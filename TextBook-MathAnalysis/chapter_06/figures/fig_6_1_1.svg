<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="auto" class="math-svg">
  <defs>
    <style>
      .bg-rect { fill: var(--bg-surface, #ffffff); }
      .grid-line { stroke: var(--border-color, #e2e8f0); stroke-width: 1; stroke-dasharray: 4,4; }
      .axis { stroke: var(--text-primary, #1e293b); stroke-width: 1.5; }
      .axis-arrow { fill: var(--text-primary, #1e293b); }
      .axis-label { font-family: 'KaTeX_Math', 'Times New Roman', serif; font-style: italic; font-size: 16px; fill: var(--text-primary, #1e293b); }
      .curve-family { fill: none; stroke: var(--text-secondary, #64748b); stroke-width: 1.8; opacity: 0.6; }
      .curve-highlight { fill: none; stroke: var(--primary-accent, #2563eb); stroke-width: 2.6; }
      .tangent-line { fill: none; stroke: #ea580c; stroke-width: 1.8; stroke-dasharray: 6,4; }
      .ref-line { fill: none; stroke: var(--text-muted, #94a3b8); stroke-width: 1.4; stroke-dasharray: 4,4; }
      .point-special { fill: var(--primary-accent, #2563eb); stroke: var(--bg-surface, #ffffff); stroke-width: 2; }
      .point-tangent { fill: #ea580c; stroke: var(--bg-surface, #ffffff); stroke-width: 2; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; fill: var(--text-primary, #1e293b); }
      .label-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; fill: var(--primary-accent, #2563eb); font-weight: 600; }
      .label-orange { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; fill: #ea580c; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="axis-arrow"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-rect"/>

  <!-- Coordinate origin at (220, 210) -->
  <!-- Scale: x: 1 unit = 50px, y: 1 unit = 15px -->
  <!-- x ranges from -3.5 to 4.5 -> screen X: 220 + x * 50 -->
  <!-- y ranges from -10 to 10 -> screen Y: 210 - y * 15 -->

  <!-- Axes -->
  <line x1="40" y1="210" x2="500" y2="210" class="axis" marker-end="url(#arrow)"/>
  <line x1="220" y1="390" x2="220" y2="30" class="axis" marker-end="url(#arrow)"/>
  <text x="505" y="215" class="axis-label">x</text>
  <text x="210" y="25" class="axis-label">y</text>
  <text x="205" y="228" class="axis-label">O</text>

  <!-- Curve Family: y = x^3 / 3 + C -->
  <!-- C = +5: y = x^3 / 3 + 5 -->
  <!-- x from -2.8 to 2.4 -->
  <path d="M 80,314 C 145,200 190,140 220,135 C 250,130 295,70 340,-20" class="curve-family"/>
  <text x="315" y="65" class="label-text" fill-opacity="0.8">C &gt; 0</text>

  <!-- C = 0: y = x^3 / 3 -->
  <!-- x from -3.0 to 3.0 -->
  <path d="M 70,345 C 145,245 190,215 220,210 C 250,205 295,175 370,75" class="curve-family"/>
  <text x="375" y="80" class="label-text" fill-opacity="0.8">C = 0</text>

  <!-- C = -3: y = x^3 / 3 - 3 -->
  <path d="M 90,380 C 155,290 195,260 220,255 C 245,250 285,220 380,120" class="curve-family"/>
  <text x="385" y="125" class="label-text" fill-opacity="0.8">C &lt; 0</text>

  <!-- Specific Solution: C = -7, passes through (3, 2) -->
  <!-- x=3 -> screen X = 220 + 3 * 50 = 370 -->
  <!-- y=2 -> screen Y = 210 - 2 * 15 = 180 -->
  <!-- y(0) = -7 -> screen Y = 210 + 7 * 15 = 315 -->
  <path d="M 120,400 C 170,340 200,320 220,315 C 240,310 270,290 320,240 S 370,180 410,75" class="curve-highlight"/>
  <text x="400" y="60" class="label-accent">y = x³/3 - 7 (通过点 (3,2))</text>

  <!-- Point (3, 2) -->
  <line x1="370" y1="210" x2="370" y2="180" class="ref-line"/>
  <line x1="220" y1="180" x2="370" y2="180" class="ref-line"/>
  <circle cx="370" cy="180" r="4.5" class="point-special"/>
  <text x="378" y="185" class="label-accent">(3, 2)</text>
  <text x="365" y="226" class="axis-label" font-size="14px">3</text>
  <text x="200" y="185" class="axis-label" font-size="14px">2</text>

  <!-- Vertical dashed line at fixed x0 = 1.4 -> screen X = 220 + 1.4 * 50 = 290 -->
  <line x1="290" y1="360" x2="290" y2="60" class="ref-line" stroke-width="1.6"/>
  <text x="283" y="226" class="axis-label" font-size="14px">x₀</text>

  <!-- Tangent lines at fixed x0 across curves: slope y' = x0^2 is identical -->
  <!-- Tangent 1 (on C=+5): at x0=1.4, Y approx 118 -->
  <line x1="250" y1="158" x2="330" y2="78" class="tangent-line"/>
  <circle cx="290" cy="118" r="3.5" class="point-tangent"/>

  <!-- Tangent 2 (on C=0): at x0=1.4, Y approx 193 -->
  <line x1="250" y1="233" x2="330" y2="153" class="tangent-line"/>
  <circle cx="290" cy="193" r="3.5" class="point-tangent"/>

  <!-- Tangent 3 (on C=-3): at x0=1.4, Y approx 238 -->
  <line x1="250" y1="278" x2="330" y2="198" class="tangent-line"/>
  <circle cx="290" cy="238" r="3.5" class="point-tangent"/>

  <!-- Tangent 4 (on C=-7): at x0=1.4, Y approx 298 -->
  <line x1="250" y1="338" x2="330" y2="258" class="tangent-line"/>
  <circle cx="290" cy="298" r="3.5" class="point-tangent"/>

  <!-- Annotations -->
  <text x="60" y="80" class="label-text" font-weight="600">原函数曲线族 y = x³/3 + C</text>
  <text x="60" y="102" class="label-orange">在相同横坐标 x₀ 处切线均平行（斜率 k = x₀²）</text>

</svg>
