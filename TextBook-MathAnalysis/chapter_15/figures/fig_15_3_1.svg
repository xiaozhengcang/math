<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="auto" style="max-width: 360px;">
  <!-- Coordinate axes -->
  <line x1="20" y1="180" x2="350" y2="180" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="350,177 358,180 350,183" fill="#2d3748" />
  <text x="350" y="196" font-size="14" font-style="italic" font-family="serif">s</text>

  <line x1="180" y1="260" x2="180" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="177,20 180,12 183,20" fill="#2d3748" />
  <text x="186" y="24" font-size="14" font-style="italic" font-family="serif">Γ(s)</text>
  <text x="166" y="195" font-size="13" font-family="serif">O</text>

  <!-- Y-axis ticks and labels: -4, -3, -2, -1, 1, 2, 3, 4 (origin at y=180, scale approx 25px per unit) -->
  <!-- y = 4 -> 180 - 100 = 80 -->
  <!-- y = 3 -> 105 -->
  <!-- y = 2 -> 130 -->
  <!-- y = 1 -> 155 -->
  <!-- y = -1 -> 205 -->
  <!-- y = -2 -> 230 -->
  <!-- y = -3 -> 255 -->
  <line x1="176" y1="155" x2="184" y2="155" stroke="#718096" stroke-width="1" />
  <text x="168" y="159" font-size="11" font-family="serif">1</text>
  <line x1="176" y1="130" x2="184" y2="130" stroke="#718096" stroke-width="1" />
  <text x="168" y="134" font-size="11" font-family="serif">2</text>
  <line x1="176" y1="105" x2="184" y2="105" stroke="#718096" stroke-width="1" />
  <text x="168" y="109" font-size="11" font-family="serif">3</text>
  <line x1="176" y1="80" x2="184" y2="80" stroke="#718096" stroke-width="1" />
  <text x="168" y="84" font-size="11" font-family="serif">4</text>

  <line x1="176" y1="205" x2="184" y2="205" stroke="#718096" stroke-width="1" />
  <text x="160" y="209" font-size="11" font-family="serif">-1</text>
  <line x1="176" y1="230" x2="184" y2="230" stroke="#718096" stroke-width="1" />
  <text x="160" y="234" font-size="11" font-family="serif">-2</text>
  <line x1="176" y1="255" x2="184" y2="255" stroke="#718096" stroke-width="1" />
  <text x="160" y="259" font-size="11" font-family="serif">-3</text>

  <!-- X-axis ticks: -4, -3, -2, -1, 1, 2, 3, 4 (scale approx 32px per unit) -->
  <!-- s = 1 -> 180 + 32 = 212 -->
  <!-- s = 2 -> 244 -->
  <!-- s = 3 -> 276 -->
  <!-- s = 4 -> 308 -->
  <!-- s = -1 -> 148 -->
  <!-- s = -2 -> 116 -->
  <!-- s = -3 -> 84 -->
  <!-- s = -4 -> 52 -->
  <line x1="212" y1="177" x2="212" y2="183" stroke="#718096" stroke-width="1" />
  <text x="209" y="196" font-size="11" font-family="serif">1</text>
  <line x1="244" y1="177" x2="244" y2="183" stroke="#718096" stroke-width="1" />
  <text x="241" y="196" font-size="11" font-family="serif">2</text>
  <line x1="276" y1="177" x2="276" y2="183" stroke="#718096" stroke-width="1" />
  <text x="273" y="196" font-size="11" font-family="serif">3</text>
  <line x1="308" y1="177" x2="308" y2="183" stroke="#718096" stroke-width="1" />
  <text x="305" y="196" font-size="11" font-family="serif">4</text>

  <line x1="148" y1="177" x2="148" y2="183" stroke="#718096" stroke-width="1" />
  <text x="142" y="196" font-size="11" font-family="serif">-1</text>
  <line x1="116" y1="177" x2="116" y2="183" stroke="#718096" stroke-width="1" />
  <text x="110" y="196" font-size="11" font-family="serif">-2</text>
  <line x1="84" y1="177" x2="84" y2="183" stroke="#718096" stroke-width="1" />
  <text x="78" y="196" font-size="11" font-family="serif">-3</text>
  <line x1="52" y1="177" x2="52" y2="183" stroke="#718096" stroke-width="1" />
  <text x="46" y="196" font-size="11" font-family="serif">-4</text>

  <!-- Vertical asymptotes (light dashed lines) at s = -1, -2, -3, -4 -->
  <line x1="148" y1="35" x2="148" y2="260" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="116" y1="35" x2="116" y2="260" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="84" y1="35" x2="84" y2="260" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="52" y1="35" x2="52" y2="260" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Curves: blue color #2b6cb0 -->
  <!-- Branch s > 0: starts from high near s=0+ -> (1, 1)[(212, 155)], min near 1.46 (y approx 0.88), passes (2, 1)[(244, 155)], rises to (3, 2)[(276, 130)], (4, 6) -->
  <path d="M 186 35 C 188 120, 198 158, 226 158 C 248 158, 270 145, 300 35" fill="none" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Branch -1 < s < 0: goes to -inf at s=0- and s=-1+ (downwards U shape) -->
  <path d="M 152 260 C 154 210, 158 200, 164 200 C 170 200, 174 210, 176 260" fill="none" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Branch -2 < s < -1: goes to +inf at s=-1- and s=-2+ (upwards U shape) -->
  <path d="M 120 35 C 122 130, 126 145, 132 145 C 138 145, 142 130, 144 35" fill="none" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Branch -3 < s < -2: goes to -inf (downwards U shape) -->
  <path d="M 88 260 C 90 215, 94 205, 100 205 C 106 205, 110 215, 112 260" fill="none" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Branch -4 < s < -3: goes to +inf (upwards U shape) -->
  <path d="M 56 35 C 58 135, 62 150, 68 150 C 74 150, 78 135, 80 35" fill="none" stroke="#2b6cb0" stroke-width="1.8" />
</svg>
