<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="auto" style="max-width: 260px;">
  <!-- Coordinate axes -->
  <line x1="20" y1="140" x2="260" y2="140" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="260,137 268,140 260,143" fill="#2d3748" />
  <text x="264" y="156" font-size="14" font-style="italic" font-family="serif">x</text>

  <line x1="140" y1="260" x2="140" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="137,20 140,12 143,20" fill="#2d3748" />
  <text x="126" y="24" font-size="14" font-style="italic" font-family="serif">y</text>
  <text x="126" y="155" font-size="13" font-family="serif">O</text>

  <!-- Ellipse: rx=50, ry=95 (b > a > 0) -->
  <ellipse cx="140" cy="140" rx="50" ry="95" fill="none" stroke="#2d3748" stroke-width="1.5" />

  <!-- First quadrant arc highlight -->
