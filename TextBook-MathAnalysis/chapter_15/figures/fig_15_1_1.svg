<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="auto" style="max-width:300px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Coordinate axes -->
  <line x1="30" y1="160" x2="295" y2="160" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="140" y1="280" x2="140" y2="25" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="300" y="165" font-style="italic">x</text>
  <text x="128" y="25" font-style="italic">y</text>
  <text x="126" y="175" font-style="italic">O</text>

  <!-- Full Ellipse: b > a > 0. rx = 65, ry = 115 -->
  <ellipse cx="140" cy="160" rx="65" ry="115" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,4"/>

  <!-- First quadrant arc L (highlighted in deep blue) -->
  <path d="M 205 160 A 65 115 0 0 0 140 45" fill="none" stroke="#1e40af" stroke-width="2.6"/>

  <!-- Endpoints of arc L -->
  <circle cx="205" cy="160" r="3.5" fill="#1e40af"/>
  <circle cx="140" cy="45" r="3.5" fill="#1e40af"/>

  <!-- Axis labels a and b -->
  <text x="205" y="178" text-anchor="middle" font-style="italic" font-weight="bold" fill="#1e40af">a</text>
  <text x="128" y="48" text-anchor="end" font-style="italic" font-weight="bold" fill="#1e40af">b</text>

  <!-- Arc label L -->
  <text x="185" y="95" font-style="italic" font-size="16px" font-weight="bold" fill="#1e40af">L</text>

  <text x="160" y="285" text-anchor="middle" font-size="13px" fill="#1e293b">椭圆第一象限部分 L (b &gt; a &gt; 0)</text>
</svg>
