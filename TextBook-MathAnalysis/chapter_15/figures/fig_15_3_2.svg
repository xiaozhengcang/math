<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="100%" height="auto" style="max-width: 260px;">
  <!-- Coordinate axes -->
  <line x1="20" y1="120" x2="260" y2="120" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="260,117 268,120 260,123" fill="#2d3748" />
  <text x="264" y="136" font-size="14" font-style="italic" font-family="serif">x</text>

  <line x1="120" y1="220" x2="120" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="117,20 120,12 123,20" fill="#2d3748" />
  <text x="106" y="24" font-size="14" font-style="italic" font-family="serif">y</text>
  <text x="126" y="135" font-size="13" font-family="serif">O</text>

  <!-- Curve: r^4 = sin^3 theta cos theta.
       Non-zero only in Q1 (where sin theta > 0, cos theta > 0)
       and Q3 (where sin theta < 0, cos theta < 0, so sin^3 theta cos theta > 0).
       Two symmetrical loops, one in Quadrant 1, one in Quadrant 3.
  -->
  <!-- Loop in Quadrant 1: tangent at origin along theta=0 and theta=pi/2. Reaches max r around theta = pi/3 (~60 deg) -->
  <path d="M 120 120 C 175 118, 220 70, 190 40 C 160 15, 122 65, 120 120 Z" fill="none" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Loop in Quadrant 3: symmetric through origin -->
  <path d="M 120 120 C 65 122, 20 170, 50 200 C 80 225, 118 175, 120 120 Z" fill="none" stroke="#2b6cb0" stroke-width="1.8" />
</svg>
