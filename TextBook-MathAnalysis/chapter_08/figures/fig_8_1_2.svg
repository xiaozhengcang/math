<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="auto" style="max-width: 420px;">
  <defs>
    <marker id="arrow-812" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="210" x2="390" y2="210" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-812)"/>
  <line x1="90" y1="230" x2="90" y2="30" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-812)"/>
  <text x="385" y="228" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">x</text>
  <text x="75" y="38" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">y</text>
  <text x="75" y="226" font-family="KaTeX_Math, serif" font-style="italic" font-size="14" fill="#1e293b">O</text>

  <!-- Shaded Area from x = a (150) to x = 360 -->
  <!-- Curve: y = 210 - 130 * (60 / (x - 90)) approx, or bezier -->
  <!-- At x = 150: y ≈ 130 (height 80) -->
  <path d="M 150 210 L 150 130 C 200 170, 260 198, 360 207 L 360 210 Z" fill="#e2e8f0" stroke="none"/>

  <!-- Vertical dashed line at x = a -->
  <line x1="150" y1="210" x2="150" y2="130" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="150" y="228" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b" text-anchor="middle">a</text>

  <!-- Curve y = f(x) -->
  <path d="M 120 70 C 135 100, 160 140, 210 175 C 260 198, 310 205, 370 207" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <text x="190" y="110" font-family="KaTeX_Math, serif" font-style="italic" font-size="14" fill="#1e293b">y = f(x)</text>

  <!-- Figure caption -->
  <text x="210" y="252" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">图 8.1.2</text>
</svg>