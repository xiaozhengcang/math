  <text x="200" y="80" text-anchor="middle" font-size="13px" fill="#1e293b">∫<tspan font-size="10px" dy="3">a</tspan><tspan font-size="10px" dy="-3">⁺∞</tspan> f(x) dx = lim<tspan font-size="10px" dy="4">A→+∞</tspan> ∫<tspan font-size="10px" dy="-4">a</tspan><tspan font-size="10px" dy="0">ᴬ</tspan> f(x) dx</text>
</svg>
