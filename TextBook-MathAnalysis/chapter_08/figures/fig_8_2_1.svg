<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="60" y1="160" x2="360" y2="160" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="120" y1="300" x2="120" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="365" y="164" font-style="italic">p</text>
  <text x="108" y="30" font-style="italic">q</text>
  <text x="106" y="176" font-style="italic">O</text>
  <!-- Convergence Region (shaded) -->
  <polygon points="175,160 230,215 230,270" fill="#e0f2fe" fill-opacity="0.8" stroke="none"/>
  <!-- Boundary p + q = 1 -->
  <line x1="105" y1="90" x2="260" y2="245" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="268" y="245" font-size="12px" fill="#0284c7">p + q = 1</text>
  <!-- Boundary 2p + q = 2 -->
  <line x1="110" y1="28" x2="245" y2="302" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="250" y="305" font-size="12px" fill="#dc2626">2p + q = 2</text>
  <!-- Boundary p = 2 -->
  <line x1="230" y1="40" x2="230" y2="295" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="235" y="55" font-size="12px" fill="#475569">p = 2</text>
  <circle cx="175" cy="160" r="3.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="230" cy="215" r="3.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="230" cy="270" r="3.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="175" y="152" text-anchor="middle">1</text>
  <text x="230" y="152" text-anchor="middle">2</text>
  <text x="108" y="109" text-anchor="end">1</text>
  <text x="108" y="54" text-anchor="end">2</text>
  <text x="108" y="219" text-anchor="end">−1</text>
  <text x="108" y="274" text-anchor="end">−2</text>
  <line x1="120" y1="215" x2="230" y2="215" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="120" y1="270" x2="230" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="210" y="240" font-size="12px" fill="#0369a1" font-weight="bold">收敛域</text>
</svg>
