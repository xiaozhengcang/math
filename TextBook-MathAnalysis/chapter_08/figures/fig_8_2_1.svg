<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="100%" height="auto" style="max-width: 380px;">
  <defs>
    <marker id="arrow-821" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Axes: origin at (120, 160) -->
  <!-- Scale: unit = 60px. p=0: x=120, p=1: x=180, p=2: x=240 -->
  <!-- q=0: y=160, q=1: y=100, q=2: y=40, q=-1: y=220, q=-2: y=280 -->
  <line x1="80" y1="160" x2="320" y2="160" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-821)"/>
  <line x1="120" y1="300" x2="120" y2="25" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-821)"/>
  <text x="315" y="175" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">p</text>
  <text x="108" y="35" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">q</text>
  <text x="105" y="175" font-family="KaTeX_Math, serif" font-style="italic" font-size="14" fill="#1e293b">O</text>

  <!-- Ticks and labels -->
  <!-- p = 1: x = 180 -->
  <text x="176" y="175" font-family="KaTeX_Math, serif" font-size="14" fill="#1e293b">1</text>
  <!-- p = 2: x = 240 -->
  <text x="230" y="175" font-family="KaTeX_Math, serif" font-size="14" fill="#1e293b">2</text>
  <!-- q = 1: y = 100 -->
  <text x="105" y="105" font-family="KaTeX_Math, serif" font-size="14" fill="#1e293b">1</text>
  <!-- q = 2: y = 40 -->
  <text x="105" y="45" font-family="KaTeX_Math, serif" font-size="14" fill="#1e293b">2</text>

  <!-- Shaded Region: Triangle with vertices: -->
  <!-- (1, 0) -> (180, 160) -->
  <!-- (2, -1) -> (240, 220) -->
  <!-- (2, -2) -> (240, 280) -->
  <polygon points="180,160 240,220 240,280" fill="#cbd5e1" stroke="none"/>

  <!-- Dashed lines -->
  <!-- Line 1: p + q = 1 => (0, 1) to (2.5, -1.5) => (120, 100) to (270, 250) -->
  <line x1="110" y1="90" x2="270" y2="250" stroke="#334155" stroke-width="1.3" stroke-dasharray="6,4"/>

  <!-- Line 2: 2p + q = 2 => (0, 2) to (2.2, -2.4) => (120, 40) to (252, 304) -->
  <line x1="115" y1="30" x2="255" y2="310" stroke="#334155" stroke-width="1.3" stroke-dasharray="6,4"/>

  <!-- Vertical dashed line p = 2 => x = 240 from y = 35 to y = 295 -->
  <line x1="240" y1="35" x2="240" y2="295" stroke="#334155" stroke-width="1.3" stroke-dasharray="6,4"/>

  <!-- Figure caption -->
  <text x="200" y="328" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">图 8.2.1</text>
</svg>