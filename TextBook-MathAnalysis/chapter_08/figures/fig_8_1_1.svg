<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Earth -->
  <circle cx="90" cy="150" r="55" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <circle cx="90" cy="150" r="3" fill="#0284c7"/>
  <text x="90" y="155" text-anchor="middle" font-size="13px" fill="#0284c7" font-weight="bold">地球 M</text>
  <text x="75" y="175" font-style="italic" fill="#0284c7">O</text>
  <line x1="90" y1="150" x2="145" y2="150" stroke="#0284c7" stroke-width="1.4"/>
  <text x="115" y="142" text-anchor="middle" font-style="italic">R</text>
  <line x1="145" y1="150" x2="395" y2="150" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="154" font-style="italic">r</text>
  <circle cx="240" cy="150" r="4.5" fill="#dc2626"/>
  <text x="240" y="138" text-anchor="middle" font-style="italic" font-weight="bold" fill="#dc2626">m</text>
  <text x="240" y="168" text-anchor="middle" font-style="italic">r</text>
  <line x1="240" y1="150" x2="180" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="205" y="140" font-size="12px" fill="#dc2626">F(r)</text>
  <line x1="240" y1="120" x2="275" y2="120" stroke="#1e40af" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="255" y="112" font-size="12px" fill="#1e40af">dr</text>
  <text x="170" y="235" font-size="13px" fill="#1e293b">做功积分：W = ∫<tspan font-size="10px" dy="4">R</tspan><tspan font-size="10px" dy="-4">⁺∞</tspan> (GMm / r²) dr = GMm / R</text>
</svg>
