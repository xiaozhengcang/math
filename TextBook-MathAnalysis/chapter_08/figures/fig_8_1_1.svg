<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="auto" style="max-width: 400px;">
  <defs>
    <marker id="arrow-811" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Earth Circle -->
  <circle cx="180" cy="220" r="55" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Earth Center Dot -->
  <circle cx="180" cy="220" r="2" fill="#1e293b"/>
  
  <!-- Earth Radius R line -->
  <line x1="180" y1="220" x2="219" y2="181" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow-dim)"/>
  <text x="206" y="210" font-family="KaTeX_Math, serif" font-style="italic" font-size="14" fill="#1e293b">R</text>

  <!-- Radial axis r (vertical) -->
  <line x1="180" y1="220" x2="180" y2="75" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="180" y1="75" x2="180" y2="35" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-811)"/>
  <text x="190" y="42" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">r</text>

  <!-- Surface point at r = R -->
  <circle cx="180" cy="165" r="3.5" fill="#1e293b"/>

  <!-- Point at r = x -->
  <circle cx="180" cy="75" r="3.5" fill="#1e293b"/>

  <!-- Dimension line for x -->
  <!-- Horizontal guides -->
  <line x1="180" y1="220" x2="265" y2="220" stroke="#64748b" stroke-width="0.8"/>
  <line x1="180" y1="75" x2="265" y2="75" stroke="#64748b" stroke-width="0.8"/>
  <!-- Vertical dimension line with double arrows -->
  <line x1="255" y1="214" x2="255" y2="81" stroke="#475569" stroke-width="1"/>
  <polygon points="255,220 252,210 258,210" fill="#475569"/>
  <polygon points="255,75 252,85 258,85" fill="#475569"/>
  <text x="250" y="152" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b" text-anchor="end">x</text>

  <!-- Figure caption -->
  <text x="200" y="305" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">图 8.1.1</text>
</svg>