<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Point charge q -->
  <circle cx="100" cy="130" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" font-weight="bold" fill="#dc2626">+q</text>
  <line x1="116" y1="130" x2="375" y2="130" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="134" font-style="italic">r</text>
  <!-- Observation point P -->
  <circle cx="200" cy="130" r="4" fill="#1e40af"/>
  <text x="200" y="118" text-anchor="middle" font-style="italic" font-weight="bold" fill="#1e40af">P(r)</text>
  <text x="200" y="148" text-anchor="middle" font-style="italic">r</text>
  <circle cx="270" cy="130" r="3.5" fill="#64748b"/>
  <text x="270" y="148" text-anchor="middle" font-style="italic">ρ</text>
  <line x1="270" y1="130" x2="315" y2="130" stroke="#ea580c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="295" y="120" font-size="12px" fill="#ea580c">E(ρ)</text>
  <text x="200" y="215" text-anchor="middle" font-size="13px" fill="#1e293b">电势模型：φ(r) = ∫<tspan font-size="10px" dy="3">r</tspan><tspan font-size="10px" dy="-3">⁺∞</tspan> E(ρ) dρ = q / (4πε₀ r)</text>
</svg>
