<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="100%" height="auto" style="max-width: 360px;">
  <defs>
    <marker id="arrow-814" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Center charge q -->
  <circle cx="170" cy="170" r="4" fill="#1e293b"/>
  <text x="150" y="175" font-family="KaTeX_Math, serif" font-style="italic" font-size="16" fill="#1e293b">q</text>

  <!-- Concentric dashed circles -->
  <circle cx="170" cy="170" r="35" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <circle cx="170" cy="170" r="65" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <circle cx="170" cy="170" r="100" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="7,4"/>

  <!-- Radial ray from q towards infinity -->
  <!-- Angle approx 40 deg: dx = cos(40)*155 ≈ 118, dy = -sin(40)*155 ≈ -100 -->
  <line x1="170" y1="170" x2="295" y2="65" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-814)"/>
  <text x="302" y="72" font-family="sans-serif" font-size="16" fill="#1e293b">∞</text>

  <!-- Point x on the ray at radius approx 85 -->
  <!-- 170 + 85*cos(40) = 170 + 65 = 235, 170 - 85*sin(40) = 170 - 55 = 115 -->
  <circle cx="235" cy="115" r="4" fill="#1e293b"/>
  <text x="226" y="102" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">x</text>

  <!-- Figure caption -->
  <text x="180" y="305" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">图 8.1.4</text>
</svg>