<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Ellipse -->
  <ellipse cx="170" cy="130" rx="120" ry="80" fill="none" stroke="#222" stroke-width="1.6"/>

  <!-- Foci -->
  <circle cx="80" cy="130" r="3.5" fill="#222"/>
  <circle cx="260" cy="130" r="3.5" fill="#222"/>
  <text x="72" y="150">F₁</text>
  <text x="264" y="150">F₂</text>

  <!-- Point P on ellipse -->
  <circle cx="230" cy="61" r="3.5" fill="#1e40af"/>
  <text x="238" y="58">P</text>

  <!-- Incident ray from F1 to P -->
  <line x1="80" y1="130" x2="230" y2="61" stroke="#c2410c" stroke-width="1.8" marker-end="url(#arr4)"/>

  <!-- Reflected ray from P to F2 -->
  <line x1="230" y1="61" x2="260" y2="130" stroke="#c2410c" stroke-width="1.8" marker-end="url(#arr4)"/>

  <!-- Additional reflected rays (schematic) -->
  <line x1="80" y1="130" x2="205" y2="85" stroke="#222" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr4)"/>
  <line x1="205" y1="85" x2="260" y2="130" stroke="#222" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr4)"/>

  <line x1="80" y1="130" x2="140" y2="170" stroke="#222" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr4)"/>
  <line x1="140" y1="170" x2="260" y2="130" stroke="#222" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr4)"/>
</svg>
