<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr_ray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Ellipse outline -->
  <ellipse cx="180" cy="120" rx="135" ry="75" fill="none" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Light Rays radiating from F1 (67.8, 120) reflecting to F2 (292.2, 120) -->
  <!-- Ray 1: 40 deg -->
  <line x1="67.8" y1="120" x2="283.4" y2="71.8" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="283.4" y1="71.8" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Ray 2: 75 deg -->
  <line x1="67.8" y1="120" x2="214.9" y2="47.6" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="214.9" y1="47.6" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Ray 3: 110 deg -->
  <line x1="67.8" y1="120" x2="133.8" y2="49.5" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="133.8" y1="49.5" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Ray 4: 145 deg -->
  <line x1="67.8" y1="120" x2="69.4" y2="77.0" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="69.4" y1="77.0" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Ray 5: 215 deg -->
  <line x1="67.8" y1="120" x2="69.4" y2="163.0" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="69.4" y1="163.0" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Ray 6: 250 deg -->
  <line x1="67.8" y1="120" x2="133.8" y2="190.5" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="133.8" y1="190.5" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Ray 7: 285 deg -->
  <line x1="67.8" y1="120" x2="214.9" y2="192.4" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="214.9" y1="192.4" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Ray 8: 320 deg -->
  <line x1="67.8" y1="120" x2="283.4" y2="168.2" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>
  <line x1="283.4" y1="168.2" x2="292.2" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr_ray)"/>

  <!-- Foci points -->
  <circle cx="67.8" cy="120" r="3.5" fill="#1e293b"/>
  <circle cx="292.2" cy="120" r="3.5" fill="#1e293b"/>
</svg>