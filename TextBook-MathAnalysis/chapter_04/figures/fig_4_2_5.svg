<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr425" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
    <marker id="arr_ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Ellipse -->
  <ellipse cx="180" cy="125" rx="130" ry="75" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>

  <!-- Major axis (focal line) -->
  <line x1="35" y1="125" x2="325" y2="125" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Foci F1 and F2 -->
  <circle cx="73.8" cy="125" r="3.5" fill="#1e293b"/>
  <circle cx="286.2" cy="125" r="3.5" fill="#1e293b"/>
  <text x="65.8" y="143" font-weight="bold">F₁</text>
  <text x="280.2" y="143" font-weight="bold">F₂</text>

  <!-- Incident ray F1 -> P -->
  <line x1="73.8" y1="125" x2="254.6" y2="63.6" stroke="#dc2626" stroke-width="2"/>
  <line x1="73.8" y1="125" x2="164.2" y2="94.3" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_ray)"/>

  <!-- Reflected ray P -> F2 -->
  <line x1="254.6" y1="63.6" x2="286.2" y2="125" stroke="#dc2626" stroke-width="2"/>
  <line x1="254.6" y1="63.6" x2="270.4" y2="94.3" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_ray)"/>

  <!-- Second ray (to top) -->
  <line x1="73.8" y1="125" x2="180" y2="50" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="73.8" y1="125" x2="126.9" y2="87.5" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr_gray)"/>
  <line x1="180" y1="50" x2="286.2" y2="125" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="180" y1="50" x2="233.1" y2="87.5" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr_gray)"/>

  <!-- Normal Line at P -->
  <line x1="243.3" y1="91.4" x2="267.7" y2="31.1" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="271.7" y="31.111481703776647" fill="#0284c7" font-size="12px">法线</text>

  <!-- Point P -->
  <circle cx="254.6" cy="63.6" r="3.5" fill="#dc2626"/>
  <text x="262.6" y="59.6" fill="#dc2626" font-weight="bold">P</text>

  <!-- Title / Explanation -->
  <text x="30" y="235" fill="#475569" font-size="12px">从一个焦点 F₁ 发出的光线经椭圆反射后必穿过另一焦点 F₂</text>
</svg>