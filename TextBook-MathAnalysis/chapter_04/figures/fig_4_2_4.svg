<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="60" y1="200" x2="310" y2="200" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <line x1="80" y1="220" x2="80" y2="30" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <text x="315" y="208" font-style="italic">x</text>
  <text x="68" y="32" font-style="italic">y</text>
  <text x="68" y="217" font-style="italic">O</text>

  <!-- Parabola y^2 = 8x (scale 1 unit = 8 px) -->
  <path d="M 80 200 Q 120 152 144 128 Q 168 104 200 80 Q 232 56 256 40" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M 80 200 Q 120 248 144 272" fill="none" stroke="#1e40af" stroke-width="2" style="display:none"/>
  <text x="260" y="45" fill="#1e40af">y²=2px</text>

  <!-- Point P0 -->
  <circle cx="144" cy="128" r="3.5" fill="#222"/>
  <text x="125" y="120">(x₀,y₀)</text>

  <!-- Focus F -->
  <circle cx="96" cy="200" r="3.5" fill="#222"/>
  <text x="88" y="218">F</text>

  <!-- Tangent line -->
  <line x1="60" y1="168" x2="200" y2="200" stroke="#c2410c" stroke-width="2"/>
  <text x="205" y="195" fill="#c2410c">切线</text>

  <!-- Normal dashed -->
  <line x1="112" y1="32" x2="176" y2="160" stroke="#222" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="95" y="35">法线</text>

  <!-- Focus line FP0 -->
  <line x1="96" y1="200" x2="144" y2="128" stroke="#222" stroke-width="1.2"/>

  <!-- Horizontal reference for theta2 -->
  <line x1="96" y1="128" x2="144" y2="128" stroke="#222" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Angle arcs -->
  <path d="M 96 200 A 22 22 0 0 0 112 184" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="105" y="190">θ₂</text>

  <path d="M 144 128 A 26 26 0 0 1 128 152" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="120" y="145">θ</text>

  <path d="M 144 128 A 30 30 0 0 1 168 146" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="160" y="140">θ₁</text>
</svg>
