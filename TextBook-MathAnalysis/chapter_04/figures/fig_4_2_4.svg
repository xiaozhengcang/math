<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr424" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
    <marker id="arr_ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="40" y1="140" x2="350" y2="140" stroke="#222" stroke-width="1.4" marker-end="url(#arr424)"/>
  <line x1="80" y1="230" x2="80" y2="25" stroke="#222" stroke-width="1.4" marker-end="url(#arr424)"/>
  <text x="355" y="145" font-style="italic">x</text>
  <text x="65" y="25" font-style="italic">y</text>
  <text x="65" y="156" font-style="italic">O</text>

  <!-- Parabola y^2 = 2px -->
  <path d="M 152.2,55.0 L 147.2,58.0 L 142.4,61.0 L 137.8,64.0 L 133.3,67.0 L 129.0,70.0 L 124.9,73.0 L 121.0,76.0 L 117.2,79.0 L 113.6,82.0 L 110.2,85.0 L 107.0,88.0 L 104.0,91.0 L 101.2,94.0 L 98.5,97.0 L 96.0,100.0 L 93.7,103.0 L 91.6,106.0 L 89.6,109.0 L 87.8,112.0 L 86.2,115.0 L 84.8,118.0 L 83.6,121.0 L 82.6,124.0 L 81.7,127.0 L 81.0,130.0 L 80.5,133.0 L 80.2,136.0 L 80.0,139.0 L 80.0,142.0 L 80.2,145.0 L 80.6,148.0 L 81.2,151.0 L 82.0,154.0 L 82.9,157.0 L 84.0,160.0 L 85.3,163.0 L 86.8,166.0 L 88.4,169.0 L 90.2,172.0 L 92.2,175.0 L 94.4,178.0 L 96.8,181.0 L 99.4,184.0 L 102.1,187.0 L 105.0,190.0 L 108.1,193.0 L 111.4,196.0 L 114.8,199.0 L 118.4,202.0 L 122.2,205.0 L 126.2,208.0 L 130.4,211.0 L 134.8,214.0 L 139.3,217.0 L 144.0,220.0 L 148.9,223.0" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="215" y="55" fill="#1e40af" font-style="italic" font-weight="bold">y² = 2px</text>

  <!-- Focus F -->
  <circle cx="105.0" cy="140" r="3.5" fill="#1e293b"/>
  <text x="99.0" y="158" font-weight="bold">F</text>

  <!-- Incident Ray: F -> P0 -->
  <line x1="105.0" y1="140" x2="110.2" y2="85.0" stroke="#dc2626" stroke-width="2"/>
  <!-- Middle arrow on incident ray -->
  <line x1="105.0" y1="140" x2="107.6" y2="112.5" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_ray)"/>

  <!-- Reflected Ray: P0 -> horizontal right -->
  <line x1="110.2" y1="85.0" x2="330" y2="85.0" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_ray)"/>

  <!-- Tangent Line -->
  <line x1="49.8" y1="140" x2="150.2" y2="48.6" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="34.8" y="134" fill="#16a34a" font-size="12px">切线</text>

  <!-- Normal Line -->
  <line x1="85.2" y1="112.5" x2="160.2" y2="140" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="164.2" y="134" fill="#64748b" font-size="12px">法线</text>

  <!-- Point P0 -->
  <circle cx="110.2" cy="85.0" r="3.5" fill="#dc2626"/>
  <text x="100.2" y="75.0" fill="#dc2626" font-weight="bold">P₀(x₀, y₀)</text>

  <!-- Annotation -->
  <text x="210" y="80" fill="#dc2626" font-size="13px">反射光线平行于对称轴</text>
  <text x="210" y="100" fill="#475569" font-size="12px">入射角 = 反射角</text>
</svg>