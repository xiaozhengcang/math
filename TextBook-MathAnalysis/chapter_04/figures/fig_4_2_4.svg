<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr424" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_sm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="160" x2="350" y2="160" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr424)"/>
  <line x1="120" y1="240" x2="120" y2="30" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr424)"/>
  <text x="355" y="164" font-style="italic">x</text>
  <text x="126" y="32" font-style="italic">y</text>
  <text x="108" y="174" font-style="italic">O</text>

  <!-- Parabola y^2 = 2px -->
  <path d="M 180.2,245.0 L 173.3,240.0 L 166.9,235.0 L 160.8,230.0 L 155.2,225.0 L 150.0,220.0 L 145.2,215.0 L 140.8,210.0 L 136.9,205.0 L 133.3,200.0 L 130.2,195.0 L 127.5,190.0 L 125.2,185.0 L 123.3,180.0 L 121.9,175.0 L 120.8,170.0 L 120.2,165.0 L 120.0,160.0 L 120.2,155.0 L 120.8,150.0 L 121.9,145.0 L 123.3,140.0 L 125.2,135.0 L 127.5,130.0 L 130.2,125.0 L 133.3,120.0 L 136.9,115.0 L 140.8,110.0 L 145.2,105.0 L 150.0,100.0 L 155.2,95.0 L 160.8,90.0 L 166.9,85.0 L 173.3,80.0 L 180.2,75.0 L 195.0,65.0 L 210.0,56.0 L 230.0,46.0 L 255.0,36.0" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="250" y="52" font-style="italic">y²=2px</text>

  <!-- Normal Line (法线, dashed) -->
  <line x1="138" y1="16" x2="225" y2="139" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="130" y="16" fill="#1e293b">法线</text>

  <!-- Tangent Line (切线) -->
  <line x1="45" y1="171" x2="275" y2="8" stroke="#1e293b" stroke-width="1.5"/>
  <text x="280" y="12" fill="#1e293b">切线</text>

  <!-- Ray from Focus (150, 160) through (180, 75.2) -->
  <line x1="150" y1="160" x2="198" y2="24" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Horizontal ray from (180, 75.2) to the right -->
  <line x1="180" y1="75.2" x2="310" y2="75.2" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Angle arcs -->
  <!-- theta_1 at x-axis -->
  <path d="M 84,160 A 24,24 0 0,0 79.6,146.1" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="88" y="155" font-style="italic">θ₁</text>

  <!-- theta_2 at focus -->
  <path d="M 170,160 A 20,20 0 0,0 156.7,141.0" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="173" y="152" font-style="italic">θ₂</text>

  <!-- theta_1 at (x0, y0) between horizontal ray and tangent -->
  <path d="M 206,75.2 A 26,26 0 0,0 201.2,60.2" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="210" y="70" font-style="italic">θ₁</text>

  <!-- theta at (x0, y0) between tangent and focal ray (upper) -->
  <path d="M 201.2,60.2 A 32,32 0 0,0 188.7,42.8" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="195" y="47" font-style="italic">θ</text>

  <!-- theta at (x0, y0) between focal ray and tangent (lower) -->
  <path d="M 171.3,99.9 A 26,26 0 0,0 158.8,90.2" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="165" y="96" font-style="italic">θ</text>

  <!-- Point (x0, y0) and Focus -->
  <circle cx="180" cy="75.2" r="3.5" fill="#1e293b"/>
  <circle cx="150" cy="160" r="3" fill="#1e293b"/>
  <text x="122" y="76" font-style="italic">(x₀, y₀)</text>
</svg>