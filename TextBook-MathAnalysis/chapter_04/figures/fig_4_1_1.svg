<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:15px;">
  <!-- Earth surface arc -->
  <path d="M 60,150 A 155,155 0 0,1 300,150" fill="none" stroke="#334155" stroke-width="1.4"/>

  <!-- Satellite circular orbit arc from A through C -->
  <path d="M 180,60 A 180,180 0 0,1 278,89" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Ray OA (dashed) -->
  <line x1="180" y1="240" x2="180" y2="60" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Ray OB (dashed up to C) -->
  <line x1="180" y1="240" x2="267.4" y2="82.6" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Segment BC (solid fall under gravity) -->
  <line x1="267.4" y1="82.6" x2="280" y2="60" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Tangent line segment AB -->
  <line x1="180" y1="60" x2="280" y2="60" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Right angle marker at A -->
  <path d="M 180,72 L 192,72 L 192,60" fill="none" stroke="#64748b" stroke-width="1"/>

  <!-- Points -->
  <circle cx="180" cy="240" r="3" fill="#1e293b"/>
  <circle cx="180" cy="60" r="3.5" fill="#1e293b"/>
  <circle cx="280" cy="60" r="3.5" fill="#1e293b"/>
  <circle cx="267.4" cy="82.6" r="3.5" fill="#1e293b"/>

  <!-- Point Labels -->
  <text x="175" y="48" font-style="italic">A</text>
  <text x="288" y="58" font-style="italic">B</text>
  <text x="278" y="94" font-style="italic">C</text>
  <text x="190" y="244" font-style="italic">O</text>
</svg>