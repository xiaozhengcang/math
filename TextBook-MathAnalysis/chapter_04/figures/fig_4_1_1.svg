<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr411" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <radialGradient id="earthGrad" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#e0f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <!-- Earth filled sector -->
  <path d="M -29.4 207.3 A 165 165 0 0 1 289.4 207.3 L 130 250 Z" fill="url(#earthGrad)" stroke="none"/>
  <!-- Earth surface arc -->
  <path d="M -29.4 207.3 A 165 165 0 0 1 289.4 207.3" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="50" y="225" fill="#0369a1" font-size="13px">地球表面</text>

  <!-- Radius OA -->
  <line x1="130" y1="250" x2="130" y2="85" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,4"/>
  <!-- Line OB (passing through C) -->
  <line x1="130" y1="250" x2="238.9" y2="126.1" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,4"/>
  <line x1="238.9" y1="126.1" x2="275" y2="85" stroke="#dc2626" stroke-width="2"/>

  <!-- Right angle marker at A -->
  <path d="M 130 99 L 144 99 L 144 85" fill="none" stroke="#475569" stroke-width="1.2"/>

  <!-- Tangent line AB (motion without gravity) -->
  <line x1="130" y1="85" x2="275" y2="85" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>

  <!-- Gravity drop arc/arrow from B to C -->
  <path d="M 275 85 L 238.9 126.1" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Points -->
  <circle cx="130" cy="250" r="3.5" fill="#1e293b"/>
  <circle cx="130" cy="85" r="3.5" fill="#1e40af"/>
  <circle cx="275" cy="85" r="3.5" fill="#1e40af"/>
  <circle cx="238.9" cy="126.1" r="3.5" fill="#dc2626"/>

  <!-- Labels -->
  <text x="115" y="255" font-style="italic" font-weight="bold">O</text>
  <text x="115" y="80" font-style="italic" font-weight="bold" fill="#1e40af">A</text>
  <text x="283" y="90" font-style="italic" font-weight="bold" fill="#1e40af">B</text>
  <text x="246.918910275232" y="141.0577917557705" font-style="italic" font-weight="bold" fill="#dc2626">C</text>

  <!-- Dimension / explanatory labels -->
  <text x="180" y="75" fill="#1e40af" font-size="13px">切线方向 (水平飞行)</text>
  <text x="106.0" y="167.5" font-style="italic" fill="#475569">R</text>
  <text x="179.459455137616" y="206.02889587788525" font-style="italic" fill="#475569">R</text>
  <text x="287" y="105.52889587788525" fill="#dc2626" font-size="12px">落差 4.9 m</text>
</svg>