<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Earth arc -->
  <path d="M 50 200 A 130 130 0 0 1 310 200" fill="none" stroke="#222" stroke-width="1.6"/>

  <!-- Points coordinates: O=(180,200), A=(180,70), B=(300,70), C=(300,161) -->
  <!-- O to A -->
  <line x1="180" y1="200" x2="180" y2="70" stroke="#222" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- O to C -->
  <line x1="180" y1="200" x2="300" y2="161" stroke="#222" stroke-width="1.2"/>
  <!-- A to B -->
  <line x1="180" y1="70" x2="300" y2="70" stroke="#1e40af" stroke-width="2"/>
  <!-- B to C -->
  <line x1="300" y1="70" x2="300" y2="161" stroke="#1e40af" stroke-width="2"/>

  <!-- Points -->
  <circle cx="180" cy="70" r="3" fill="#222"/>
  <circle cx="300" cy="70" r="3" fill="#222"/>
  <circle cx="300" cy="161" r="3" fill="#222"/>
  <circle cx="180" cy="200" r="3" fill="#222"/>

  <!-- Labels -->
  <text x="172" y="62" font-style="italic">A</text>
  <text x="308" y="68" font-style="italic">B</text>
  <text x="308" y="165" font-style="italic">C</text>
  <text x="172" y="216" font-style="italic">O</text>
</svg>
