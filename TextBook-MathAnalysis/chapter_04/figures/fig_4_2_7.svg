<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="auto" style="max-width:300px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="200" x2="270" y2="200" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <line x1="150" y1="215" x2="150" y2="20" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <text x="275" y="208" font-style="italic">x</text>
  <text x="138" y="22" font-style="italic">y</text>
  <text x="138" y="213" font-style="italic">O</text>

  <!-- y=|x| rays -->
  <line x1="50" y1="180" x2="150" y2="80" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="150" y1="80" x2="250" y2="180" stroke="#1e40af" stroke-width="2.2"/>

  <!-- Open/closed circles at origin -->
  <circle cx="150" cy="80" r="3.5" fill="#1e40af"/>

  <text x="210" y="90" fill="#1e40af">y=|x|</text>
</svg>
