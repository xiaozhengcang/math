<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr427" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="180" x2="300" y2="180" stroke="#222" stroke-width="1.4" marker-end="url(#arr427)"/>
  <line x1="160" y1="210" x2="160" y2="25" stroke="#222" stroke-width="1.4" marker-end="url(#arr427)"/>
  <text x="305" y="185" font-style="italic">x</text>
  <text x="145" y="25" font-style="italic">y</text>
  <text x="145" y="196" font-style="italic">O</text>

  <!-- Left Ray: y = -x (slope in screen = +1 from (55, 75) to (160, 180)) -->
  <line x1="55" y1="75" x2="160" y2="180" stroke="#1e40af" stroke-width="2.4"/>

  <!-- Right Ray: y = x (slope in screen = -1 from (160, 180) to (265, 75)) -->
  <line x1="160" y1="180" x2="265" y2="75" stroke="#1e40af" stroke-width="2.4"/>

  <!-- Corner point at origin -->
  <circle cx="160" cy="180" r="3.5" fill="#1e40af"/>

  <!-- Labels for the branches -->
  <text x="60" y="67" fill="#1e40af" font-weight="bold">y = -x (x &lt; 0)</text>
  <text x="210" y="67" fill="#1e40af" font-weight="bold">y = x (x ≥ 0)</text>

  <!-- Left/right derivative indicators -->
  <text x="85" y="145" fill="#ea580c" font-size="12px">f'_(0) = -1</text>
  <text x="185" y="145" fill="#16a34a" font-size="12px">f'_+(0) = +1</text>

  <!-- Note on non-differentiability -->
  <text x="100" y="215" fill="#dc2626" font-size="12px" font-weight="bold">在 x = 0 处左右导数不等，不可导</text>
</svg>