<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr441" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
    <marker id="arr_vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Ground and axes -->
  <line x1="30" y1="180" x2="355" y2="180" stroke="#222" stroke-width="1.4" marker-end="url(#arr441)"/>
  <line x1="50" y1="205" x2="50" y2="25" stroke="#222" stroke-width="1.4" marker-end="url(#arr441)"/>
  <text x="360" y="185" font-style="italic">x</text>
  <text x="35" y="25" font-style="italic">y</text>
  <text x="35" y="196" font-style="italic">O</text>

  <!-- Parabolic trajectory -->
  <path d="M 50.0,180.0 L 52.6,175.2 L 55.2,170.6 L 57.8,166.0 L 60.4,161.6 L 63.0,157.2 L 65.6,152.9 L 68.2,148.8 L 70.8,144.7 L 73.4,140.7 L 76.0,136.8 L 78.6,133.0 L 81.2,129.3 L 83.8,125.7 L 86.4,122.2 L 89.0,118.8 L 91.6,115.5 L 94.2,112.3 L 96.8,109.2 L 99.4,106.1 L 102.0,103.2 L 104.6,100.4 L 107.2,97.6 L 109.8,95.0 L 112.4,92.4 L 115.0,90.0 L 117.6,87.6 L 120.2,85.4 L 122.8,83.2 L 125.4,81.2 L 128.0,79.2 L 130.6,77.3 L 133.2,75.6 L 135.8,73.9 L 138.4,72.3 L 141.0,70.8 L 143.6,69.4 L 146.2,68.1 L 148.8,66.9 L 151.4,65.8 L 154.0,64.8 L 156.6,63.9 L 159.2,63.1 L 161.8,62.4 L 164.4,61.7 L 167.0,61.2 L 169.6,60.8 L 172.2,60.4 L 174.8,60.2 L 177.4,60.0 L 180.0,60.0 L 182.6,60.0 L 185.2,60.2 L 187.8,60.4 L 190.4,60.8 L 193.0,61.2 L 195.6,61.7 L 198.2,62.4 L 200.8,63.1 L 203.4,63.9 L 206.0,64.8 L 208.6,65.8 L 211.2,66.9 L 213.8,68.1 L 216.4,69.4 L 219.0,70.8 L 221.6,72.3 L 224.2,73.9 L 226.8,75.6 L 229.4,77.3 L 232.0,79.2 L 234.6,81.2 L 237.2,83.2 L 239.8,85.4 L 242.4,87.6 L 245.0,90.0 L 247.6,92.4 L 250.2,95.0 L 252.8,97.6 L 255.4,100.4 L 258.0,103.2 L 260.6,106.1 L 263.2,109.2 L 265.8,112.3 L 268.4,115.5 L 271.0,118.8 L 273.6,122.2 L 276.2,125.7 L 278.8,129.3 L 281.4,133.0 L 284.0,136.8 L 286.6,140.7 L 289.2,144.7 L 291.8,148.8 L 294.4,152.9 L 297.0,157.2 L 299.6,161.6 L 302.2,166.0 L 304.8,170.6 L 307.4,175.2 L 310.0,180.0" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Tangent velocity vector at P -->
  <line x1="122.8" y1="83.2" x2="173.3" y2="42.3" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_vel)"/>
  <text x="178.3" y="38.3" fill="#dc2626" font-weight="bold">v(t)</text>

  <!-- Horizontal dashed line for angle reference -->
  <line x1="122.8" y1="83.2" x2="187.8" y2="83.2" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Angle arc for theta -->
  <path d="M 148.8 83.2 A 26 26 0 0 0 143.0 66.8" fill="none" stroke="#dc2626" stroke-width="1.4"/>
  <text x="154.8" y="75.2" fill="#dc2626" font-style="italic" font-weight="bold">θ</text>

  <!-- Point P -->
  <circle cx="122.8" cy="83.2" r="3.5" fill="#1e293b"/>
  <text x="114.8" y="101.2" font-weight="bold">P(x, y)</text>

  <!-- Highest point (theta = 0) -->
  <circle cx="180.0" cy="60" r="3" fill="#16a34a"/>
  <line x1="155.0" y1="60" x2="205.0" y2="60" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="155.0" y="52" fill="#16a34a" font-size="12px">最高点: θ = 0</text>

  <!-- Formula hint -->
  <text x="210" y="115" fill="#475569" font-size="12px">tan θ = (v₂ - gt) / v₁</text>
</svg>