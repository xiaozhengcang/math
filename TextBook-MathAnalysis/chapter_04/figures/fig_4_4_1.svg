<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="40" y1="160" x2="320" y2="160" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <line x1="50" y1="170" x2="50" y2="25" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <text x="325" y="168" font-style="italic">x</text>
  <text x="38" y="27" font-style="italic">y</text>
  <text x="38" y="168" font-style="italic">O</text>

  <!-- Parabolic trajectory -->
  <path d="M 50 160 Q 150 20 250 160" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Point P on trajectory -->
  <circle cx="170" cy="55" r="3.5" fill="#222"/>

  <!-- Tangent line at P with arrow -->
  <line x1="125" y1="85" x2="230" y2="30" stroke="#c2410c" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Horizontal reference -->
  <line x1="125" y1="55" x2="200" y2="55" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Angle arc -->
  <path d="M 155 55 A 20 20 0 0 0 165 42" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="160" y="38">θ</text>
</svg>
