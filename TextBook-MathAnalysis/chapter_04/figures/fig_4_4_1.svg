<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr441" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_tan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="180" x2="355" y2="180" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr441)"/>
  <line x1="50" y1="205" x2="50" y2="25" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr441)"/>
  <text x="360" y="184" font-style="italic">x</text>
  <text x="38" y="28" font-style="italic">y</text>
  <text x="36" y="194" font-style="italic">O</text>

  <!-- Parabolic projectile trajectory -->
  <path d="M 50,180 Q 120,70 190,70 Q 260,70 330,180" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Tangent velocity vector at (120, 97.5) -->
  <line x1="120" y1="97.5" x2="175" y2="54.2" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr_tan)"/>

  <!-- Horizontal reference line from (120, 97.5) -->
  <line x1="120" y1="97.5" x2="195" y2="97.5" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Angle arc for theta -->
  <path d="M 148,97.5 A 28,28 0 0,0 142.0,80.2" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="152" y="86" font-style="italic">θ</text>
</svg>