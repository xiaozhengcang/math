<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="55" y1="200" x2="320" y2="200" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <line x1="75" y1="215" x2="75" y2="30" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <text x="325" y="208" font-style="italic">x</text>
  <text x="63" y="32" font-style="italic">y</text>
  <text x="63" y="213" font-style="italic">O</text>

  <!-- Curve y=f(x) -->
  <path d="M 90 170 Q 150 140 190 100 T 300 40" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="305" y="45" font-style="italic">y=f(x)</text>

  <!-- Points x and x+Δx -->
  <line x1="165" y1="200" x2="165" y2="112" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="245" y1="200" x2="245" y2="62" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Horizontal dashed lines -->
  <line x1="75" y1="112" x2="245" y2="112" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="75" y1="62" x2="245" y2="62" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Secant line -->
  <line x1="140" y1="155" x2="270" y2="40" stroke="#c2410c" stroke-width="1.8"/>
  <text x="275" y="45" fill="#c2410c">割线</text>

  <!-- Tangent line at x -->
  <line x1="130" y1="145" x2="205" y2="70" stroke="#16a34a" stroke-width="2"/>
  <text x="125" y="145" fill="#16a34a">切线</text>

  <!-- Labels -->
  <text x="155" y="215" font-style="italic">x</text>
  <text x="225" y="215">x+Δx</text>
  <text x="50" y="117">f(x)</text>
  <text x="35" y="67">f(x+Δx)</text>
  <text x="250" y="90">Δy</text>
  <text x="200" y="185">Δx</text>
</svg>
