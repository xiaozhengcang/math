<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr423" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_rot" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="210" x2="350" y2="210" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr423)"/>
  <line x1="80" y1="230" x2="80" y2="25" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr423)"/>
  <text x="355" y="214" font-style="italic">x</text>
  <text x="68" y="28" font-style="italic">y</text>
  <text x="66" y="224" font-style="italic">O</text>

  <!-- Projections to axes -->
  <line x1="170" y1="210" x2="170" y2="150" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="245" y1="210" x2="245" y2="85" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="80" y1="150" x2="170" y2="150" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="80" y1="85" x2="245" y2="85" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>

  <!-- Difference triangle -->
  <line x1="170" y1="150" x2="245" y2="150" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="245" y1="150" x2="245" y2="85" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Tangent line (切线) -->
  <line x1="105" y1="179" x2="330" y2="78" stroke="#1e293b" stroke-width="1.5"/>
  <text x="336" y="82" fill="#1e293b">切线</text>

  <!-- Secant line (割线) through (170, 150) and (245, 85) -->
  <line x1="125" y1="189" x2="285" y2="50" stroke="#1e293b" stroke-width="1.5"/>
  <text x="288" y="46" fill="#1e293b">割线</text>

  <!-- Limit rotation arrow: dashed arc from secant to tangent line -->
  <path d="M 268,64 A 120,120 0 0,1 292,95" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr_rot)"/>

  <!-- Curve y = f(x) -->
  <path d="M 115,183 C 145,172 155,162 170,150 C 200,124 230,105 245,85 C 255,70 258,55 260,38" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Axis coordinate labels -->
  <text x="166" y="226" font-style="italic">x</text>
  <text x="232" y="226" font-style="italic">x+Δx</text>
  <text x="44" y="154" font-style="italic">f(x)</text>
  <text x="24" y="89" font-style="italic">f(x+Δx)</text>

  <!-- Increments labels -->
  <text x="200" y="166" font-style="italic">Δx</text>
  <text x="254" y="124" font-style="italic">Δy</text>
</svg>