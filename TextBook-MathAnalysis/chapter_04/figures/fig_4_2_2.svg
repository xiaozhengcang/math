<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr422" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="190" x2="300" y2="190" stroke="#222" stroke-width="1.4" marker-end="url(#arr422)"/>
  <line x1="150" y1="210" x2="150" y2="25" stroke="#222" stroke-width="1.4" marker-end="url(#arr422)"/>
  <text x="305" y="195" font-style="italic">x</text>
  <text x="135" y="25" font-style="italic">y</text>
  <text x="135" y="206" font-style="italic">O</text>

  <!-- Parabola y = x^2 (opens UP) -->
  <path d="M 62.0,62.0 L 64.8,69.9 L 67.5,77.5 L 70.2,84.9 L 73.0,92.0 L 75.8,98.9 L 78.5,105.5 L 81.2,111.9 L 84.0,118.0 L 86.8,123.9 L 89.5,129.5 L 92.2,134.9 L 95.0,140.0 L 97.8,144.9 L 100.5,149.5 L 103.2,153.9 L 106.0,158.0 L 108.8,161.9 L 111.5,165.5 L 114.2,168.9 L 117.0,172.0 L 119.8,174.9 L 122.5,177.5 L 125.2,179.9 L 128.0,182.0 L 130.8,183.9 L 133.5,185.5 L 136.2,186.9 L 139.0,188.0 L 141.8,188.9 L 144.5,189.5 L 147.2,189.9 L 150.0,190.0 L 152.8,189.9 L 155.5,189.5 L 158.2,188.9 L 161.0,188.0 L 163.8,186.9 L 166.5,185.5 L 169.2,183.9 L 172.0,182.0 L 174.8,179.9 L 177.5,177.5 L 180.2,174.9 L 183.0,172.0 L 185.8,168.9 L 188.5,165.5 L 191.2,161.9 L 194.0,158.0 L 196.8,153.9 L 199.5,149.5 L 202.2,144.9 L 205.0,140.0 L 207.8,134.9 L 210.5,129.5 L 213.2,123.9 L 216.0,118.0 L 218.8,111.9 L 221.5,105.5 L 224.2,98.9 L 227.0,92.0 L 229.8,84.9 L 232.5,77.5 L 235.2,69.9 L 238.0,62.0" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="245" y="55" fill="#1e40af" font-style="italic" font-weight="bold">y = x²</text>

  <!-- Line x = a -->
  <line x1="199.5" y1="35" x2="199.5" y2="205" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="205.5" y="45" fill="#dc2626" font-weight="bold">x = a</text>
  <text x="194.5" y="206" fill="#dc2626" font-style="italic">a</text>

  <!-- Intersection Point P(a, a^2) -->
  <circle cx="199.5" cy="149.5" r="4" fill="#dc2626"/>
  <text x="207.5" y="147.5" fill="#dc2626">交点 (a, a²)</text>
  
  <text x="45" y="55" fill="#475569" font-size="12px">与曲线仅有 1 个交点</text>
  <text x="45" y="72" fill="#dc2626" font-size="12px">但穿透曲线，并非切线！</text>
</svg>