<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr422" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="195" x2="310" y2="195" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr422)"/>
  <line x1="180" y1="220" x2="180" y2="25" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr422)"/>
  <text x="315" y="200" font-style="italic">x</text>
  <text x="190" y="28" font-style="italic">y</text>
  <text x="186" y="210" font-style="italic">O</text>

  <!-- Parabola y = x^2 -->
  <path d="M 75,37.5 C 110,140 145,195 180,195 C 215,195 250,140 285,37.5" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <text x="270" y="32" font-style="italic">y=x²</text>

  <!-- Vertical line x = a -->
  <line x1="120" y1="220" x2="120" y2="40" stroke="#1e293b" stroke-width="1.4"/>
  <text x="108" y="32" font-style="italic">x=a</text>

  <!-- Intersection point -->
  <circle cx="120" cy="143.6" r="3.5" fill="#1e293b"/>
</svg>