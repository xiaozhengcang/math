<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="auto" style="max-width:320px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="160" y1="210" x2="290" y2="210" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <line x1="160" y1="220" x2="160" y2="30" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <text x="295" y="218" font-style="italic">x</text>
  <text x="148" y="32" font-style="italic">y</text>
  <text x="148" y="222" font-style="italic">O</text>

  <!-- Parabola y=x^2 (scaled) -->
  <path d="M 80 210 Q 120 130 160 90 Q 200 130 240 210" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="245" y="200" fill="#1e40af">y=x²</text>

  <!-- Vertical line x=a -->
  <line x1="220" y1="40" x2="220" y2="210" stroke="#222" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="225" y="50">x=a</text>

  <!-- Intersection point -->
  <circle cx="220" cy="150" r="3.5" fill="#1e40af" stroke="#1e40af"/>
</svg>
