<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="55" y1="200" x2="320" y2="200" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <line x1="75" y1="215" x2="75" y2="30" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <text x="325" y="208" font-style="italic">x</text>
  <text x="63" y="32" font-style="italic">y</text>
  <text x="63" y="213" font-style="italic">O</text>

  <!-- Curve y=f(x) -->
  <path d="M 90 170 Q 150 140 190 100 T 300 45" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="305" y="50" font-style="italic">y=f(x)</text>

  <!-- Point at x -->
  <line x1="165" y1="200" x2="165" y2="112" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="205" y1="200" x2="205" y2="80" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Tangent segment -->
  <line x1="165" y1="112" x2="205" y2="80" stroke="#16a34a" stroke-width="2"/>

  <!-- Horizontal/vertical small triangle for dx, dy -->
  <line x1="165" y1="112" x2="205" y2="112" stroke="#222" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="205" y1="112" x2="205" y2="80" stroke="#222" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Delta y segment from curve to tangent top -->
  <line x1="205" y1="80" x2="205" y2="72" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Labels -->
  <text x="155" y="215" font-style="italic">x</text>
  <text x="190" y="215">x+Δx</text>
  <text x="180" y="105">dy</text>
  <text x="210" y="95">Δy</text>
  <text x="178" y="188">dx</text>
  <text x="45" y="117">f(x)</text>
  <text x="30" y="78">f(x+Δx)</text>
</svg>
