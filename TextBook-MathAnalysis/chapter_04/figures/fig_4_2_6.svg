<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr426" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="210" x2="350" y2="210" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr426)"/>
  <line x1="80" y1="230" x2="80" y2="25" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr426)"/>
  <text x="355" y="214" font-style="italic">x</text>
  <text x="68" y="28" font-style="italic">y</text>
  <text x="66" y="224" font-style="italic">O</text>

  <!-- Projections to axes -->
  <line x1="170" y1="210" x2="170" y2="150" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="245" y1="210" x2="245" y2="70" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="80" y1="150" x2="245" y2="150" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="80" y1="70" x2="245" y2="70" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>

  <!-- Tangent Line through (170, 150) and (245, 101) -->
  <line x1="120" y1="182.5" x2="315" y2="55.7" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Curve y = f(x) -->
  <path d="M 110,183 C 145,172 155,162 170,150 C 195,130 225,105 245,70 C 255,52 260,42 265,30" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="255" y="25" font-style="italic">y=f(x)</text>

  <!-- dx label below horizontal base of differential triangle -->
  <text x="202" y="166" font-style="italic">dx</text>

  <!-- dy curly brace (measuring vertical rise of tangent line) -->
  <path d="M 249,101 Q 253,101 253,105 L 253,121.5 Q 253,125.5 257,125.5 Q 253,125.5 253,129.5 L 253,146 Q 253,150 249,150" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="262" y="130" font-style="italic">dy</text>

  <!-- Δy curly brace (measuring total function increment) -->
  <path d="M 276,70 Q 280,70 280,74 L 280,106 Q 280,110 284,110 Q 280,110 280,114 L 280,146 Q 280,150 276,150" fill="none" stroke="#1e293b" stroke-width="1.1"/>
  <text x="289" y="114" font-style="italic">Δy</text>

  <!-- Axis coordinate labels -->
  <text x="166" y="226" font-style="italic">x</text>
  <text x="232" y="226" font-style="italic">x+Δx</text>
  <text x="44" y="154" font-style="italic">f(x)</text>
  <text x="24" y="74" font-style="italic">f(x+Δx)</text>
</svg>