<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="auto" style="max-width:320px; font-family:'Times New Roman', serif; font-size:14px;">
  <!-- Circle -->
  <circle cx="180" cy="130" r="70" fill="none" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Tangent line (touches circle precisely at top-left rim (130.5, 80.5)) -->
  <line x1="55" y1="156" x2="195" y2="16" stroke="#1e293b" stroke-width="1.8"/>
  <text x="186" y="12" fill="#1e293b">切线</text>

  <!-- Secant line (intersects circle at two points) -->
  <line x1="85" y1="165" x2="225" y2="25" stroke="#1e293b" stroke-width="1.8"/>
</svg>