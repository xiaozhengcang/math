<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="190" x2="320" y2="190" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <line x1="70" y1="205" x2="70" y2="30" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)"/>
  <text x="325" y="198" font-style="italic">x</text>
  <text x="58" y="32" font-style="italic">y</text>
  <text x="58" y="203" font-style="italic">O</text>

  <!-- Curve y=f(x) -->
  <path d="M 80 170 Q 140 150 180 110 T 280 45" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Vertical lines at x and x+Δx -->
  <line x1="160" y1="190" x2="160" y2="122" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="230" y1="190" x2="230" y2="73" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Horizontal dashed lines to y-axis -->
  <line x1="70" y1="122" x2="230" y2="122" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="70" y1="73" x2="230" y2="73" stroke="#222" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Delta x brace -->
  <line x1="160" y1="185" x2="230" y2="185" stroke="#222" stroke-width="1"/>
  <line x1="160" y1="183" x2="160" y2="187" stroke="#222" stroke-width="1"/>
  <line x1="230" y1="183" x2="230" y2="187" stroke="#222" stroke-width="1"/>
  <text x="188" y="202">Δx</text>

  <!-- Delta y brace -->
  <line x1="235" y1="122" x2="235" y2="73" stroke="#222" stroke-width="1"/>
  <line x1="233" y1="122" x2="237" y2="122" stroke="#222" stroke-width="1"/>
  <line x1="233" y1="73" x2="237" y2="73" stroke="#222" stroke-width="1"/>
  <text x="240" y="101">Δy</text>

  <!-- Labels -->
  <text x="152" y="203" font-style="italic">x</text>
  <text x="215" y="203">x+Δx</text>
  <text x="40" y="127">f(x)</text>
  <text x="25" y="78">f(x+Δx)</text>
  <text x="250" y="50" font-style="italic">y=f(x)</text>
</svg>
