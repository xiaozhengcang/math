<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr412" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="210" x2="350" y2="210" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr412)"/>
  <line x1="80" y1="230" x2="80" y2="30" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr412)"/>
  <text x="355" y="214" font-style="italic">x</text>
  <text x="68" y="32" font-style="italic">y</text>
  <text x="66" y="224" font-style="italic">O</text>

  <!-- Dashed projections to axes -->
  <line x1="170" y1="210" x2="170" y2="150" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="255" y1="210" x2="255" y2="75" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="80" y1="150" x2="170" y2="150" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>
  <line x1="80" y1="75" x2="255" y2="75" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4,4"/>

  <!-- Difference triangle legs -->
  <line x1="170" y1="150" x2="255" y2="150" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="255" y1="150" x2="255" y2="75" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Secant Chord connecting (x, f(x)) and (x+Δx, f(x+Δx)) -->
  <line x1="170" y1="150" x2="255" y2="75" stroke="#1e293b" stroke-width="1.6"/>

  <!-- Curve y = f(x) -->
  <path d="M 100,175 C 135,168 152,160 170,150 C 200,150 230,120 255,75 C 265,55 269,42 273,30" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Axis tick / coordinate labels -->
  <text x="166" y="226" font-style="italic">x</text>
  <text x="238" y="226" font-style="italic">x+Δx</text>
  <text x="44" y="154" font-style="italic">f(x)</text>
  <text x="24" y="79" font-style="italic">f(x+Δx)</text>

  <!-- Increments labels -->
  <text x="204" y="166" font-style="italic">Δx</text>
  <text x="264" y="117" font-style="italic">Δy</text>
</svg>