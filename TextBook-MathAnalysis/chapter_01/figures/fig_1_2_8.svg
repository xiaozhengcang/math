<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr8" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(15, 10)">
    <!-- Origin O at (50, 160) -->
    <!-- Peak (1, 1) at (150, 60), End (2, 0) at (250, 160) -->
    <!-- Cut x at 190 (between 1 and 2, y = 160 - 60 = 100 at cut) -->
    <line x1="20" y1="160" x2="300" y2="160" stroke="#222" stroke-width="1.4" marker-end="url(#arr8)" />
    <line x1="50" y1="180" x2="50" y2="20" stroke="#222" stroke-width="1.4" marker-end="url(#arr8)" />
    <text x="295" y="176" font-style="italic">x</text>
    <text x="36" y="28" font-style="italic">y</text>
    <text x="36" y="176" font-style="italic">O</text>

    <!-- Shaded area from 0 to x: polygon (50, 160) -> (150, 60) -> (190, 100) -> (190, 160) -->
    <polygon points="50,160 150,60 190,100 190,160" fill="#cbd5e1" />

    <!-- Triangle outline -->
    <line x1="50" y1="160" x2="150" y2="60" stroke="#222" stroke-width="1.8" />
    <line x1="150" y1="60" x2="250" y2="160" stroke="#222" stroke-width="1.8" />
    <line x1="190" y1="100" x2="190" y2="160" stroke="#222" stroke-width="1.8" />

    <!-- Labels -->
    <text x="135" y="50">(1, 1)</text>
    <text x="186" y="176" font-style="italic">x</text>
    <text x="246" y="176">2</text>
  </g>
</svg>