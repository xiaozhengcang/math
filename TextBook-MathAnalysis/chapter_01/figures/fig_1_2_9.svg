<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="auto" style="max-width:320px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr9" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Frustum container:
         Top ellipse: center (180, 50), rx=85, ry=22
         Interface 1 (kerosene/water, depth 5cm): center (180, 120), rx=72, ry=18
         Interface 2 (water/mercury, depth +4cm=9cm): center (180, 190), rx=60, ry=15
         Bottom ellipse (bottom, depth +2cm=11cm): center (180, 240), rx=48, ry=12
    -->
    <!-- Outlines -->
    <line x1="95" y1="50" x2="132" y2="240" stroke="#222" stroke-width="1.8" />
    <line x1="265" y1="50" x2="228" y2="240" stroke="#222" stroke-width="1.8" />

    <!-- Top rim -->
    <ellipse cx="180" cy="50" rx="85" ry="22" fill="#f8fafc" stroke="#222" stroke-width="1.8" />

    <!-- Interface 1: 5cm -->
    <path d="M 108 120 A 72 18 0 0 1 252 120" stroke="#888" stroke-dasharray="4,4" stroke-width="1.2" fill="none" />
    <path d="M 108 120 A 72 18 0 0 0 252 120" stroke="#222" stroke-width="1.8" fill="none" />

    <!-- Interface 2: 4cm -->
    <path d="M 120 190 A 60 15 0 0 1 240 190" stroke="#888" stroke-dasharray="4,4" stroke-width="1.2" fill="none" />
    <path d="M 120 190 A 60 15 0 0 0 240 190" stroke="#222" stroke-width="1.8" fill="none" />

    <!-- Bottom: 2cm -->
    <path d="M 132 240 A 48 12 0 0 1 228 240" stroke="#888" stroke-dasharray="4,4" stroke-width="1.2" fill="none" />
    <path d="M 132 240 A 48 12 0 0 0 228 240" stroke="#222" stroke-width="1.8" fill="none" />

    <!-- Dimension arrows on left -->
    <!-- 5 cm: y from 50 to 120 -->
    <line x1="70" y1="50" x2="95" y2="50" stroke="#555" stroke-width="1" />
    <line x1="70" y1="120" x2="108" y2="120" stroke="#555" stroke-width="1" />
    <line x1="78" y1="53" x2="78" y2="117" stroke="#222" stroke-width="1.2" marker-start="url(#arr9)" marker-end="url(#arr9)" />
    <text x="32" y="90">5 cm</text>

    <!-- 4 cm: y from 120 to 190 -->
    <line x1="70" y1="190" x2="120" y2="190" stroke="#555" stroke-width="1" />
    <line x1="78" y1="123" x2="78" y2="187" stroke="#222" stroke-width="1.2" marker-start="url(#arr9)" marker-end="url(#arr9)" />
    <text x="32" y="160">4 cm</text>

    <!-- 2 cm: y from 190 to 240 -->
    <line x1="70" y1="240" x2="132" y2="240" stroke="#555" stroke-width="1" />
    <line x1="78" y1="193" x2="78" y2="237" stroke="#222" stroke-width="1.2" marker-start="url(#arr9)" marker-end="url(#arr9)" />
    <text x="32" y="220">2 cm</text>
  </g>
</svg>