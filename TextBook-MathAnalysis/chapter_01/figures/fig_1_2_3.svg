<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Axes: origin at (120, 140), step = 35 -->
    <line x1="20" y1="140" x2="340" y2="140" stroke="#222" stroke-width="1.4" marker-end="url(#arr3)" />
    <line x1="120" y1="220" x2="120" y2="20" stroke="#222" stroke-width="1.4" marker-end="url(#arr3)" />
    <text x="335" y="156" font-style="italic">x</text>
    <text x="105" y="26" font-style="italic">y</text>
    <text x="104" y="156" font-style="italic">O</text>

    <!-- Ticks -->
    <!-- x = -2 (50), -1 (85), 0 (120), 1 (155), 2 (190), 3 (225), 4 (260) -->
    <line x1="85" y1="137" x2="85" y2="143" stroke="#222" />
    <text x="78" y="158">-1</text>
    <line x1="155" y1="137" x2="155" y2="143" stroke="#222" />
    <text x="152" y="158">1</text>
    <line x1="190" y1="137" x2="190" y2="143" stroke="#222" />
    <text x="187" y="158">2</text>
    <line x1="225" y1="137" x2="225" y2="143" stroke="#222" />
    <text x="222" y="158">3</text>
    <line x1="260" y1="137" x2="260" y2="143" stroke="#222" />
    <text x="257" y="158">4</text>

    <!-- Steps -->
    <!-- n = -2: x in [-2, -1), y = -2 (y_px = 140 + 70 = 210) -->
    <line x1="50" y1="210" x2="85" y2="210" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="50" cy="210" r="3.2" fill="#1e40af" />
    <circle cx="85" cy="210" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- n = -1: x in [-1, 0), y = -1 (y_px = 140 + 35 = 175) -->
    <line x1="85" y1="175" x2="120" y2="175" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="85" cy="175" r="3.2" fill="#1e40af" />
    <circle cx="120" cy="175" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- n = 0: x in [0, 1), y = 0 (y_px = 140) -->
    <line x1="120" y1="140" x2="155" y2="140" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="120" cy="140" r="3.2" fill="#1e40af" />
    <circle cx="155" cy="140" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- n = 1: x in [1, 2), y = 1 (y_px = 105) -->
    <line x1="155" y1="105" x2="190" y2="105" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="155" cy="105" r="3.2" fill="#1e40af" />
    <circle cx="190" cy="105" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- n = 2: x in [2, 3), y = 2 (y_px = 70) -->
    <line x1="190" y1="70" x2="225" y2="70" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="190" cy="70" r="3.2" fill="#1e40af" />
    <circle cx="225" cy="70" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- n = 3: x in [3, 4), y = 3 (y_px = 35) -->
    <line x1="225" y1="35" x2="260" y2="35" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="225" cy="35" r="3.2" fill="#1e40af" />
    <circle cx="260" cy="35" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />
  </g>
</svg>