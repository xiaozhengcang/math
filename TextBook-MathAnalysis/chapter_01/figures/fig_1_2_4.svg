<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Origin at (110, 120), step = 45, y=1 height = 55 -->
    <line x1="20" y1="120" x2="345" y2="120" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)" />
    <line x1="110" y1="155" x2="110" y2="25" stroke="#222" stroke-width="1.4" marker-end="url(#arr4)" />
    <text x="340" y="136" font-style="italic">x</text>
    <text x="96" y="32" font-style="italic">y</text>
    <text x="94" y="136" font-style="italic">O</text>

    <!-- Ticks -->
    <text x="60" y="136">-1</text>
    <text x="152" y="136">1</text>
    <text x="197" y="136">2</text>
    <text x="242" y="136">3</text>
    <text x="287" y="136">4</text>

    <!-- Sawtooth waves -->
    <!-- [-2, -1) -->
    <line x1="20" y1="120" x2="65" y2="65" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="20" cy="120" r="3.2" fill="#1e40af" />
    <circle cx="65" cy="65" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- [-1, 0) -->
    <line x1="65" y1="120" x2="110" y2="65" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="65" cy="120" r="3.2" fill="#1e40af" />
    <circle cx="110" cy="65" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- [0, 1) -->
    <line x1="110" y1="120" x2="155" y2="65" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="110" cy="120" r="3.2" fill="#1e40af" />
    <circle cx="155" cy="65" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- [1, 2) -->
    <line x1="155" y1="120" x2="200" y2="65" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="155" cy="120" r="3.2" fill="#1e40af" />
    <circle cx="200" cy="65" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- [2, 3) -->
    <line x1="200" y1="120" x2="245" y2="65" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="200" cy="120" r="3.2" fill="#1e40af" />
    <circle cx="245" cy="65" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />

    <!-- [3, 4) -->
    <line x1="245" y1="120" x2="290" y2="65" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="245" cy="120" r="3.2" fill="#1e40af" />
    <circle cx="290" cy="65" r="3.2" fill="#fff" stroke="#1e40af" stroke-width="1.8" />
  </g>
</svg>