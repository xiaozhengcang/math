<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="auto" style="max-width:320px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Center O at (140, 140), radius R = 100 -->
    <line x1="20" y1="140" x2="280" y2="140" stroke="#222" stroke-width="1.4" marker-end="url(#arr5)" />
    <line x1="140" y1="260" x2="140" y2="20" stroke="#222" stroke-width="1.4" marker-end="url(#arr5)" />
    <text x="275" y="156" font-style="italic">x</text>
    <text x="126" y="28" font-style="italic">y</text>
    <text x="124" y="156" font-style="italic">O</text>

    <!-- Circle -->
    <circle cx="140" cy="140" r="100" fill="none" stroke="#222" stroke-width="1.8" />

    <!-- Point P at t = 58 deg (approx 1 rad) -->
    <!-- cos(58) = 0.53, sin(58) = 0.85 -> px: 140 + 53 = 193, py: 140 - 85 = 55 -->
    <line x1="140" y1="140" x2="193" y2="55" stroke="#1e40af" stroke-width="1.8" />
    <circle cx="193" cy="55" r="3.5" fill="#1e40af" />
    <text x="198" y="52" font-style="italic">P(x, y)</text>

    <!-- Angle arc t -->
    <path d="M 175 140 A 35 35 0 0 0 159 110" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arr5)" />
    <text x="168" y="128" font-style="italic">t</text>
  </g>
</svg>