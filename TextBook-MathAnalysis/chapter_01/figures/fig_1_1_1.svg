<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="100%" height="auto" style="max-width:780px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <!-- 交集用 clipPath：S∩T = S 的区域 clip 到 T -->
    <clipPath id="clipT2">
      <circle cx="310" cy="75" r="52"/>
    </clipPath>
    <!-- 差集 S\T：先渲染 S，再用 T 的形状挖掉 -->
    <mask id="maskSdiffT">
      <!-- 整个 S 区域白色（可见） -->
      <circle cx="450" cy="115" r="52" fill="white"/>
      <!-- T 区域黑色（遮掉） -->
      <circle cx="492" cy="75" r="52" fill="black"/>
    </mask>
    <!-- 补集 S^c：矩形减去 S -->
    <mask id="maskScomp">
      <rect x="585" y="20" width="155" height="155" fill="white"/>
      <circle cx="657" cy="97" r="48" fill="black"/>
    </mask>
  </defs>

  <!-- ====== Panel 1: S ∪ T ====== -->
  <g>
    <!-- 两个圆都填色 = 并集 -->
    <circle cx="90" cy="115" r="52" fill="#b0c4de" stroke="#222" stroke-width="1.8"/>
    <circle cx="132" cy="75" r="52" fill="#b0c4de" stroke="#222" stroke-width="1.8"/>
    <text x="72" y="138" font-style="italic" fill="#222">S</text>
    <text x="152" y="62" font-style="italic" fill="#222">T</text>
    <text x="111" y="206" text-anchor="middle" font-style="italic" fill="#222">S ∪ T</text>
  </g>

  <!-- ====== Panel 2: S ∩ T ====== -->
  <g>
    <!-- 两圆轮廓（无填色） -->
    <circle cx="270" cy="115" r="52" fill="#f5f5f5" stroke="#222" stroke-width="1.8"/>
    <circle cx="312" cy="75" r="52" fill="#f5f5f5" stroke="#222" stroke-width="1.8"/>
    <!-- 交集部分：S 的区域裁剪到 T 中 -->
    <circle cx="270" cy="115" r="52" fill="#b0c4de" clip-path="url(#clipT2)" stroke="none"/>
    <!-- 重绘轮廓 -->
    <circle cx="270" cy="115" r="52" fill="none" stroke="#222" stroke-width="1.8"/>
    <circle cx="312" cy="75" r="52" fill="none" stroke="#222" stroke-width="1.8"/>
    <text x="252" y="138" font-style="italic" fill="#222">S</text>
    <text x="332" y="62" font-style="italic" fill="#222">T</text>
    <text x="291" y="206" text-anchor="middle" font-style="italic" fill="#222">S ∩ T</text>
  </g>

  <!-- ====== Panel 3: S \ T ====== -->
  <g>
    <!-- S 减去 T 的部分 -->
    <circle cx="450" cy="115" r="52" fill="#b0c4de" mask="url(#maskSdiffT)" stroke="none"/>
    <!-- 轮廓 -->
    <circle cx="450" cy="115" r="52" fill="none" stroke="#222" stroke-width="1.8"/>
    <circle cx="492" cy="75" r="52" fill="none" stroke="#222" stroke-width="1.8"/>
    <text x="432" y="138" font-style="italic" fill="#222">S</text>
    <text x="512" y="62" font-style="italic" fill="#222">T</text>
    <text x="471" y="206" text-anchor="middle" font-style="italic" fill="#222">S \ T</text>
  </g>

  <!-- ====== Panel 4: S^c ====== -->
  <g>
    <!-- 矩形范围减去圆 S 的部分 -->
    <rect x="585" y="20" width="155" height="155" fill="#b0c4de" mask="url(#maskScomp)" stroke="none"/>
    <!-- 轮廓 -->
    <rect x="585" y="20" width="155" height="155" fill="none" stroke="#222" stroke-width="1.8"/>
    <circle cx="657" cy="97" r="48" fill="#f5f5f5" stroke="#222" stroke-width="1.8"/>
    <text x="651" y="102" font-style="italic" fill="#222">S</text>
    <text x="725" y="42" font-style="italic" fill="#222">X</text>
    <text x="657" y="206" text-anchor="middle" font-style="italic" fill="#222">S<tspan baseline-shift="super" font-size="12px">c</tspan></text>
  </g>
</svg>