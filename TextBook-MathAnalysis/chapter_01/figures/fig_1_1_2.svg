<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="auto" style="max-width:680px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- ===== Left panel: 2D A×B rectangle ===== -->
  <!-- Origin O at (70, 230), x-axis goes right, y-axis goes up -->
  <g transform="translate(0, 0)">
    <!-- Axes -->
    <line x1="50" y1="230" x2="280" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="70" y1="250" x2="70" y2="30"  stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="270" y="248" font-style="italic">x</text>
    <text x="54"  y="38"  font-style="italic">y</text>
    <text x="54"  y="248" font-style="italic">O</text>

    <!-- Rectangle [a,b]×[c,d]: a=110, b=230 (x coords), c=y=190→px, d=y=80→px -->
    <!-- x=a at px 120, x=b at px 220 -->
    <!-- y=c at px 190, y=d at px 90 -->
    <rect x="120" y="90" width="100" height="100" fill="#e8f0fe" stroke="#222" stroke-width="1.8"/>

    <!-- Dashed projection lines -->
    <line x1="120" y1="190" x2="120" y2="230" stroke="#888" stroke-dasharray="4,4" stroke-width="1.2"/>
    <line x1="220" y1="190" x2="220" y2="230" stroke="#888" stroke-dasharray="4,4" stroke-width="1.2"/>
    <line x1="70"  y1="190" x2="120" y2="190" stroke="#888" stroke-dasharray="4,4" stroke-width="1.2"/>
    <line x1="70"  y1="90"  x2="120" y2="90"  stroke="#888" stroke-dasharray="4,4" stroke-width="1.2"/>

    <!-- Axis labels -->
    <text x="115" y="248" font-style="italic">a</text>
    <text x="215" y="248" font-style="italic">b</text>
    <text x="52"  y="195" font-style="italic">c</text>
    <text x="52"  y="95"  font-style="italic">d</text>

    <!-- Title -->
    <text x="150" y="280" text-anchor="middle" font-style="italic">A × B</text>
  </g>

  <!-- ===== Right panel: 3D A×B×C cuboid ===== -->
  <!--
    Coordinate system:
      Origin O at (420, 220) in SVG coords
      y-axis: points right → (+1, 0) in SVG
      z-axis: points up   → (0, -1) in SVG
      x-axis: isometric, points lower-left → (-0.6, +0.5) in SVG (normalized to unit=50px)

    Unit sizes:
      A=[a,b]: x-depth units = 2 → 2*50px = 100px along x-dir
      B=[c,d]: y-width units = 2 → 2*50px = 100px along y-dir  
      C=[e,f]: z-height units = 2 → 2*50px = 100px along z-dir

    x-axis unit vector: (-0.6, 0.5)*50 = (-30, 25) per unit
    y-axis unit vector: (1, 0)*50 = (50, 0) per unit
    z-axis unit vector: (0, -1)*50 = (0, -50) per unit

    Cuboid:
      Origin corner (near): O = (420, 220)
      Along x: 2 units → Δ=(-60, 50)
      Along y: 2 units → Δ=(100, 0)
      Along z: 2 units → Δ=(0, -100)

    8 vertices (x=0..2, y=0..2, z=0..2):
      (0,0,0) = O = (420, 220)      ← front-bottom-near
      (2,0,0) = O+(-60,50) = (360, 270) ← back-bottom-near  (hidden)
      (0,2,0) = O+(100,0) = (520, 220)  ← front-bottom-far
      (2,2,0) = (460, 270)              ← back-bottom-far   (hidden)
      (0,0,2) = O+(0,-100) = (420, 120) ← front-top-near
      (2,0,2) = (360, 170)              ← back-top-near     (hidden)
      (0,2,2) = (520, 120)              ← front-top-far
      (2,2,2) = (460, 170)              ← back-top-far
  -->
  <g transform="translate(0, 0)">
    <!-- Axes from O=(420,220) -->
    <!-- y-axis (right) -->
    <line x1="420" y1="220" x2="560" y2="220" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- z-axis (up) -->
    <line x1="420" y1="220" x2="420" y2="50"  stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- x-axis (lower-left), direction (-0.6, 0.5), length ~150 → endpoint ≈(420-90, 220+75)=(330,295) -->
    <line x1="420" y1="220" x2="330" y2="295" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="565" y="236" font-style="italic">y</text>
    <text x="406" y="56"  font-style="italic">z</text>
    <text x="318" y="308" font-style="italic">x</text>
    <text x="424" y="238" font-style="italic">O</text>

    <!-- Dashed hidden edges -->
    <!-- bottom face hidden edges: (0,0,0)-(2,0,0), (0,0,0)-(2,0,0)→... -->
    <!-- vertex (2,0,0)=(360,270) hidden -->
    <line x1="420" y1="220" x2="360" y2="270" stroke="#888" stroke-dasharray="4,3" stroke-width="1.2"/>
    <line x1="360" y1="270" x2="460" y2="270" stroke="#888" stroke-dasharray="4,3" stroke-width="1.2"/>
    <line x1="360" y1="270" x2="360" y2="170" stroke="#888" stroke-dasharray="4,3" stroke-width="1.2"/>

    <!-- Visible solid edges of cuboid -->
    <!-- Bottom face visible edges -->
    <line x1="420" y1="220" x2="520" y2="220" stroke="#222" stroke-width="1.8"/>
    <line x1="520" y1="220" x2="460" y2="270" stroke="#222" stroke-width="1.8"/>

    <!-- Vertical edges (z-direction) -->
    <line x1="420" y1="220" x2="420" y2="120" stroke="#222" stroke-width="1.8"/>
    <line x1="520" y1="220" x2="520" y2="120" stroke="#222" stroke-width="1.8"/>
    <line x1="460" y1="270" x2="460" y2="170" stroke="#222" stroke-width="1.8"/>

    <!-- Top face edges -->
    <line x1="420" y1="120" x2="520" y2="120" stroke="#222" stroke-width="1.8"/>
    <line x1="420" y1="120" x2="360" y2="170" stroke="#222" stroke-width="1.8"/>
    <line x1="360" y1="170" x2="460" y2="170" stroke="#222" stroke-width="1.8"/>
    <line x1="460" y1="170" x2="520" y2="120" stroke="#222" stroke-width="1.8"/>

    <!-- Face fills (back faces first, then front faces) -->
    <!-- Top face: (420,120),(520,120),(460,170),(360,170) -->
    <polygon points="420,120 520,120 460,170 360,170" fill="#dce8f7" fill-opacity="0.7" stroke="none"/>
    <!-- Right face: (520,220),(460,270),(460,170),(520,120) -->
    <polygon points="520,220 460,270 460,170 520,120" fill="#c8d8f0" fill-opacity="0.7" stroke="none"/>
    <!-- Front face: (420,220),(520,220),(520,120),(420,120) -->
    <polygon points="420,220 520,220 520,120 420,120" fill="#e8f0fe" fill-opacity="0.7" stroke="none"/>

    <!-- Re-draw edges on top of fills -->
    <line x1="420" y1="220" x2="520" y2="220" stroke="#222" stroke-width="1.8"/>
    <line x1="520" y1="220" x2="460" y2="270" stroke="#222" stroke-width="1.8"/>
    <line x1="420" y1="220" x2="420" y2="120" stroke="#222" stroke-width="1.8"/>
    <line x1="520" y1="220" x2="520" y2="120" stroke="#222" stroke-width="1.8"/>
    <line x1="460" y1="270" x2="460" y2="170" stroke="#222" stroke-width="1.8"/>
    <line x1="420" y1="120" x2="520" y2="120" stroke="#222" stroke-width="1.8"/>
    <line x1="420" y1="120" x2="360" y2="170" stroke="#222" stroke-width="1.8"/>
    <line x1="360" y1="170" x2="460" y2="170" stroke="#222" stroke-width="1.8"/>
    <line x1="460" y1="170" x2="520" y2="120" stroke="#222" stroke-width="1.8"/>

    <!--
      Labels for axes:
        a is on x-axis at x=1 unit: O+(-30,25)=(390,245)
        b is on x-axis at x=2 unit: (360,270) - labeled near tick
        c is on y-axis at y=1 unit: O+(50,0)=(470,220) - label below
        d is on y-axis at y=2 unit: (520,220) - label below
        e is on z-axis at z=1 unit: O+(0,-50)=(420,170) - label left
        f is on z-axis at z=2 unit: (420,120) - label left
    -->
    <!-- Tick marks and labels on x-axis -->
    <line x1="393" y1="244" x2="387" y2="248" stroke="#222" stroke-width="1"/>
    <text x="374" y="256" font-style="italic">a</text>
    <line x1="363" y1="269" x2="357" y2="273" stroke="#222" stroke-width="1"/>
    <text x="344" y="281" font-style="italic">b</text>

    <!-- Tick marks and labels on y-axis -->
    <line x1="470" y1="217" x2="470" y2="223" stroke="#222" stroke-width="1"/>
    <text x="466" y="238" font-style="italic">c</text>
    <line x1="520" y1="217" x2="520" y2="223" stroke="#222" stroke-width="1"/>
    <text x="516" y="238" font-style="italic">d</text>

    <!-- Tick marks and labels on z-axis -->
    <line x1="417" y1="170" x2="423" y2="170" stroke="#222" stroke-width="1"/>
    <text x="400" y="175" font-style="italic">e</text>
    <line x1="417" y1="120" x2="423" y2="120" stroke="#222" stroke-width="1"/>
    <text x="400" y="125" font-style="italic">f</text>

    <!-- Title -->
    <text x="460" y="280" text-anchor="middle" font-style="italic">A × B × C</text>
  </g>
</svg>