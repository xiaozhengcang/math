<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="auto" style="max-width:680px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Left: 2D A x B -->
  <g transform="translate(10, 20)">
    <!-- Axes -->
    <line x1="50" y1="230" x2="270" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="70" y1="250" x2="70" y2="30" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="265" y="248" font-style="italic">x</text>
    <text x="52" y="38" font-style="italic">y</text>
    <text x="55" y="245" font-style="italic">O</text>

    <!-- Rectangle [a, b] x [c, d] -->
    <rect x="110" y="80" width="120" height="110" fill="#f4f6f8" stroke="#222" stroke-width="1.8" />
    <line x1="110" y1="190" x2="110" y2="230" stroke="#666" stroke-dasharray="4,4" stroke-width="1.2" />
    <line x1="230" y1="190" x2="230" y2="230" stroke="#666" stroke-dasharray="4,4" stroke-width="1.2" />
    <line x1="70" y1="190" x2="110" y2="190" stroke="#666" stroke-dasharray="4,4" stroke-width="1.2" />
    <line x1="70" y1="80" x2="110" y2="80" stroke="#666" stroke-dasharray="4,4" stroke-width="1.2" />

    <text x="106" y="248" font-style="italic">a</text>
    <text x="226" y="248" font-style="italic">b</text>
    <text x="56" y="195" font-style="italic">c</text>
    <text x="54" y="85" font-style="italic">d</text>
  </g>

  <!-- Right: 3D A x B x C -->
  <g transform="translate(340, 20)">
    <!-- Axes: x (pointing down-left), y (pointing right), z (pointing up) -->
    <line x1="100" y1="180" x2="310" y2="180" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="100" y1="180" x2="100" y2="20" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="100" y1="180" x2="30" y2="250" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" />

    <text x="305" y="198" font-style="italic">y</text>
    <text x="82" y="28" font-style="italic">z</text>
    <text x="22" y="260" font-style="italic">x</text>
    <text x="106" y="195" font-style="italic">O</text>

    <!-- Cuboid vertices:
         x in [a, b], y in [c, d], z in [e, f]
         Projected: origin at (100, 180).
         dx for x: -0.707 * s, dy for x: 0.707 * s
         y goes right (+y), z goes up (-z)
    -->
    <!-- Dashed projection box -->
    <!-- z levels: e=120 (y=100), f=60 (y=50) -->
    <!-- y levels: c=180, d=270 -->
    <!-- x levels: a=30 (proj: -25, +25), b=60 (proj: -50, +50) -->
    
    <!-- Front Face (at x=b): (100-50, y+50, z) -> x=50, y=180+50=230 to 270+50=320 is outside, let's calibrate: -->
    <!-- Let O=(100,180). x-axis: vector (-0.8, 0.6) -->
    <!-- let a: 40px -> (-32, 24); b: 80px -> (-64, 48) -->
    <!-- let c: 80px (x=180); d: 170px (x=270) -->
    <!-- let e: 70px (z=110); f: 130px (z=50) -->
    
    <!-- Dashed lines for axes markings -->
    <line x1="68" y1="204" x2="148" y2="204" stroke="#888" stroke-dasharray="3,3" />
    <line x1="36" y1="228" x2="206" y2="228" stroke="#888" stroke-dasharray="3,3" />
    <line x1="180" y1="180" x2="116" y2="228" stroke="#888" stroke-dasharray="3,3" />
    <line x1="270" y1="180" x2="206" y2="228" stroke="#888" stroke-dasharray="3,3" />
    
    <line x1="100" y1="110" x2="148" y2="110" stroke="#888" stroke-dasharray="3,3" />
    <line x1="100" y1="50" x2="148" y2="50" stroke="#888" stroke-dasharray="3,3" />
    <line x1="148" y1="110" x2="148" y2="204" stroke="#888" stroke-dasharray="3,3" />

    <!-- Cuboid: back face at x=a (origin + (-32, 24)):
         left-bottom: (148, 134), right-bottom: (238, 134), left-top: (148, 74), right-top: (238, 74)
         Front face at x=b (origin + (-64, 48)):
         left-bottom: (116, 158), right-bottom: (206, 158), left-top: (116, 98), right-top: (206, 98)
    -->
    <!-- Dashed back edges -->
    <line x1="148" y1="134" x2="238" y2="134" stroke="#888" stroke-dasharray="3,3" />
    <line x1="148" y1="134" x2="148" y2="74" stroke="#888" stroke-dasharray="3,3" />
    <line x1="148" y1="134" x2="116" y2="158" stroke="#888" stroke-dasharray="3,3" />

    <!-- Solid front/top/side edges -->
    <rect x="116" y="98" width="90" height="60" fill="#f8fafc" fill-opacity="0.7" stroke="#222" stroke-width="1.8" />
    <!-- Top Face -->
    <polygon points="116,98 148,74 238,74 206,98" fill="#eef2f6" fill-opacity="0.7" stroke="#222" stroke-width="1.8" />
    <!-- Right Face -->
    <polygon points="206,98 238,74 238,134 206,158" fill="#e2e8f0" fill-opacity="0.7" stroke="#222" stroke-width="1.8" />

    <!-- Outer projection dashed lines -->
    <line x1="100" y1="50" x2="238" y2="50" stroke="#888" stroke-dasharray="3,3" />
    <line x1="238" y1="50" x2="238" y2="74" stroke="#888" stroke-dasharray="3,3" />
    <line x1="100" y1="110" x2="270" y2="110" stroke="#888" stroke-dasharray="3,3" />
    <line x1="270" y1="110" x2="270" y2="180" stroke="#888" stroke-dasharray="3,3" />
    <line x1="36" y1="228" x2="36" y2="98" stroke="#888" stroke-dasharray="3,3" />
    <line x1="36" y1="98" x2="116" y2="98" stroke="#888" stroke-dasharray="3,3" />

    <!-- Labels -->
    <text x="72" y="200" font-style="italic">a</text>
    <text x="40" y="224" font-style="italic">b</text>
    <text x="182" y="196" font-style="italic">c</text>
    <text x="272" y="196" font-style="italic">d</text>
    <text x="104" y="114" font-style="italic">e</text>
    <text x="104" y="54" font-style="italic">f</text>
  </g>
</svg>