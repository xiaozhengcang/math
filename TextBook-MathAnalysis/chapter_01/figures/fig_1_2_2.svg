<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(20, 10)">
    <!-- Axes -->
    <line x1="20" y1="90" x2="280" y2="90" stroke="#222" stroke-width="1.4" marker-end="url(#arr2)" />
    <line x1="150" y1="165" x2="150" y2="15" stroke="#222" stroke-width="1.4" marker-end="url(#arr2)" />
    <text x="275" y="108" font-style="italic">x</text>
    <text x="136" y="22" font-style="italic">y</text>
    <text x="136" y="106" font-style="italic">O</text>

    <!-- Function rays -->
    <!-- y = 1 for x > 0 -->
    <line x1="154" y1="50" x2="270" y2="50" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="150" cy="50" r="3.5" fill="#fff" stroke="#1e40af" stroke-width="2" />
    <text x="134" y="55">1</text>

    <!-- y = 0 for x = 0 -->
    <circle cx="150" cy="90" r="3.5" fill="#1e40af" stroke="#1e40af" stroke-width="1" />

    <!-- y = -1 for x < 0 -->
    <line x1="30" y1="130" x2="146" y2="130" stroke="#1e40af" stroke-width="2.2" />
    <circle cx="150" cy="130" r="3.5" fill="#fff" stroke="#1e40af" stroke-width="2" />
    <text x="158" y="135">-1</text>
  </g>
</svg>