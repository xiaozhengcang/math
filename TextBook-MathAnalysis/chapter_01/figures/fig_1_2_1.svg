<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Outer Square of side a: 180 x 180, corner cut x=40 -->
    <rect x="80" y="20" width="180" height="180" fill="#fff" stroke="#222" stroke-width="1.8" />
    
    <!-- Shaded 4 corners -->
    <rect x="80" y="20" width="40" height="40" fill="#cbd5e1" stroke="#222" stroke-width="1.2" />
    <rect x="220" y="20" width="40" height="40" fill="#cbd5e1" stroke="#222" stroke-width="1.2" />
    <rect x="80" y="160" width="40" height="40" fill="#cbd5e1" stroke="#222" stroke-width="1.2" />
    <rect x="220" y="160" width="40" height="40" fill="#cbd5e1" stroke="#222" stroke-width="1.2" />

    <!-- Inner fold dashed lines -->
    <rect x="120" y="60" width="100" height="100" fill="none" stroke="#555" stroke-dasharray="5,4" stroke-width="1.5" />

    <!-- Dimension arrow for a on the left -->
    <line x1="55" y1="20" x2="80" y2="20" stroke="#222" stroke-width="1" />
    <line x1="55" y1="200" x2="80" y2="200" stroke="#222" stroke-width="1" />
    <line x1="65" y1="22" x2="65" y2="198" stroke="#222" stroke-width="1.2" marker-start="url(#arrowB)" marker-end="url(#arrowB)" />
    <text x="46" y="115" font-style="italic">a</text>

    <!-- Dimension arrow for x at bottom corner -->
    <line x1="80" y1="200" x2="80" y2="225" stroke="#222" stroke-width="1" />
    <line x1="120" y1="200" x2="120" y2="225" stroke="#222" stroke-width="1" />
    <line x1="82" y1="215" x2="118" y2="215" stroke="#222" stroke-width="1.2" marker-start="url(#arrowB)" marker-end="url(#arrowB)" />
    <text x="96" y="210" font-style="italic">x</text>
  </g>
</svg>