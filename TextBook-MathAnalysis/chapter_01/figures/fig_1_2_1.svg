<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arrBox" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#444"/>
    </marker>
  </defs>

  <!--
    Iron sheet: side a
    SVG layout: outer square 200×200, top-left at (70, 30)
    Corner squares: side x = 40px (x/a = 40/200 = 0.2, which is reasonable)
    
    Outer square corners: (70,30),(270,30),(270,230),(70,230)
    Corner cuts (size x=40):
      top-left:    (70,30) to (110,70)
      top-right:   (230,30) to (270,70)
      bottom-left: (70,190) to (110,230)
      bottom-right:(230,190) to (270,230)
    Fold lines (dashed): the inner square
      (110,30),(230,30),(270,70),(270,190),(230,230),(110,230),(70,190),(70,70) → rectangle at x=110..230, y=70..190
  -->

  <!-- Outer square -->
  <rect x="70" y="30" width="200" height="200" fill="#f8f8f8" stroke="#222" stroke-width="1.8"/>

  <!-- Shaded cut corners -->
  <rect x="70"  y="30"  width="40" height="40" fill="#c8d8e8" stroke="#555" stroke-width="1.2"/>
  <rect x="230" y="30"  width="40" height="40" fill="#c8d8e8" stroke="#555" stroke-width="1.2"/>
  <rect x="70"  y="190" width="40" height="40" fill="#c8d8e8" stroke="#555" stroke-width="1.2"/>
  <rect x="230" y="190" width="40" height="40" fill="#c8d8e8" stroke="#555" stroke-width="1.2"/>

  <!-- Fold lines (dashed inner rectangle) -->
  <rect x="110" y="70" width="120" height="120" fill="none" stroke="#888" stroke-dasharray="5,4" stroke-width="1.5"/>

  <!-- === Dimension: a (whole side, left side) === -->
  <!-- Bracket at x=42, from y=30 to y=230 -->
  <line x1="42" y1="30"  x2="68" y2="30"  stroke="#444" stroke-width="1"/>
  <line x1="42" y1="230" x2="68" y2="230" stroke="#444" stroke-width="1"/>
  <line x1="52" y1="32"  x2="52" y2="228" stroke="#444" stroke-width="1.2"
        marker-start="url(#arrBox)" marker-end="url(#arrBox)"/>
  <text x="30" y="135" font-style="italic" text-anchor="middle">a</text>

  <!-- === Dimension: x (corner width, bottom) === -->
  <!-- Bracket at y=248, from x=70 to x=110 -->
  <line x1="70"  y1="232" x2="70"  y2="252" stroke="#444" stroke-width="1"/>
  <line x1="110" y1="232" x2="110" y2="252" stroke="#444" stroke-width="1"/>
  <line x1="72"  y1="242" x2="108" y2="242" stroke="#444" stroke-width="1.2"
        marker-start="url(#arrBox)" marker-end="url(#arrBox)"/>
  <text x="90" y="268" font-style="italic" text-anchor="middle">x</text>

  <!-- === Labels: a-2x (inner dimension) === -->
  <line x1="110" y1="255" x2="110" y2="268" stroke="#444" stroke-width="1"/>
  <line x1="230" y1="255" x2="230" y2="268" stroke="#444" stroke-width="1"/>
  <line x1="112" y1="262" x2="228" y2="262" stroke="#444" stroke-width="1.2"
        marker-start="url(#arrBox)" marker-end="url(#arrBox)"/>
  <text x="170" y="280" text-anchor="middle" font-style="italic">a − 2x</text>
</svg>