<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="100%" height="auto" style="max-width:280px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Start at (60, 200) -->
    <!-- Vector a: from (60, 200) vertically up to (60, 80) -->
    <line x1="60" y1="200" x2="60" y2="82" stroke="#222" stroke-width="2" marker-end="url(#arr7)" />
    <text x="40" y="145" font-weight="bold" font-style="italic">a</text>

    <!-- Vector b: from (60, 80) to (200, 25) -->
    <line x1="60" y1="80" x2="198" y2="26" stroke="#222" stroke-width="2" marker-end="url(#arr7)" />
    <text x="115" y="45" font-weight="bold" font-style="italic">b</text>

    <!-- Vector a + b: from (60, 200) to (200, 25) -->
    <line x1="60" y1="200" x2="198" y2="27" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr7)" />
    <text x="145" y="130" font-weight="bold" font-style="italic">a + b</text>
  </g>
</svg>