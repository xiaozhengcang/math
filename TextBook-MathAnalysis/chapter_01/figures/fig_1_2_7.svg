<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="100%" height="auto" style="max-width:280px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
    <marker id="arr7b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>

  <!--
    Triangle for vector addition:
    Start point A = (55, 200)
    End of a: B = (55, 85)   (a points straight up, length=115)
    End of b: C = (210, 35)  (b points upper-right from B)
    
    Vector a: A→B
    Vector b: B→C
    Vector a+b: A→C (blue, the sum)
  -->

  <!-- Vector a: A(55,200) → B(55,85) -->
  <line x1="55" y1="200" x2="55" y2="88" stroke="#222" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="34" y="148" font-weight="bold" font-style="italic" font-size="17">a</text>

  <!-- Vector b: B(55,85) → C(210,35) -->
  <line x1="55" y1="85" x2="207" y2="37" stroke="#222" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="122" y="50" font-weight="bold" font-style="italic" font-size="17">b</text>

  <!-- Vector a+b: A(55,200) → C(210,35) -->
  <line x1="55" y1="200" x2="207" y2="38" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr7b)"/>
  <!-- Label placed to the right of the midpoint (132.5, 119) -->
  <text x="148" y="126" font-weight="bold" font-style="italic" font-size="17" fill="#1e40af">a+b</text>
</svg>