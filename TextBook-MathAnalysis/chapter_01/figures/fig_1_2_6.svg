<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="100%" height="auto" style="max-width:660px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
    <marker id="arrSm6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!--
    Cycloid with radius R=1.
    Parametric: x(t) = t - sin(t),  y(t) = 1 - cos(t),  t in [0, 2π]
    
    Scale: 1 unit = 55px (so circle radius = 55px, 2π ≈ 6.2832 → width ≈ 345px)
    Origin (t=0 contact point) at SVG (60, 185).
    
    SVG coords: px = origin_x + x(t)*55, py = origin_y - y(t)*55
    
    Notable points:
      t=0:   x=0,    y=0  → (60, 185)
      t=π/2: x≈0.571,y=1  → (60+31.4, 185-55) = (91.4, 130)
      t=π:   x≈3.142,y=2  → (60+172.7, 185-110) = (232.7, 75)  ← top
      t=3π/2:x≈5.712,y=1  → (60+314.2, 185-55) = (374.2, 130)
      t=2π:  x≈6.283,y=0  → (60+345.6, 185) = (405.6, 185)
    
    For the rolling circle illustration, show circle at t ≈ 1.2 rad:
      cos(1.2)≈0.362, sin(1.2)≈0.932
      Circle center: x_c = t - 0 = 1.2 units = 66px from origin → px = 60+66=126... 
      Wait: x_c(t) = R*t = 1.2 (in units), y_c = R = 1 (in units)
      → px_c = 60 + 1.2*55 = 60+66 = 126, py_c = 185 - 1*55 = 130
      Contact point P on ground: (px_c, 185) = (126, 185)
      
      Point A' (the tracing point):
        x_A = x(t) = t - sin(t) = 1.2 - 0.932 = 0.268 units → px = 60 + 0.268*55 = 60+14.7 = 74.7 ≈ 75
        y_A = y(t) = 1 - cos(t) = 1 - 0.362 = 0.638 units → py = 185 - 0.638*55 = 185-35.1 = 149.9 ≈ 150
      
      Angle arc: from vertical down from center to line CA':
        Center is at (126, 130). Vertical down = (126, 185).
        A' is at (75, 150).
        Vector CA' = (75-126, 150-130) = (-51, 20)
        This is to the upper-left, so angle is measured from straight down (0,-1) rotating CCW
        Arc from (126, 185-30=155) to toward A' at radius 30.
        
    Initial position: circle at t=0, center=(60, 130), contact=(60, 185)
    Mark as starting circle (dashed).
  -->

  <!-- Axes -->
  <line x1="30"  y1="185" x2="620" y2="185" stroke="#222" stroke-width="1.4" marker-end="url(#arr6)"/>
  <line x1="60"  y1="210" x2="60"  y2="25"  stroke="#222" stroke-width="1.4" marker-end="url(#arr6)"/>
  <text x="608" y="202" font-style="italic">x</text>
  <text x="46"  y="30"  font-style="italic">y</text>
  <text x="44"  y="200" font-style="italic">O</text>

  <!-- Ground line tick: 2π -->
  <line x1="406" y1="182" x2="406" y2="188" stroke="#222"/>
  <text x="396"  y="202">2π</text>

  <!-- Rolling circle at t=0 (initial position, dashed) -->
  <circle cx="60" cy="130" r="55" fill="none" stroke="#94a3b8" stroke-dasharray="5,4" stroke-width="1.4"/>
  <circle cx="60" cy="185" r="2.5" fill="#94a3b8"/>
  <text x="46" y="178" font-style="italic" fill="#94a3b8" font-size="14">A</text>

  <!-- Rolling circle at t=1.2 rad (current position) -->
  <!-- center at (126, 130) -->
  <circle cx="126" cy="130" r="55" fill="none" stroke="#374151" stroke-width="1.6"/>
  <!-- Radius from center to contact point P -->
  <line x1="126" y1="130" x2="126" y2="185" stroke="#555" stroke-dasharray="3,3" stroke-width="1.2"/>
  <!-- Contact point P -->
  <circle cx="126" cy="185" r="2.5" fill="#222"/>
  <text x="122" y="200" font-style="italic">P</text>

  <!-- Radius from center to tracing point A' -->
  <line x1="126" y1="130" x2="75"  y2="150" stroke="#1e40af" stroke-width="1.6"/>
  <!-- Tracing point A' -->
  <circle cx="75" cy="150" r="3.5" fill="#1e40af"/>
  <text x="56"  y="148" font-style="italic">A′</text>

  <!-- Angle arc t from vertical-down to radius CA' (CW on screen = CCW math) -->
  <!-- Arc center=(126,130), start at bottom (126,160) radius=30 -->
  <!-- End angle toward A': direction (-51,20), normalized, at radius 30 from center -->
  <!-- endpoint: 126 + 30*(-51/sqrt(51²+20²), 30*(20/sqrt(51²+20²)) -->
  <!-- sqrt(51²+20²)=sqrt(2601+400)=sqrt(3001)≈54.8 -->
  <!-- endpoint: (126 - 30*51/54.8, 130 + 30*20/54.8) = (126-27.9, 130+10.9) = (98.1, 140.9) ≈ (98, 141) -->
  <path d="M 126 160 A 30 30 0 0 0 98 141" fill="none" stroke="#374151" stroke-width="1.3" marker-end="url(#arrSm6)"/>
  <text x="104" y="162" font-style="italic">t</text>

  <!--
    Cycloid path: t from 0 to 2π, computed with ~40 points
    x(t)=(t-sin(t))*55+60, y(t)=185-(1-cos(t))*55
    t=0:    (60,    185)
    t=0.16: (60+(0.16-0.1595)*55, 185-(1-0.9872)*55) ≈ (60.03, 183.3)
    Computing key points:
    t:   x_unit=t-sin(t),  y_unit=1-cos(t),  px=60+x*55, py=185-y*55
    0.0: 0,       0      → 60,     185
    0.3: 0.0451,  0.0551 → 62.5,  181.97
    0.6: 0.1647,  0.1753 → 69.1,  175.4
    0.9: 0.3838,  0.3784 → 81.1,  164.2
    1.2: 0.2679,→ already calc above: 0.268, 0.638 → 74.7, 149.9
    Wait, 1.2: sin(1.2)=0.9320, so x=1.2-0.9320=0.268, y=1-cos(1.2)=1-0.3624=0.638 ✓
    1.5: sin(1.5)=0.9975, x=1.5-0.9975=0.5025, y=1-cos(1.5)=1-0.0707=0.9293 → (87.6, 133.9)
    π/2=1.5708: x=1.5708-1=0.5708, y=1-0=1 → (91.4, 130)
    2.0: sin(2.0)=0.9093, x=2.0-0.9093=1.0907, y=1-cos(2)=1-(-0.4161)=1.4161 → (120.0, 107.1)
    2.5: sin(2.5)=0.5985, x=1.9015, y=1-(-0.8011)=1.8011 → (164.6, 86.1)
    3.0: sin(3.0)=0.1411, x=2.8589, y=1-(-0.9900)=1.990 → (217.2, 75.6)
    π=3.1416: x=π-0=π, y=2 → (60+172.8, 185-110) = (232.8, 75)
    3.5: sin(3.5)=-0.3508, x=3.5+0.3508=3.8508, y=1-(-0.9365)=1.9365 → (271.8, 78.5)
    4.0: sin(4.0)=-0.7568, x=4.7568, y=1-(-0.6536)=1.6536 → (321.6, 94.5)
    4.5: sin(4.5)=-0.9775, x=5.4775, y=1-(-0.2108)=1.2108 → (361.3, 118.4)
    3π/2=4.7124: x=4.7124+1=5.7124, y=1-0=1 → (374.2, 130)
    5.0: sin(5.0)=-0.9589, x=5.9589, y=1-0.2837=0.7163 → (387.7, 146.6)
    5.5: sin(5.5)=-0.7055, x=6.2055, y=1-0.7087=0.2913 → (401.3, 169.0)
    2π=6.2832: x=2π-0=6.2832, y=0 → (405.6, 185)
    
    Using these ~14 points as a polyline (close enough for illustration):
  -->
  <polyline
    points="
      60,185
      62.5,182.0
      69.1,175.4
      81.1,164.2
      74.7,149.9
      87.6,133.9
      91.4,130.0
      120.0,107.1
      164.6,86.1
      217.2,75.6
      232.8,75.0
      271.8,78.5
      321.6,94.5
      361.3,118.4
      374.2,130.0
      387.7,146.6
      401.3,169.0
      405.6,185.0"
    fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round"/>
</svg>