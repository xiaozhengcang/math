<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" width="100%" height="auto" style="max-width:620px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(20, 10)">
    <!-- Ground / x axis: y = 170, origin O at (80, 170) -->
    <line x1="40" y1="170" x2="570" y2="170" stroke="#222" stroke-width="1.4" marker-end="url(#arr6)" />
    <line x1="80" y1="200" x2="80" y2="20" stroke="#222" stroke-width="1.4" marker-end="url(#arr6)" />
    <text x="560" y="188" font-style="italic">x</text>
    <text x="66" y="28" font-style="italic">y</text>
    <text x="68" y="186" font-style="italic">O</text>

    <!-- Radius R = 55 -->
    <!-- Circle 1 at start: center (80, 115) -->
    <circle cx="80" cy="115" r="55" fill="none" stroke="#64748b" stroke-width="1.4" />
    <text x="68" y="166" font-style="italic">A</text>

    <!-- Circle 2 rolled by angle t:
         t ~ 1.2 rad (approx 70 deg)
         Center moved right by R*t = 55 * 1.2 = 66 -> center (146, 115)
         Contact point P on x axis = (146, 170)
    -->
    <circle cx="146" cy="115" r="55" fill="none" stroke="#222" stroke-width="1.6" />
    <line x1="146" y1="115" x2="146" y2="170" stroke="#555" stroke-dasharray="3,3" stroke-width="1.2" />
    <circle cx="146" cy="170" r="2.5" fill="#222" />
    <text x="142" y="188" font-style="italic">P</text>

    <!-- Point A' on circle 2:
         x = R(t - sin t) = 55*(1.2 - 0.932) = 55 * 0.268 = 14.7 -> 80 + 14.7 = 94.7
         y = R(1 - cos t) = 55*(1 - 0.362) = 55 * 0.638 = 35.1 -> 170 - 35.1 = 134.9
    -->
    <line x1="146" y1="115" x2="95" y2="135" stroke="#1e40af" stroke-width="1.6" />
    <circle cx="95" cy="135" r="3.5" fill="#1e40af" />
    <text x="82" y="130" font-style="italic">A′</text>

    <!-- Angle t between vertical down line and radius CA' -->
    <path d="M 146 145 A 30 30 0 0 1 122 125" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arr6)" />
    <text x="132" y="145" font-style="italic">t</text>

    <!-- Cycloid Arch: from x=80 (t=0) to x = 80 + 2*pi*55 = 80 + 345.6 = 425.6 (t=2*pi) -->
    <!-- Path computed using exact cycloid coordinates -->
    <path d="M 80,170 C 105,160 120,135 150,110 C 185,80 220,60 253,60 C 286,60 321,80 356,110 C 386,135 401,160 426,170" fill="none" stroke="#dc2626" stroke-width="2.2" />
    <text x="415" y="188">2π</text>
  </g>
</svg>