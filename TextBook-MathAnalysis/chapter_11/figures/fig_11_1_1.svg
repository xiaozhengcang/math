<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Region S -->
  <path d="M 120 80 C 220 50, 360 70, 380 170 C 400 250, 270 270, 160 260 C 80 250, 60 180, 80 120 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="180" y="220" font-style="italic" font-size="20px" fill="#94a3b8" font-weight="bold">S</text>
  <!-- Interior point x and B(x, r) -->
  <circle cx="170" cy="130" r="30" fill="#e0f2fe" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="3,3"/>
  <circle cx="170" cy="130" r="3.5" fill="#0284c7"/>
  <text x="165" y="133" font-style="italic" font-weight="bold" fill="#0284c7">x</text>
  <text x="170" y="175" text-anchor="middle" font-size="12px" fill="#0284c7">内点 x (邻域 ⊂ S)</text>
  <!-- Exterior point y and B(y, r) -->
  <circle cx="410" cy="100" r="25" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3,3"/>
  <circle cx="410" cy="100" r="3.5" fill="#64748b"/>
  <text x="405" y="103" font-style="italic" font-weight="bold" fill="#64748b">y</text>
  <text x="410" y="140" text-anchor="middle" font-size="12px" fill="#64748b">外点 y (邻域 ⊂ Sᶜ)</text>
  <!-- Boundary point z and B(z, r) -->
  <circle cx="280" cy="62" r="28" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3,3"/>
  <circle cx="280" cy="62" r="3.5" fill="#dc2626"/>
  <text x="275" y="65" font-style="italic" font-weight="bold" fill="#dc2626">z</text>
  <text x="280" y="25" text-anchor="middle" font-size="12px" fill="#dc2626">边界点 z (邻域兼含内外)</text>
</svg>
