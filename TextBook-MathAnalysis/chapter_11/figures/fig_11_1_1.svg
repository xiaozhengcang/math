<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 320" width="100%" height="auto" style="max-width: 450px;">
  <defs>
    <marker id="arr1111" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Region S background and outline -->
  <path d="M 120 70 C 220 40, 360 80, 380 180 C 400 270, 260 300, 160 280 C 70 260, 50 180, 70 120 Z" 
        fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="210" y="240" font-family="KaTeX_Math, serif" font-style="italic" font-size="20" fill="#64748b">S</text>

  <!-- Interior point -->
  <circle cx="280" cy="120" r="25" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="280" cy="120" r="3.5" fill="#1e293b"/>
  <line x1="220" y1="70" x2="272" y2="112" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr1111)"/>
  <text x="180" y="65" font-family="SimSun, 'Songti SC', serif" font-size="15" fill="#1e293b">内点</text>

  <!-- Boundary point -->
  <circle cx="102" cy="198" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="102" cy="198" r="3.5" fill="#1e293b"/>
  <line x1="50" y1="160" x2="95" y2="192" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr1111)"/>
  <text x="10" y="155" font-family="SimSun, 'Songti SC', serif" font-size="15" fill="#1e293b">边界点</text>

  <!-- Exterior point -->
  <circle cx="390" cy="270" r="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="390" cy="270" r="3.5" fill="#1e293b"/>
  <text x="420" y="275" font-family="SimSun, 'Songti SC', serif" font-size="15" fill="#1e293b">外点</text>

  <text x="225" y="310" text-anchor="middle" font-family="SimSun, 'Songti SC', serif" font-size="15" fill="#1e293b">图 11.1.1</text>
</svg>