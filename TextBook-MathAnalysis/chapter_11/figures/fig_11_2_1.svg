<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="auto" style="max-width: 460px;">
  <defs>
    <marker id="arr1121" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <!-- z axis -->
  <line x1="220" y1="210" x2="220" y2="100" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="220" y1="100" x2="220" y2="25" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr1121)"/>
  <text x="205" y="35" font-family="KaTeX_Math, serif" font-style="italic" font-size="16" fill="#1e293b">z</text>

  <!-- y axis -->
  <line x1="60" y1="210" x2="420" y2="210" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr1121)"/>
  <text x="425" y="215" font-family="KaTeX_Math, serif" font-style="italic" font-size="16" fill="#1e293b">y</text>

  <!-- x axis (oblique perspective) -->
  <line x1="220" y1="210" x2="120" y2="280" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr1121)"/>
  <text x="105" y="285" font-family="KaTeX_Math, serif" font-style="italic" font-size="16" fill="#1e293b">x</text>
  <text x="225" y="225" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">O</text>

  <!-- Base ellipse: center (220, 210), rx=140, ry=45 -->
  <!-- Back half (dashed) -->
  <path d="M 80 210 A 140 45 0 0 1 360 210" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Front half (solid) -->
  <path d="M 80 210 A 140 45 0 0 0 360 210" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Upper ellipsoid dome: top at (220, 95) -->
  <path d="M 80 210 C 80 130, 150 95, 220 95 C 290 95, 360 130, 360 210" fill="none" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Front cross section curve -->
  <path d="M 220 95 C 190 140, 165 210, 155 240" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <!-- Formula annotation -->
  <line x1="330" y1="130" x2="365" y2="110" stroke="#64748b" stroke-width="1"/>
  <text x="370" y="115" font-family="KaTeX_Math, serif" font-size="14" fill="#1e293b">
    <tspan font-style="italic">z</tspan> = <tspan font-style="normal">√</tspan>(1 - <tspan font-style="italic">x</tspan>²/<tspan font-style="italic">a</tspan>² - <tspan font-style="italic">y</tspan>²/<tspan font-style="italic">b</tspan>²)
  </text>

  <text x="220" y="305" text-anchor="middle" font-family="SimSun, 'Songti SC', serif" font-size="15" fill="#1e293b">图 11.2.1</text>
</svg>