<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Coordinate Axes -->
  <line x1="220" y1="190" x2="430" y2="190" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="220" y1="190" x2="80" y2="270" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="220" y1="190" x2="220" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="435" y="194" font-style="italic">y</text>
  <text x="75" y="280" font-style="italic">x</text>
  <text x="208" y="30" font-style="italic">z</text>
  <text x="206" y="206" font-style="italic">O</text>
  <!-- Equatorial boundary (z = 0) -->
  <ellipse cx="220" cy="190" rx="140" ry="45" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Upper dome -->
  <path d="M 80 190 C 80 110, 160 65, 220 65 C 280 65, 360 110, 360 190 Z" fill="#e0f2fe" fill-opacity="0.5" stroke="#1e40af" stroke-width="2"/>
  <path d="M 220 65 C 220 110, 140 190, 130 240" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="4,3"/>
  <path d="M 120 130 C 170 150, 270 150, 320 130" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="220" cy="65" r="3.5" fill="#1e40af"/>
  <text x="228" y="70" font-style="italic" font-weight="bold">c</text>
  <circle cx="360" cy="190" r="3" fill="#1e40af"/>
  <text x="365" y="204" font-style="italic" font-weight="bold">b</text>
  <circle cx="125" cy="245" r="3" fill="#1e40af"/>
  <text x="110" y="250" font-style="italic" font-weight="bold">a</text>
  <text x="320" y="90" font-style="italic" font-weight="bold" fill="#1e40af">z = c√(1 − x²/a² − y²/b²)</text>
</svg>
