<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="auto" style="max-width: 420px;">
  <!-- Outer boundary of domain -->
  <ellipse cx="210" cy="140" rx="160" ry="110" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
  <!-- Inner hole -->
  <ellipse cx="190" cy="145" rx="65" ry="45" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Points x and y -->
  <circle cx="320" cy="95" r="3.5" fill="#1e293b"/>
  <text x="330" y="95" font-family="KaTeX_Math, serif" font-style="italic" font-size="16" fill="#1e293b">x</text>

  <circle cx="210" cy="225" r="3.5" fill="#1e293b"/>
  <text x="195" y="230" font-family="KaTeX_Math, serif" font-style="italic" font-size="16" fill="#1e293b">y</text>

  <!-- Connecting path gamma navigating inside the annulus around the hole -->
  <path d="M 320 95 C 340 160, 310 215, 210 225" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="325" y="170" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#2563eb">γ</text>

  <text x="210" y="285" text-anchor="middle" font-family="SimSun, 'Songti SC', serif" font-size="15" fill="#1e293b">图 11.3.1</text>
</svg>