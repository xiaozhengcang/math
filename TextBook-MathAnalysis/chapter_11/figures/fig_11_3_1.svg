<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Domain with hole -->
  <ellipse cx="210" cy="140" rx="165" ry="105" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
  <ellipse cx="190" cy="140" rx="60" ry="40" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="190" y="145" text-anchor="middle" font-size="12px" fill="#94a3b8">空洞</text>
  <text x="100" y="80" font-style="italic" font-size="18px" fill="#475569" font-weight="bold">D</text>
  <!-- Path from x to y绕过空洞 -->
  <circle cx="310" cy="95" r="4" fill="#dc2626"/>
  <circle cx="210" cy="215" r="4" fill="#dc2626"/>
  <text x="318" y="99" font-style="italic" font-weight="bold" fill="#dc2626">x</text>
  <text x="218" y="221" font-style="italic" font-weight="bold" fill="#dc2626">y</text>
  <polyline points="310,95 320,150 280,210 210,215" fill="none" stroke="#1e40af" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="320" cy="150" r="3" fill="#1e40af"/>
  <circle cx="280" cy="210" r="3" fill="#1e40af"/>
  <text x="210" y="265" text-anchor="middle" font-size="13px" fill="#1e293b">开区域 D 内任意两点 x, y 均可用有限段折线相连（道路连通）</text>
</svg>
