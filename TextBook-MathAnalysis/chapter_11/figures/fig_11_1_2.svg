<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="auto" style="max-width: 380px;">
  <!-- Vertices: A=(190, 40), B=(70, 210), C=(310, 210) -->
  <!-- Triangle ABC -->
  <polygon points="190,40 70,210 310,210" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Midpoints of sides: A1 on BC = (190, 210), B1 on AC = (250, 125), C1 on AB = (130, 125) -->
  <!-- Medial triangle A1B1C1 -->
  <polygon points="190,210 250,125 130,125" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Medians of ABC: AA1, BB1, CC1 -->
  <line x1="190" y1="40" x2="190" y2="210" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="70" y1="210" x2="250" y2="125" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="310" y1="210" x2="130" y2="125" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Inner medians: A2, B2, C2 -->
  <line x1="190" y1="125" x2="190" y2="167" stroke="#0284c7" stroke-width="1"/>
  <line x1="150" y1="182" x2="215" y2="153" stroke="#0284c7" stroke-width="1"/>
  <line x1="230" y1="182" x2="165" y2="153" stroke="#0284c7" stroke-width="1"/>

  <!-- Vertex labels -->
  <text x="190" y="32" text-anchor="middle" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">A</text>
  <text x="55" y="218" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">B</text>
  <text x="318" y="218" font-family="KaTeX_Math, serif" font-style="italic" font-size="15" fill="#1e293b">C</text>

  <text x="190" y="230" text-anchor="middle" font-family="KaTeX_Math, serif" font-size="13" fill="#1e293b"><tspan font-style="italic">A</tspan><tspan font-size="10" dy="3">1</tspan></text>
  <text x="260" y="125" font-family="KaTeX_Math, serif" font-size="13" fill="#1e293b"><tspan font-style="italic">B</tspan><tspan font-size="10" dy="3">1</tspan></text>
  <text x="110" y="125" font-family="KaTeX_Math, serif" font-size="13" fill="#1e293b"><tspan font-style="italic">C</tspan><tspan font-size="10" dy="3">1</tspan></text>

  <text x="190" y="118" text-anchor="middle" font-family="KaTeX_Math, serif" font-size="12" fill="#0284c7"><tspan font-style="italic">A</tspan><tspan font-size="9" dy="2">2</tspan></text>
  <text x="135" y="190" font-family="KaTeX_Math, serif" font-size="12" fill="#0284c7"><tspan font-style="italic">B</tspan><tspan font-size="9" dy="2">2</tspan></text>
  <text x="245" y="190" font-family="KaTeX_Math, serif" font-size="12" fill="#0284c7"><tspan font-style="italic">C</tspan><tspan font-size="9" dy="2">2</tspan></text>

  <text x="190" y="265" text-anchor="middle" font-family="SimSun, 'Songti SC', serif" font-size="15" fill="#1e293b">图 11.1.2</text>
</svg>
