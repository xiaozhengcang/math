<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Triangle ABC -->
  <polygon points="200,40 70,240 330,240" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <!-- Medians -->
  <line x1="200" y1="40" x2="200" y2="240" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="70" y1="240" x2="265" y2="140" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="330" y1="240" x2="135" y2="140" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Centroid G -->
  <circle cx="200" cy="173.3" r="4" fill="#dc2626"/>
  <text x="210" y="178" font-style="italic" font-weight="bold" fill="#dc2626">G</text>
  <circle cx="200" cy="40" r="3.5" fill="#1e293b"/>
  <text x="200" y="32" text-anchor="middle" font-style="italic" font-weight="bold">A</text>
  <circle cx="70" cy="240" r="3.5" fill="#1e293b"/>
  <text x="70" y="258" text-anchor="middle" font-style="italic" font-weight="bold">B</text>
  <circle cx="330" cy="240" r="3.5" fill="#1e293b"/>
  <text x="330" y="258" text-anchor="middle" font-style="italic" font-weight="bold">C</text>
  <circle cx="200" cy="240" r="3" fill="#0284c7"/>
  <text x="200" y="258" text-anchor="middle" font-style="italic" fill="#0284c7">A₁</text>
  <circle cx="265" cy="140" r="3" fill="#0284c7"/>
  <text x="273" y="136" text-anchor="start" font-style="italic" fill="#0284c7">B₁</text>
  <circle cx="135" cy="140" r="3" fill="#0284c7"/>
  <text x="127" y="136" text-anchor="end" font-style="italic" fill="#0284c7">C₁</text>
  <text x="200" y="285" text-anchor="middle" font-size="13px" fill="#1e293b">三条中线交于重心 G，且 AG : GA₁ = 2 : 1</text>
</svg>
