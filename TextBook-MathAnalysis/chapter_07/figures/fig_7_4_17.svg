<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- x-axis -->
  <line x1="30" y1="130" x2="390" y2="130" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="148" font-style="italic">x</text>

  <!-- Surface outline -->
  <path d="M 90 85 C 150 55, 250 65, 320 100 L 320 160 C 250 195, 150 205, 90 175 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Upper curve y = f(x) -->
  <path d="M 90 85 C 150 55, 250 65, 320 100" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="180" y="65" font-style="italic" fill="#1e40af">y = f(x)</text>

  <!-- Conical frustum element dS between x=200 and x=230 -->
  <!-- Radii at 200 is y1=62, at 230 is y2=66 -->
  <path d="M 200 68 L 230 64 L 230 196 L 200 192 Z" fill="#fed7aa" fill-opacity="0.8" stroke="#ea580c" stroke-width="1.5"/>
  <ellipse cx="200" cy="130" rx="10" ry="62" fill="none" stroke="#ea580c" stroke-width="1.2"/>
  <ellipse cx="230" cy="130" rx="10" ry="66" fill="none" stroke="#ea580c" stroke-width="1.2"/>

  <!-- Arc element ds -->
  <line x1="200" y1="68" x2="230" y2="64" stroke="#dc2626" stroke-width="2.5"/>
  <text x="210" y="55" font-size="13" font-style="italic" fill="#dc2626">ds</text>

  <text x="210" y="240" text-anchor="middle" font-size="14" fill="#1e40af">dS = 2π f(x) ds = 2π f(x) √[1 + f'(x)²] dx</text>
</svg>
