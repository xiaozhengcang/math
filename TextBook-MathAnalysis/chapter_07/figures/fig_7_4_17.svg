<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Surface of revolution -->
  <line x1="30" y1="110" x2="390" y2="110" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 100 60 C 160 40, 260 70, 320 50" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  <path d="M 100 160 C 160 180, 260 150, 320 170" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Surface frustum element -->
  <ellipse cx="210" cy="110" rx="15" ry="50" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="215" y="85" font-size="12" font-style="italic" fill="#e67e22">2π f(x) ds</text>
  <text x="210" y="208" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.17 旋转曲面的侧面积微元 dA = 2π f(x) ds</text>
</svg>
