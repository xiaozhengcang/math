<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- River water level line -->
  <line x1="40" y1="60" x2="380" y2="60" stroke="#3498db" stroke-width="2"/>
  <text x="345" y="52" font-size="12" fill="#3498db">水面</text>
  <!-- Riverbed curve -->
  <path d="M 60 60 C 120 150, 180 170, 240 140 C 300 110, 340 70, 360 60" fill="rgba(52, 152, 219, 0.2)" stroke="#2980b9" stroke-width="2.2"/>
  <!-- Measurement soundings -->
  <line x1="110" y1="60" x2="110" y2="128" stroke="var(--text-primary, #333)" stroke-dasharray="3 3"/>
  <line x1="170" y1="60" x2="170" y2="166" stroke="var(--text-primary, #333)" stroke-dasharray="3 3"/>
  <line x1="230" y1="60" x2="230" y2="144" stroke="var(--text-primary, #333)" stroke-dasharray="3 3"/>
  <line x1="290" y1="60" x2="290" y2="115" stroke="var(--text-primary, #333)" stroke-dasharray="3 3"/>
  <text x="210" y="190" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.6.3 辛普森公式计算河流横断面水深与面积</text>
</svg>
