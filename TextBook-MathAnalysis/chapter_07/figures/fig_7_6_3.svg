<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Water surface horizontal line from (50, 60) to (370, 60) -->
  <line x1="40" y1="60" x2="380" y2="60" stroke="#0284c7" stroke-width="2.5"/>
  <text x="385" y="65" font-size="12" fill="#0284c7">水面</text>

  <!-- River bed profile: riverbed depth soundings at 6 points: dx = 50 px -->
  <!-- x0=60, x1=110, x2=160, x3=210, x4=260, x5=310, x6=360 -->
  <!-- depths: 0, 45, 80, 95, 75, 40, 0 -> y: 60, 105, 140, 155, 135, 100, 60 -->
  <path d="M 60 60 Q 110 115 160 140 Q 210 165 260 135 Q 310 110 360 60 Z" 
        fill="#bae6fd" fill-opacity="0.65" stroke="#0284c7" stroke-width="2"/>

  <!-- Vertical sounding lines -->
  <line x1="110" y1="60" x2="110" y2="105" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="160" y1="60" x2="160" y2="140" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="210" y1="60" x2="210" y2="155" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="260" y1="60" x2="260" y2="135" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="310" y1="60" x2="310" y2="100" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Sounding depths labels -->
  <text x="110" y="85" font-size="11" fill="#475569" text-anchor="middle">y₁</text>
  <text x="160" y="100" font-size="11" fill="#475569" text-anchor="middle">y₂</text>
  <text x="210" y="110" font-size="11" fill="#475569" text-anchor="middle">y₃</text>
  <text x="260" y="100" font-size="11" fill="#475569" text-anchor="middle">y₄</text>
  <text x="310" y="85" font-size="11" fill="#475569" text-anchor="middle">y₅</text>

  <!-- Width h dimension -->
  <text x="85" y="52" font-size="11" font-style="italic" fill="#64748b">h</text>
  <text x="135" y="52" font-size="11" font-style="italic" fill="#64748b">h</text>
  <text x="185" y="52" font-size="11" font-style="italic" fill="#64748b">h</text>

  <text x="210" y="195" text-anchor="middle" font-size="13" fill="#1e40af">河流横断面面积测量（数值积分应用）</text>
</svg>
