<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Polar sector element -->
  <line x1="40" y1="180" x2="340" y2="180" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="180" x2="260" y2="50" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="280" y2="80" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <path d="M 60 180 L 260 50 C 270 60, 275 70, 280 80 Z" fill="rgba(26, 115, 232, 0.3)" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.8"/>
  <text x="170" y="100" font-size="13" font-style="italic" fill="var(--primary-accent, #1a73e8)">r(θ)</text>
  <text x="120" y="165" font-size="12" fill="var(--text-primary, #333)">dθ</text>
  <text x="190" y="210" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.5 极坐标曲边扇形的微元 dS = ½r²dθ</text>
</svg>
