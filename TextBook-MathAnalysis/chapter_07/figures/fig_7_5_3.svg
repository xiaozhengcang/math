<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (170, 160) -->
  <line x1="30" y1="160" x2="310" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="178" font-style="italic">x</text>
  <line x1="170" y1="185" x2="170" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="158" y="30" font-style="italic">y</text>
  <text x="155" y="175">O</text>

  <!-- Semicircular wire of radius R = 100 in upper half plane -->
  <path d="M 270 160 A 100 100 0 0 0 70 160" fill="none" stroke="#1e40af" stroke-width="2.5"/>

  <!-- Arc element ds at angle theta = 50 deg -->
  <!-- theta = 50 deg -> (170 + 100*cos(50), 160 - 100*sin(50)) = (234.3, 83.4) -->
  <line x1="170" y1="160" x2="234.3" y2="83.4" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="195" y="115" font-style="italic" fill="#64748b">R</text>

  <!-- Element dq on wire (red highlight) -->
  <path d="M 239.5 77.2 A 100 100 0 0 0 228.6 90.1" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="245" y="75" font-size="12" fill="#dc2626">dq = λ(θ) R dθ</text>

  <!-- Angle theta arc -->
  <path d="M 210 160 A 40 40 0 0 0 195.7 129.4" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <text x="205" y="150" font-style="italic">θ</text>

  <text x="170" y="205" text-anchor="middle" font-size="13" fill="#1e40af">λ(θ) = λ₀ sin θ  ⟹  Q = ∫₀^π λ(θ) R dθ = 2λ₀R</text>
</svg>
