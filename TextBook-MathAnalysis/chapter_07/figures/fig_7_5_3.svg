<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="160" x2="330" y2="160" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="180" x2="180" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Semicircular charged wire -->
  <path d="M 80 160 A 100 100 0 0 1 280 160" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <circle cx="180" cy="160" r="4" fill="var(--primary-accent, #1a73e8)"/>
  <text x="185" y="175" font-size="12" fill="var(--primary-accent, #1a73e8)">O (受力点)</text>
  <text x="180" y="200" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.5.3 半圆形带电细线在圆心处产生的场强</text>
</svg>
