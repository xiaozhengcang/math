<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="180" x2="330" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="198" font-style="italic">x</text>
  <line x1="60" y1="205" x2="60" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="48" y="195">O</text>

  <!-- Right triangle: base b from (60, 180) to (260, 180), height h at (260, 50) -->
  <polygon points="60,180 260,180 260,50" fill="#e0f2fe" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Right angle mark at (260, 180) -->
  <path d="M 245 180 L 245 165 L 260 165" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Line equation y = (h/b) x -->
  <text x="140" y="100" font-style="italic" fill="#1e40af">y = (h/b) x</text>

  <line x1="260" y1="177" x2="260" y2="183" stroke="#1e293b" stroke-width="1.2"/>
  <text x="256" y="198" font-style="italic">b</text>
  <line x1="265" y1="115" x2="265" y2="115" stroke="#1e293b" stroke-width="1.2"/>
  <text x="270" y="120" font-style="italic">h</text>

  <text x="170" y="150" font-size="15" font-style="italic" fill="#0369a1" font-weight="bold">A = ½ bh</text>
</svg>
