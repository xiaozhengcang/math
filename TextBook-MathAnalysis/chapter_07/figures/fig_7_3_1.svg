<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="160" x2="340" y2="160" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="180" x2="50" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="180" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
  <text x="35" y="25" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
  
  <!-- Right triangle with horizontal and vertical legs -->
  <polygon points="100,140 240,140 240,40" fill="rgba(26, 115, 232, 0.2)" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <text x="160" y="155" font-size="13" font-style="italic" fill="var(--text-primary, #333)">Δx</text>
  <text x="250" y="95" font-size="13" font-style="italic" fill="var(--text-primary, #333)">Δy = f'(x)Δx</text>
  <text x="190" y="190" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.3.1 直角三角形两直角边与斜率关系</text>
</svg>
