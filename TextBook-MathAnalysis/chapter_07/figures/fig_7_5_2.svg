<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Water surface -->
  <line x1="30" y1="40" x2="350" y2="40" stroke="#3498db" stroke-width="2"/>
  <text x="320" y="32" font-size="12" fill="#3498db">水面</text>
  <!-- Submerged vertical circular disk -->
  <circle cx="190" cy="130" r="50" fill="rgba(52, 152, 219, 0.2)" stroke="var(--text-primary, #333)" stroke-width="2"/>
  <!-- Horizontal pressure strip -->
  <rect x="150" y="120" width="80" height="8" fill="rgba(231, 76, 60, 0.5)" stroke="#e74c3c" stroke-width="1"/>
  <line x1="190" y1="40" x2="190" y2="124" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <text x="195" y="85" font-size="12" font-style="italic" fill="var(--text-muted, #888)">h</text>
  <text x="190" y="215" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.5.2 垂直沉浸水中圆盘所受水压力计算</text>
</svg>
