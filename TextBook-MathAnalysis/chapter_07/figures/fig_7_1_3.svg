<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="210" x2="430" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="425" y="228" font-style="italic">x</text>
  <line x1="55" y1="230" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="225">O</text>

  <!-- Function curve y = f(x) over [a, b] = [90, 370] -->
  <path d="M 70 170 C 120 110, 180 70, 260 120 C 310 150, 360 80, 390 60" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <text x="395" y="55" font-style="italic" fill="#1e40af">y = f(x)</text>

  <!-- Partition points: x0=90, x1=145, x2=200, x3=260, x4=315, x5=370 -->
  <!-- Sample rectangles:
       [90, 145]: xi_1 = 120, f(120)=122 -> rect height 88
       [145, 200]: xi_2 = 175, f(175)=82 -> rect height 128
       [200, 260]: xi_3 = 230, f(230)=105 -> rect height 105 (highlighted!)
       [260, 315]: xi_4 = 285, f(285)=135 -> rect height 75
       [315, 370]: xi_5 = 345, f(345)=95 -> rect height 115
  -->
  <rect x="90" y="122" width="55" height="88" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="145" y="82" width="55" height="128" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="200" y="105" width="60" height="105" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="260" y="135" width="55" height="75" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="315" y="95" width="55" height="115" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>

  <!-- Highlight sample point xi_i in 3rd strip -->
  <circle cx="230" cy="105" r="3.5" fill="#dc2626"/>
  <line x1="230" y1="210" x2="230" y2="105" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3,3"/>
  <circle cx="230" cy="210" r="2.5" fill="#dc2626"/>
  <text x="225" y="228" font-style="italic" fill="#dc2626" font-weight="bold">ξᵢ</text>
  <text x="235" y="100" font-size="12" font-style="italic" fill="#dc2626">f(ξᵢ)</text>

  <!-- Ticks at a and b -->
  <line x1="90" y1="207" x2="90" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="86" y="228" font-style="italic">a = x₀</text>
  <line x1="370" y1="207" x2="370" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="360" y="228" font-style="italic">b = xₙ</text>

  <text x="215" y="170" font-size="13" font-style="italic" fill="#0369a1">f(ξᵢ)Δxᵢ</text>
</svg>
