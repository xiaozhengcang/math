<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="40" y1="210" x2="490" y2="210" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="230" x2="70" y2="30" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="230" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
  <text x="55" y="35" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="55" y="225" font-size="13" fill="var(--text-primary, #333)">O</text>
  
  <!-- Curve y = f(x) -->
  <path d="M 110 140 C 150 190, 220 180, 270 140 C 320 100, 390 60, 430 70" fill="none" stroke="var(--text-primary, #333)" stroke-width="2"/>
  <text x="415" y="55" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y = f(x)</text>
  
  <!-- Boundary lines x = a, x = b -->
  <line x1="110" y1="210" x2="110" y2="140" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <text x="105" y="228" font-size="13" font-style="italic" fill="var(--text-primary, #333)">a</text>
  <line x1="430" y1="210" x2="430" y2="70" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <text x="425" y="228" font-size="13" font-style="italic" fill="var(--text-primary, #333)">b</text>
  
  <!-- Partition ticks -->
  <line x1="160" y1="210" x2="160" y2="178" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <text x="153" y="228" font-size="12" font-style="italic" fill="var(--text-muted, #888)">x₁</text>
  <line x1="210" y1="210" x2="210" y2="175" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <text x="203" y="228" font-size="12" font-style="italic" fill="var(--text-muted, #888)">x₂</text>
  <text x="235" y="225" font-size="12" fill="var(--text-muted, #888)">⋯</text>
  
  <!-- Highlighted interval [x_i-1, x_i] and sample point xi_i -->
  <rect x="270" y="115" width="60" height="95" fill="rgba(26, 115, 232, 0.2)" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.8"/>
  <line x1="270" y1="210" x2="270" y2="115" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5"/>
  <line x1="330" y1="210" x2="330" y2="115" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5"/>
  <text x="255" y="228" font-size="11" font-style="italic" fill="var(--text-primary, #333)">xᵢ₋₁</text>
  <text x="323" y="228" font-size="11" font-style="italic" fill="var(--text-primary, #333)">xᵢ</text>
  
  <!-- Sample point xi_i -->
  <circle cx="295" cy="115" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <line x1="295" y1="115" x2="295" y2="210" stroke="var(--primary-accent, #1a73e8)" stroke-dasharray="3 3"/>
  <text x="290" y="228" font-size="11" font-style="italic" fill="var(--primary-accent, #1a73e8)">ξᵢ</text>
  <text x="290" y="105" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">f(ξᵢ)</text>
  
  <line x1="375" y1="210" x2="375" y2="72" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <text x="348" y="225" font-size="12" fill="var(--text-muted, #888)">⋯</text>
  
  <text x="270" y="252" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.1.3 定积分（黎曼和）的几何定义</text>
</svg>
