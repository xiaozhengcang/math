<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="190" x2="410" y2="190" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="405" y="208" font-style="italic">x</text>
  <line x1="55" y1="210" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="205">O</text>

  <!-- Curve y = f(x) over [a, b] = [90, 360], 3 subdivisions: 90, 180, 270, 360 -->
  <!-- f(90)=130, f(180)=75, f(270)=105, f(360)=65 -->
  <!-- Shaded trapezoids -->
  <polygon points="90,190 90,130 180,75 180,190" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <polygon points="180,190 180,75 270,105 270,190" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <polygon points="270,190 270,105 360,65 360,190" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Actual curve -->
  <path d="M 70 145 C 120 90, 150 70, 180 75 C 220 85, 240 115, 270 105 C 300 95, 330 70, 380 60" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="385" y="55" font-style="italic" fill="#1e40af">y = f(x)</text>

  <!-- Chords (trapezoid tops) -->
  <line x1="90" y1="130" x2="180" y2="75" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="180" y1="75" x2="270" y2="105" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="270" y1="105" x2="360" y2="65" stroke="#dc2626" stroke-width="1.8"/>

  <!-- Ticks -->
  <line x1="90" y1="187" x2="90" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="82" y="208" font-style="italic">x₀=a</text>
  <line x1="180" y1="187" x2="180" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="175" y="208" font-style="italic">x₁</text>
  <line x1="270" y1="187" x2="270" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="265" y="208" font-style="italic">x₂</text>
  <line x1="360" y1="187" x2="360" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="352" y="208" font-style="italic">x₃=b</text>

  <text x="220" y="235" text-anchor="middle" font-size="13" fill="#1e293b">复化梯形公式：T_n = h [½ y₀ + y₁ + y₂ + ½ y₃]</text>
</svg>
