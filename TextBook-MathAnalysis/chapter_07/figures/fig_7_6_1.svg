      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="160" x2="340" y2="160" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="180" x2="50" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Trapezoidal rule straight secant -->
  <path d="M 100 120 C 160 70, 220 70, 270 90" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <polygon points="100,160 100,120 270,90 270,160" fill="rgba(26, 115, 232, 0.2)" stroke="#e67e22" stroke-width="1.8"/>
  <text x="100" y="178" font-size="12" fill="var(--text-primary, #333)">a</text>
  <text x="270" y="178" font-size="12" fill="var(--text-primary, #333)">b</text>
  <text x="190" y="195" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.6.1 梯形求积公式几何示意</text>
</svg>
