<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (70, 180) -->
  <line x1="40" y1="180" x2="300" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="295" y="198" font-style="italic">x</text>
  <line x1="70" y1="205" x2="70" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="58" y="30" font-style="italic">y</text>
  <text x="55" y="195">O</text>

  <!-- Intersection from (70, 180) to (210, 40), scale: 1 unit = 140 px -->
  <!-- Shaded region between y = x^2 and y = sqrt(x) -->
  <path d="M 70 180 Q 140 180 210 40 Q 90 110 70 180 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>

  <!-- Parabola y = x^2 -->
  <path d="M 70 180 Q 140 180 230 15" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <text x="235" y="45" font-style="italic" fill="#1e40af">y = x²</text>

  <!-- Parabola x = y^2 (y = sqrt(x)) -->
  <path d="M 70 180 Q 90 110 210 40" fill="none" stroke="#dc2626" stroke-width="2.2"/>
  <text x="135" y="65" font-style="italic" fill="#dc2626">x = y²</text>

  <!-- Intersection point (1, 1) -->
  <circle cx="210" cy="40" r="3.5" fill="#1e293b"/>
  <line x1="210" y1="40" x2="210" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="70" y1="40" x2="210" y2="40" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="215" y="40">(1, 1)</text>
  <text x="206" y="198">1</text>
  <text x="55" y="45">1</text>

  <text x="135" y="130" font-size="15" font-style="italic" fill="#0369a1" font-weight="bold">A = ⅓</text>
</svg>
