      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="180" x2="340" y2="180" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="200" x2="60" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- x = g1(y) and x = g2(y) -->
  <path d="M 140 150 C 220 120, 240 80, 180 40" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <path d="M 90 150 C 130 110, 140 70, 100 40" fill="none" stroke="#27ae60" stroke-width="2"/>
  <path d="M 90 150 C 130 110, 140 70, 100 40 L 180 40 C 240 80, 220 120, 140 150 Z" fill="rgba(26, 115, 232, 0.25)"/>
  <line x1="60" y1="150" x2="140" y2="150" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <line x1="60" y1="40" x2="180" y2="40" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <text x="45" y="155" font-size="12" fill="var(--text-primary, #333)">c</text>
  <text x="45" y="45" font-size="12" fill="var(--text-primary, #333)">d</text>
  <text x="190" y="210" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.3 沿 y 轴积分计算的平面面积</text>
