<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Cardioid r = a(1 + cos theta) -->
  <line x1="20" y1="110" x2="340" y2="110" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="200" x2="120" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Cardioid parametric curve path -->
  <path d="M 280 110 C 280 50, 180 30, 120 110 C 180 190, 280 170, 280 110 Z" fill="rgba(26, 115, 232, 0.2)" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.2"/>
  <text x="285" y="125" font-size="12" fill="var(--text-primary, #333)">2a</text>
  <text x="180" y="210" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.9 心形线 r = a(1 + cos θ)</text>
</svg>
