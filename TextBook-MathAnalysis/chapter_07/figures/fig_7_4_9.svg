<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Polar axis -->
  <line x1="40" y1="180" x2="300" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="295" y="198">极轴</text>
  <text x="32" y="195">O</text>

  <!-- Hyperbolic spiral curve r = a/theta from theta=pi/6 to 2pi -->
  <path d="M 260 180 C 230 110, 150 90, 110 125 C 80 155, 95 180, 120 180" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <text x="195" y="90" font-style="italic" fill="#1e40af">rθ = a</text>

  <!-- Swept sector area -->
  <path d="M 40 180 L 260 180 C 230 110, 150 90, 110 125 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>
  <text x="145" y="150" font-size="14" font-style="italic" fill="#0369a1" font-weight="bold">A</text>
</svg>
