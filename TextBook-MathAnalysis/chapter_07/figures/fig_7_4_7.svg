<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (50, 170) -->
  <line x1="20" y1="170" x2="390" y2="170" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="188" font-style="italic">x</text>
  <line x1="50" y1="195" x2="50" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="38" y="30" font-style="italic">y</text>
  <text x="38" y="185">O</text>

  <!-- Cycloid arch: width 2pi*a = 280 px, height 2a = 110 px -->
  <path d="M 50 170 C 100 168, 130 60, 190 60 C 250 60, 280 168, 330 170 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2.2"/>

  <!-- Peak point (pi*a, 2a) -->
  <circle cx="190" cy="60" r="3" fill="#dc2626"/>
  <line x1="190" y1="60" x2="190" y2="170" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="195" y="55" font-size="12" fill="#dc2626">(πa, 2a)</text>

  <line x1="330" y1="167" x2="330" y2="173" stroke="#1e293b" stroke-width="1.2"/>
  <text x="320" y="188">2πa</text>

  <text x="190" y="125" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold" text-anchor="middle">A = 3πa²</text>
</svg>
