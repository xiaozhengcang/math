<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Cycloid arch -->
  <line x1="30" y1="170" x2="430" y2="170" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="190" x2="50" y2="30" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- One arch of cycloid x = a(t - sin t), y = a(1 - cos t) -->
  <path d="M 50 170 C 110 165, 140 50, 210 50 C 280 50, 310 165, 370 170" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  <line x1="210" y1="170" x2="210" y2="50" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <text x="45" y="188" font-size="12" fill="var(--text-primary, #333)">0</text>
  <text x="200" y="188" font-size="12" fill="var(--text-primary, #333)">πa</text>
  <text x="360" y="188" font-size="12" fill="var(--text-primary, #333)">2πa</text>
  <text x="30" y="55" font-size="12" fill="var(--text-primary, #333)">2a</text>
  <text x="230" y="210" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.7 旋轮线（摆线）的一拱</text>
</svg>
