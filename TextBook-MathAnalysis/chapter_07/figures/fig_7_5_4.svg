<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Cylinder chamber -->
  <rect x="50" y="50" width="300" height="90" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="140" stroke="#1e293b" stroke-width="3"/>

  <!-- Gas region shaded -->
  <rect x="50" y="50" width="160" height="90" fill="#bae6fd" fill-opacity="0.6" stroke="none"/>
  <text x="110" y="100" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">气体 p(V)</text>

  <!-- Piston at x1 = 210, moving to x2 = 270 -->
  <rect x="210" y="52" width="18" height="86" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <line x1="228" y1="95" x2="380" y2="95" stroke="#334155" stroke-width="5"/>

  <!-- Movement arrow -->
  <line x1="240" y1="75" x2="280" y2="75" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <text x="250" y="68" font-size="12" fill="#dc2626">位移 dx</text>

  <!-- Work formula -->
  <text x="210" y="180" text-anchor="middle" font-size="14" fill="#1e40af">dW = p(V) A dx = p(V) dV  ⟹  W = ∫_{V₁}^{V₂} p(V) dV</text>
</svg>
