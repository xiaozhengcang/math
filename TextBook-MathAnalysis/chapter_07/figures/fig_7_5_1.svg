<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- x-axis -->
  <line x1="30" y1="110" x2="390" y2="110" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="128" font-style="italic">x</text>
  <text x="50" y="125">O</text>

  <!-- Metal rod: from x=50 to x=330, thickness 24 px -->
  <rect x="50" y="60" width="280" height="24" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>

  <!-- Micro element dx at x = 200, width = 20 px -->
  <rect x="200" y="60" width="20" height="24" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="210" y1="84" x2="210" y2="110" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="205" y="128" font-style="italic" fill="#dc2626">x</text>
  <text x="210" y="50" font-size="12" fill="#dc2626" text-anchor="middle">dm = ρ(x) dx</text>

  <!-- Ticks at 0 and L -->
  <line x1="50" y1="107" x2="50" y2="113" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="330" y1="107" x2="330" y2="113" stroke="#1e293b" stroke-width="1.2"/>
  <text x="326" y="128" font-style="italic">L</text>

  <text x="210" y="160" text-anchor="middle" font-size="14" fill="#1e40af">M = ∫₀ᴸ ρ(x) dx</text>
</svg>
