<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="120" x2="370" y2="120" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Non-uniform rod -->
  <rect x="70" y="80" width="240" height="20" fill="url(#rod-grad)" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <!-- Micro element dx -->
  <rect x="180" y="78" width="25" height="24" fill="rgba(231, 76, 60, 0.4)" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="185" y="70" font-size="12" font-style="italic" fill="#e74c3c">dx</text>
  <text x="65" y="140" font-size="12" fill="var(--text-primary, #333)">a</text>
  <text x="305" y="140" font-size="12" fill="var(--text-primary, #333)">b</text>
  <text x="200" y="168" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.5.1 非均匀金属棒的质量微元 dM = ρ(x) dx</text>
</svg>
