<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="190" x2="420" y2="190" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="210" x2="60" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="210" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
  <text x="45" y="25" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
  
  <!-- Curve y = f(x) -->
  <path d="M 110 150 C 160 80, 260 60, 350 140" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  <text x="345" y="125" font-size="13" font-style="italic" fill="var(--primary-accent, #1a73e8)">y = f(x)</text>
  
  <!-- Interval [a, b] -->
  <line x1="110" y1="190" x2="110" y2="150" stroke="var(--text-primary, #333)" stroke-width="1.2"/>
  <text x="105" y="210" font-size="13" font-style="italic" fill="var(--text-primary, #333)">a</text>
  <line x1="350" y1="190" x2="350" y2="140" stroke="var(--text-primary, #333)" stroke-width="1.2"/>
  <text x="345" y="210" font-size="13" font-style="italic" fill="var(--text-primary, #333)">b</text>
  
  <!-- Mean value height f(xi) rectangle -->
  <line x1="110" y1="105" x2="350" y2="105" stroke="var(--text-primary, #333)" stroke-width="1.8" stroke-dasharray="5 3"/>
  <circle cx="215" cy="105" r="4" fill="var(--primary-accent, #1a73e8)"/>
  <line x1="215" y1="105" x2="215" y2="190" stroke="var(--primary-accent, #1a73e8)" stroke-dasharray="3 3"/>
  <text x="210" y="210" font-size="13" font-style="italic" fill="var(--primary-accent, #1a73e8)">ξ</text>
  <text x="75" y="109" font-size="13" font-style="italic" fill="var(--primary-accent, #1a73e8)">f(ξ)</text>
  
  <text x="230" y="232" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.2.1 定积分第一中值定理的几何意义（曲边梯形面积等于矩形面积）</text>
</svg>
