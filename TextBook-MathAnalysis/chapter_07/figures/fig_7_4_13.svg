<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Archimedean spiral r = a theta -->
  <line x1="30" y1="110" x2="330" y2="110" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="200" x2="180" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 180 110 C 185 105, 190 100, 195 110 C 205 130, 175 140, 155 125 C 135 105, 150 75, 180 70 C 220 65, 245 95, 240 135 C 230 175, 170 185, 130 165" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <text x="180" y="210" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.13 阿基米德螺线 r = aθ</text>
</svg>
