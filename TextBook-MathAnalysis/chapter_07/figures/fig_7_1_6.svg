<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="160" x2="420" y2="160" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="180" x2="60" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="180" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
  <text x="45" y="25" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="45" y="175" font-size="13" fill="var(--text-primary, #333)">O</text>
  
  <!-- Threshold line y = epsilon / 2 -->
  <line x1="60" y1="100" x2="380" y2="100" stroke="var(--text-muted, #888)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="385" y="105" font-size="12" font-style="italic" fill="var(--text-muted, #888)">ε / 2</text>
  
  <!-- Finitely many points with R(x) >= epsilon / 2 -->
  <circle cx="60" cy="30" r="3.5" fill="var(--text-primary, #333)"/>
  <text x="45" y="35" font-size="12" fill="var(--text-primary, #333)">1</text>
  
  <circle cx="210" cy="30" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="135" cy="80" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="285" cy="80" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  
  <!-- Points below threshold line -->
  <circle cx="110" cy="125" r="2.5" fill="var(--text-muted, #888)"/>
  <circle cx="310" cy="125" r="2.5" fill="var(--text-muted, #888)"/>
  
  <!-- Covering intervals on x-axis -->
  <rect x="55" y="157" width="15" height="6" fill="var(--primary-accent, #1a73e8)"/>
  <text x="50" y="180" font-size="10" fill="var(--text-primary, #333)">[x₀,x₁]</text>
  
  <rect x="195" y="157" width="30" height="6" fill="var(--primary-accent, #1a73e8)"/>
  <text x="195" y="180" font-size="10" fill="var(--text-primary, #333)">[x₂,x₃]</text>
  
  <rect x="345" y="157" width="20" height="6" fill="var(--primary-accent, #1a73e8)"/>
  <text x="340" y="180" font-size="10" fill="var(--text-primary, #333)">[x₄,x₅=1]</text>
  
  <text x="230" y="202" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.1.6 Riemann 函数可积性证明中覆盖间断点的有限小区间</text>
</svg>
