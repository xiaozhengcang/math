<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Conical helix -->
  <ellipse cx="180" cy="180" rx="100" ry="30" fill="none" stroke="var(--border-color, #ccc)" stroke-dasharray="3 3"/>
  <line x1="80" y1="180" x2="180" y2="40" stroke="var(--text-muted, #888)"/>
  <line x1="280" y1="180" x2="180" y2="40" stroke="var(--text-muted, #888)"/>
  <!-- Helix spiral upwards -->
  <path d="M 180 180 C 230 180, 240 140, 180 130 C 130 120, 140 90, 180 80 C 200 75, 190 50, 180 40" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.2"/>
  <text x="180" y="225" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.12 圆锥螺线</text>
</svg>
