<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Cone outline -->
  <line x1="170" y1="35" x2="85" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="170" y1="35" x2="255" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="170" cy="210" rx="85" ry="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Spiral on cone winding down -->
  <path d="M 170 35 Q 185 55 160 70 Q 130 85 180 105 Q 225 125 150 145 Q 95 165 190 185 Q 245 200 170 215" 
        fill="none" stroke="#1e40af" stroke-width="2.2"/>

  <circle cx="170" cy="35" r="3" fill="#dc2626"/>
  <text x="175" y="35" font-size="12" fill="#dc2626">顶点</text>
  <text x="170" y="248" text-anchor="middle" font-size="13" font-style="italic" fill="#1e40af">圆锥螺线</text>
</svg>
