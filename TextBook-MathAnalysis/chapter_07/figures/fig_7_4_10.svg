<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Three-leaved rose r = a sin(3 theta) -->
  <line x1="20" y1="110" x2="340" y2="110" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="200" x2="180" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Three petals -->
  <path d="M 180 110 C 230 40, 260 80, 180 110 C 130 180, 100 150, 180 110 C 100 80, 130 40, 180 110 Z" fill="rgba(231, 76, 60, 0.25)" stroke="#e74c3c" stroke-width="2"/>
  <text x="180" y="210" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.10 三叶玫瑰线 r = a sin(3θ)</text>
</svg>
