<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (60, 200) -->
  <line x1="30" y1="200" x2="330" y2="200" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="218" font-style="italic">x</text>
  <line x1="60" y1="225" x2="60" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="48" y="215">O</text>

  <!-- Tractrix curve from (60, 60) down-right approaching x-axis (tangent length = a) -->
  <path d="M 60 60 C 80 80, 110 130, 170 170 C 220 192, 270 198, 320 200" fill="none" stroke="#1e40af" stroke-width="2.5"/>

  <!-- Point P on tractrix: (140, 150) -->
  <circle cx="140" cy="150" r="3.5" fill="#dc2626"/>
  <text x="125" y="145" font-weight="bold" fill="#dc2626">P</text>

  <!-- Tangent line from P to x-axis at T: (240, 200) -->
  <line x1="140" y1="150" x2="240" y2="200" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="240" cy="200" r="3" fill="#1e293b"/>
  <text x="245" y="195" font-weight="bold">T</text>

  <!-- Tangent segment length PT = a -->
  <text x="180" y="165" font-style="italic" fill="#dc2626" font-weight="bold">a (常数)</text>

  <!-- Initial point (0, a) -->
  <circle cx="60" cy="60" r="3" fill="#1e293b"/>
  <text x="40" y="65" font-style="italic">a</text>

  <text x="190" y="240" text-anchor="middle" font-size="13" fill="#1e40af">切线段长保持为常数 a 的曲线（曳物线）</text>
</svg>
