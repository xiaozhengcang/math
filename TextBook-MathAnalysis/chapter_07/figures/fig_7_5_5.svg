<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Tractrix (pursuit curve) -->
  <line x1="30" y1="170" x2="340" y2="170" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="190" x2="60" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 60 60 C 90 60, 150 140, 290 165" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  <line x1="150" y1="125" x2="230" y2="170" stroke="#e67e22" stroke-width="1.8"/>
  <circle cx="150" cy="125" r="4" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="230" cy="170" r="4" fill="#e67e22"/>
  <text x="145" y="115" font-size="12" fill="var(--primary-accent, #1a73e8)">B</text>
  <text x="235" y="185" font-size="12" fill="#e67e22">A</text>
  <text x="190" y="208" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.5.5 曳物线（追逐曲线）运动轨迹</text>
</svg>
