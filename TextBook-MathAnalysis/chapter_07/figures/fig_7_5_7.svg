<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Planetary polar motion -->
  <ellipse cx="190" cy="100" rx="140" ry="70" fill="none" stroke="var(--border-color, #ccc)" stroke-dasharray="3 3"/>
  <circle cx="130" cy="100" r="7" fill="#e67e22"/>
  <circle cx="270" cy="65" r="4.5" fill="var(--primary-accent, #1a73e8)"/>
  <line x1="130" y1="100" x2="270" y2="65" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.8"/>
  <text x="190" y="75" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">r(t)</text>
  <text x="155" y="95" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">θ(t)</text>
  <text x="190" y="190" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.5.7 行星运动的极坐标向径与转角模型</text>
</svg>
