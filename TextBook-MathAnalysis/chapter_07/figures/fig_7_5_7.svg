<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Elliptical orbit -->
  <ellipse cx="200" cy="115" rx="150" ry="85" fill="none" stroke="#64748b" stroke-width="1.8"/>

  <!-- Sun at focus S(110, 115) -->
  <circle cx="110" cy="115" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="105" y="138" font-weight="bold" fill="#d97706">S</text>

  <!-- Planet P at (270, 75) moving to P' at (295, 95) during dt -->
  <!-- Sector dA shaded -->
  <path d="M 110 115 L 270 75 C 280 82, 290 88, 295 95 Z" fill="#bae6fd" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="270" cy="75" r="3.5" fill="#1e40af"/>
  <text x="268" y="65" font-weight="bold">P</text>
  <circle cx="295" cy="95" r="3" fill="#1e40af"/>
  <text x="302" y="100">P'</text>

  <!-- Radius vector r -->
  <line x1="110" y1="115" x2="270" y2="75" stroke="#1e40af" stroke-width="1.5"/>
  <text x="190" y="88" font-style="italic" fill="#1e40af">r</text>

  <!-- Velocity vector v -->
  <line x1="270" y1="75" x2="310" y2="105" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="315" y="115" font-style="italic" font-weight="bold" fill="#dc2626">v</text>

  <text x="235" y="115" font-size="13" font-style="italic" fill="#0369a1">dA</text>
  <text x="200" y="215" text-anchor="middle" font-size="13" fill="#1e293b">面积速度守恒：dA / dt = ½ r² θ̇ = C (常数)</text>
</svg>
