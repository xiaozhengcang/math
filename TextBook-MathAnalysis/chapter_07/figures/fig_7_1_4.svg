<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="200" x2="420" y2="200" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="220" x2="60" y2="30" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="220" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
  <text x="45" y="35" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="45" y="215" font-size="13" fill="var(--text-primary, #333)">O</text>
  
  <!-- Curve y = f(x) -->
  <path d="M 100 130 C 130 180, 180 180, 230 110 C 270 55, 340 55, 370 140" fill="none" stroke="var(--text-primary, #333)" stroke-width="2.2"/>
  <text x="355" y="45" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y = f(x)</text>
  
  <!-- Left interval: [x_i-1, x_i] -->
  <line x1="100" y1="200" x2="100" y2="130" stroke="var(--text-primary, #333)" stroke-width="1.2"/>
  <line x1="170" y1="200" x2="170" y2="175" stroke="var(--text-primary, #333)" stroke-width="1.2"/>
  <!-- Upper rectangle M_i -->
  <rect x="100" y="130" width="70" height="70" fill="none" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <!-- Lower rectangle m_i -->
  <line x1="100" y1="175" x2="170" y2="175" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="125" y="190" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">mᵢ</text>
  <text x="125" y="125" font-size="12" font-style="italic" fill="var(--text-primary, #333)">Mᵢ</text>
  
  <!-- Middle interval -->
  <line x1="230" y1="200" x2="230" y2="110" stroke="var(--text-primary, #333)" stroke-width="1.2"/>
  <line x1="330" y1="200" x2="330" y2="70" stroke="var(--text-primary, #333)" stroke-width="1.2"/>
  <!-- Upper rectangle -->
  <rect x="230" y="60" width="100" height="140" fill="none" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <!-- Lower rectangle -->
  <line x1="230" y1="110" x2="330" y2="110" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <text x="230" y="240" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.1.4 达布大和（实线）与达布小和（虚线）</text>
</svg>
