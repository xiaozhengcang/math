<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Rocket body -->
  <path d="M 170 90 L 270 90 L 295 105 L 270 120 L 170 120 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/>
  <!-- Rocket nose cone -->
  <path d="M 270 90 L 305 105 L 270 120 Z" fill="#dc2626" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Fins -->
  <polygon points="170,90 150,70 180,90" fill="#1e40af" stroke="#1e293b" stroke-width="1.2"/>
  <polygon points="170,120 150,140 180,120" fill="#1e40af" stroke="#1e293b" stroke-width="1.2"/>

  <text x="220" y="110" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">m(t)</text>

  <!-- Rocket forward velocity v -->
  <line x1="315" y1="105" x2="365" y2="105" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
  <text x="370" y="110" font-size="15" font-weight="bold" font-style="italic" fill="#1e40af">v(t)</text>

  <!-- Exhaust gases backward -->
  <path d="M 165 105 L 125 95 M 165 105 L 120 105 M 165 105 L 125 115" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="120" y1="105" x2="70" y2="105" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <text x="50" y="110" font-size="14" font-weight="bold" font-style="italic" fill="#dc2626">u</text>
  <text x="60" y="90" font-size="11" fill="#dc2626">喷气相对速度</text>

  <text x="210" y="180" text-anchor="middle" font-size="14" fill="#1e40af">齐奥尔科夫斯基公式：v = v₀ + u ln(m₀ / m)</text>
</svg>
