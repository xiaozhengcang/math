<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="160" x2="340" y2="160" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="180" x2="50" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Simpson parabolic rule through 3 points -->
  <path d="M 90 120 Q 180 40, 270 100" fill="rgba(46, 204, 113, 0.25)" stroke="#27ae60" stroke-width="2"/>
  <line x1="90" y1="160" x2="90" y2="120" stroke="var(--text-primary, #333)"/>
  <line x1="180" y1="160" x2="180" y2="60" stroke="var(--text-primary, #333)" stroke-dasharray="3 3"/>
  <line x1="270" y1="160" x2="270" y2="100" stroke="var(--text-primary, #333)"/>
  <text x="85" y="178" font-size="12" fill="var(--text-primary, #333)">a</text>
  <text x="170" y="178" font-size="12" fill="var(--text-primary, #333)">(a+b)/2</text>
  <text x="265" y="178" font-size="12" fill="var(--text-primary, #333)">b</text>
  <text x="190" y="195" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.6.2 Simpson（抛物线）求积公式几何示意</text>
</svg>
