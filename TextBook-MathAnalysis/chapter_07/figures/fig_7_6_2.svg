<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="190" x2="390" y2="190" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="208" font-style="italic">x</text>
  <line x1="55" y1="210" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="205">O</text>

  <!-- 3 interpolation points for parabola: x0=100, x1=210, x2=320 -->
  <!-- y0 = 125, y1 = 60, y2 = 110 -->
  <!-- Shaded parabolic strip -->
  <path d="M 100 190 L 100 125 Q 210 35 320 110 L 320 190 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>

  <!-- Interpolating parabola -->
  <path d="M 100 125 Q 210 35 320 110" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="210" y="45" font-size="13" fill="#dc2626" text-anchor="middle">二次插值抛物线</text>

  <!-- 3 Points -->
  <circle cx="100" cy="125" r="3.5" fill="#dc2626"/>
  <circle cx="210" cy="60" r="3.5" fill="#dc2626"/>
  <circle cx="320" cy="110" r="3.5" fill="#dc2626"/>

  <!-- Vertical dividers -->
  <line x1="100" y1="125" x2="100" y2="190" stroke="#64748b" stroke-width="1.2"/>
  <line x1="210" y1="60" x2="210" y2="190" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="320" y1="110" x2="320" y2="190" stroke="#64748b" stroke-width="1.2"/>

  <!-- Ticks -->
  <line x1="100" y1="187" x2="100" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="95" y="208" font-style="italic">x₀</text>
  <line x1="210" y1="187" x2="210" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="205" y="208" font-style="italic">x₁</text>
  <line x1="320" y1="187" x2="320" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="315" y="208" font-style="italic">x₂</text>

  <text x="210" y="235" text-anchor="middle" font-size="13" fill="#1e40af">Simpson 面积公式：A ≈ (h/3)[y₀ + 4y₁ + y₂]</text>
</svg>
