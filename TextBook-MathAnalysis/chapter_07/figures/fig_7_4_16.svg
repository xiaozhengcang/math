<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Solid of revolution -->
  <line x1="30" y1="110" x2="390" y2="110" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 100 60 C 160 40, 260 70, 320 50 L 320 170 C 260 150, 160 180, 100 160 Z" fill="rgba(26, 115, 232, 0.15)" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <!-- Circular disk slice -->
  <ellipse cx="210" cy="110" rx="15" ry="50" fill="rgba(26, 115, 232, 0.4)" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5"/>
  <line x1="210" y1="110" x2="210" y2="60" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5"/>
  <text x="215" y="85" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">f(x)</text>
  <text x="210" y="208" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.16 绕 x 轴旋转所得旋转体的圆盘微元 dV = π f²(x) dx</text>
</svg>
