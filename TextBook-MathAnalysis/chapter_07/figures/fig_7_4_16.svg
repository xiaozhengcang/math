<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- x-axis rotation center -->
  <line x1="30" y1="130" x2="390" y2="130" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="148" font-style="italic">x</text>

  <!-- Solid of revolution between a=90 and b=320 -->
  <!-- Upper curve y = f(x) -->
  <path d="M 90 85 C 150 55, 250 65, 320 100 L 320 160 C 250 195, 150 205, 90 175 Z" 
        fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>

  <!-- Silhouette curves -->
  <path d="M 90 85 C 150 55, 250 65, 320 100" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <path d="M 90 175 C 150 205, 250 195, 320 160" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <text x="180" y="65" font-style="italic" fill="#1e40af">y = f(x)</text>

  <!-- Left and right end disks -->
  <ellipse cx="90" cy="130" rx="12" ry="45" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <ellipse cx="320" cy="130" rx="12" ry="30" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Thin disk slice at x = 210: radius y = f(x), thickness dx -->
  <ellipse cx="210" cy="130" rx="14" ry="58" fill="#fed7aa" fill-opacity="0.8" stroke="#ea580c" stroke-width="1.6"/>
  <line x1="210" y1="130" x2="210" y2="72" stroke="#ea580c" stroke-width="1.5"/>
  <text x="215" y="105" font-style="italic" fill="#c2410c">f(x)</text>

  <!-- Labels -->
  <line x1="90" y1="127" x2="90" y2="133" stroke="#1e293b" stroke-width="1.2"/>
  <text x="86" y="148" font-style="italic">a</text>
  <line x1="320" y1="127" x2="320" y2="133" stroke="#1e293b" stroke-width="1.2"/>
  <text x="316" y="148" font-style="italic">b</text>

  <text x="210" y="240" text-anchor="middle" font-size="14" fill="#1e40af">V = π ∫ₐᵇ f²(x) dx</text>
</svg>
