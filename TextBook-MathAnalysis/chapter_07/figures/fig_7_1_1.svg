<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Ellipse orbit -->
  <ellipse cx="210" cy="110" rx="180" ry="85" fill="none" stroke="var(--text-primary, #333)" stroke-width="2"/>
  
  <!-- Sun at left focus -->
  <circle cx="120" cy="110" r="8" fill="#e67e22" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <text x="80" y="115" font-size="14" font-family="KaTeX_Main, serif" fill="var(--text-primary, #333)">太阳</text>
  
  <!-- Sector 1 near perihelion (wide angle, short radius) -->
  <path d="M 120 110 L 135 27 A 180 85 0 0 1 175 33 Z" fill="rgba(26, 115, 232, 0.25)" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5"/>
  <circle cx="155" cy="30" r="5" fill="var(--primary-accent, #1a73e8)"/>
  <text x="145" y="18" font-size="14" font-family="KaTeX_Main, serif" fill="var(--text-primary, #333)">行星</text>
  
  <!-- Sector 2 near aphelion (narrow angle, long radius) -->
  <path d="M 120 110 L 375 80 A 180 85 0 0 1 385 125 Z" fill="rgba(26, 115, 232, 0.25)" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.5"/>
  <circle cx="380" cy="100" r="5" fill="var(--primary-accent, #1a73e8)"/>
  
  <!-- Caption/Label -->
  <text x="210" y="210" text-anchor="middle" font-size="14" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.1.1 开普勒第二定律（相等时间内扫过相等面积）</text>
</svg>
