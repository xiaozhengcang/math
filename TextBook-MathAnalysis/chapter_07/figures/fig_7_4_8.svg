<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Polar axis -->
  <line x1="50" y1="200" x2="320" y2="200" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="315" y="218">极轴</text>
  <text x="40" y="215">O</text>

  <!-- Polar sector from alpha=20 deg to beta=70 deg -->
  <!-- Curve r = r(theta) -->
  <path d="M 50 200 L 220 138 C 210 100, 180 60, 110 35 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>

  <!-- Boundary rays theta = alpha and theta = beta -->
  <line x1="50" y1="200" x2="220" y2="138" stroke="#1e40af" stroke-width="1.8"/>
  <text x="225" y="145" font-style="italic" fill="#1e40af">θ = α</text>
  <line x1="50" y1="200" x2="110" y2="35" stroke="#1e40af" stroke-width="1.8"/>
  <text x="110" y="30" font-style="italic" fill="#1e40af">θ = β</text>

  <!-- Curve r = r(theta) -->
  <path d="M 220 138 C 210 100, 180 60, 110 35" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="185" y="70" font-style="italic" fill="#1e40af">r = r(θ)</text>

  <!-- Infinitesimal sector dtheta -->
  <path d="M 50 200 L 175 92 A 160 160 0 0 1 155 76 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
  <text x="145" y="130" font-size="13" font-style="italic" fill="#c2410c">dA = ½ r² dθ</text>
</svg>
