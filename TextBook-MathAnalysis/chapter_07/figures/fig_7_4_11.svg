<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Arc length differential element ds -->
  <line x1="30" y1="170" x2="340" y2="170" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="190" x2="50" y2="30" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 90 140 Q 180 120, 280 50" fill="none" stroke="var(--text-primary, #333)" stroke-width="2"/>
  <!-- Differential triangle: dx, dy, ds -->
  <line x1="160" y1="115" x2="210" y2="115" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.8"/>
  <line x1="210" y1="115" x2="210" y2="85" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.8"/>
  <line x1="160" y1="115" x2="210" y2="85" stroke="#e74c3c" stroke-width="2.2"/>
  <text x="180" y="130" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">dx</text>
  <text x="215" y="105" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">dy</text>
  <text x="175" y="95" font-size="12" font-style="italic" fill="#e74c3c">ds</text>
  <text x="190" y="200" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.11 曲线弧长微元 ds = √(1 + y'²) dx</text>
</svg>
