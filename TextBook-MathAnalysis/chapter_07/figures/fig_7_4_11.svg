<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Curve y = f(x) from A to B -->
  <path d="M 60 180 C 110 70, 220 50, 360 120" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="365" y="115" font-style="italic" fill="#1e40af">y = f(x)</text>

  <!-- Inscribed polygon vertices: A=(60, 180), P1=(110, 120), P2=(180, 75), P3=(265, 78), B=(360, 120) -->
  <polyline points="60,180 110,120 180,75 265,78 360,120" fill="none" stroke="#dc2626" stroke-width="1.8"/>

  <circle cx="60" cy="180" r="3.5" fill="#1e293b"/>
  <text x="45" y="195">A</text>
  <circle cx="110" cy="120" r="3" fill="#dc2626"/>
  <circle cx="180" cy="75" r="3" fill="#dc2626"/>
  <text x="175" y="65">P_{i-1}</text>
  <circle cx="265" cy="78" r="3" fill="#dc2626"/>
  <text x="265" y="68">P_i</text>
  <circle cx="360" cy="120" r="3.5" fill="#1e293b"/>
  <text x="365" y="135">B</text>

  <!-- Chord Delta s_i -->
  <text x="220" y="95" font-size="13" font-style="italic" fill="#dc2626">Δs_i</text>
  <text x="210" y="220" text-anchor="middle" font-size="13" fill="#1e293b">s = lim ∑ √[Δx_i² + Δy_i²] = ∫ √[1 + f'(x)²] dx</text>
</svg>
