<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Subfigure (a) -->
  <g transform="translate(20, 10)">
    <polygon points="40,150 200,150 200,30" fill="none" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
    <path d="M 40 150 C 100 140, 150 100, 200 30" fill="rgba(26, 115, 232, 0.2)" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
    <text x="120" y="180" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-primary, #333)">(a) 曲边直角三角形</text>
  </g>
  <!-- Subfigure (b) -->
  <g transform="translate(300, 10)">
    <path d="M 40 150 C 100 140, 150 100, 200 30" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
    <!-- Micro-triangles -->
    <path d="M 40 150 L 80 150 L 80 142 Z" fill="rgba(26, 115, 232, 0.3)" stroke="var(--text-primary, #333)"/>
    <path d="M 80 142 L 120 142 L 120 120 Z" fill="rgba(26, 115, 232, 0.3)" stroke="var(--text-primary, #333)"/>
    <path d="M 120 120 L 160 120 L 160 80 Z" fill="rgba(26, 115, 232, 0.3)" stroke="var(--text-primary, #333)"/>
    <path d="M 160 80 L 200 80 L 200 30 Z" fill="rgba(26, 115, 232, 0.3)" stroke="var(--text-primary, #333)"/>
    <text x="120" y="180" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-primary, #333)">(b) 阶梯微分三角形拼接</text>
  </g>
  <text x="300" y="210" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.3.2 微积分基本定理的直观构作模型</text>
</svg>
