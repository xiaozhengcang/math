<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Left: S_n' (Lower sum) -->
  <g transform="translate(40, 20)">
    <line x1="20" y1="200" x2="260" y2="200" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="40" y1="210" x2="40" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="255" y="220" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
    <text x="25" y="25" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
    
    <!-- Shaded lower steps -->
    <path d="M 40 200 L 76 200 L 76 195 L 112 195 L 112 181 L 148 181 L 148 158 L 184 158 L 184 125 L 220 125 L 220 200 Z" fill="rgba(26, 115, 232, 0.25)" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.2"/>
    
    <!-- Parabola curve y = x^2 -->
    <path d="M 40 200 Q 130 195, 230 40" fill="none" stroke="var(--text-primary, #333)" stroke-width="2"/>
    <text x="225" y="35" font-size="12" font-style="italic" fill="var(--text-primary, #333)">y = x²</text>
    <text x="130" y="175" font-size="14" font-weight="bold" fill="var(--primary-accent, #1a73e8)">S'ₙ</text>
    <line x1="220" y1="197" x2="220" y2="203" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
    <text x="217" y="218" font-size="12" fill="var(--text-primary, #333)">1</text>
    <text x="35" y="218" font-size="12" fill="var(--text-primary, #333)">O</text>
  </g>
  
  <!-- Right: S_n'' (Upper sum) -->
  <g transform="translate(380, 20)">
    <line x1="20" y1="200" x2="260" y2="200" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="40" y1="210" x2="40" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="255" y="220" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
    <text x="25" y="25" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
    
    <!-- Shaded upper steps -->
    <path d="M 40 200 L 40 195 L 76 195 L 76 181 L 112 181 L 112 158 L 148 158 L 148 125 L 184 125 L 184 81 L 220 81 L 220 200 Z" fill="rgba(26, 115, 232, 0.25)" stroke="var(--primary-accent, #1a73e8)" stroke-width="1.2"/>
    
    <!-- Parabola curve y = x^2 -->
    <path d="M 40 200 Q 130 195, 230 40" fill="none" stroke="var(--text-primary, #333)" stroke-width="2"/>
    <text x="225" y="35" font-size="12" font-style="italic" fill="var(--text-primary, #333)">y = x²</text>
    <text x="130" y="155" font-size="14" font-weight="bold" fill="var(--primary-accent, #1a73e8)">S"ₙ</text>
    <line x1="220" y1="197" x2="220" y2="203" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
    <text x="217" y="218" font-size="12" fill="var(--text-primary, #333)">1</text>
    <text x="35" y="218" font-size="12" fill="var(--text-primary, #333)">O</text>
  </g>
  <text x="340" y="265" text-anchor="middle" font-size="14" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.1.2 抛物线下曲边梯形面积的内接与外切阶梯逼近</text>
</svg>
