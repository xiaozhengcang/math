<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="auto" style="max-width:540px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Left panel: Inscribed rectangles s_n -->
  <g transform="translate(25, 20)">
    <line x1="20" y1="180" x2="210" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="205" y="198" font-style="italic">x</text>
    <line x1="40" y1="195" x2="40" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="28" y="25" font-style="italic">y</text>
    <text x="28" y="195">O</text>

    <!-- Parabola y = x^2: x in [0, 1] (width 140 px, height 140 px) -->
    <!-- (40, 180) to (180, 40) -->
    <!-- 4 steps: dx = 35 px -->
    <!-- Step 0: x in [0, 1/4], h = 0 -->
    <!-- Step 1: x in [1/4, 2/4], h = 140 * (1/4)^2 = 8.75 -> y = 171.25 -->
    <!-- Step 2: x in [2/4, 3/4], h = 140 * (2/4)^2 = 35 -> y = 145 -->
    <!-- Step 3: x in [3/4, 1], h = 140 * (3/4)^2 = 78.75 -> y = 101.25 -->
    <rect x="75" y="171.25" width="35" height="8.75" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
    <rect x="110" y="145" width="35" height="35" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>
    <rect x="145" y="101.25" width="35" height="78.75" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>

    <!-- Parabola curve -->
    <path d="M 40 180 Q 110 180 180 40" fill="none" stroke="#1e40af" stroke-width="2"/>
    <line x1="180" y1="177" x2="180" y2="183" stroke="#1e293b" stroke-width="1.2"/>
    <text x="178" y="198">1</text>
    <text x="110" y="220" text-anchor="middle" font-weight="bold" fill="#0284c7">内接阶梯形 sₙ</text>
  </g>

  <!-- Right panel: Circumscribed rectangles S_n -->
  <g transform="translate(285, 20)">
    <line x1="20" y1="180" x2="210" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="205" y="198" font-style="italic">x</text>
    <line x1="40" y1="195" x2="40" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="28" y="25" font-style="italic">y</text>
    <text x="28" y="195">O</text>

    <!-- 4 steps: dx = 35 px -->
    <!-- Step 1: x in [0, 1/4], h = 8.75 -> y = 171.25 -->
    <!-- Step 2: x in [1/4, 2/4], h = 35 -> y = 145 -->
    <!-- Step 3: x in [2/4, 3/4], h = 78.75 -> y = 101.25 -->
    <!-- Step 4: x in [3/4, 1], h = 140 -> y = 40 -->
    <rect x="40" y="171.25" width="35" height="8.75" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <rect x="75" y="145" width="35" height="35" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <rect x="110" y="101.25" width="35" height="78.75" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <rect x="145" y="40" width="35" height="140" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>

    <!-- Parabola curve -->
    <path d="M 40 180 Q 110 180 180 40" fill="none" stroke="#1e40af" stroke-width="2"/>
    <line x1="180" y1="177" x2="180" y2="183" stroke="#1e293b" stroke-width="1.2"/>
    <text x="178" y="198">1</text>
    <text x="110" y="220" text-anchor="middle" font-weight="bold" fill="#ea580c">外切阶梯形 Sₙ</text>
  </g>
</svg>
