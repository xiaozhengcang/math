<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="170" x2="370" y2="170" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="190" x2="50" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Two curves y = f1(x) and y = f2(x) -->
  <path d="M 90 120 C 150 50, 250 60, 320 90" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <path d="M 90 150 C 160 130, 250 140, 320 120" fill="none" stroke="#27ae60" stroke-width="2"/>
  <!-- Shaded area between them -->
  <path d="M 120 98 C 170 65, 240 70, 280 82 L 280 125 C 240 135, 170 128, 120 142 Z" fill="rgba(26, 115, 232, 0.25)"/>
  <line x1="120" y1="170" x2="120" y2="98" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <line x1="280" y1="170" x2="280" y2="82" stroke="var(--text-muted, #888)" stroke-dasharray="3 3"/>
  <text x="115" y="185" font-size="12" fill="var(--text-primary, #333)">a</text>
  <text x="275" y="185" font-size="12" fill="var(--text-primary, #333)">b</text>
  <text x="200" y="195" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.2 两曲线 y = f₁(x) 与 y = f₂(x) 之间的面积</text>
</svg>
