<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="130" x2="390" y2="130" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="148" font-style="italic">x</text>
  <line x1="55" y1="210" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="145">O</text>

  <!-- Curve crossing x-axis at c1=170 and c2=270, a=80, b=350 -->
  <!-- Region A1 (above x-axis): x in [80, 170] -->
  <path d="M 80 130 C 100 60, 150 60, 170 130 Z" fill="#bae6fd" fill-opacity="0.65" stroke="none"/>
  <!-- Region A2 (below x-axis): x in [170, 270] -->
  <path d="M 170 130 C 190 200, 250 200, 270 130 Z" fill="#fed7aa" fill-opacity="0.75" stroke="none"/>
  <!-- Region A3 (above x-axis): x in [270, 350] -->
  <path d="M 270 130 C 290 70, 330 70, 350 130 Z" fill="#bae6fd" fill-opacity="0.65" stroke="none"/>

  <!-- Curve y = f(x) -->
  <path d="M 65 160 C 80 80, 100 60, 170 130 C 190 200, 250 200, 270 130 C 290 70, 330 70, 365 150" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <text x="365" y="140" font-style="italic" fill="#1e40af">y = f(x)</text>

  <!-- Ticks -->
  <line x1="80" y1="127" x2="80" y2="133" stroke="#1e293b" stroke-width="1.2"/>
  <text x="76" y="148" font-style="italic">a</text>
  <line x1="170" y1="127" x2="170" y2="133" stroke="#1e293b" stroke-width="1.2"/>
  <text x="165" y="148" font-style="italic">c₁</text>
  <line x1="270" y1="127" x2="270" y2="133" stroke="#1e293b" stroke-width="1.2"/>
  <text x="265" y="122" font-style="italic">c₂</text>
  <line x1="350" y1="127" x2="350" y2="133" stroke="#1e293b" stroke-width="1.2"/>
  <text x="346" y="148" font-style="italic">b</text>

  <text x="120" y="110" font-size="14" font-style="italic" fill="#0369a1" font-weight="bold">A₁</text>
  <text x="215" y="165" font-size="14" font-style="italic" fill="#b45309" font-weight="bold">A₂</text>
  <text x="305" y="110" font-size="14" font-style="italic" fill="#0369a1" font-weight="bold">A₃</text>
</svg>
