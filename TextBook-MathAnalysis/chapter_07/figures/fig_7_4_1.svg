<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <line x1="30" y1="110" x2="370" y2="110" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="50" y1="180" x2="50" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Curve crossing x-axis -->
  <path d="M 80 110 C 120 40, 180 50, 210 110 C 240 170, 300 160, 330 110" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <path d="M 80 110 C 120 40, 180 50, 210 110 Z" fill="rgba(26, 115, 232, 0.25)"/>
  <path d="M 210 110 C 240 170, 300 160, 330 110 Z" fill="rgba(231, 76, 60, 0.25)"/>
  <text x="140" y="90" font-size="12" fill="var(--primary-accent, #1a73e8)">S₁ (+)</text>
  <text x="260" y="140" font-size="12" fill="#e74c3c">S₂ (-)</text>
  <text x="200" y="190" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.1 函数变号时的定积分与实际面积</text>
</svg>
