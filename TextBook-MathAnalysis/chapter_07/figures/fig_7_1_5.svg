<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="210" x2="410" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="405" y="228" font-style="italic">x</text>
  <line x1="55" y1="230" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="225">O</text>

  <!-- Curve y = f(x) -->
  <path d="M 80 170 C 130 100, 200 65, 270 120 C 320 160, 350 110, 380 75" fill="none" stroke="#1e40af" stroke-width="2.2"/>

  <!-- Oscillation strip between M_i and m_i on [170, 270]: y from 65 to 120, height = 55 px -->
  <rect x="170" y="65" width="100" height="55" fill="#fca5a5" fill-opacity="0.65" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="170" y1="120" x2="170" y2="210" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="270" y1="120" x2="270" y2="210" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="170" y1="207" x2="170" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="155" y="228" font-style="italic">x_{i-1}</text>
  <line x1="270" y1="207" x2="270" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="265" y="228" font-style="italic">x_i</text>

  <!-- Oscillation height omega_i -->
  <line x1="150" y1="65" x2="150" y2="120" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="145" y1="65" x2="155" y2="65" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="145" y1="120" x2="155" y2="120" stroke="#dc2626" stroke-width="1.5"/>
  <text x="125" y="98" font-style="italic" fill="#dc2626" font-weight="bold">ωᵢ</text>

  <text x="220" y="95" font-size="14" font-style="italic" fill="#991b1b" font-weight="bold" text-anchor="middle">ωᵢ Δxᵢ</text>
  <text x="220" y="245" text-anchor="middle" font-size="12" fill="#64748b">∑ ωᵢ Δxᵢ = S(T) - s(T) → 0</text>
</svg>
