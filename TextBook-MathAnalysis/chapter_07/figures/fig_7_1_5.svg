<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="200" x2="420" y2="200" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="220" x2="60" y2="30" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="220" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
  <text x="45" y="35" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="45" y="215" font-size="13" fill="var(--text-primary, #333)">O</text>
  
  <!-- Difference rectangular shaded strips: (M_i - m_i) * delta_x_i -->
  <rect x="100" y="90" width="40" height="50" fill="rgba(231, 76, 60, 0.3)" stroke="var(--text-primary, #333)" stroke-width="1"/>
  <rect x="140" y="115" width="40" height="35" fill="rgba(231, 76, 60, 0.3)" stroke="var(--text-primary, #333)" stroke-width="1"/>
  <rect x="180" y="110" width="40" height="20" fill="rgba(231, 76, 60, 0.3)" stroke="var(--text-primary, #333)" stroke-width="1"/>
  <rect x="220" y="100" width="45" height="30" fill="rgba(231, 76, 60, 0.3)" stroke="var(--text-primary, #333)" stroke-width="1"/>
  <rect x="265" y="65" width="45" height="55" fill="rgba(231, 76, 60, 0.3)" stroke="var(--text-primary, #333)" stroke-width="1"/>
  <rect x="310" y="45" width="40" height="40" fill="rgba(231, 76, 60, 0.3)" stroke="var(--text-primary, #333)" stroke-width="1"/>
  
  <!-- Curve y = f(x) passing through -->
  <path d="M 100 90 C 120 140, 160 150, 200 120 C 240 90, 280 120, 310 65 C 330 45, 350 50, 350 85" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.2"/>
  <text x="355" y="45" font-size="13" font-style="italic" fill="var(--primary-accent, #1a73e8)">y = f(x)</text>
  
  <text x="230" y="240" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.1.5 振幅差和 ∑ ωᵢΔxᵢ 的几何意义（阴影矩形带面积趋于0）</text>
</svg>
