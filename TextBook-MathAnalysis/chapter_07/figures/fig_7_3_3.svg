<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="20" y1="120" x2="280" y2="120" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="220" x2="140" y2="20" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="135" font-size="13" font-style="italic" fill="var(--text-primary, #333)">x</text>
  <text x="128" y="25" font-size="13" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="128" y="135" font-size="12" font-style="italic" fill="var(--text-primary, #333)">O</text>

  <!-- Full Circle outline -->
  <circle cx="140" cy="120" r="80" fill="none" stroke="var(--text-primary, #333)" stroke-width="1.5"/>

  <!-- Shaded First Quadrant sector: from (140,120) to (220,120) arc to (140,40) back to (140,120) -->
  <path d="M 140 120 L 220 120 A 80 80 0 0 0 140 40 Z" fill="rgba(26, 115, 232, 0.25)" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>

  <!-- Radius label r -->
  <text x="180" y="135" font-size="13" font-style="italic" fill="var(--text-primary, #333)">r</text>
  <line x1="220" y1="117" x2="220" y2="123" stroke="var(--text-primary, #333)" stroke-width="1.5"/>

  <text x="140" y="225" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.3.3</text>
</svg>
