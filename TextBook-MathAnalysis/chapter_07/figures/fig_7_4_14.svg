<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- x-axis passing through solid -->
  <line x1="30" y1="150" x2="390" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="385" y="168" font-style="italic">x</text>

  <!-- Solid body between a=90 and b=330 -->
  <path d="M 90 120 C 130 65, 270 55, 330 110 L 330 185 C 270 230, 130 220, 90 170 Z" 
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Cross section at x = 210 with area A(x) -->
  <ellipse cx="210" cy="145" rx="26" ry="68" fill="#bae6fd" fill-opacity="0.8" stroke="#0284c7" stroke-width="2"/>
  <text x="210" y="145" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold" text-anchor="middle">A(x)</text>

  <!-- Vertical cross section plane slice -->
  <line x1="210" y1="145" x2="210" y2="150" stroke="#1e293b" stroke-width="1.2"/>
  <text x="206" y="168" font-style="italic">x</text>

  <!-- Boundaries a and b -->
  <line x1="90" y1="145" x2="90" y2="155" stroke="#1e293b" stroke-width="1.2"/>
  <text x="86" y="168" font-style="italic">a</text>
  <line x1="330" y1="145" x2="330" y2="155" stroke="#1e293b" stroke-width="1.2"/>
  <text x="326" y="168" font-style="italic">b</text>

  <text x="210" y="240" text-anchor="middle" font-size="14" fill="#1e40af">V = ∫ₐᵇ A(x) dx</text>
</svg>
