<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--primary-accent, #1a73e8)"/>
    </marker>
  </defs>

  <!-- Parallel slice volume V = int S(x) dx -->
  <line x1="30" y1="170" x2="390" y2="170" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Outline of 3D solid -->
  <path d="M 80 130 C 140 60, 280 60, 340 100 L 340 170 L 80 170 Z" fill="rgba(26, 115, 232, 0.1)" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <!-- Cross section slice at x -->
  <ellipse cx="210" cy="115" rx="25" ry="50" fill="rgba(26, 115, 232, 0.35)" stroke="var(--primary-accent, #1a73e8)" stroke-width="2"/>
  <line x1="210" y1="170" x2="210" y2="165" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <text x="205" y="185" font-size="12" fill="var(--text-primary, #333)">x</text>
  <text x="215" y="115" font-size="12" font-style="italic" fill="var(--primary-accent, #1a73e8)">S(x)</text>
  <text x="210" y="208" text-anchor="middle" font-size="13" font-family="KaTeX_Main, serif" fill="var(--text-muted, #666)">图 7.4.14 平行截面面积已知的立体体积 V = ∫ S(x) dx</text>
</svg>
