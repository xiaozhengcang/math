<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="100%" height="auto" style="max-width: 520px;">
  <defs>
    <marker id="arrow-941" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="55" y1="280" x2="480" y2="280" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-941)"/>
  <line x1="80" y1="305" x2="80" y2="40" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-941)"/>
  <text x="70" y="295" font-family="KaTeX_Math, serif" font-style="italic" font-size="14" fill="#1e293b">O</text>

  <!-- Outer Boundary & Horizontal Dividing Lines -->
  <!-- y = 75 (a5) -->
  <line x1="80" y1="75" x2="430" y2="75" stroke="#1e293b" stroke-width="1.2"/>
  <!-- y = 115 (a4) -->
  <line x1="80" y1="115" x2="360" y2="115" stroke="#1e293b" stroke-width="1.2"/>
  <!-- y = 155 (a3) -->
  <line x1="80" y1="155" x2="290" y2="155" stroke="#1e293b" stroke-width="1.2"/>
  <!-- y = 195 (a2) -->
  <line x1="80" y1="195" x2="220" y2="195" stroke="#1e293b" stroke-width="1.2"/>
  <!-- y = 235 (a1) -->
  <line x1="80" y1="235" x2="150" y2="235" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Vertical Dividing Lines -->
  <!-- x = 150 (B1) -->
  <line x1="150" y1="195" x2="150" y2="280" stroke="#1e293b" stroke-width="1.2"/>
  <!-- x = 220 (B2) -->
  <line x1="220" y1="155" x2="220" y2="280" stroke="#1e293b" stroke-width="1.2"/>
  <!-- x = 290 (B3) -->
  <line x1="290" y1="115" x2="290" y2="280" stroke="#1e293b" stroke-width="1.2"/>
  <!-- x = 360 (B4) -->
  <line x1="360" y1="75" x2="360" y2="280" stroke="#1e293b" stroke-width="1.2"/>
  <!-- x = 430 (B5) -->
  <line x1="430" y1="75" x2="430" y2="280" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Y-Axis Labels -->
  <text x="72" y="240" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="end">a₁</text>
  <text x="72" y="200" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="end">a₂</text>
  <text x="72" y="160" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="end">a₃</text>
  <text x="72" y="120" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="end">a₄</text>
  <text x="72" y="80" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="end">a₅</text>

  <!-- X-Axis Labels -->
  <text x="150" y="298" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="middle">B₁</text>
  <text x="220" y="298" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="middle">B₂</text>
  <text x="290" y="298" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="middle">B₃</text>
  <text x="360" y="298" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="middle">B₄</text>
  <text x="430" y="298" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#1e293b" text-anchor="middle">B₅</text>

  <!-- Area Labels Inside Rectangles -->
  <!-- a_k b_k blocks -->
  <text x="115" y="262" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#334155" text-anchor="middle">a₁b₁</text>
  <text x="185" y="242" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#334155" text-anchor="middle">a₂b₂</text>
  <text x="255" y="222" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#334155" text-anchor="middle">a₃b₃</text>
  <text x="325" y="202" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#334155" text-anchor="middle">a₄b₄</text>
  <text x="395" y="180" font-family="KaTeX_Math, serif" font-style="italic" font-size="13" fill="#334155" text-anchor="middle">a₅b₅</text>

  <!-- Complementary (a_{k+1} - a_k) B_k blocks -->
  <text x="115" y="218" font-family="KaTeX_Math, serif" font-size="12" fill="#334155" text-anchor="middle">(a₂−a₁)B₁</text>
  <text x="150" y="178" font-family="KaTeX_Math, serif" font-size="12" fill="#334155" text-anchor="middle">(a₃−a₂)B₂</text>
  <text x="185" y="138" font-family="KaTeX_Math, serif" font-size="12" fill="#334155" text-anchor="middle">(a₄−a₃)B₃</text>
  <text x="220" y="98" font-family="KaTeX_Math, serif" font-size="12" fill="#334155" text-anchor="middle">(a₅−a₄)B₄</text>

  <!-- Caption -->
  <text x="260" y="335" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">图 9.4.1</text>
</svg>
