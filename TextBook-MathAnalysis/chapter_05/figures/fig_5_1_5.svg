<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" width="100%" height="auto" style="max-width:480px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="45" y1="250" x2="445" y2="250" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <line x1="75" y1="285" x2="75" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <text x="450" y="255" font-style="italic">x</text>
  <text x="63" y="30" font-style="italic">y</text>
  <text x="60" y="265" font-style="italic">O</text>
  <!-- Upper curve y = f(x) & secant -->
  <line x1="120" y1="155" x2="390" y2="90" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <path d="M 140 150 C 175 75 220 65 255 65 C 295 65 340 75 370 95" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <text x="380" y="85" font-style="italic" font-weight="bold" fill="#1e40af">y = f(x)</text>
  <line x1="190" y1="80" x2="320" y2="49" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="255" cy="65" r="3.5" fill="#dc2626"/>
  <!-- Auxiliary function y = ψ(x) -->
  <path d="M 140 250 C 175 200 220 195 255 195 C 290 195 335 200 370 250" fill="none" stroke="#059669" stroke-width="2.2"/>
  <line x1="195" y1="195" x2="315" y2="195" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="255" cy="195" r="3.5" fill="#dc2626"/>
  <text x="380" y="240" font-style="italic" font-weight="bold" fill="#059669">y = ψ(x)</text>
  <text x="325" y="199" font-size="12px" fill="#dc2626">ψ'(ξ) = 0</text>
  <!-- Projections -->
  <line x1="140" y1="250" x2="140" y2="150" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="370" y1="250" x2="370" y2="95" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="255" y1="250" x2="255" y2="65" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="210" y1="84" x2="210" y2="127" stroke="#059669" stroke-width="1.5" marker-end="url(#arr5)" marker-start="url(#arr5)"/>
  <text x="202" y="110" text-anchor="end" font-style="italic" font-size="13px" fill="#059669">ψ(x)</text>
  <text x="140" y="265" text-anchor="middle" font-style="italic">a</text>
  <text x="255" y="265" text-anchor="middle" font-style="italic" font-weight="bold">ξ</text>
  <text x="370" y="265" text-anchor="middle" font-style="italic">b</text>
</svg>
