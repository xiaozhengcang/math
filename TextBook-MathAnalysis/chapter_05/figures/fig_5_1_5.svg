<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="auto">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="50" y1="240" x2="430" y2="240" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <text x="425" y="258" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x</text>
  
  <line x1="80" y1="270" x2="80" y2="30" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <text x="65" y="35" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="65" y="255" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">O</text>
  
  <!-- a, xi, b coordinates -->
  <!-- a = 120, xi = 200, b = 320 -->
  <!-- Top Curve y = f(x) -->
  <!-- (120, 160) to (320, 90) -->
  <path d="M 120 160 C 150 70, 270 50, 320 90" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  <!-- Secant line -->
  <line x1="100" y1="167" x2="340" y2="83" stroke="var(--text-primary, #333)" stroke-width="1"/>
  <!-- Tangent at xi -->
  <line x1="130" y1="94" x2="280" y2="41" stroke="#e53935" stroke-width="1.8"/>
  
  <!-- Bottom Curve phi(x) on axis -->
  <!-- Drops to zero at a=120 and b=320, peak at xi=200 -->
  <path d="M 120 240 C 150 180, 270 180, 320 240" fill="none" stroke="#2e7d32" stroke-width="2"/>
  
  <!-- Dashed vertical lines -->
  <line x1="120" y1="160" x2="120" y2="240" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="200" y1="66" x2="200" y2="240" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="320" y1="90" x2="320" y2="240" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Horizontal reference line between f(a) and b vertical line -->
  <line x1="90" y1="160" x2="340" y2="160" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Downward arrows indicating transformation -->
  <line x1="240" y1="115" x2="240" y2="160" stroke="var(--text-muted, #555)" stroke-width="1.2" marker-end="url(#arrow5)"/>
  <line x1="320" y1="95" x2="320" y2="150" stroke="var(--text-muted, #555)" stroke-width="1.2" marker-end="url(#arrow5)"/>
  <line x1="320" y1="165" x2="320" y2="230" stroke="var(--text-muted, #555)" stroke-width="1.2" marker-end="url(#arrow5)"/>
  
  <text x="116" y="258" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">a</text>
  <text x="196" y="258" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">ξ</text>
  <text x="316" y="258" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">b</text>
</svg>