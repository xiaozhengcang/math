<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="auto">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>
  <!-- x-axis -->
  <line x1="30" y1="210" x2="430" y2="210" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow2)"/>
  
  <!-- Curve -->
  <!-- Starts at a (x=60, y=70), drops to local min at x1 (x=100, y=90), goes up to high point (x=160, y=50), drops way down to trough (x=240, y=180), goes up to local max at x2 (x=330, y=130), then drops to b (x=380, y=170) -->
  <path d="M 60 70 C 75 88, 85 92, 100 92 C 120 92, 140 50, 165 45 C 190 40, 200 180, 240 180 C 270 180, 290 130, 330 130 C 355 130, 365 155, 380 170" 
        fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
        
  <!-- Points a, x1, x2, b vertical dashed lines -->
  <line x1="60" y1="70" x2="60" y2="210" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="100" y1="92" x2="100" y2="210" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="330" y1="130" x2="330" y2="210" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="380" y1="170" x2="380" y2="210" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Circles -->
  <circle cx="100" cy="92" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="330" cy="130" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  
  <!-- Ticks and labels -->
  <text x="56" y="228" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">a</text>
  <text x="93" y="228" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x<tspan font-size="10" dy="3">1</tspan></text>
  <text x="323" y="228" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x<tspan font-size="10" dy="3">2</tspan></text>
  <text x="376" y="228" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">b</text>
</svg>