<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="auto" style="max-width:480px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="225" x2="450" y2="225" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <line x1="70" y1="255" x2="70" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <text x="455" y="230" font-style="italic">x</text>
  <text x="58" y="30" font-style="italic">y</text>
  <text x="56" y="240" font-style="italic">O</text>
  <!-- Curve y = f(x) -->
  <path d="M 100 85 C 120 105 135 105 150 105 C 175 105 190 45 215 45 C 245 45 260 195 285 195 C 315 195 340 145 365 145 C 385 145 400 165 415 185" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="100" y1="225" x2="100" y2="85" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="242" text-anchor="middle" font-style="italic">a</text>
  <line x1="415" y1="225" x2="415" y2="185" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="415" y="242" text-anchor="middle" font-style="italic">b</text>
  <line x1="150" y1="225" x2="150" y2="105" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="70" y1="105" x2="150" y2="105" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <circle cx="150" cy="105" r="3.5" fill="#dc2626"/>
  <text x="150" y="242" text-anchor="middle" font-style="italic" font-weight="bold">x₁</text>
  <text x="60" y="110" text-anchor="end" font-style="italic">f(x₁)</text>
  <line x1="365" y1="225" x2="365" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="70" y1="145" x2="365" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <circle cx="365" cy="145" r="3.5" fill="#dc2626"/>
  <text x="365" y="242" text-anchor="middle" font-style="italic" font-weight="bold">x₂</text>
  <text x="60" y="150" text-anchor="end" font-style="italic">f(x₂)</text>
  <!-- Horizontal level comparison -->
  <line x1="125" y1="105" x2="175" y2="105" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="340" y1="145" x2="390" y2="145" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="88" text-anchor="middle" font-size="12px" fill="#dc2626">极小值点 x₁</text>
  <text x="365" y="130" text-anchor="middle" font-size="12px" fill="#dc2626">极大值点 x₂</text>
  <text x="255" y="120" text-anchor="middle" font-size="13px" fill="#0369a1" font-weight="bold">极小值 f(x₁) &gt; 极大值 f(x₂)</text>
</svg>
