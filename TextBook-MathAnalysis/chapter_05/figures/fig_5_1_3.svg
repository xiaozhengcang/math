<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="auto">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>
  <!-- x-axis -->
  <line x1="40" y1="200" x2="430" y2="200" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  
  <!-- Curve f(a) = f(b) with peak at xi -->
  <!-- a=(90, 140), xi=(220, 60), b=(350, 140) -->
  <path d="M 90 140 C 130 50, 310 50, 350 140" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  
  <!-- Dashed vertical lines -->
  <line x1="90" y1="140" x2="90" y2="200" stroke="var(--text-muted, #888)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="220" y1="60" x2="220" y2="200" stroke="var(--text-muted, #888)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="350" y1="140" x2="350" y2="200" stroke="var(--text-muted, #888)" stroke-width="1.2" stroke-dasharray="4 4"/>
  
  <!-- Horizontal tangent line at peak -->
  <line x1="140" y1="60" x2="300" y2="60" stroke="#e53935" stroke-width="1.8" stroke-dasharray="5 4"/>
  
  <!-- Horizontal line between endpoints -->
  <line x1="90" y1="140" x2="350" y2="140" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Points -->
  <circle cx="90" cy="140" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="220" cy="60" r="3.5" fill="#e53935"/>
  <circle cx="350" cy="140" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  
  <!-- Brace or label on right for f(a)=f(b) -->
  <path d="M 360 140 Q 365 140 365 170 Q 365 200 370 200" fill="none" stroke="var(--text-primary, #333)" stroke-width="1"/>
  <text x="365" y="145" font-size="14" font-family="KaTeX_Math, serif" fill="var(--text-primary, #333)">} <tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>)=<tspan font-style="italic">f</tspan>(<tspan font-style="italic">b</tspan>)</text>
  
  <!-- Labels on x-axis -->
  <text x="86" y="220" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">a</text>
  <text x="216" y="220" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">ξ</text>
  <text x="346" y="220" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">b</text>
</svg>