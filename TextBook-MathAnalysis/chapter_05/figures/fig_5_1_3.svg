<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="215" x2="430" y2="215" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <line x1="65" y1="245" x2="65" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <text x="435" y="220" font-style="italic">x</text>
  <text x="53" y="30" font-style="italic">y</text>
  <text x="52" y="230" font-style="italic">O</text>
  <!-- Projections -->
  <line x1="110" y1="215" x2="110" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="350" y1="215" x2="350" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="230" y1="215" x2="230" y2="65" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="65" y1="145" x2="360" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Curve y = f(x) -->
  <path d="M 85 175 C 105 150 110 145 110 145 C 140 75 190 65 230 65 C 270 65 320 75 350 145 C 350 145 355 150 375 175" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="160" y1="65" x2="300" y2="65" stroke="#dc2626" stroke-width="1.8"/>
  <text x="308" y="70" fill="#dc2626" font-size="13px">切线 f'(ξ) = 0</text>
  <circle cx="110" cy="145" r="3.5" fill="#1e40af"/>
  <circle cx="350" cy="145" r="3.5" fill="#1e40af"/>
  <circle cx="230" cy="65" r="3.5" fill="#dc2626"/>
  <text x="110" y="232" text-anchor="middle" font-style="italic">a</text>
  <text x="230" y="232" text-anchor="middle" font-style="italic" font-weight="bold">ξ</text>
  <text x="350" y="232" text-anchor="middle" font-style="italic">b</text>
  <text x="55" y="149" text-anchor="end" font-style="italic">f(a) = f(b)</text>
  <text x="230" y="50" text-anchor="middle" font-style="italic" fill="#1e40af">y = f(x)</text>
</svg>
