<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="260" style="max-width: 460px; display: block; margin: 1.5rem auto;">
  <defs>
    <style>
      .axis { stroke: var(--text-color, #2c3e50); stroke-width: 1.5; marker-end: url(#arrow-g); }
      .curve { fill: none; stroke: var(--primary-color, #2980b9); stroke-width: 2.2; }
      .dashed { stroke: var(--text-color, #2c3e50); stroke-width: 1.2; stroke-dasharray: 5 4; }
      .label { font-family: 'Times New Roman', serif; font-size: 15px; fill: var(--text-color, #2c3e50); }
      .math-italic { font-style: italic; }
    </style>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Axes -->
  <!-- x-axis -->
  <line x1="40" y1="200" x2="430" y2="200" class="axis" />
  <text x="435" y="204" class="label math-italic">x</text>

  <!-- y-axis -->
  <line x1="220" y1="230" x2="220" y2="35" class="axis" />
  <text x="212" y="28" class="label math-italic">y</text>

  <!-- Bell curve: peak at (220, 65), inflection at x=285 (y=114) and x=155 (y=114) -->
  <path d="M 50 198 C 120 197 150 185 175 145 C 195 110 205 65 220 65 C 235 65 245 110 265 145 C 290 185 320 197 390 198" class="curve" />

  <!-- Inflection point dashed lines for x=1 -->
  <!-- x = 285 is x=1 -->
  <line x1="285" y1="200" x2="285" y2="114" class="dashed" />
  <line x1="220" y1="114" x2="285" y2="114" class="dashed" />

  <!-- Labels -->
  <text x="210" y="218" class="label math-italic">O</text>
  <text x="282" y="218" class="label">1</text>
  
  <!-- Peak label on y-axis -->
  <text x="212" y="58" class="label" text-anchor="end">1</text>
  <line x1="190" y1="63" x2="216" y2="63" stroke="currentColor" stroke-width="1" />
  <text x="212" y="77" class="label" text-anchor="end">√2π</text>

  <!-- Inflection value label on y-axis -->
  <text x="212" y="108" class="label" text-anchor="end">1</text>
  <line x1="184" y1="113" x2="216" y2="113" stroke="currentColor" stroke-width="1" />
  <text x="212" y="127" class="label" text-anchor="end">√2πe</text>

  <!-- Equation label -->
  <text x="310" y="70" class="label math-italic">y = </text>
  <text x="345" y="60" class="label">1</text>
  <line x1="335" y1="66" x2="365" y2="66" stroke="currentColor" stroke-width="1" />
  <text x="338" y="80" class="label">√2π</text>
  <text x="368" y="70" class="label math-italic">e</text>
  <text x="376" y="58" class="label" font-size="11px">−x²/2</text>
</svg>
