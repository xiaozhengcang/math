<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="320" style="max-width: 360px; display: block; margin: 1.5rem auto;">
  <defs>
    <style>
      .fig-circle { fill: none; stroke: var(--text-color, #2c3e50); stroke-width: 2; }
      .fig-hex { fill: none; stroke: var(--text-color, #2c3e50); stroke-width: 1.8; }
      .fig-12gon { fill: none; stroke: var(--primary-color, #2980b9); stroke-width: 1.2; stroke-dasharray: none; }
      .fig-spoke { stroke: var(--text-color, #2c3e50); stroke-width: 1.2; }
      .fig-dashed { stroke: var(--secondary-color, #e74c3c); stroke-width: 1.5; stroke-dasharray: 5 4; }
      .fig-mark { stroke: var(--text-color, #2c3e50); stroke-width: 1.5; }
      .fig-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: var(--text-color, #2c3e50); }
    </style>
  </defs>

  <!-- Outer Circle -->
  <circle cx="180" cy="180" r="140" class="fig-circle" />

  <!-- Radii spokes to 6 vertices -->
  <!-- Center (180, 180) -->
  <!-- 0 deg: (320, 180) -->
  <!-- 60 deg: (250, 58.76) -->
  <!-- 120 deg: (110, 58.76) -->
  <!-- 180 deg: (40, 180) -->
  <!-- 240 deg: (110, 301.24) -->
  <!-- 300 deg: (250, 301.24) -->
  <line x1="40" y1="180" x2="320" y2="180" class="fig-spoke" />
  <line x1="180" y1="180" x2="250" y2="58.76" class="fig-spoke" />
  <line x1="180" y1="180" x2="110" y2="58.76" class="fig-spoke" />
  <line x1="180" y1="180" x2="110" y2="301.24" class="fig-spoke" />
  <line x1="180" y1="180" x2="250" y2="301.24" class="fig-spoke" />

  <!-- Inscribed Hexagon (n=6) -->
  <polygon points="320,180 250,58.76 110,58.76 40,180 110,301.24 250,301.24" class="fig-hex" />

  <!-- Inscribed 12-gon (2n=12) chords around perimeter -->
  <!-- Midpoints of 30, 90, 150, 210, 270, 330 deg on circle: -->
  <!-- 30 deg: 180+140*cos(30) = 180+121.24 = 301.24, 180-70 = 110 -->
  <!-- 90 deg: 180, 40 -->
  <!-- 150 deg: 58.76, 110 -->
  <!-- 210 deg: 58.76, 250 -->
  <!-- 270 deg: 180, 320 -->
  <!-- 330 deg: 301.24, 250 -->
  <polyline points="250,58.76 180,40 110,58.76" class="fig-12gon" />
  <polyline points="110,58.76 58.76,110 40,180" class="fig-12gon" />
  <polyline points="40,180 58.76,250 110,301.24" class="fig-12gon" />
  <polyline points="110,301.24 180,320 250,301.24" class="fig-12gon" />
  <polyline points="250,301.24 301.24,250 320,180" class="fig-12gon" />
  <polyline points="320,180 301.24,110 250,58.76" class="fig-12gon" />

  <!-- Dashed vertical bisector radius to (180, 40) -->
  <line x1="180" y1="180" x2="180" y2="40" class="fig-dashed" />

  <!-- Little intersection mark at chord (180, 58.76) -->
  <line x1="175" y1="58.76" x2="185" y2="58.76" class="fig-mark" />

  <!-- Center point -->
  <circle cx="180" cy="180" r="2.5" fill="currentColor" />
</svg>
