<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="210" x2="410" y2="210" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <line x1="70" y1="245" x2="70" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <text x="415" y="215" font-style="italic">x</text>
  <text x="58" y="35" font-style="italic">y</text>
  <text x="56" y="225" font-style="italic">O</text>
  <!-- Neighborhood shading on x-axis -->
  <rect x="155" y="206" width="130" height="8" fill="#e0f2fe" fill-opacity="0.7"/>
  <line x1="155" y1="204" x2="155" y2="216" stroke="#0284c7" stroke-width="1.6"/>
  <line x1="285" y1="204" x2="285" y2="216" stroke="#0284c7" stroke-width="1.6"/>
  <text x="145" y="230" text-anchor="middle" font-style="italic">x₀−δ</text>
  <text x="220" y="230" text-anchor="middle" font-style="italic" font-weight="bold">x₀</text>
  <text x="295" y="230" text-anchor="middle" font-style="italic">x₀+δ</text>
  <!-- Projections and Tangent -->
  <line x1="220" y1="210" x2="220" y2="80" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="70" y1="80" x2="220" y2="80" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="155" y1="210" x2="155" y2="108" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="285" y1="210" x2="285" y2="108" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="60" y="85" text-anchor="end" font-style="italic">f(x₀)</text>
  <line x1="150" y1="80" x2="290" y2="80" stroke="#dc2626" stroke-width="1.8"/>
  <text x="300" y="84" fill="#dc2626" font-size="13px">切线斜率 = 0</text>
  <!-- Curve y = f(x) -->
  <path d="M 100,165 C 150,95 180,80 220,80 C 260,80 290,95 340,165" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <circle cx="220" cy="80" r="3.5" fill="#dc2626"/>
  <text x="345" y="165" fill="#1e40af" font-style="italic" font-weight="bold">y = f(x)</text>
  <text x="220" y="65" text-anchor="middle" font-size="13px" fill="#1e40af">极大值点 (x₀, f(x₀))</text>
</svg>
