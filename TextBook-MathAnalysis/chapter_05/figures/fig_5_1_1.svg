<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>
  <!-- x-axis -->
  <line x1="40" y1="190" x2="360" y2="190" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="210" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x</text>
  
  <!-- Curve y = f(x) with local maximum at x0 -->
  <path d="M 100 150 C 140 60, 260 60, 300 150" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  
  <!-- Dashed vertical line to x0 -->
  <line x1="200" y1="78" x2="200" y2="190" stroke="var(--text-muted, #888)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="200" cy="78" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  
  <!-- Label x0 -->
  <line x1="200" y1="187" x2="200" y2="193" stroke="var(--text-primary, #333)" stroke-width="1.5"/>
  <text x="193" y="210" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x<tspan font-size="10" dy="3">0</tspan></text>
</svg>