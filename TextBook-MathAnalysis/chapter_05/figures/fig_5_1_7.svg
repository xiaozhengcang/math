<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="45" y1="230" x2="435" y2="230" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <line x1="75" y1="260" x2="75" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <text x="440" y="235" font-style="italic">x</text>
  <text x="63" y="35" font-style="italic">y</text>
  <text x="60" y="245" font-style="italic">O</text>
  <!-- Secant Chord -->
  <line x1="90" y1="187" x2="370" y2="93" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- Parametric Curve (g(t), f(t)) -->
  <path d="M 110 180 C 145 95 185 85 220 85 C 265 85 315 90 350 100" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="160" y1="105" x2="280" y2="65" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="220" cy="85" r="3.5" fill="#dc2626"/>
  <text x="288" y="68" fill="#dc2626" font-size="13px">切线斜率 = f'(ξ)/g'(ξ)</text>
  <circle cx="110" cy="180" r="3.5" fill="#1e40af"/>
  <circle cx="350" cy="100" r="3.5" fill="#1e40af"/>
  <text x="115" y="200" font-size="13px" fill="#1e40af">(g(a), f(a))</text>
  <text x="355" y="115" font-size="13px" fill="#1e40af">(g(b), f(b))</text>
  <text x="220" y="70" text-anchor="middle" font-size="13px" fill="#dc2626">(g(ξ), f(ξ))</text>
</svg>
