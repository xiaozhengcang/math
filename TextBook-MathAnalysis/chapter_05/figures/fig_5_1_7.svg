<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="auto">
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="230" x2="420" y2="230" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <text x="415" y="248" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x</text>
  
  <line x1="70" y1="260" x2="70" y2="40" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <text x="55" y="45" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="55" y="245" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">O</text>
  
  <!-- Parametric Curve from (g(a), f(a)) to (g(b), f(b)) -->
  <!-- A = (100, 190), B = (310, 110) -->
  <path d="M 100 190 C 130 90, 250 80, 310 110" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  
  <!-- Dashed secant line AB -->
  <line x1="100" y1="190" x2="310" y2="110" stroke="var(--text-muted, #777)" stroke-width="1.5" stroke-dasharray="5 4"/>
  
  <!-- Solid tangent line parallel to AB at contact point -->
  <!-- Contact approx at (190, 93) -->
  <line x1="110" y1="124" x2="280" y2="59" stroke="#e53935" stroke-width="1.8"/>
  
  <!-- Points -->
  <circle cx="100" cy="190" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="310" cy="110" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="190" cy="93" r="3.5" fill="#e53935"/>
  
  <!-- Labels -->
  <text x="105" y="205" font-size="13" font-family="KaTeX_Math, serif" fill="var(--text-primary, #333)">(<tspan font-style="italic">g</tspan>(<tspan font-style="italic">a</tspan>), <tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>))</text>
  <text x="320" y="115" font-size="13" font-family="KaTeX_Math, serif" fill="var(--text-primary, #333)">(<tspan font-style="italic">g</tspan>(<tspan font-style="italic">b</tspan>), <tspan font-style="italic">f</tspan>(<tspan font-style="italic">b</tspan>))</text>
</svg>