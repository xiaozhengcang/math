<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="320" style="max-width: 320px; display: block; margin: 1.5rem auto;">
  <defs>
    <style>
      .can-stroke { fill: none; stroke: var(--text-color, #2c3e50); stroke-width: 1.5; }
      .can-fill { fill: var(--bg-card, #ecf0f1); stroke: var(--text-color, #2c3e50); stroke-width: 1.5; }
      .dim-line { stroke: var(--text-color, #2c3e50); stroke-width: 1; marker-end: url(#arrow); marker-start: url(#arrow-rev); }
      .text-label { font-family: 'Times New Roman', serif; font-size: 16px; font-style: italic; fill: var(--text-color, #2c3e50); text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor" />
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Can body & lid -->
  <g transform="translate(40, 20)">
    <!-- Top rim/lid -->
    <ellipse cx="90" cy="40" rx="42" ry="12" class="can-fill" />
    
    <!-- Ribbed neck -->
    <path d="M 48 40 L 40 58 C 40 68 140 68 140 58 L 132 40" class="can-stroke" />
    <!-- ribs on neck -->
    <line x1="45" y1="46" x2="42" y2="57" class="can-stroke" stroke-width="0.8" />
    <line x1="55" y1="49" x2="52" y2="61" class="can-stroke" stroke-width="0.8" />
    <line x1="68" y1="51" x2="66" y2="63" class="can-stroke" stroke-width="0.8" />
    <line x1="82" y1="52" x2="81" y2="64" class="can-stroke" stroke-width="0.8" />
    <line x1="98" y1="52" x2="99" y2="64" class="can-stroke" stroke-width="0.8" />
    <line x1="112" y1="51" x2="114" y2="63" class="can-stroke" stroke-width="0.8" />
    <line x1="125" y1="49" x2="128" y2="61" class="can-stroke" stroke-width="0.8" />
    <line x1="135" y1="46" x2="138" y2="57" class="can-stroke" stroke-width="0.8" />

    <!-- Main Cylinder Body -->
    <path d="M 40 58 L 40 210 C 40 226 140 226 140 210 L 140 58" class="can-stroke" />
    <!-- Bottom Ellipse Outline -->
    <path d="M 40 210 C 40 226 140 226 140 210" class="can-stroke" />

    <!-- Subtle vertical reflection lines -->
    <line x1="48" y1="68" x2="48" y2="195" stroke="currentColor" stroke-width="0.8" opacity="0.5" />
    <line x1="54" y1="78" x2="54" y2="185" stroke="currentColor" stroke-width="0.6" opacity="0.4" />
    <line x1="126" y1="72" x2="126" y2="190" stroke="currentColor" stroke-width="0.8" opacity="0.5" />
    <line x1="132" y1="82" x2="132" y2="175" stroke="currentColor" stroke-width="0.6" opacity="0.4" />

    <!-- Height dimension h on the right -->
    <line x1="140" y1="40" x2="185" y2="40" stroke="currentColor" stroke-width="0.8" />
    <line x1="140" y1="218" x2="185" y2="218" stroke="currentColor" stroke-width="0.8" />
    <line x1="165" y1="45" x2="165" y2="213" class="dim-line" />
    <text x="165" y="135" class="text-label" dx="15">h</text>

    <!-- Diameter dimension 2r at the bottom -->
    <line x1="40" y1="218" x2="40" y2="265" stroke="currentColor" stroke-width="0.8" />
    <line x1="140" y1="218" x2="140" y2="265" stroke="currentColor" stroke-width="0.8" />
    <line x1="45" y1="250" x2="135" y2="250" class="dim-line" />
    <text x="90" y="246" class="text-label" dy="-4">2r</text>
  </g>
</svg>
