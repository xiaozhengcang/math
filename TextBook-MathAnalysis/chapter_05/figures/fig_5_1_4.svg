<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="auto">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>
  <!-- Original Axes x, y -->
  <line x1="80" y1="240" x2="420" y2="240" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="415" y="258" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x</text>
  
  <line x1="160" y1="270" x2="160" y2="40" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <text x="145" y="45" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="145" y="255" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">O</text>
  
  <!-- Rotated Axes x', y' rotated by ~30 deg -->
  <line x1="80" y1="240" x2="390" y2="90" stroke="var(--text-muted, #777)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow4)"/>
  <text x="395" y="95" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-muted, #777)">x'</text>
  
  <line x1="160" y1="240" x2="60" y2="70" stroke="var(--text-muted, #777)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow4)"/>
  <text x="45" y="75" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-muted, #777)">y'</text>
  
  <!-- Curve y = f(x) -->
  <!-- A = (200, 180), B = (340, 110) -->
  <path d="M 200 180 C 230 70, 310 60, 340 110" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  
  <!-- Secant line AB parallel to x' -->
  <line x1="180" y1="190" x2="360" y2="100" stroke="var(--text-primary, #333)" stroke-width="1"/>
  
  <!-- Tangent line parallel to secant at peak -->
  <!-- Peak contact at approx (255, 87) -->
  <line x1="180" y1="124" x2="330" y2="49" stroke="#e53935" stroke-width="1.8"/>
  
  <!-- Vertical dashed line to xi -->
  <line x1="255" y1="87" x2="255" y2="240" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="250" y="258" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">ξ</text>
  
  <!-- Dashed perpendicular to x' at eta -->
  <line x1="255" y1="87" x2="293" y2="136" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="150" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-muted, #777)">η</text>
  
  <circle cx="200" cy="180" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="340" cy="110" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="255" cy="87" r="3.5" fill="#e53935"/>
</svg>