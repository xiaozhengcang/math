<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" width="100%" height="auto" style="max-width:480px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Original Axes xOy -->
  <line x1="45" y1="250" x2="445" y2="250" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <line x1="75" y1="285" x2="75" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <text x="450" y="255" font-style="italic">x</text>
  <text x="63" y="35" font-style="italic">y</text>
  <text x="60" y="265" font-style="italic">O</text>
  <!-- Secant chord AB -->
  <line x1="125" y1="203" x2="385" y2="99" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <!-- Rotated Axes x'Oy' -->
  <line x1="75" y1="250" x2="435" y2="106" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr5)"/>
  <text x="440" y="112" font-style="italic" fill="#475569">x'</text>
  <line x1="75" y1="250" x2="20" y2="112.5" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr5)"/>
  <text x="10" y="115" font-style="italic" fill="#475569">y'</text>
  <path d="M 88,244.8 L 82.8,231.8 L 69.8,237" fill="none" stroke="#475569" stroke-width="1"/>
  <!-- Curve y = f(x) -->
  <path d="M 145 195 C 175 110, 220 92, 255 92 C 290 92, 335 100, 365 107" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="185" y1="120" x2="325" y2="64" stroke="#dc2626" stroke-width="1.8"/>
  <text x="330" y="65" fill="#dc2626" font-size="13px">切线平行于 AB 及 x' 轴</text>
  <!-- Projections -->
  <line x1="145" y1="250" x2="145" y2="195" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="365" y1="250" x2="365" y2="107" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="255" y1="250" x2="255" y2="92" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="255" y1="92" x2="285" y2="166" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="285" cy="166" r="2.5" fill="#475569"/>
  <text x="290" y="180" font-style="italic" fill="#475569">η</text>
  <circle cx="145" cy="195" r="3.5" fill="#1e40af"/>
  <circle cx="365" cy="107" r="3.5" fill="#1e40af"/>
  <circle cx="255" cy="92" r="3.5" fill="#dc2626"/>
  <text x="135" y="190" font-style="italic" fill="#1e40af">A</text>
  <text x="375" y="105" font-style="italic" fill="#1e40af">B</text>
  <text x="145" y="265" text-anchor="middle" font-style="italic">a</text>
  <text x="255" y="265" text-anchor="middle" font-style="italic" font-weight="bold">ξ</text>
  <text x="365" y="265" text-anchor="middle" font-style="italic">b</text>
</svg>
