<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="220" x2="410" y2="220" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <line x1="70" y1="260" x2="70" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr5)"/>
  <text x="415" y="225" font-style="italic">x</text>
  <text x="58" y="35" font-style="italic">y</text>
  <text x="56" y="235" font-style="italic">O</text>
  <path d="M 120 235 C 135 228 145 222 150 220 C 180 205 260 140 350 50" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <text x="355" y="55" font-style="italic" font-weight="bold" fill="#1e40af">y = f(x)</text>
  <circle cx="150" cy="220" r="3.5" fill="#1e293b"/>
  <text x="145" y="238" font-style="italic" font-weight="bold">x*</text>
  <!-- Secant 1 through (x0, f(x0)) and (x1, f(x1)) -->
  <line x1="355" y1="46" x2="160" y2="229" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="340" cy="60" r="3.5" fill="#1e40af"/>
  <circle cx="260" cy="135" r="3.5" fill="#1e40af"/>
  <circle cx="170" cy="220" r="3.5" fill="#dc2626"/>
  <line x1="340" y1="220" x2="340" y2="60" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="260" y1="220" x2="260" y2="135" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="340" y="238" text-anchor="middle" font-style="italic">x₀</text>
  <text x="260" y="238" text-anchor="middle" font-style="italic">x₁</text>
  <text x="170" y="238" text-anchor="middle" font-style="italic" font-weight="bold" fill="#dc2626">x₂</text>
  <text x="260" y="275" text-anchor="middle" font-size="13px" fill="#1e293b">割线法迭代式：xₖ₊₁ = xₖ − f(xₖ)(xₖ − xₖ₋₁)/[f(xₖ) − f(xₖ₋₁)]</text>
</svg>
