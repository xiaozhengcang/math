<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="auto">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--text-primary, #333)"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="220" x2="420" y2="220" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="415" y="238" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x</text>
  
  <line x1="70" y1="250" x2="70" y2="30" stroke="var(--text-primary, #333)" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <text x="55" y="35" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">y</text>
  <text x="55" y="235" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">O</text>
  
  <!-- Convex curve (curving upward) -->
  <!-- x1=120, x_lambda=210, x2=320 -->
  <path d="M 90 175 C 130 170, 240 160, 340 50" fill="none" stroke="var(--primary-accent, #1a73e8)" stroke-width="2.5"/>
  
  <!-- Secant chord connecting (120, 168) and (320, 75) -->
  <line x1="120" y1="168" x2="320" y2="75" stroke="var(--text-primary, #333)" stroke-width="1.8"/>
  
  <!-- Dashed lines -->
  <line x1="120" y1="168" x2="120" y2="220" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="210" y1="126" x2="210" y2="220" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="320" y1="75" x2="320" y2="220" stroke="var(--text-muted, #888)" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Points -->
  <circle cx="120" cy="168" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="320" cy="75" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  <circle cx="210" cy="126" r="3.5" fill="#e53935"/>
  <circle cx="210" cy="153" r="3.5" fill="var(--primary-accent, #1a73e8)"/>
  
  <!-- Labels -->
  <text x="215" y="120" font-size="12" font-family="KaTeX_Math, serif" fill="var(--text-primary, #333)">λf(x<tspan font-size="9" dy="2">1</tspan>) + (1-λ)f(x<tspan font-size="9" dy="2">2</tspan>)</text>
  <text x="218" y="160" font-size="12" font-family="KaTeX_Math, serif" fill="var(--primary-accent, #1a73e8)">f(λx<tspan font-size="9" dy="2">1</tspan> + (1-λ)x<tspan font-size="9" dy="2">2</tspan>)</text>
  
  <text x="113" y="238" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x<tspan font-size="10" dy="3">1</tspan></text>
  <text x="175" y="238" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">λx<tspan font-size="10" dy="2">1</tspan> + (1-λ)x<tspan font-size="10" dy="2">2</tspan></text>
  <text x="313" y="238" font-size="14" font-family="KaTeX_Math, serif" font-style="italic" fill="var(--text-primary, #333)">x<tspan font-size="10" dy="3">2</tspan></text>
</svg>