<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="260" style="max-width: 380px; display: block; margin: 1.5rem auto;">
  <defs>
    <style>
      .axis { stroke: var(--text-color, #2c3e50); stroke-width: 1.5; marker-end: url(#arrow-61); }
      .curve { fill: none; stroke: var(--primary-color, #2980b9); stroke-width: 2.2; }
      .tangent { stroke: var(--secondary-color, #e74c3c); stroke-width: 1.4; }
      .dashed { stroke: var(--text-color, #2c3e50); stroke-width: 1.2; stroke-dasharray: 5 4; }
      .label { font-family: 'Times New Roman', serif; font-size: 15px; fill: var(--text-color, #2c3e50); }
      .math-italic { font-style: italic; }
    </style>
    <marker id="arrow-61" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="40" y1="200" x2="360" y2="200" class="axis" />
  <text x="355" y="218" class="label math-italic">x</text>

  <line x1="90" y1="235" x2="90" y2="35" class="axis" />
  <text x="80" y="38" class="label math-italic">y</text>
  <text x="75" y="215" class="label math-italic">O</text>

  <!-- Curve: y = f(x), convex and increasing -->
  <path d="M 80 230 C 110 215 135 200 160 175 C 190 145 230 100 275 45" class="curve" />
  <text x="275" y="40" class="label math-italic">y = f(x)</text>

  <!-- Point x_{k-1} = 265, curve y ~ 60 -->
  <line x1="265" y1="200" x2="265" y2="60" class="dashed" />
  <!-- Tangent from (265, 60) to (225, 200) (slope = -140/40 = -3.5) -->
  <line x1="265" y1="60" x2="225" y2="200" class="tangent" />

  <!-- Point x_k = 225, curve y ~ 118 -->
  <line x1="225" y1="200" x2="225" y2="118" class="dashed" />
  <!-- Tangent from (225, 118) to (180, 200) -->
  <line x1="225" y1="118" x2="180" y2="200" class="tangent" />

  <!-- Ticks and labels on x-axis -->
  <!-- x^* root at 145 -->
  <text x="145" y="218" class="label math-italic" text-anchor="middle">x*</text>
  <!-- x_{k+1} at 180 -->
  <text x="180" y="218" class="label math-italic" text-anchor="middle">x<tspan font-size="11px" dy="3">k+1</tspan></text>
  <!-- x_k at 225 -->
  <text x="225" y="218" class="label math-italic" text-anchor="middle" dx="5">x<tspan font-size="11px" dy="3">k</tspan></text>
  <!-- x_{k-1} at 265 -->
  <text x="265" y="218" class="label math-italic" text-anchor="middle" dx="8">x<tspan font-size="11px" dy="3">k−1</tspan></text>
</svg>
