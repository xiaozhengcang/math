<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="320" style="max-width: 460px; display: block; margin: 1.5rem auto;">
  <defs>
    <style>
      .axis { stroke: var(--text-color, #2c3e50); stroke-width: 1.5; marker-end: url(#arrow-5); }
      .curve { fill: none; stroke: var(--primary-color, #2980b9); stroke-width: 2.2; }
      .asymptote { stroke: var(--secondary-color, #e74c3c); stroke-width: 1.2; stroke-dasharray: 6 4; }
      .label { font-family: 'Times New Roman', serif; font-size: 15px; fill: var(--text-color, #2c3e50); }
      .math-italic { font-style: italic; }
    </style>
    <marker id="arrow-5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Axes -->
  <!-- x-axis -->
  <line x1="40" y1="200" x2="430" y2="200" class="axis" />
  <text x="435" y="204" class="label math-italic">x</text>

  <!-- y-axis -->
  <line x1="200" y1="330" x2="200" y2="35" class="axis" />
  <text x="192" y="28" class="label math-italic">y</text>

  <!-- Oblique Asymptote y = x - 1/3 -->
  <!-- passing through (200, 220) with slope -1 in SVG (45 deg) -->
  <line x1="70" y1="345" x2="380" y2="45" class="asymptote" />
  <text x="310" y="50" class="label math-italic">y = x − </text>
  <text x="358" y="42" class="label">1</text>
  <line x1="354" y1="47" x2="366" y2="47" stroke="currentColor" stroke-width="1" />
  <text x="358" y="58" class="label">3</text>

  <!-- Curve: y = cbrt(x^3 - x^2 - x + 1) -->
  <!-- Left branch: from (75, 335) through (-1, 0) at (140, 200), max at (180, 140), y-intercept (200, 145), down to cusp (260, 200) -->
  <path d="M 75 335 C 105 300 132 245 140 200 C 145 165 160 140 180 140 C 190 140 198 142 200 145 C 215 160 248 185 260 200" class="curve" />

  <!-- Right branch: from cusp (260, 200) rising up to asymptotic line -->
  <path d="M 260 200 C 270 170 300 130 380 70" class="curve" />

  <!-- Ticks & Labels -->
  <!-- Origin -->
  <text x="188" y="216" class="label math-italic">O</text>

  <!-- Point 1 on x-axis (cusp) -->
  <text x="257" y="218" class="label">1</text>

  <!-- Point 1 on y-axis -->
  <line x1="196" y1="145" x2="204" y2="145" stroke="currentColor" stroke-width="1.2" />
  <text x="208" y="142" class="label">1</text>

  <!-- Curve equation label -->
  <text x="60" y="145" class="label math-italic">y = </text>
  <text x="80" y="145" class="label">³√(x³ − x² − x + 1)</text>
</svg>
