<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Baseline -->
  <line x1="40" y1="170" x2="380" y2="170" stroke="#1e293b" stroke-width="2"/>
  <text x="385" y="174" font-size="13px">基线 L</text>
  <!-- Cables MA and MB -->
  <line x1="180" y1="170" x2="90" y2="60" stroke="#0284c7" stroke-width="2.2"/>
  <line x1="180" y1="170" x2="310" y2="80" stroke="#0284c7" stroke-width="2.2"/>
  <line x1="90" y1="60" x2="90" y2="170" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="310" y1="80" x2="310" y2="170" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <path d="M 90 158 L 102 158 L 102 170" fill="none" stroke="#64748b" stroke-width="1"/>
  <path d="M 310 158 L 298 158 L 298 170" fill="none" stroke="#64748b" stroke-width="1"/>
  <circle cx="90" cy="60" r="4" fill="#1e293b"/>
  <circle cx="310" cy="80" r="4" fill="#1e293b"/>
  <circle cx="180" cy="170" r="4.5" fill="#dc2626"/>
  <path d="M 145 170 A 35 35 0 0 1 158 143" fill="none" stroke="#dc2626" stroke-width="1.4"/>
  <text x="140" y="155" font-style="italic" fill="#dc2626">α</text>
  <path d="M 215 170 A 35 35 0 0 0 209 150" fill="none" stroke="#dc2626" stroke-width="1.4"/>
  <text x="225" y="155" font-style="italic" fill="#dc2626">β</text>
  <text x="80" y="55" font-style="italic" font-weight="bold">A</text>
  <text x="320" y="78" font-style="italic" font-weight="bold">B</text>
  <text x="180" y="195" text-anchor="middle" font-style="italic" font-weight="bold" fill="#dc2626">M (变电站)</text>
  <text x="120" y="105" font-size="12px" fill="#0284c7">单价 a 元/km</text>
  <text x="255" y="115" font-size="12px" fill="#0284c7">单价 b 元/km</text>
  <text x="210" y="225" text-anchor="middle" font-size="13px" fill="#1e293b">平衡条件：a cos α = b cos β</text>
</svg>
