<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="320" style="max-width: 360px; display: block; margin: 1.5rem auto;">
  <defs>
    <style>
      .box-line { fill: none; stroke: var(--text-color, #2c3e50); stroke-width: 1.5; }
      .grass-bg { fill: rgba(46, 204, 113, 0.15); stroke: var(--text-color, #2c3e50); stroke-width: 1.5; }
      .path-line { fill: none; stroke: var(--text-color, #2c3e50); stroke-width: 2; }
      .dashed-line { fill: none; stroke: var(--text-color, #2c3e50); stroke-width: 1.2; stroke-dasharray: 5 4; }
      .dim-line { stroke: var(--text-color, #2c3e50); stroke-width: 1; marker-end: url(#arr); marker-start: url(#arr-rev); }
      .text-math { font-family: 'Times New Roman', serif; font-size: 15px; font-style: italic; fill: var(--text-color, #2c3e50); }
      .text-zh { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14px; fill: var(--text-color, #2c3e50); text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor" />
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- Plain region (top) -->
  <rect x="60" y="40" width="180" height="110" fill="none" class="box-line" />
  <text x="150" y="75" class="text-zh">平原</text>

  <!-- Grassland region (bottom) -->
  <rect x="60" y="150" width="180" height="110" class="grass-bg" />
  <text x="120" y="210" class="text-zh">草原</text>

  <!-- Normal dashed line at x = 180 -->
  <line x1="180" y1="40" x2="180" y2="260" class="dashed-line" />

  <!-- Trajectory A(60, 40) -> M(180, 150) -> B(240, 260) -->
  <polyline points="60,40 180,150 225,260" class="path-line" />

  <!-- Dots at A, B -->
  <circle cx="60" cy="40" r="4" fill="currentColor" />
  <text x="45" y="38" class="text-math">A</text>
  <circle cx="225" cy="260" r="4" fill="currentColor" />
  <text x="232" y="275" class="text-math">B</text>

  <!-- Angle arcs -->
  <!-- Upper angle theta1 at (180, 150) from line to vertical (dx=-120, dy=-110, angle ~ 47.5 deg) -->
  <path d="M 165 136 A 22 22 0 0 1 180 128" fill="none" stroke="currentColor" stroke-width="1" />
  <text x="174" y="125" class="text-math" font-size="13px" text-anchor="end">θ₁</text>

  <!-- Lower angle theta2 at (180, 150) from vertical to line (dx=45, dy=110, angle ~ 22 deg) -->
  <path d="M 180 172 A 22 22 0 0 0 189 170" fill="none" stroke="currentColor" stroke-width="1" />
  <text x="195" y="180" class="text-math" font-size="13px">θ₂</text>

  <!-- Dimension x at top -->
  <line x1="60" y1="40" x2="60" y2="22" stroke="currentColor" stroke-width="0.8" />
  <line x1="180" y1="40" x2="180" y2="22" stroke="currentColor" stroke-width="0.8" />
  <line x1="65" y1="28" x2="175" y2="28" class="dim-line" />
  <text x="120" y="24" class="text-math" text-anchor="middle">x</text>

  <!-- Dimension l at bottom -->
  <line x1="60" y1="260" x2="60" y2="288" stroke="currentColor" stroke-width="0.8" />
  <line x1="225" y1="260" x2="225" y2="288" stroke="currentColor" stroke-width="0.8" />
  <line x1="65" y1="280" x2="220" y2="280" class="dim-line" />
  <text x="142" y="295" class="text-math" text-anchor="middle">l</text>

  <!-- Dimension h1 on right -->
  <line x1="240" y1="40" x2="270" y2="40" stroke="currentColor" stroke-width="0.8" />
  <line x1="240" y1="150" x2="270" y2="150" stroke="currentColor" stroke-width="0.8" />
  <line x1="260" y1="45" x2="260" y2="145" class="dim-line" />
  <text x="265" y="98" class="text-math" dx="5">h₁</text>

  <!-- Dimension h2 on right -->
  <line x1="240" y1="260" x2="270" y2="260" stroke="currentColor" stroke-width="0.8" />
  <line x1="260" y1="155" x2="260" y2="255" class="dim-line" />
  <text x="265" y="210" class="text-math" dx="5">h₂</text>
</svg>
