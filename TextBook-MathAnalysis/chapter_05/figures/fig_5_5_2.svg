<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr5_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr5_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Medium Interface -->
  <rect x="30" y="30" width="400" height="120" fill="#f8fafc"/>
  <rect x="30" y="150" width="400" height="120" fill="#e0f2fe" fill-opacity="0.5"/>
  <line x1="30" y1="150" x2="430" y2="150" stroke="#1e293b" stroke-width="1.6"/>
  <text x="390" y="140" font-size="13px" fill="#64748b">介质 1 (v₁)</text>
  <text x="390" y="170" font-size="13px" fill="#0284c7">介质 2 (v₂)</text>
  <!-- Normal line -->
  <line x1="200" y1="45" x2="200" y2="255" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Light Path -->
  <line x1="90" y1="70" x2="200" y2="150" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr5_red)"/>
  <line x1="200" y1="150" x2="330" y2="230" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr5_red)"/>
  <circle cx="90" cy="70" r="3.5" fill="#1e293b"/>
  <circle cx="200" cy="150" r="3.5" fill="#dc2626"/>
  <circle cx="330" cy="230" r="3.5" fill="#1e293b"/>
  <!-- Angles theta1, theta2 -->
  <path d="M 200 115 A 35 35 0 0 0 174 131" fill="none" stroke="#1e293b" stroke-width="1.3"/>
  <text x="182" y="125" font-style="italic" font-size="13px">θ₁</text>
  <path d="M 200 185 A 35 35 0 0 0 223 164" fill="none" stroke="#1e293b" stroke-width="1.3"/>
  <text x="210" y="180" font-style="italic" font-size="13px">θ₂</text>
  <line x1="90" y1="70" x2="90" y2="150" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="150" x2="330" y2="230" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="75" y="115" font-style="italic">h₁</text>
  <text x="340" y="195" font-style="italic">h₂</text>
  <text x="80" y="65" font-style="italic" font-weight="bold">A</text>
  <text x="340" y="235" font-style="italic" font-weight="bold">B</text>
  <text x="200" y="142" text-anchor="middle" font-style="italic" font-weight="bold" fill="#dc2626">P</text>
  <text x="145" y="165" text-anchor="middle" font-style="italic">x₀</text>
  <text x="265" y="165" text-anchor="middle" font-style="italic">l − x₀</text>
</svg>
