    <line x1="180" y1="140" x2="180" y2="196" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="90" cy="84" r="3.5" fill="#dc2626"/>
    <circle cx="180" cy="196" r="3.5" fill="#dc2626"/>
    <circle cx="90" cy="140" r="3" fill="#1e293b"/>
