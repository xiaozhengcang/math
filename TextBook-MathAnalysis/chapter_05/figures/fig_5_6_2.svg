<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="100%" height="240" style="max-width: 540px; display: block; margin: 1.5rem auto;">
  <defs>
    <style>
      .axis { stroke: var(--text-color, #2c3e50); stroke-width: 1.5; marker-end: url(#arrow-62); }
      .curve { fill: none; stroke: var(--primary-color, #2980b9); stroke-width: 2; }
      .tangent { stroke: var(--secondary-color, #e74c3c); stroke-width: 1.2; }
      .dashed { stroke: var(--text-color, #2c3e50); stroke-width: 1.2; stroke-dasharray: 4 3; }
      .label { font-family: 'Times New Roman', serif; font-size: 14px; fill: var(--text-color, #2c3e50); }
      .math-italic { font-style: italic; }
      .subcap { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: var(--text-color, #2c3e50); text-anchor: middle; }
    </style>
    <marker id="arrow-62" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- (a) Local extremum cycling -->
  <g transform="translate(10, 0)">
    <line x1="30" y1="170" x2="230" y2="170" class="axis" />
    <!-- U-curve opening upwards with minimum below x-axis -->
    <path d="M 50 80 C 75 140 90 190 130 190 C 170 190 185 140 210 80" class="curve" />

    <!-- x_{2k} = 95, x_{2k+1} = 165 -->
    <!-- Point on curve: (95, 160), (165, 160) -->
    <line x1="95" y1="170" x2="95" y2="160" class="dashed" />
    <line x1="165" y1="170" x2="165" y2="160" class="dashed" />

    <!-- Tangent at (95, 160) hits (165, 170) -->
    <line x1="60" y1="155" x2="175" y2="171" class="tangent" />
    <!-- Tangent at (165, 160) hits (95, 170) -->
    <line x1="200" y1="155" x2="85" y2="171" class="tangent" />

    <text x="95" y="188" class="label math-italic" text-anchor="middle">x<tspan font-size="10px" dy="3">2k</tspan></text>
    <text x="165" y="188" class="label math-italic" text-anchor="middle">x<tspan font-size="10px" dy="3">2k+1</tspan></text>
    <text x="130" y="225" class="subcap">(a)</text>
  </g>

  <!-- (b) Inflection point cycling -->
  <g transform="translate(260, 0)">
    <line x1="30" y1="120" x2="230" y2="120" class="axis" />
    <!-- S-curve (cubic-like) inflection at (130, 120) -->
    <path d="M 45 180 C 85 180 110 160 130 120 C 150 80 175 60 215 60" class="curve" />

    <!-- x_{2k} = 90, curve y ~ 168 -->
    <!-- x_{2k+1} = 170, curve y ~ 72 -->
    <line x1="90" y1="120" x2="90" y2="168" class="dashed" />
    <line x1="170" y1="120" x2="170" y2="72" class="dashed" />

    <!-- Tangent at (90, 168) hits (170, 120) -->
    <line x1="60" y1="186" x2="190" y2="108" class="tangent" />
    <!-- Tangent at (170, 72) hits (90, 120) -->
    <line x1="200" y1="54" x2="70" y2="132" class="tangent" />

    <text x="82" y="112" class="label math-italic" text-anchor="middle">x<tspan font-size="10px" dy="3">2k</tspan></text>
    <text x="182" y="112" class="label math-italic" text-anchor="middle">x<tspan font-size="10px" dy="3">2k+1</tspan></text>
    <text x="130" y="225" class="subcap">(b)</text>
  </g>
</svg>
