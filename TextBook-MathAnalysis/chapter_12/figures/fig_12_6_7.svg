<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="210" x2="390" y2="210" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="60" y1="240" x2="60" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="395" y="214" font-style="italic">X = ln x</text>
  <text x="48" y="30" font-style="italic">Y = ln y</text>
  <!-- Linearized Fit Line -->
  <line x1="70" y1="195" x2="375" y2="45" stroke="#1e40af" stroke-width="2.2"/>
  <text x="340" y="40" font-style="italic" fill="#1e40af" font-weight="bold">Y = aX + b</text>
  <circle cx="90" cy="180" r="3.5" fill="#dc2626"/>
  <circle cx="130" cy="155" r="3.5" fill="#dc2626"/>
  <circle cx="175" cy="140" r="3.5" fill="#dc2626"/>
  <circle cx="220" cy="120" r="3.5" fill="#dc2626"/>
  <circle cx="265" cy="100" r="3.5" fill="#dc2626"/>
  <circle cx="310" cy="80" r="3.5" fill="#dc2626"/>
  <circle cx="355" cy="60" r="3.5" fill="#dc2626"/>
  <text x="210" y="245" text-anchor="middle" font-size="13px" fill="#1e293b">变量替换对数线性化：将非线性幂律/指数模型转化为直线拟合</text>
</svg>
