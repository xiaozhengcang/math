<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Trapezoidal Gutter -->
  <polygon points="120,120.7 160,190 280,190 320,120.7" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="2.5"/>
  <line x1="120" y1="120.7" x2="320" y2="120.7" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="160" y1="210" x2="280" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="220" y="226" text-anchor="middle" font-style="italic" font-size="14px">b</text>
  <line x1="110" y1="126" x2="150" y2="195" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr_red)" marker-start="url(#arr_red)"/>
  <text x="120" y="170" font-style="italic" font-size="14px" fill="#dc2626">a</text>
  <line x1="160" y1="120.7" x2="160" y2="190" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="168" y="160" font-style="italic" font-size="13px" fill="#64748b">h</text>
  <line x1="100" y1="190" x2="160" y2="190" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 135 190 A 25 25 0 0 1 147.5 168.3" fill="none" stroke="#dc2626" stroke-width="1.4"/>
  <text x="130" y="180" font-style="italic" fill="#dc2626">θ</text>
  <text x="220" y="80" text-anchor="middle" font-size="13px" fill="#1e40af" font-weight="bold">截面积 A(θ) = (b + a cos θ) a sin θ</text>
  <text x="220" y="250" text-anchor="middle" font-size="13px" fill="#1e293b">当 θ = 60° (等边梯形) 时容水量最大</text>
</svg>
