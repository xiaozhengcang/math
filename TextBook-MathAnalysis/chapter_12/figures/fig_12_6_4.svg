<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="50" y1="230" x2="380" y2="230" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="80" y1="265" x2="80" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="385" y="234" font-style="italic">x</text>
  <text x="68" y="35" font-style="italic">y</text>
  <text x="66" y="246" font-style="italic">O</text>
  <!-- Triangular Domain D -->
  <polygon points="80,230 240,230 80,70" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="2.2"/>
  <text x="133.33333333333334" y="176.66666666666666" font-style="italic" font-size="18px" fill="#0284c7" font-weight="bold">D</text>
  <text x="170.0" y="150.0" font-size="13px" fill="#1e40af">x + y = 1</text>
  <circle cx="133.3" cy="176.7" r="4" fill="#dc2626"/>
  <text x="141.3" y="180.7" font-size="12px" fill="#dc2626" font-weight="bold">驻点 (1/3, 1/3)</text>
  <circle cx="240" cy="230" r="3.5" fill="#1e293b"/>
  <circle cx="80" cy="70" r="3.5" fill="#1e293b"/>
  <text x="240" y="246" text-anchor="middle" font-weight="bold">1</text>
  <text x="72" y="74" text-anchor="end" font-weight="bold">1</text>
  <text x="210" y="280" text-anchor="middle" font-size="13px" fill="#1e293b">闭区域上最值求解：比较内部驻点值与三条边界上的最值</text>
