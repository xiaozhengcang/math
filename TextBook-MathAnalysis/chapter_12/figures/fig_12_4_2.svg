<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="240" x2="430" y2="240" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="70" y1="270" x2="70" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="435" y="244" font-style="italic">x</text>
  <text x="58" y="30" font-style="italic">y</text>
  <text x="56" y="256" font-style="italic">O</text>
  <!-- Neighborhood Box -->
  <rect x="150" y="70" width="160" height="120" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,4"/>
  <text x="230" y="62" text-anchor="middle" font-size="13px" fill="#0284c7" font-weight="bold">F(x, y₀+ε) &gt; 0</text>
  <text x="230" y="208" text-anchor="middle" font-size="13px" fill="#0284c7" font-weight="bold">F(x, y₀−ε) &lt; 0</text>
  <!-- Implicit Curve y = f(x) -->
  <path d="M 150 160 C 200 145, 260 115, 310 100" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="318" y="105" font-style="italic" font-weight="bold" fill="#1e40af">y = f(x)</text>
  <circle cx="230" cy="130" r="4" fill="#dc2626"/>
  <text x="238" y="124" font-style="italic" font-weight="bold" fill="#dc2626">(x₀, y₀)</text>
  <line x1="230" y1="240" x2="230" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="70" y1="130" x2="230" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="230" y="256" text-anchor="middle" font-style="italic">x₀</text>
  <text x="62" y="134" text-anchor="end" font-style="italic">y₀</text>
  <text x="240" y="295" text-anchor="middle" font-size="13px" fill="#1e293b">零点存在定理：对于每个 x ∈ (x₀−δ, x₀+δ)，存在唯一的 y = f(x) 使得 F(x, y) = 0</text>
</svg>
