<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>
    <style>
      .axis { stroke: #2d3748; stroke-width: 1.5; fill: none; }
      .circle-curve { stroke: #2b6cb0; stroke-width: 2; fill: none; }
      .box-line { stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
      .solid-box { stroke: #2d3748; stroke-width: 1.2; fill: none; }
      .label { font-family: 'KaTeX_Main', 'Times New Roman', serif; font-size: 15px; fill: #2d3748; }
      .point { fill: #c53030; }
    </style>
  </defs>

  <!-- Axes -->
  <line x1="30" y1="180" x2="330" y2="180" class="axis" marker-end="url(#arrow)" />
  <text x="330" y="195" class="label">x</text>
  <line x1="180" y1="280" x2="180" y2="20" class="axis" marker-end="url(#arrow)" />
  <text x="168" y="25" class="label">y</text>
  <text x="168" y="195" class="label">O</text>

  <!-- Unit Circle radius R = 100, Center at (180, 180) -->
  <circle cx="180" cy="180" r="100" class="circle-curve" />

  <!-- Tick marks / labels -->
  <text x="185" y="85" class="label">1</text>
  <text x="282" y="172" class="label">1</text>
  <text x="68" y="172" class="label">-1</text>

  <!-- Neighborhood boxes at (1, 0) and (-1, 0) -->
  <!-- Box around x = 280, y = 180 -->
  <rect x="260" y="145" width="40" height="70" class="solid-box" />
  <!-- Box around x = 80, y = 180 -->
  <rect x="60" y="145" width="40" height="70" class="solid-box" />

  <!-- Points (+-1, 0) -->
  <circle cx="280" cy="180" r="3.5" class="point" />
  <circle cx="80" cy="180" r="3.5" class="point" />
</svg>
