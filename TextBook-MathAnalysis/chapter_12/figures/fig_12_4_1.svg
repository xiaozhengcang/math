<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="150" x2="380" y2="150" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="200" y1="275" x2="200" y2="25" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="385" y="154" font-style="italic">x</text>
  <text x="188" y="25" font-style="italic">y</text>
  <text x="186" y="166" font-style="italic">O</text>
  <!-- Unit Circle -->
  <circle cx="200" cy="150" r="95" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
  <path d="M 105 150 A 95 95 0 0 1 295 150" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="255" y="75" font-style="italic" fill="#1e40af">y = √(1−x²)</text>
  <!-- Vertical Tangent Points (∂F/∂y = 0) -->
  <line x1="105" y1="100" x2="105" y2="200" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="295" y1="100" x2="295" y2="200" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="105" cy="150" r="4" fill="#dc2626"/>
  <circle cx="295" cy="150" r="4" fill="#dc2626"/>
  <text x="97" y="166" text-anchor="end" font-weight="bold">−1</text>
  <text x="303" y="166" text-anchor="start" font-weight="bold">1</text>
  <text x="303" y="130" font-size="11px" fill="#dc2626">垂直切线</text>
  <text x="303" y="143" font-size="11px" fill="#dc2626">(∂F/∂y = 0)</text>
  <text x="200" y="275" text-anchor="middle" font-size="13px" fill="#1e293b">单位圆周 x² + y² = 1：在 x = ±1 处 ∂F/∂y = 0，隐函数条件不满足</text>
</svg>
