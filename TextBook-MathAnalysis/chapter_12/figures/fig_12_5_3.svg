<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="210" y1="180" x2="380" y2="180" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="210" y1="180" x2="70" y2="265" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="210" y1="180" x2="210" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="385" y="184" font-style="italic">y</text>
  <text x="65" y="275" font-style="italic">x</text>
  <text x="198" y="35" font-style="italic">z</text>
  <text x="196" y="196" font-style="italic">O</text>
  <!-- Sphere Shell -->
  <circle cx="210" cy="180" r="110" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
  <ellipse cx="210" cy="180" rx="110" ry="35" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- Intersection Circle C -->
  <ellipse cx="210" cy="120" rx="75" ry="22" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="2.2"/>
  <text x="290" y="120" font-style="italic" fill="#1e40af" font-weight="bold">C</text>
  <!-- Tangent vector at P -->
  <line x1="275" y1="130" x2="320" y2="110" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <circle cx="275" cy="130" r="3.5" fill="#dc2626"/>
  <text x="275" y="146" font-style="italic" font-weight="bold" fill="#dc2626">P</text>
  <text x="325" y="110" font-size="12px" fill="#dc2626">切线 T</text>
  <text x="210" y="305" text-anchor="middle" font-size="13px" fill="#1e293b">球面被平面截割成的圆周曲线及其切线与法平面</text>
</svg>
