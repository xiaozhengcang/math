<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="auto" style="max-width: 400px;">
  <defs>
    <marker id="arr1253" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="180" y1="180" x2="180" y2="40" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arr1253)" />
  <text x="170" y="45" font-family="'Times New Roman', serif" font-style="italic" font-size="16">z</text>
  
  <line x1="80" y1="180" x2="340" y2="180" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arr1253)" />
  <text x="345" y="185" font-family="'Times New Roman', serif" font-style="italic" font-size="16">y</text>
  
  <line x1="180" y1="180" x2="90" y2="245" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arr1253)" />
  <text x="75" y="250" font-family="'Times New Roman', serif" font-style="italic" font-size="16">x</text>
  <text x="165" y="175" font-family="'Times New Roman', serif" font-size="15">O</text>

  <!-- Sphere outline -->
  <circle cx="180" cy="160" r="90" fill="none" stroke="#4a5568" stroke-width="1.5" />
  <ellipse cx="180" cy="160" rx="90" ry="30" fill="none" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Cutting plane rectangle in perspective -->
  <polygon points="100,140 280,70 320,180 140,250" fill="#edf2f7" fill-opacity="0.4" stroke="#2b6cb0" stroke-width="1.5" />

  <!-- Intersection circle -->
  <ellipse cx="205" cy="165" rx="65" ry="35" transform="rotate(-20 205 165)" fill="none" stroke="#2b6cb0" stroke-width="2" />

  <!-- Tangent point (1, 1, -2) -->
  <circle cx="215" cy="195" r="4" fill="#c53030" />
  <text x="225" y="205" font-family="'Times New Roman', serif" font-size="14">(1, 1, -2)</text>

  <text x="200" y="310" text-anchor="middle" font-family="'Songti SC', SimSun, serif" font-size="15" fill="#2d3748">图 12.5.3</text>
</svg>