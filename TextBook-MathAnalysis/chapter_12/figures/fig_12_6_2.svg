<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="210" y1="230" x2="380" y2="230" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="210" y1="230" x2="90" y2="280" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="210" y1="230" x2="210" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="385" y="234" font-style="italic">y</text>
  <text x="85" y="290" font-style="italic">x</text>
  <text x="198" y="35" font-style="italic">z</text>
  <text x="196" y="246" font-style="italic">O</text>
  <!-- Cone Body -->
  <polygon points="210,230 90,80 330,80" fill="#e0f2fe" fill-opacity="0.5" stroke="none"/>
  <line x1="210" y1="230" x2="90" y2="80" stroke="#1e40af" stroke-width="2"/>
  <line x1="210" y1="230" x2="330" y2="80" stroke="#1e40af" stroke-width="2"/>
  <ellipse cx="210" cy="80" rx="120" ry="35" fill="#bae6fd" fill-opacity="0.6" stroke="#1e40af" stroke-width="1.8"/>
  <circle cx="210" cy="230" r="4.5" fill="#dc2626"/>
  <text x="220" y="234" font-size="13px" fill="#dc2626" font-weight="bold">顶点 (0, 0, 0) 极小值</text>
  <text x="220" y="250" font-size="12px" fill="#dc2626">(偏导数不存在)</text>
  <text x="320" y="70" font-style="italic" font-weight="bold" fill="#1e40af">z = √(x² + y²)</text>
  <text x="210" y="300" text-anchor="middle" font-size="13px" fill="#1e293b">锥面在顶点处连续且取得严格极小值，但由于尖角不可微</text>
</svg>
