<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="auto">
  <defs>
    <style>
      .grid-line { stroke: #4a5568; stroke-width: 1.5; stroke-dasharray: none; }
      .stencil-point { fill: #2b6cb0; stroke: #1a365d; stroke-width: 2; }
      .center-point { fill: #c53030; stroke: #742a2a; stroke-width: 2; }
      .label { font-family: 'KaTeX_Main', 'Times New Roman', serif; font-size: 16px; fill: #2d3748; }
      .label-center { font-family: 'KaTeX_Main', 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #9b2c2c; }
    </style>
  </defs>

  <!-- Background Grid Box -->
  <rect x="100" y="50" width="200" height="200" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5" />
  
  <!-- Cross lines connecting the 5 points -->
  <line x1="100" y1="150" x2="300" y2="150" class="grid-line" />
  <line x1="200" y1="50" x2="200" y2="250" class="grid-line" />

  <!-- 5 Points -->
  <!-- Left (x-h, y) -->
  <circle cx="100" cy="150" r="5" class="stencil-point" />
  <text x="25" y="155" class="label">(x - h, y)</text>

  <!-- Right (x+h, y) -->
  <circle cx="300" cy="150" r="5" class="stencil-point" />
  <text x="310" y="155" class="label">(x + h, y)</text>

  <!-- Top (x, y+h) -->
  <circle cx="200" cy="50" r="5" class="stencil-point" />
  <text x="175" y="38" class="label">(x, y + h)</text>

  <!-- Bottom (x, y-h) -->
  <circle cx="200" cy="250" r="5" class="stencil-point" />
  <text x="175" y="275" class="label">(x, y - h)</text>

  <!-- Center (x, y) -->
  <circle cx="200" cy="150" r="6" class="center-point" />
  <text x="210" y="142" class="label-center">(x, y)</text>

  <!-- Figure Caption inside SVG or HTML -->
</svg>
