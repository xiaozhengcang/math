<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Grid Lines -->
  <line x1="120" y1="50" x2="120" y2="250" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="190" y1="50" x2="190" y2="250" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="260" y1="50" x2="260" y2="250" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="90" y1="80" x2="290" y2="80" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="90" y1="150" x2="290" y2="150" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="90" y1="220" x2="290" y2="220" stroke="#e2e8f0" stroke-width="1.2"/>
  <!-- Stencil Cross -->
  <line x1="120" y1="150" x2="260" y2="150" stroke="#0284c7" stroke-width="2"/>
  <line x1="190" y1="80" x2="190" y2="220" stroke="#0284c7" stroke-width="2"/>
  <circle cx="190" cy="150" r="5" fill="#dc2626"/>
  <text x="198" y="164" font-size="12px" fill="#dc2626" font-weight="bold">(i, j)</text>
  <circle cx="260" cy="150" r="5" fill="#1e40af"/>
  <text x="268" y="168" font-size="12px" fill="#1e40af" font-weight="bold">(i+1, j)</text>
  <circle cx="120" cy="150" r="5" fill="#1e40af"/>
  <text x="128" y="168" font-size="12px" fill="#1e40af" font-weight="bold">(i−1, j)</text>
  <circle cx="190" cy="80" r="5" fill="#1e40af"/>
  <text x="198" y="98" font-size="12px" fill="#1e40af" font-weight="bold">(i, j+1)</text>
  <circle cx="190" cy="220" r="5" fill="#1e40af"/>
  <text x="198" y="238" font-size="12px" fill="#1e40af" font-weight="bold">(i, j−1)</text>
  <text x="225.0" y="142" text-anchor="middle" font-style="italic" fill="#0284c7">h</text>
  <text x="198" y="115.0" font-style="italic" fill="#0284c7">h</text>
  <text x="190" y="275" text-anchor="middle" font-size="13px" fill="#1e293b">五点差分格式：Δu ≈ [u(i+1,j)+u(i−1,j)+u(i,j+1)+u(i,j−1)−4u(i,j)] / h²</text>
</svg>
