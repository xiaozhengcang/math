<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Space Curve Γ -->
  <path d="M 60 190 C 110 175, 160 140, 210 110 C 260 80, 310 70, 360 65" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="365" y="70" font-style="italic" font-weight="bold" fill="#1e40af">Γ</text>
  <!-- Secant Line P0 P1 -->
  <line x1="100" y1="170" x2="340" y2="50" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="345" y="55" font-size="12px" fill="#64748b">割线 P₀P₁</text>
  <!-- Tangent Line at P0 -->
  <line x1="80" y1="192" x2="260" y2="75" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="268" y="78" font-size="13px" fill="#dc2626" font-weight="bold">切线 T (P₁ → P₀ 极限)</text>
  <circle cx="160" cy="140" r="4" fill="#dc2626"/>
  <circle cx="280" cy="80" r="4" fill="#1e40af"/>
  <text x="152" y="130" font-style="italic" font-weight="bold" fill="#dc2626">P₀</text>
  <text x="288" y="84" font-style="italic" font-weight="bold" fill="#1e40af">P₁</text>
  <text x="210" y="245" text-anchor="middle" font-size="13px" fill="#1e293b">割线 P₀P₁ 的极限位置即为切线 T：r'(t₀) = lim<tspan font-size="10px" dy="3">Δt→0</tspan> [r(t₀+Δt) − r(t₀)] / Δt</text>
</svg>
