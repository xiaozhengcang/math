<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width: 380px;">
  <!-- Space curve Gamma -->
  <path d="M 40 180 C 120 170, 200 130, 320 40" fill="none" stroke="#2b6cb0" stroke-width="2.2" />
  
  <!-- Secant line through P0 and P1 -->
  <line x1="120" y1="210" x2="330" y2="25" stroke="#718096" stroke-width="1.2" stroke-dasharray="none" />
  
  <!-- Tangent line at P0 -->
  <line x1="50" y1="190" x2="310" y2="80" stroke="#c53030" stroke-width="1.5" />

  <!-- Points P0 and P1 -->
  <circle cx="180" cy="140" r="4" fill="#1a202c" />
  <text x="180" y="165" font-family="'Times New Roman', serif" font-style="italic" font-size="16" fill="#1a202c">P₀</text>

  <circle cx="280" cy="78" r="4" fill="#1a202c" />
  <text x="288" y="75" font-family="'Times New Roman', serif" font-style="italic" font-size="16" fill="#1a202c">P₁</text>

  <!-- Labels -->
  <text x="50" y="165" font-family="'Times New Roman', serif" font-style="italic" font-size="16" fill="#2b6cb0">Γ</text>
  <text x="190" y="245" text-anchor="middle" font-family="'Songti SC', SimSun, serif" font-size="15" fill="#2d3748">图 12.5.1</text>
</svg>