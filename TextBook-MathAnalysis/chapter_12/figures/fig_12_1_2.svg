<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 260" width="100%" height="auto">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b6cb0" />
    </marker>
  </defs>
  <style>
    .axis { stroke: #2d3748; stroke-width: 1.5; fill: none; }
    .ray { stroke: #2b6cb0; stroke-width: 2.2; fill: none; }
    .dash { stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4,4; fill: none; }
    .arc { stroke: #e53e3e; stroke-width: 1.5; fill: none; }
    .label { font-family: "Times New Roman", STSong, serif; font-style: italic; font-size: 15px; fill: #1a202c; }
    .sub { font-size: 11px; }
  </style>

  <!-- Axes -->
  <line x1="60" y1="210" x2="410" y2="210" class="axis" marker-end="url(#arr)" />
  <text x="405" y="225" class="label">x</text>
  <line x1="80" y1="230" x2="80" y2="40" class="axis" marker-end="url(#arr)" />
  <text x="65" y="45" class="label">y</text>
  <text x="68" y="225" class="label">O</text>

  <!-- Point P0 -->
  <circle cx="170" cy="150" r="3.5" fill="#2d3748" />
  <text x="110" y="170" class="label">P<tspan class="sub">0</tspan>(x<tspan class="sub">0</tspan>, y<tspan class="sub">0</tspan>)</text>

  <!-- Horizontal baseline from P0 -->
  <line x1="170" y1="150" x2="280" y2="150" class="dash" />

  <!-- Ray v -->
  <line x1="170" y1="150" x2="310" y2="70" class="ray" marker-end="url(#arr-blue)" />
  <text x="260" y="65" class="label" fill="#2b6cb0"><tspan font-weight="bold">v</tspan> = (cos α, sin α)</text>

  <!-- Angle alpha arc -->
  <path d="M 220 150 A 50 50 0 0 0 212 126" class="arc" />
  <text x="228" y="135" class="label" fill="#e53e3e">α</text>
</svg>