<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="50" y1="210" x2="390" y2="210" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="80" y1="250" x2="80" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="395" y="214" font-style="italic">x</text>
  <text x="68" y="35" font-style="italic">y</text>
  <text x="66" y="226" font-style="italic">O</text>
  <!-- P0(x0, y0) -->
  <line x1="170" y1="210" x2="170" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="130" x2="170" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="170" cy="130" r="4" fill="#1e293b"/>
  <text x="162" y="120" font-style="italic" font-weight="bold">P₀(x₀, y₀)</text>
  <text x="170" y="226" text-anchor="middle" font-style="italic">x₀</text>
  <text x="72" y="134" text-anchor="end" font-style="italic">y₀</text>
  <!-- Direction Ray l -->
  <line x1="170" y1="130" x2="330" y2="30" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="338" y="34" font-style="italic" font-weight="bold" fill="#1e40af">l</text>
  <line x1="170" y1="130" x2="270" y2="130" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <path d="M 215 130 A 45 45 0 0 0 207 104" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="222" y="118" font-style="italic" fill="#dc2626" font-weight="bold">α</text>
  <!-- Displaced point P -->
  <circle cx="260" cy="73.75" r="3.5" fill="#dc2626"/>
  <text x="268" y="69.75" font-style="italic" font-weight="bold" fill="#dc2626">P</text>
  <text x="210.0" y="93.875" font-size="12px" fill="#1e40af">Δl</text>
  <text x="210" y="260" text-anchor="middle" font-size="13px" fill="#1e293b">方向导数：∂f/∂l = lim<tspan font-size="10px" dy="3">Δl→0⁺</tspan> [f(P) − f(P₀)] / Δl</text>
</svg>
