  <line x1="70" y1="195" x2="385" y2="45" stroke="#1e40af" stroke-width="2.2"/>
  <text x="350" y="40" font-style="italic" fill="#1e40af" font-weight="bold">y = ax + b</text>
  <line x1="90" y1="185" x2="90" y2="185.5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="90" cy="185" r="3.5" fill="#dc2626"/>
  <line x1="130" y1="160" x2="130" y2="166.4" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="130" cy="160" r="3.5" fill="#dc2626"/>
  <line x1="170" y1="145" x2="170" y2="147.4" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="170" cy="145" r="3.5" fill="#dc2626"/>
  <line x1="210" y1="120" x2="210" y2="128.4" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="210" cy="120" r="3.5" fill="#dc2626"/>
  <line x1="250" y1="115" x2="250" y2="109.3" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
