  <line x1="290" y1="85" x2="290" y2="90.3" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="290" cy="85" r="3.5" fill="#dc2626"/>
  <line x1="330" y1="70" x2="330" y2="71.2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="330" cy="70" r="3.5" fill="#dc2626"/>
  <line x1="370" y1="50" x2="370" y2="52.2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
  <circle cx="370" cy="50" r="3.5" fill="#dc2626"/>
  <text x="210" y="245" text-anchor="middle" font-size="13px" fill="#1e293b">最小二乘法：使残差平方和 ∑ [yᵢ − (axᵢ + b)]² 达到最小</text>
</svg>
