<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="120" y1="230" x2="420" y2="230" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="120" y1="230" x2="50" y2="290" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="120" y1="230" x2="120" y2="35" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="425" y="234" font-style="italic">y</text>
  <text x="45" y="300" font-style="italic">x</text>
  <text x="108" y="35" font-style="italic">z</text>
  <text x="106" y="246" font-style="italic">O</text>
  <!-- Surface S: F(x, y, z) = 0 -->
  <path d="M 140 180 C 200 90, 330 90, 400 160 C 350 230, 250 230, 140 180 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="395" y="180" font-style="italic" font-weight="bold" fill="#64748b">Σ</text>
  <!-- Tangent Plane Π -->
  <polygon points="170,165 330,85 370,125 210,205" fill="#e0f2fe" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.6"/>
  <text x="340" y="85" font-style="italic" font-weight="bold" fill="#0284c7">切平面 Π</text>
  <path d="M 190 160 C 230 140, 260 130, 330 115" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <path d="M 220 175 C 240 150, 260 130, 300 95" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <!-- Normal vector n = ∇F -->
  <line x1="260" y1="130" x2="285" y2="55" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  <text x="293" y="55" font-style="italic" font-weight="bold" fill="#dc2626">n = ∇F</text>
  <circle cx="260" cy="130" r="4" fill="#1e293b"/>
  <text x="252" y="122" font-style="italic" font-weight="bold">P₀</text>
  <text x="230" y="315" text-anchor="middle" font-size="13px" fill="#1e293b">切平面由过 P₀ 的所有切线张成，法向量 n = (F_x, F_y, F_z) 垂直于切平面</text>
</svg>
