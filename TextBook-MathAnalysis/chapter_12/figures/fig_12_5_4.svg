<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="100%" height="auto" style="max-width: 440px;">
  <defs>
    <marker id="arr1254" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>
    <marker id="arrNorm" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c53030" />
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="160" y1="280" x2="160" y2="80" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arr1254)" />
  <text x="145" y="85" font-family="'Times New Roman', serif" font-style="italic" font-size="16">z</text>
  
  <line x1="160" y1="280" x2="340" y2="220" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arr1254)" />
  <text x="345" y="225" font-family="'Times New Roman', serif" font-style="italic" font-size="16">y</text>
  
  <line x1="160" y1="280" x2="330" y2="320" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arr1254)" />
  <text x="335" y="325" font-family="'Times New Roman', serif" font-style="italic" font-size="16">x</text>
  <text x="145" y="285" font-family="'Times New Roman', serif" font-size="15">O</text>

  <!-- Surface S dome -->
  <path d="M 120 200 C 130 140, 240 100, 360 130 C 370 180, 280 230, 200 210 C 150 200, 130 220, 120 200 Z" 
        fill="#ebf8ff" stroke="#3182ce" stroke-width="1.8" />
  <text x="350" y="195" font-family="'Times New Roman', serif" font-style="italic" font-size="16" fill="#2b6cb0">S</text>

  <!-- Point P0 -->
  <line x1="230" y1="140" x2="230" y2="280" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" />
  <circle cx="230" cy="140" r="4" fill="#c53030" />
  <text x="240" y="145" font-family="'Times New Roman', serif" font-size="14">(x₀, y₀, z₀)</text>
  <circle cx="230" cy="280" r="3" fill="#2d3748" />
  <text x="235" y="295" font-family="'Times New Roman', serif" font-size="14">(x₀, y₀, 0)</text>

  <!-- Tangent Plane pi -->
  <polygon points="100,180 280,105 380,140 200,215" fill="#f7fafc" fill-opacity="0.5" stroke="#2d3748" stroke-width="1.4" />
  <text x="360" y="130" font-family="'Times New Roman', serif" font-style="italic" font-size="16">π</text>

  <!-- Normal vector n -->
  <line x1="230" y1="140" x2="230" y2="60" stroke="#c53030" stroke-width="2" marker-end="url(#arrNorm)" />
  <text x="210" y="70" font-family="'Times New Roman', serif" font-weight="bold" font-size="16" fill="#c53030">n</text>

  <!-- Tangent curves on surface through P0 -->
  <path d="M 190 165 Q 230 140 270 130" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr1254)" />
  <path d="M 200 130 Q 230 140 260 155" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr1254)" />

  <text x="220" y="335" text-anchor="middle" font-family="'Songti SC', SimSun, serif" font-size="15" fill="#2d3748">图 12.5.4</text>
</svg>