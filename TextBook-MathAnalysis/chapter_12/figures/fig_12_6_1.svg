<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="230" y1="170" x2="420" y2="170" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="230" y1="170" x2="80" y2="255" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="230" y1="170" x2="230" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="425" y="174" font-style="italic">y</text>
  <text x="75" y="265" font-style="italic">x</text>
  <text x="218" y="30" font-style="italic">z</text>
  <text x="216" y="186" font-style="italic">O</text>
  <!-- Saddle Surface z = x² − y² -->
  <path d="M 120 230 Q 230 170 340 110" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="345" y="115" font-size="12px" fill="#1e40af">z = x² (极小)</text>
  <path d="M 110 110 Q 230 170 350 230" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="355" y="235" font-size="12px" fill="#dc2626">z = −y² (极大)</text>
  <path d="M 120 230 Q 110 170 110 110 Q 230 170 340 110 Q 345 170 350 230 Q 230 170 120 230 Z" fill="#e0f2fe" fill-opacity="0.35" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="230" cy="170" r="4.5" fill="#dc2626"/>
  <text x="238" y="160" font-size="13px" fill="#dc2626" font-weight="bold">鞍点 (0, 0, 0)</text>
  <text x="230" y="295" text-anchor="middle" font-size="13px" fill="#1e293b">驻点 (0, 0) 沿 x 方向为极小值，沿 y 方向为极大值，故非极值点</text>
</svg>
