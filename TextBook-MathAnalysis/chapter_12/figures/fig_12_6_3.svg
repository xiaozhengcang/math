<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="130" x2="420" y2="130" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="230" y1="230" x2="230" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="425" y="134" font-style="italic">x, y</text>
  <text x="218" y="30" font-style="italic">z</text>
  <text x="216" y="146" font-style="italic">O</text>
  <!-- Section y = 0: z = x² (Trough) -->
  <path d="M 90 40 Q 230 150 370 40" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="375" y="45" font-style="italic" font-weight="bold" fill="#1e40af">z = x² (极小)</text>
  <!-- Section x = 0: z = −y² (Crest) -->
  <path d="M 90 220 Q 230 110 370 220" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="375" y="225" font-style="italic" font-weight="bold" fill="#dc2626">z = −y² (极大)</text>
  <circle cx="230" cy="130" r="4.5" fill="#1e293b"/>
  <text x="230" y="250" text-anchor="middle" font-size="13px" fill="#1e293b">鞍点正交截面：沿 y=0 截线为凹，沿 x=0 截线为凸</text>
</svg>
