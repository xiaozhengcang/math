<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="170" y1="210" x2="170" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="180" y="28" font-style="italic">z</text>
  <line x1="170" y1="170" x2="330" y2="170" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="188" font-style="italic">y</text>
  <line x1="170" y1="170" x2="70" y2="245" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="60" y="255" font-style="italic">x</text>
  <text x="155" y="182">O</text>

  <!-- Upper hemisphere dome: radius R = 85 -->
  <!-- Equator on xy-plane: center (170, 170), rx = 85, ry = 28 -->
  <!-- Dome top at (170, 85) -->
  <path d="M 85 170 C 85 85, 255 85, 255 170 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Equator front half (visible) -->
  <path d="M 85 170 C 85 188, 255 188, 255 170" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <!-- Equator back half (dashed) -->
  <path d="M 85 170 C 85 152, 255 152, 255 170" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Peak point mark at (170, 85) -->
  <circle cx="170" cy="85" r="2.5" fill="#1e293b"/>
  <text x="158" y="90">1</text>
  <text x="260" y="175">1</text>

  <text x="185" y="125" font-size="13" font-style="italic" fill="#1e40af">z = √(1 - x² - y²)</text>
  <text x="165" y="155" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Ω</text>
</svg>
