  <line x1="40" y1="110" x2="280" y2="110" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="280,108 286,110 280,112" fill="#2d3748" />
  <text x="282" y="125" font-size="12" font-style="italic" font-family="serif">x</text>

