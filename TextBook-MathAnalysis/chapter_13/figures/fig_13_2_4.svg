<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="100%" height="auto" style="max-width: 360px;">
  <!-- 3D axes -->
  <line x1="160" y1="250" x2="160" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="157,20 160,12 163,20" fill="#2d3748" />
  <text x="168" y="22" font-size="13" font-style="italic" font-family="serif">z</text>

  <line x1="160" y1="170" x2="340" y2="170" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="340,167 348,170 340,173" fill="#2d3748" />
  <text x="345" y="184" font-size="13" font-style="italic" font-family="serif">y</text>

  <line x1="160" y1="170" x2="70" y2="245" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="68,240 62,250 73,246" fill="#2d3748" />
  <text x="65" y="262" font-size="13" font-style="italic" font-family="serif">x</text>
  <text x="148" y="182" font-size="12" font-family="serif">O</text>

  <!-- Region Omega in 3D -->
  <!-- Top surface z = z_2(x, y) -->
  <path d="M 150 85 C 190 60, 270 65, 300 100 C 270 125, 200 120, 150 85 Z" fill="#ebf8ff" fill-opacity="0.8" stroke="#2b6cb0" stroke-width="1.8" />
  <!-- Bottom surface z = z_1(x, y) -->
  <path d="M 150 145 C 190 120, 270 125, 300 160 C 270 185, 200 180, 150 145 Z" fill="#edf2f7" fill-opacity="0.6" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Vertical boundary generators connecting top and bottom -->
  <line x1="150" y1="85" x2="150" y2="145" stroke="#2b6cb0" stroke-width="1.5" />
  <line x1="300" y1="100" x2="300" y2="160" stroke="#2b6cb0" stroke-width="1.5" />

  <!-- Horizontal cross section at height z -->
  <path d="M 150 115 C 190 90, 270 95, 300 130 C 270 155, 200 150, 150 115 Z" fill="#feb2b2" fill-opacity="0.3" stroke="#e53e3e" stroke-width="1.2" stroke-dasharray="3,2" />

  <!-- Projected region Omega_xy on xy-plane -->
  <path d="M 150 205 C 190 180, 270 185, 300 220 C 270 245, 200 240, 150 205 Z" fill="#e2e8f0" fill-opacity="0.5" stroke="#718096" stroke-width="1.4" stroke-dasharray="4,3" />
  <!-- Projection rays -->
  <line x1="150" y1="145" x2="150" y2="205" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="300" y1="160" x2="300" y2="220" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="2,2" />

  <text x="215" y="110" font-size="14" font-style="italic" font-family="serif" fill="#2b6cb0">Ω</text>
  <text x="210" y="220" font-size="13" font-style="italic" font-family="serif" fill="#4a5568">Ω_{xy}</text>
  <text x="250" y="55" font-size="11" font-style="italic" font-family="serif" fill="#2b6cb0">z = z₂(x, y)</text>
  <text x="250" y="150" font-size="11" font-style="italic" font-family="serif" fill="#4a5568">z = z₁(x, y)</text>
</svg>