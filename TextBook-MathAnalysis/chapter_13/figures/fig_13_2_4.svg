<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="160" y1="270" x2="160" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="170" y="28" font-style="italic">z</text>
  <line x1="160" y1="190" x2="370" y2="190" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="365" y="208" font-style="italic">y</text>
  <line x1="160" y1="190" x2="80" y2="265" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="70" y="280" font-style="italic">x</text>
  <text x="145" y="202">O</text>

  <!-- Solid Omega boundary (egg-shaped volume) between z=e (y=230) and z=f (y=60) -->
  <path d="M 160 60 C 230 60, 270 120, 260 180 C 250 225, 200 240, 160 240 C 120 240, 70 220, 65 170 C 60 110, 100 60, 160 60 Z" 
        fill="#f8fafc" fill-opacity="0.4" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Bottom boundary z = e -->
  <line x1="155" y1="240" x2="165" y2="240" stroke="#1e293b" stroke-width="1.2"/>
  <text x="140" y="245" font-style="italic">e</text>
  <!-- Top boundary z = f -->
  <line x1="155" y1="60" x2="165" y2="60" stroke="#1e293b" stroke-width="1.2"/>
  <text x="145" y="65" font-style="italic">f</text>

  <!-- Horizontal cross-section plane at height z: z = 145 -->
  <polygon points="75,130 295,130 265,165 45,165" fill="#f1f5f9" fill-opacity="0.5" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="155" y1="145" x2="165" y2="145" stroke="#1e293b" stroke-width="1.2"/>
  <text x="145" y="148" font-style="italic" fill="#0369a1">z</text>

  <!-- Slice Omega_z -->
  <ellipse cx="160" cy="145" rx="75" ry="22" fill="#bae6fd" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.8"/>
  <text x="195" y="150" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Ω_z</text>
  <text x="265" y="105" font-size="18" font-style="italic" fill="#1e40af" font-weight="bold">Ω</text>
</svg>
