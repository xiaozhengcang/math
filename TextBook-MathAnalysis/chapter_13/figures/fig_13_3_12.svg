<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="160" y1="230" x2="160" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="170" y="28" font-style="italic">z</text>
  <line x1="160" y1="210" x2="310" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="228" font-style="italic">y</text>
  <line x1="160" y1="210" x2="85" y2="255" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="75" y="265" font-style="italic">x</text>
  <text x="145" y="222">O</text>

  <!-- Paraboloid surface: apex at (160, 210), opening up to (85, 80) and (235, 80) -->
  <path d="M 85 80 Q 160 210 235 80" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Top disk rim at z = h -->
  <ellipse cx="160" cy="80" rx="75" ry="22" fill="#bae6fd" fill-opacity="0.75" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Height mark z = h -->
  <line x1="160" y1="210" x2="160" y2="80" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="155" y1="80" x2="165" y2="80" stroke="#1e293b" stroke-width="1.2"/>
  <text x="145" y="85" font-style="italic">h</text>

  <text x="245" y="85" font-style="italic" fill="#0284c7">z = h</text>
  <text x="180" y="170" font-size="13" font-style="italic" fill="#1e40af">z = x² + y²</text>
  <text x="155" y="140" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Ω</text>
</svg>
