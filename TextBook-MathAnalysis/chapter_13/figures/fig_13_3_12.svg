<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="auto" style="max-width: 300px;">
  <!-- Paraboloid z = x^2+y^2 and plane z = 2 -->
  <line x1="150" y1="210" x2="270" y2="210" stroke="#2d3748" stroke-width="1.2" />
  <line x1="150" y1="210" x2="150" y2="30" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="148,30 150,22 152,30" fill="#2d3748" />
  <text x="140" y="28" font-size="12" font-style="italic" font-family="serif">z</text>

  <path d="M 80 80 Q 150 210 220 80" fill="#bee3f8" fill-opacity="0.4" stroke="#3182ce" stroke-width="1.8" />
  <ellipse cx="150" cy="80" rx="70" ry="20" fill="#bee3f8" fill-opacity="0.6" stroke="#2b6cb0" stroke-width="1.6" />
  <text x="225" y="85" font-size="11" font-family="serif" fill="#2b6cb0">z = 2</text>
  <text x="155" y="160" font-size="11" font-family="serif" fill="#2c5282">Ω</text>
</svg>