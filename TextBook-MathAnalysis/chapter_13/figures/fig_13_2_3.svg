<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="210" x2="350" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="228" font-style="italic">x</text>
  <line x1="55" y1="225" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="225">O</text>

  <!-- Bounding rectangle [a, b] x [c, d] -->
  <rect x="90" y="45" width="220" height="145" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="90" y1="207" x2="90" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="86" y="228" font-style="italic">a</text>
  <line x1="310" y1="207" x2="310" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="306" y="228" font-style="italic">b</text>
  <text x="40" y="193" font-style="italic">c</text>
  <text x="40" y="50" font-style="italic">d</text>
  <text x="315" y="55" font-style="italic" fill="#64748b">D̃</text>

  <!-- Shaded normal domain D between y1(x) and y2(x) -->
  <path d="M 90 145 C 130 170, 240 185, 310 135 L 310 75 C 240 50, 160 65, 90 110 Z" 
        fill="#e0f2fe" stroke="none"/>

  <!-- Lower curve y = y1(x) -->
  <path d="M 90 145 C 130 170, 240 185, 310 135" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="210" y="188" font-size="13" font-style="italic" fill="#1e40af">y = y₁(x)</text>

  <!-- Upper curve y = y2(x) -->
  <path d="M 90 110 C 160 65, 240 50, 310 75" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="210" y="65" font-size="13" font-style="italic" fill="#0284c7">y = y₂(x)</text>

  <!-- Vertical boundary lines x=a and x=b for D -->
  <line x1="90" y1="110" x2="90" y2="145" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="310" y1="75" x2="310" y2="135" stroke="#1e40af" stroke-width="1.5"/>

  <text x="180" y="125" font-size="18" font-style="italic" fill="#1e40af" font-weight="bold">D</text>
</svg>
