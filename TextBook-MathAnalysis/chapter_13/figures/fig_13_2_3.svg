<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width: 340px;">
  <!-- Axes -->
  <line x1="40" y1="190" x2="320" y2="190" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="320,187 328,190 320,193" fill="#2d3748" />
  <text x="322" y="205" font-size="13" font-style="italic" font-family="serif">x</text>

  <line x1="60" y1="200" x2="60" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="57,20 60,12 63,20" fill="#2d3748" />
  <text x="48" y="22" font-size="13" font-style="italic" font-family="serif">y</text>
  <text x="50" y="202" font-size="12" font-family="serif">O</text>

  <!-- Bounding box [a, b] x [c, d] -->
  <rect x="100" y="40" width="190" height="130" fill="none" stroke="#a0aec0" stroke-width="1.4" stroke-dasharray="4,3" />

  <!-- Region D bounded by y_1(x) below and y_2(x) above -->
  <path d="M 100 120 C 140 170, 250 170, 290 120 C 250 45, 140 45, 100 120 Z" 
        fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" />

  <!-- Boundary curve labels -->
  <text x="170" y="60" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">y = y₂(x)</text>
  <text x="170" y="160" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">y = y₁(x)</text>
  <text x="190" y="115" font-size="15" font-style="italic" font-family="serif" fill="#2b6cb0">D</text>

  <!-- Ticks on axes -->
  <line x1="100" y1="190" x2="100" y2="170" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="290" y1="190" x2="290" y2="170" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
  <text x="96" y="204" font-size="12" font-style="italic" font-family="serif">a</text>
  <text x="286" y="204" font-size="12" font-style="italic" font-family="serif">b</text>

  <line x1="60" y1="170" x2="100" y2="170" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="60" y1="40" x2="100" y2="40" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
  <text x="46" y="174" font-size="12" font-style="italic" font-family="serif">c</text>
  <text x="46" y="44" font-size="12" font-style="italic" font-family="serif">d</text>
</svg>