<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <!-- z-axis -->
  <line x1="150" y1="300" x2="150" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="160" y="28" font-style="italic">z</text>
  <!-- y-axis -->
  <line x1="150" y1="210" x2="410" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="405" y="228" font-style="italic">y</text>
  <!-- x-axis -->
  <line x1="150" y1="210" x2="45" y2="285" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="40" y="305" font-style="italic">x</text>
  <text x="135" y="222">O</text>

  <!-- Base region D in xy-plane -->
  <path d="M 160 235 C 120 250, 130 285, 195 280 C 265 275, 295 240, 275 220 C 245 210, 185 225, 160 235 Z" 
        fill="#e2e8f0" fill-opacity="0.5" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- Side generators of the cylinder -->
  <line x1="135" y1="258" x2="135" y2="135" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="288" y1="230" x2="288" y2="110" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="195" y1="280" x2="195" y2="155" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Top surface z = f(x, y) -->
  <path d="M 135 135 C 125 70, 225 60, 288 110 C 295 140, 260 165, 195 155 C 155 150, 138 140, 135 135 Z" 
        fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Contour / grid lines on curved surface -->
  <path d="M 150 102 C 185 92, 240 102, 280 126" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
  <path d="M 175 75 C 200 110, 210 145, 198 155" fill="none" stroke="#60a5fa" stroke-width="1.2"/>

  <!-- Micro element Delta D_i in base -->
  <polygon points="210,250 230,248 233,258 213,260" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <!-- Micro column edges -->
  <line x1="210" y1="250" x2="210" y2="125" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="230" y1="248" x2="230" y2="123" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="233" y1="258" x2="233" y2="133" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="213" y1="260" x2="213" y2="135" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Micro column top patch -->
  <polygon points="210,125 230,123 233,133 213,135" fill="#fca5a5" stroke="#dc2626" stroke-width="1.2"/>

  <!-- Sample point (xi_i, eta_i) -->
  <circle cx="221" cy="254" r="2.5" fill="#dc2626"/>
  <line x1="221" y1="254" x2="265" y2="280" stroke="#dc2626" stroke-width="1"/>
  <text x="268" y="285" fill="#dc2626">(ξᵢ, ηᵢ)</text>

  <text x="145" y="285" fill="#475569">ΔDᵢ</text>
  <text x="290" y="85" font-style="italic" fill="#1e40af">z = f(x, y)</text>
  <text x="175" y="248" font-style="italic" fill="#64748b">D</text>
</svg>
