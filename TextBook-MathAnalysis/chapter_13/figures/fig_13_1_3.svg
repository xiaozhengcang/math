<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="auto" style="max-width: 420px;">
  <!-- 3D Axes -->
  <!-- z axis -->
  <line x1="160" y1="300" x2="160" y2="30" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="157,30 160,20 163,30" fill="#2d3748" />
  <text x="168" y="32" font-size="14" font-style="italic" font-family="serif">z</text>

  <!-- y axis -->
  <line x1="160" y1="210" x2="390" y2="210" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="390,207 400,210 390,213" fill="#2d3748" />
  <text x="395" y="225" font-size="14" font-style="italic" font-family="serif">y</text>

  <!-- x axis -->
  <line x1="160" y1="210" x2="50" y2="285" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="48,280 40,292 53,286" fill="#2d3748" />
  <text x="45" y="305" font-size="14" font-style="italic" font-family="serif">x</text>
  <text x="145" y="222" font-size="13" font-family="serif">O</text>

  <!-- Base region D in xy-plane -->
  <!-- Projected oval on xy plane -->
  <path d="M 170 240 C 130 255, 140 285, 200 280 C 270 275, 290 245, 270 225 C 240 215, 190 230, 170 240 Z" 
        fill="#edf2f7" fill-opacity="0.6" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,2" />

  <!-- Cylinder vertical side generators -->
  <line x1="145" y1="260" x2="145" y2="135" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="285" y1="235" x2="285" y2="115" stroke="#718096" stroke-width="1.2" />
  <line x1="200" y1="280" x2="200" y2="155" stroke="#718096" stroke-width="1.2" />

  <!-- Curved top surface z = f(x, y) -->
  <path d="M 145 135 C 135 70, 230 65, 285 115 C 290 145, 260 165, 200 155 C 160 150, 145 140, 145 135 Z" 
        fill="#ebf8ff" fill-opacity="0.6" stroke="#2b6cb0" stroke-width="2.2" />

  <!-- Surface grid/contour lines on curved top -->
  <path d="M 160 100 C 190 90, 240 105, 275 130" fill="none" stroke="#63b3ed" stroke-width="1.2" />
  <path d="M 180 75 C 205 110, 215 145, 205 155" fill="none" stroke="#63b3ed" stroke-width="1.2" />

  <!-- Micro element Delta D_i in base -->
  <path d="M 215 250 L 235 248 L 238 258 L 218 260 Z" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.2" />
  <!-- Micro column to top -->
  <line x1="215" y1="250" x2="215" y2="125" stroke="#e53e3e" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="235" y1="248" x2="235" y2="123" stroke="#e53e3e" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="238" y1="258" x2="238" y2="133" stroke="#e53e3e" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="218" y1="260" x2="218" y2="135" stroke="#e53e3e" stroke-width="1" stroke-dasharray="2,2" />
  <!-- Micro top cap -->
  <path d="M 215 125 L 235 123 L 238 133 L 218 135 Z" fill="#feb2b2" stroke="#e53e3e" stroke-width="1.2" />

  <!-- Sample point (\xi_i, \eta_i) -->
  <circle cx="226" cy="254" r="2" fill="#2d3748" />
  <line x1="226" y1="254" x2="270" y2="280" stroke="#718096" stroke-width="1" />
  <text x="272" y="285" font-size="13" font-family="serif">$(\xi_i, \eta_i)$</text>

  <text x="145" y="285" font-size="13" font-family="serif">$\Delta D_i$</text>
  <text x="285" y="90" font-size="14" font-style="italic" font-family="serif" fill="#2b6cb0">$z = f(x, y)$</text>
</svg>