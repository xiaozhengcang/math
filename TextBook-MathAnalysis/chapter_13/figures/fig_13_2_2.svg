<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="auto" style="max-width: 320px;">
  <!-- Coordinate axes -->
  <line x1="90" y1="130" x2="290" y2="130" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="290,127 298,130 290,133" fill="#2d3748" />
  <text x="285" y="146" font-size="13" font-style="italic" font-family="serif">y</text>

  <line x1="90" y1="180" x2="90" y2="30" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="87,30 90,22 93,30" fill="#2d3748" />
  <text x="96" y="32" font-size="13" font-style="italic" font-family="serif">z</text>

  <line x1="90" y1="130" x2="30" y2="175" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="28,170 22,181 33,176" fill="#2d3748" />
  <text x="35" y="190" font-size="13" font-style="italic" font-family="serif">x</text>
  <text x="78" y="125" font-size="12" font-family="serif">O</text>

  <!-- Left circle at y = 0: x^2 + z^2 = R^2 in perspective -->
  <ellipse cx="90" cy="130" rx="45" ry="35" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="4,3" />
  <!-- Visible half of left circle -->
  <path d="M 45 130 A 45 35 0 0 1 135 130" fill="none" stroke="#2b6cb0" stroke-width="1.8" />
  
  <!-- Right circle at y = a -->
  <ellipse cx="210" cy="130" rx="45" ry="35" fill="#ebf8ff" fill-opacity="0.5" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Cylinder boundary tangents -->
  <line x1="90" y1="95" x2="210" y2="95" stroke="#2b6cb0" stroke-width="1.8" />
  <line x1="90" y1="165" x2="210" y2="165" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Cylinder axis line -->
  <line x1="90" y1="130" x2="210" y2="130" stroke="#718096" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Vertical radius at y = a -->
  <line x1="210" y1="130" x2="210" y2="95" stroke="#4a5568" stroke-width="1.2" />
  <text x="212" y="145" font-size="12" font-style="italic" font-family="serif">a</text>
  <text x="110" y="80" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">x² + z² = R²</text>
</svg>