<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="90" y1="160" x2="90" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="100" y="28" font-style="italic">z</text>
  <line x1="90" y1="160" x2="350" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="178" font-style="italic">y</text>
  <line x1="90" y1="160" x2="20" y2="230" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="10" y="245" font-style="italic">x</text>
  <text x="75" y="172">O</text>

  <!-- Front face (y = a): y=260 -->
  <!-- Quarter circle on front face: center (260, 160), R along x (40px forward-left), R along z (80px up) -->
  <!-- Back face (y = 0): center (90, 160) -->
  
  <!-- Base on xy-plane: [0, R] along x, [0, a] along y -->
  <!-- Origin to (90, 160), x=R is (40, 210), y=a is (260, 160), corner (210, 210) -->
  <polygon points="90,160 260,160 210,210 40,210" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="260" y="178" font-style="italic">a</text>
  <text x="25" y="222" font-style="italic">R</text>

  <!-- Cylinder curved surface -->
  <path d="M 90 80 L 260 80 C 260 125, 235 185, 210 210 L 40 210 C 65 185, 90 125, 90 80 Z" 
        fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="1.8"/>

  <!-- Back circular arc (y = 0) -->
  <path d="M 90 80 C 90 125, 65 185, 40 210" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Front circular arc (y = a) -->
  <path d="M 260 80 C 260 125, 235 185, 210 210" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Top generator line -->
  <line x1="90" y1="80" x2="260" y2="80" stroke="#1e40af" stroke-width="2"/>
  <line x1="40" y1="210" x2="210" y2="210" stroke="#1e40af" stroke-width="1.5"/>

  <text x="75" y="85" font-style="italic">R</text>
  <text x="145" y="135" font-style="italic" fill="#1e40af">x² + z² ≤ R²</text>
</svg>
