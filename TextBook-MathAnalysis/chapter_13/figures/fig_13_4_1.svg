<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="180" x2="330" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="198" font-style="italic">x</text>
  <line x1="60" y1="210" x2="60" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="48" y="195">O</text>

  <!-- Bounded subregion D_r: cut by arc Gamma -->
  <!-- Bounded region from origin out to radius ~ 140 -->
  <path d="M 60 180 L 220 180 A 160 160 0 0 0 60 40 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>
  <line x1="60" y1="180" x2="220" y2="180" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="60" y2="40" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Cut line Gamma (circular arc / smooth curve) -->
  <path d="M 220 180 A 160 160 0 0 0 60 40" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="185" y="80" font-style="italic" fill="#dc2626" font-weight="bold">Γ (割线)</text>

  <!-- Labels -->
  <text x="110" y="130" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">D_r</text>
  <text x="250" y="100" font-size="18" font-style="italic" fill="#1e293b" font-weight="bold">D</text>
  <text x="220" y="195" font-size="12" fill="#64748b">r</text>
</svg>
