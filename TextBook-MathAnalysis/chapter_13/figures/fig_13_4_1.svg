<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width: 340px;">
  <!-- Unbounded region D and cut Gamma -->
  <line x1="20" y1="110" x2="310" y2="110" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="310,108 316,110 310,112" fill="#2d3748" />
  <text x="315" y="125" font-size="12" font-style="italic" font-family="serif">x</text>

  <line x1="110" y1="200" x2="110" y2="20" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="108,20 110,14 112,20" fill="#2d3748" />
  <text x="100" y="24" font-size="12" font-style="italic" font-family="serif">y</text>

  <!-- Bounded subset D_r -->
  <path d="M 110 110 L 220 110 A 110 110 0 0 0 110 20 Z" fill="#bee3f8" fill-opacity="0.6" stroke="#3182ce" stroke-width="1.6" />
  <text x="150" y="80" font-size="13" font-style="italic" font-family="serif" fill="#2b6cb0">D_r</text>

  <!-- Cut line Gamma -->
  <path d="M 220 110 A 110 110 0 0 0 110 20" fill="none" stroke="#e53e3e" stroke-width="2" stroke-dasharray="3,3" />
  <text x="210" y="45" font-size="12" font-style="italic" font-family="serif" fill="#c53030">Γ (割线)</text>
  <text x="250" y="70" font-size="14" font-style="italic" font-family="serif" fill="#4a5568">D</text>
</svg>