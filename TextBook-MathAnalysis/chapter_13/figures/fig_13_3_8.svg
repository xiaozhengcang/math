           fill="#bae6fd" fill-opacity="0.7" stroke="#0284c7" stroke-width="1.6"/>

  <text x="150" y="130" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">A_n</text>
  <text x="245" y="105" font-size="18" font-style="italic" fill="#1e293b" font-weight="bold">D</text>
  <text x="255" y="170" font-size="15" font-style="italic" fill="#64748b">B_n</text>
</svg>
