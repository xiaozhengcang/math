<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" width="100%" height="auto" style="max-width: 440px;">
  <g transform="translate(20, 10)">
    <line x1="20" y1="140" x2="180" y2="140" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="180,138 186,140 180,142" fill="#2d3748" />
    <text x="182" y="155" font-size="12" font-style="italic" font-family="serif">x</text>

    <line x1="30" y1="150" x2="30" y2="15" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="28,15 30,9 32,15" fill="#2d3748" />
    <text x="20" y="17" font-size="12" font-style="italic" font-family="serif">y</text>

    <!-- Region bounded by hyperbolas -->
    <path d="M 45 130 Q 70 80 130 45 L 155 60 Q 95 105 70 135 Z" fill="#e9d8fd" fill-opacity="0.6" stroke="#805ad5" stroke-width="1.5" />
    <text x="95" y="95" font-size="12" font-style="italic" font-family="serif" fill="#553c9e">D</text>
  </g>

  <g transform="translate(200, 70)">
    <text x="0" y="-6" font-size="11" font-family="serif" fill="#4a5568">u=xy, v=y/x</text>
    <path d="M 5 10 L 40 10" stroke="#3182ce" stroke-width="1.6" />
    <polygon points="38,7 45,10 38,13" fill="#3182ce" />
  </g>

  <g transform="translate(260, 10)">
    <line x1="20" y1="140" x2="160" y2="140" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="160,138 166,140 160,142" fill="#2d3748" />
    <text x="162" y="155" font-size="12" font-style="italic" font-family="serif">u</text>

    <line x1="30" y1="150" x2="30" y2="15" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="28,15 30,9 32,15" fill="#2d3748" />
    <text x="20" y="17" font-size="12" font-style="italic" font-family="serif">v</text>

    <rect x="60" y="50" width="70" height="60" fill="#e9d8fd" fill-opacity="0.6" stroke="#805ad5" stroke-width="1.5" />
    <text x="88" y="85" font-size="12" font-style="italic" font-family="serif" fill="#553c9e">D*</text>
