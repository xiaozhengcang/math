<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="100%" height="auto" style="max-width:480px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Left panel: xy plane with curvilinear quadrilateral -->
  <g transform="translate(25, 15)">
    <line x1="20" y1="160" x2="180" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="175" y="178" font-style="italic">x</text>
    <line x1="35" y1="175" x2="35" y2="15" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="20" font-style="italic">y</text>
    <text x="22" y="172">O</text>

    <!-- Region D bounded by xy=p, xy=q, y^2=ax, y^2=bx -->
    <!-- 4 corners: (55, 125), (75, 135), (145, 75), (115, 60) approximately -->
    <path d="M 55 125 Q 75 80 115 60 L 145 75 Q 95 105 75 135 Z" fill="#e9d5ff" fill-opacity="0.65" stroke="#9333ea" stroke-width="1.8"/>
    <text x="95" y="100" font-size="16" font-style="italic" fill="#7e22ce" font-weight="bold">D</text>
    <text x="120" y="55" font-size="11" fill="#64748b">y² = bx</text>
    <text x="145" y="85" font-size="11" fill="#64748b">xy = q</text>
  </g>

  <!-- Middle transform indicator -->
  <g transform="translate(210, 75)">
    <text x="-5" y="-8" font-size="12" fill="#1e40af">u = xy</text>
    <text x="-5" y="8" font-size="12" fill="#1e40af">v = y²/x</text>
    <path d="M 0 16 L 45 16" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  </g>

  <!-- Right panel: uv plane with rectangle D* = [p, q] x [a, b] -->
  <g transform="translate(285, 15)">
    <line x1="20" y1="160" x2="175" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="170" y="178" font-style="italic">u</text>
    <line x1="35" y1="175" x2="35" y2="15" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="20" font-style="italic">v</text>
    <text x="22" y="172">O</text>

    <!-- Rectangle [p, q] x [a, b] -->
    <rect x="65" y="55" width="70" height="65" fill="#e9d5ff" fill-opacity="0.65" stroke="#9333ea" stroke-width="1.8"/>
    <line x1="65" y1="157" x2="65" y2="163" stroke="#1e293b" stroke-width="1.2"/>
    <text x="62" y="178" font-style="italic">p</text>
    <line x1="135" y1="157" x2="135" y2="163" stroke="#1e293b" stroke-width="1.2"/>
    <text x="132" y="178" font-style="italic">q</text>
    <line x1="32" y1="120" x2="38" y2="120" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="125" font-style="italic">a</text>
    <line x1="32" y1="55" x2="38" y2="55" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="60" font-style="italic">b</text>

    <text x="95" y="93" font-size="16" font-style="italic" fill="#7e22ce" font-weight="bold" text-anchor="middle">D*</text>
  </g>
</svg>
