<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g transform="translate(45, 25)">
    <!-- Parallelogram: (30, 160), a=(150, 0) -> (180, 160), b=(70, -100) -> (100, 60), (250, 60) -->
    <polygon points="30,160 180,160 250,60 100,60" fill="#fed7aa" fill-opacity="0.65" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Vector a -->
    <line x1="30" y1="160" x2="180" y2="160" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
    <text x="185" y="165" font-size="16" font-weight="bold" font-style="italic" fill="#1e40af">a</text>

    <!-- Vector b -->
    <line x1="30" y1="160" x2="100" y2="60" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
    <text x="95" y="50" font-size="16" font-weight="bold" font-style="italic" fill="#dc2626">b</text>

    <!-- Counterclockwise orientation arc from a to b -->
    <path d="M 85 160 A 55 55 0 0 0 68 106" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="85" y="130" font-size="16" font-weight="bold" fill="#1e293b">+</text>

    <text x="135" y="115" font-size="15" font-style="italic" fill="#b45309" font-weight="bold">a ∧ b (有向面积)</text>
    <text x="30" y="180">O</text>
  </g>
</svg>
