<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width: 340px;">
  <!-- Vector wedge product a ^ b and signed area -->
  <g transform="translate(40, 20)">
    <line x1="30" y1="160" x2="160" y2="160" stroke="#2b6cb0" stroke-width="2.2" />
    <polygon points="160,156 170,160 160,164" fill="#2b6cb0" />
    <text x="175" y="165" font-size="14" font-weight="bold" font-family="serif" fill="#2b6cb0">a</text>

    <line x1="30" y1="160" x2="110" y2="60" stroke="#c53030" stroke-width="2.2" />
    <polygon points="106,56 116,52 114,64" fill="#c53030" />
    <text x="105" y="45" font-size="14" font-weight="bold" font-family="serif" fill="#c53030">b</text>

    <!-- Parallelogram area -->
    <polygon points="30,160 160,160 240,60 110,60" fill="#feebc8" fill-opacity="0.6" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Counterclockwise orientation arc -->
    <path d="M 80 160 A 50 50 0 0 0 65 116" fill="none" stroke="#2d3748" stroke-width="1.5" />
    <polygon points="61,118 64,110 69,116" fill="#2d3748" />
    <text x="80" y="135" font-size="12" font-family="serif">+</text>
    
    <text x="125" y="115" font-size="13" font-family="serif" fill="#c05621">a ∧ b (有向面积)</text>
  </g>
</svg>