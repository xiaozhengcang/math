<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="auto" style="max-width: 320px;">
  <!-- Iterated integral for improper integral -->
  <line x1="30" y1="160" x2="280" y2="160" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="280,158 286,160 280,162" fill="#2d3748" />
  <text x="285" y="175" font-size="12" font-style="italic" font-family="serif">x</text>

  <line x1="50" y1="175" x2="50" y2="25" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="48,25 50,19 52,25" fill="#2d3748" />
  <text x="40" y="28" font-size="12" font-style="italic" font-family="serif">y</text>

  <!-- Strip domain x >= 0, 0 <= y <= x -->
  <line x1="50" y1="160" x2="200" y2="35" stroke="#3182ce" stroke-width="1.8" />
  <path d="M 50 160 L 220 160 L 220 50 L 180 80 Z" fill="#ebf8ff" fill-opacity="0.7" stroke="#3182ce" stroke-dasharray="3,3" />
  <text x="180" y="45" font-size="11" font-family="serif" fill="#2b6cb0">y = x</text>
  <text x="130" y="135" font-size="13" font-style="italic" font-family="serif" fill="#2c5282">D</text>
</svg>