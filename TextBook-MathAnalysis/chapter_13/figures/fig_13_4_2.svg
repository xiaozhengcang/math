<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="180" x2="310" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="198" font-style="italic">x</text>
  <line x1="60" y1="205" x2="60" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="48" y="195">O</text>

  <!-- First quadrant bounded rectangle [0, R] x [0, R] expanding -->
  <rect x="60" y="50" width="190" height="130" fill="#e0f2fe" fill-opacity="0.5" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <line x1="250" y1="177" x2="250" y2="183" stroke="#1e293b" stroke-width="1.2"/>
  <text x="246" y="198" font-style="italic">R</text>
  <line x1="57" y1="50" x2="63" y2="50" stroke="#1e293b" stroke-width="1.2"/>
  <text x="45" y="55" font-style="italic">R</text>

  <text x="140" y="120" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">K_R</text>
  <text x="220" y="40" font-size="12" fill="#64748b">R → +∞</text>
</svg>
