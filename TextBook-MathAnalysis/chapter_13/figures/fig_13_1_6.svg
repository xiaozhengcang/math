<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" width="100%" height="auto" style="max-width: 260px;">
  <!-- Equilateral triangle base -->
  <polygon points="130,20 20,210 240,210" fill="none" stroke="#2d3748" stroke-width="1.5" />
  <!-- Dense fractal-like triangulation lines filling triangle -->
  <g stroke="#2b6cb0" stroke-width="1.2" fill="none">
    <line x1="130" y1="20" x2="20" y2="210" />
    <line x1="130" y1="20" x2="240" y2="210" />
    <line x1="20" y1="210" x2="240" y2="210" />
    <!-- Subdividing network -->
    <line x1="75" y1="115" x2="185" y2="115" />
    <line x1="75" y1="115" x2="130" y2="210" />
    <line x1="185" y1="115" x2="130" y2="210" />
    
    <line x1="47" y1="162" x2="102" y2="162" />
    <line x1="157" y1="162" x2="212" y2="162" />
    <line x1="102" y1="67" x2="157" y2="67" />
    
    <!-- Micro zigzag space-filling paths -->
    <path d="M 20 210 L 35 185 L 47 210 L 60 185 L 75 210 L 90 185 L 102 210 L 115 185 L 130 210 
             L 145 185 L 157 210 L 170 185 L 185 210 L 200 185 L 212 210 L 225 185 L 240 210" />
    <path d="M 130 20 L 115 45 L 102 20 L 90 45 L 75 70 L 60 95 L 47 120 L 35 145" />
    <path d="M 130 20 L 145 45 L 157 20 L 170 45 L 185 70 L 200 95 L 212 120 L 225 145" />
  </g>
  <text x="180" y="80" font-size="13" font-style="italic" font-family="serif" fill="#2b6cb0">$f_3([0, 1])$</text>
</svg>