  <!-- Main triangle -->
  <polygon points="60,260 300,260 180,52.2" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="42" y="272">A</text>
  <text x="306" y="272">B</text>
  <text x="175" y="42">C</text>

  <!-- Level 1 subdivision -->
  <polygon points="120,156.1 240,156.1 180,260" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Level 2 subdivisions (16 sub-triangles) -->
  <polygon points="90,208 150,208 120,260" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
  <polygon points="150,208 210,208 180,260" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
  <polygon points="210,208 270,208 240,260" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>
  <polygon points="150,104.1 210,104.1 180,156.1" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- Path f_3 traversing 16 sub-triangles -->
  <path d="M 60 260 L 90 242.7 L 90 208 L 120 190.7 L 150 208 L 120 225.4 L 120 260 L 150 242.7 L 180 260 
           L 150 208 L 150 156.1 L 180 138.8 L 150 104.1 L 180 86.8 L 210 104.1 L 180 121.5 L 180 156.1 
           L 210 156.1 L 180 190.7 L 210 208 L 180 225.4 L 210 242.7 L 240 260 
           L 210 208 L 240 190.7 L 270 208 L 240 225.4 L 270 242.7 L 300 260" 
        fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round"/>

  <text x="180" y="295" text-anchor="middle" fill="#dc2626" font-weight="bold">f₃([0, 1])</text>
</svg>
