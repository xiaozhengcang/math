<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="auto" style="max-width: 340px;">
  <!-- Cylindrical coordinates (r, theta, z) -->
  <line x1="140" y1="190" x2="300" y2="190" stroke="#2d3748" stroke-width="1.4" />
  <polygon points="300,188 306,190 300,192" fill="#2d3748" />
  <text x="300" y="205" font-size="13" font-style="italic" font-family="serif">y</text>

  <line x1="140" y1="190" x2="140" y2="30" stroke="#2d3748" stroke-width="1.4" />
  <polygon points="138,30 140,22 142,30" fill="#2d3748" />
  <text x="130" y="30" font-size="13" font-style="italic" font-family="serif">z</text>

  <line x1="140" y1="190" x2="60" y2="245" stroke="#2d3748" stroke-width="1.4" />
  <polygon points="58,240 52,249 63,246" fill="#2d3748" />
  <text x="50" y="240" font-size="13" font-style="italic" font-family="serif">x</text>
  <text x="128" y="202" font-size="12" font-family="serif">O</text>

  <!-- Projection point P' in xy plane -->
  <line x1="140" y1="190" x2="220" y2="215" stroke="#3182ce" stroke-width="1.8" />
  <text x="175" y="215" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">r</text>
  <path d="M 100 217 A 50 25 0 0 0 165 198" fill="none" stroke="#e53e3e" stroke-width="1.2" />
  <text x="110" y="230" font-size="12" font-style="italic" font-family="serif" fill="#c53030">θ</text>

  <!-- Point P(r, theta, z) -->
  <line x1="220" y1="215" x2="220" y2="85" stroke="#718096" stroke-width="1.4" stroke-dasharray="3,3" />
  <circle cx="220" cy="85" r="4" fill="#2b6cb0" />
  <text x="228" y="85" font-size="12" font-family="serif" fill="#2b6cb0">P(x, y, z)</text>
  <text x="228" y="150" font-size="12" font-style="italic" font-family="serif" fill="#4a5568">z</text>
</svg>