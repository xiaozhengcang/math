<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="150" y1="190" x2="150" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="160" y="28" font-style="italic">z</text>
  <line x1="150" y1="190" x2="340" y2="190" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="335" y="208" font-style="italic">y</text>
  <line x1="150" y1="190" x2="60" y2="255" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="50" y="265" font-style="italic">x</text>
  <text x="135" y="202">O</text>

  <!-- Projection P' in xy-plane: (240, 220) -->
  <line x1="150" y1="190" x2="240" y2="220" stroke="#0284c7" stroke-width="2"/>
  <circle cx="240" cy="220" r="3" fill="#0284c7"/>
  <text x="195" y="220" font-style="italic" fill="#0284c7" font-weight="bold">r</text>
  <text x="245" y="235" font-size="12" fill="#64748b">P'(r, θ, 0)</text>

  <!-- Angle theta arc from positive x-axis towards OP' -->
  <path d="M 115 215 A 40 40 0 0 0 178 199" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr_red)"/>
  <text x="130" y="235" font-style="italic" fill="#dc2626" font-weight="bold">θ</text>

  <!-- Point P(r, theta, z) at height z above P': (240, 90) -->
  <line x1="240" y1="220" x2="240" y2="90" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="240" cy="90" r="3.5" fill="#1e40af"/>
  <text x="248" y="90" font-size="14" font-style="italic" fill="#1e40af" font-weight="bold">P(r, θ, z)</text>
  <text x="246" y="160" font-style="italic" fill="#64748b">z</text>

  <!-- Horizontal projection lines to z-axis -->
  <line x1="240" y1="90" x2="150" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="150" cy="60" r="2.5" fill="#1e293b"/>
  <text x="138" y="65" font-style="italic">z</text>
</svg>
