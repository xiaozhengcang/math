<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="auto" style="max-width: 420px;">
  <!-- Rectangle R in uv -->
  <g transform="translate(20, 15)">
    <line x1="20" y1="140" x2="160" y2="140" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="160,138 166,140 160,142" fill="#2d3748" />
    <text x="162" y="155" font-size="12" font-style="italic" font-family="serif">u</text>

    <line x1="30" y1="150" x2="30" y2="15" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="28,15 30,9 32,15" fill="#2d3748" />
    <text x="20" y="17" font-size="12" font-style="italic" font-family="serif">v</text>

    <rect x="55" y="55" width="70" height="50" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5" />
    <text x="85" y="85" font-size="12" font-style="italic" font-family="serif" fill="#c05621">R</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(195, 70)">
    <path d="M 0 10 L 35 10" stroke="#3182ce" stroke-width="1.6" />
    <polygon points="33,7 40,10 33,13" fill="#3182ce" />
    <text x="12" y="-4" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">T</text>
  </g>

  <!-- Curvilinear patch T(R) in xy -->
  <g transform="translate(250, 15)">
    <line x1="20" y1="140" x2="160" y2="140" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="160,138 166,140 160,142" fill="#2d3748" />
    <text x="162" y="155" font-size="12" font-style="italic" font-family="serif">x</text>

    <line x1="30" y1="150" x2="30" y2="15" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="28,15 30,9 32,15" fill="#2d3748" />
    <text x="20" y="17" font-size="12" font-style="italic" font-family="serif">y</text>

    <path d="M 55 105 C 75 95, 105 90, 125 80 L 140 45 C 115 55, 85 60, 70 70 Z" 
          fill="#feebc8" stroke="#dd6b20" stroke-width="1.5" />
    <text x="88" y="80" font-size="12" font-style="italic" font-family="serif" fill="#c05621">T(R)</text>
  </g>
</svg>