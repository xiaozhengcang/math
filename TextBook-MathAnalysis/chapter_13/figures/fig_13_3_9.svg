<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="100%" height="auto" style="max-width:460px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Left: rectangle R in uv -->
  <g transform="translate(25, 15)">
    <line x1="20" y1="150" x2="165" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="160" y="168" font-style="italic">u</text>
    <line x1="35" y1="165" x2="35" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="25" font-style="italic">v</text>

    <!-- Rectangle R = [e, f] x [g, h] -->
    <rect x="65" y="55" width="70" height="60" fill="#fed7aa" fill-opacity="0.65" stroke="#d97706" stroke-width="1.6"/>
    <line x1="65" y1="147" x2="65" y2="153" stroke="#1e293b" stroke-width="1.2"/>
    <text x="62" y="168" font-style="italic">e</text>
    <line x1="135" y1="147" x2="135" y2="153" stroke="#1e293b" stroke-width="1.2"/>
    <text x="132" y="168" font-style="italic">f</text>
    <line x1="32" y1="115" x2="38" y2="115" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="120" font-style="italic">g</text>
    <line x1="32" y1="55" x2="38" y2="55" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="60" font-style="italic">h</text>

    <text x="100" y="90" font-size="15" font-style="italic" fill="#b45309" font-weight="bold" text-anchor="middle">R</text>
  </g>

  <!-- Arrow T -->
  <g transform="translate(210, 80)">
    <path d="M 0 10 L 40 10" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
    <text x="15" y="-4" font-style="italic" fill="#1e40af" font-weight="bold">T</text>
  </g>

  <!-- Right: patch T(R) in xy -->
  <g transform="translate(275, 15)">
    <line x1="20" y1="150" x2="165" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="160" y="168" font-style="italic">x</text>
    <line x1="35" y1="165" x2="35" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="25" font-style="italic">y</text>

    <!-- T(R) bounded by x=e, x=f, y=y(x,g), y=y(x,h) -->
    <path d="M 65 115 C 85 105, 115 100, 135 90 L 135 45 C 110 55, 80 60, 65 70 Z" 
          fill="#fed7aa" fill-opacity="0.65" stroke="#d97706" stroke-width="1.6"/>
    <line x1="65" y1="147" x2="65" y2="153" stroke="#1e293b" stroke-width="1.2"/>
    <text x="62" y="168" font-style="italic">e</text>
    <line x1="135" y1="147" x2="135" y2="153" stroke="#1e293b" stroke-width="1.2"/>
    <text x="132" y="168" font-style="italic">f</text>

    <text x="95" y="85" font-size="14" font-style="italic" fill="#b45309" font-weight="bold">T(R)</text>
    <text x="70" y="45" font-size="11" fill="#64748b">y = y(x, h)</text>
    <text x="70" y="132" font-size="11" fill="#64748b">y = y(x, g)</text>
  </g>
</svg>
