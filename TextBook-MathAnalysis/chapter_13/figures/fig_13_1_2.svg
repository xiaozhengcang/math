<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="210" x2="350" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="228" font-style="italic">x</text>
  <line x1="55" y1="225" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="225">O</text>

  <!-- Shaded region D under curve between a and b -->
  <path d="M 105 210 L 105 145 C 145 105, 210 85, 290 60 L 290 210 Z" fill="#e0f2fe" stroke="none"/>

  <!-- Ordinate lines at x=a and x=b -->
  <line x1="105" y1="210" x2="105" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="290" y1="210" x2="290" y2="60" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Function curve y = f(x) -->
  <path d="M 75 175 C 125 125, 205 90, 325 50" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- Ticks and labels -->
  <line x1="105" y1="207" x2="105" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="101" y="228" font-style="italic">a</text>
  <line x1="290" y1="207" x2="290" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="286" y="228" font-style="italic">b</text>

  <text x="190" y="155" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">D</text>
  <text x="260" y="45" font-style="italic" fill="#1e40af">y = f(x)</text>
</svg>
