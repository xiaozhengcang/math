<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="auto" style="max-width: 380px;">
  <!-- Coordinate axes -->
  <line x1="30" y1="200" x2="350" y2="200" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="350,197 358,200 350,203" fill="#2d3748" />
  <text x="355" y="215" font-size="14" font-style="italic" font-family="serif">x</text>

  <line x1="60" y1="220" x2="60" y2="30" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="57,30 60,22 63,30" fill="#2d3748" />
  <text x="45" y="32" font-size="14" font-style="italic" font-family="serif">y</text>
  <text x="48" y="215" font-size="13" font-family="serif">O</text>

  <!-- Curve y = f(x) -->
  <!-- Shaded region D under curve between a and b -->
  <path d="M 110 200 L 110 140 C 150 100, 220 80, 290 60 L 290 200 Z" fill="#ebf8ff" stroke="none" />

  <!-- Ordinate lines at x=a and x=b -->
  <line x1="110" y1="200" x2="110" y2="140" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="290" y1="200" x2="290" y2="60" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Function curve -->
  <path d="M 80 165 C 130 120, 210 85, 320 55" fill="none" stroke="#2b6cb0" stroke-width="2.2" />

  <!-- Ticks and labels -->
  <circle cx="110" cy="200" r="2.5" fill="#2d3748" />
  <text x="106" y="218" font-size="13" font-style="italic" font-family="serif">a</text>
  <circle cx="290" cy="200" r="2.5" fill="#2d3748" />
  <text x="286" y="218" font-size="13" font-style="italic" font-family="serif">b</text>

  <text x="190" y="150" font-size="16" font-style="italic" font-family="serif" fill="#2b6cb0">D</text>
  <text x="250" y="50" font-size="14" font-style="italic" font-family="serif" fill="#2b6cb0">y = f(x)</text>
</svg>