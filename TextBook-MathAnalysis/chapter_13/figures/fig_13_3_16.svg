<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- z-axis passing horizontally/vertically: let's align along horizontal for clarity -->
  <line x1="20" y1="130" x2="370" y2="130" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="365" y="148" font-style="italic">z</text>

  <!-- Solid sphere of radius R centered at O(120, 130) -->
  <circle cx="120" cy="130" r="75" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="120" cy="130" r="3" fill="#1e293b"/>
  <text x="112" y="150">O</text>

  <!-- Radius R line -->
  <line x1="120" y1="130" x2="67" y2="77" stroke="#64748b" stroke-width="1.2"/>
  <text x="85" y="98" font-style="italic">R</text>

  <!-- External point P_0(0, 0, s) at (320, 130) -->
  <circle cx="320" cy="130" r="4" fill="#dc2626"/>
  <text x="310" y="115" font-style="italic" fill="#dc2626" font-weight="bold">P₀(0, 0, s)</text>

  <!-- Volume element dV inside sphere at P(x, y, z): (150, 95) -->
  <circle cx="150" cy="95" r="3.5" fill="#0284c7"/>
  <text x="130" y="85" font-size="12" fill="#0284c7">dV(x, y, z)</text>

  <!-- Attraction vector from P_0 toward dV or dF -->
  <line x1="150" y1="95" x2="320" y2="130" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="320" y1="130" x2="260" y2="118" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="270" y="110" font-style="italic" fill="#dc2626" font-weight="bold">dF</text>
  <text x="225" y="105" font-size="12" font-style="italic" fill="#0284c7">r_P</text>
</svg>
