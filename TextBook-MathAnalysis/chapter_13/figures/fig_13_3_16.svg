<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="auto" style="max-width: 380px;">
  <!-- Gravitational field of solid sphere on point P -->
  <line x1="20" y1="120" x2="350" y2="120" stroke="#2d3748" stroke-width="1.2" stroke-dasharray="4,4" />
  
  <!-- Solid sphere -->
  <circle cx="120" cy="120" r="70" fill="#e2e8f0" stroke="#4a5568" stroke-width="2" />
  <circle cx="120" cy="120" r="3" fill="#2d3748" />
  <text x="115" y="140" font-size="12" font-family="serif">O</text>
  <text x="65" y="105" font-size="12" font-style="italic" font-family="serif">R</text>

  <!-- External Point P -->
  <circle cx="310" cy="120" r="4" fill="#e53e3e" />
  <text x="315" y="115" font-size="13" font-family="serif" fill="#c53030">P(0, 0, s)</text>

  <!-- Volume element dV inside sphere -->
  <circle cx="150" cy="85" r="4" fill="#3182ce" />
  <text x="156" y="80" font-size="11" font-family="serif" fill="#2b6cb0">dV(x,y,z)</text>
  <line x1="150" y1="85" x2="310" y2="120" stroke="#3182ce" stroke-width="1.5" />
  <text x="230" y="95" font-size="11" font-style="italic" font-family="serif" fill="#2b6cb0">r_P</text>
</svg>