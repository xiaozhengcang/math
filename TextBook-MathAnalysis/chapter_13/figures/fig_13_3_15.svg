<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="180" y1="230" x2="180" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="190" y="28" font-style="italic">z</text>
  <line x1="180" y1="135" x2="345" y2="135" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="340" y="153" font-style="italic">y</text>
  <line x1="180" y1="135" x2="80" y2="225" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="70" y="235" font-style="italic">x</text>
  <text x="165" y="148">O</text>

  <!-- 3D Ellipsoid: center (180, 135) -->
  <!-- Outer silhouette ellipse: rx = 95, ry = 65 -->
  <ellipse cx="180" cy="135" rx="95" ry="65" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="2"/>

  <!-- Horizontal equator ellipse (xy plane): rx = 95, ry = 25 -->
  <path d="M 85 135 C 85 152, 275 152, 275 135" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 85 135 C 85 118, 275 118, 275 135" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Vertical meridian ellipse (yz plane): rx = 25, ry = 65 -->
  <path d="M 180 70 C 198 70, 198 200, 180 200" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M 180 70 C 162 70, 162 200, 180 200" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Semi-axes ticks and labels -->
  <!-- c on z-axis -->
  <line x1="175" y1="70" x2="185" y2="70" stroke="#1e293b" stroke-width="1.2"/>
  <text x="165" y="75" font-style="italic">c</text>
  <!-- b on y-axis -->
  <line x1="275" y1="132" x2="275" y2="138" stroke="#1e293b" stroke-width="1.2"/>
  <text x="278" y="150" font-style="italic">b</text>
  <!-- a on x-axis projection: (120, 189) -->
  <line x1="117" y1="185" x2="123" y2="193" stroke="#1e293b" stroke-width="1.2"/>
  <text x="105" y="200" font-style="italic">a</text>

  <text x="205" y="115" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">Ω</text>
  <text x="190" y="235" font-size="12" font-style="italic" fill="#64748b">x²/a² + y²/b² + z²/c² ≤ 1</text>
</svg>
