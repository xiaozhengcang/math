<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="auto" style="max-width: 300px;">
  <!-- Exhaustion of R^2 by concentric disks -->
  <line x1="20" y1="100" x2="270" y2="100" stroke="#2d3748" stroke-width="1.2" />
  <line x1="140" y1="185" x2="140" y2="15" stroke="#2d3748" stroke-width="1.2" />
  
  <circle cx="140" cy="100" r="35" fill="none" stroke="#3182ce" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="140" cy="100" r="60" fill="none" stroke="#3182ce" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="140" cy="100" r="85" fill="none" stroke="#3182ce" stroke-width="1.5" />
  <text x="180" y="95" font-size="11" font-style="italic" font-family="serif">r_1</text>
  <text x="205" y="95" font-size="11" font-style="italic" font-family="serif">r_2</text>
  <text x="230" y="95" font-size="11" font-style="italic" font-family="serif">r_n</text>
</svg>