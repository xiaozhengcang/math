<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (80, 140), scale: 1 unit = 50 px -->
  <line x1="40" y1="140" x2="350" y2="140" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="158" font-style="italic">x</text>
  <line x1="80" y1="245" x2="80" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="68" y="30" font-style="italic">y</text>
  <text x="68" y="155">O</text>

  <!-- Coordinates:
       (0, 0) -> (80, 140)
       (1, 1) -> (130, 90)
       (1, -1) -> (130, 190)
       (4, 2) -> (280, 40)
  -->

  <!-- Region D1: x in [0, 1], y in [-x, sqrt(x)] -->
  <path d="M 80 140 C 95 110, 112 95, 130 90 L 130 190 Z" fill="#bae6fd" fill-opacity="0.65" stroke="none"/>

  <!-- Region D2: x in [1, 4], y in [x-2, sqrt(x)] -->
  <path d="M 130 90 C 170 70, 225 50, 280 40 L 130 190 Z" fill="#fed7aa" fill-opacity="0.55" stroke="none"/>

  <!-- Upper curve y = sqrt(x) from x=0 to x=4 -->
  <path d="M 80 140 C 95 110, 112 95, 130 90 C 170 70, 225 50, 280 40" fill="none" stroke="#1e40af" stroke-width="2"/>
  <text x="215" y="45" font-style="italic" fill="#1e40af">y = √x</text>

  <!-- Line y = -x from x=0 to x=1 -->
  <line x1="80" y1="140" x2="130" y2="190" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="195" font-style="italic" fill="#dc2626">y = -x</text>

  <!-- Line y = x - 2 from x=1 to x=4 -->
  <line x1="130" y1="190" x2="280" y2="40" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="130" font-style="italic" fill="#d97706">y = x - 2</text>

  <!-- Dividing dashed line at x = 1 -->
  <line x1="130" y1="90" x2="130" y2="190" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="130" y1="137" x2="130" y2="143" stroke="#1e293b" stroke-width="1.2"/>
  <text x="126" y="155">1</text>

  <!-- Tick at x = 4 -->
  <line x1="280" y1="137" x2="280" y2="143" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="280" y1="40" x2="280" y2="140" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="276" y="155">4</text>

  <!-- Intersection points -->
  <circle cx="130" cy="190" r="3" fill="#1e293b"/>
  <text x="135" y="205" font-size="12">(1, -1)</text>
  <circle cx="280" cy="40" r="3" fill="#1e293b"/>
  <text x="285" y="38" font-size="12">(4, 2)</text>

  <!-- Region Labels -->
  <text x="108" y="135" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">D₁</text>
  <text x="175" y="105" font-size="16" font-style="italic" fill="#b45309" font-weight="bold">D₂</text>
</svg>
