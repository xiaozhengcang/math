<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width: 340px;">
  <!-- Axes -->
  <line x1="30" y1="150" x2="310" y2="150" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="310,147 318,150 310,153" fill="#2d3748" />
  <text x="310" y="166" font-size="13" font-style="italic" font-family="serif">x</text>

  <line x1="70" y1="210" x2="70" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="67,20 70,12 73,20" fill="#2d3748" />
  <text x="58" y="24" font-size="13" font-style="italic" font-family="serif">y</text>
  <text x="56" y="162" font-size="12" font-family="serif">O</text>

  <!-- Parabola y^2 = x, vertex at (70, 150) -->
  <!-- Line y = x - 2: at x=1, y=-1; at x=4, y=2 -->
  <!-- Scale: 1 unit = 35 px. Origin = (70, 150). x=1 -> 105, x=4 -> 210. y=1 -> 115, y=2 -> 80, y=-1 -> 185 -->
  <!-- Shaded region D1: x from 0 to 1, y from -sqrt(x) to sqrt(x) -->
  <path d="M 70 150 C 85 130, 95 120, 105 115 L 105 185 C 95 180, 85 170, 70 150 Z" fill="#bee3f8" fill-opacity="0.6" stroke="none" />
  <!-- Shaded region D2: x from 1 to 4, y from x-2 to sqrt(x) -->
  <path d="M 105 115 C 145 95, 180 85, 210 80 L 105 185 Z" fill="#ebf8ff" fill-opacity="0.6" stroke="none" />

  <!-- Parabola curve y^2 = x -->
  <path d="M 230 70 C 130 90, 70 140, 70 150 C 70 160, 130 210, 230 230" fill="none" stroke="#2b6cb0" stroke-width="2" />
  <!-- Line y = x - 2 -->
  <line x1="85" y1="205" x2="240" y2="50" stroke="#c53030" stroke-width="1.8" />

  <!-- Dividing line x = 1 -->
  <line x1="105" y1="110" x2="105" y2="190" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="3,3" />

  <!-- Ticks -->
  <circle cx="105" cy="150" r="2" fill="#2d3748" />
  <text x="100" y="165" font-size="11" font-family="serif">1</text>
  <circle cx="140" cy="150" r="2" fill="#2d3748" />
  <text x="138" y="165" font-size="11" font-family="serif">2</text>
  <circle cx="210" cy="150" r="2" fill="#2d3748" />
  <text x="208" y="165" font-size="11" font-family="serif">4</text>

  <!-- Labels -->
  <text x="88" y="145" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">D₁</text>
  <text x="135" y="135" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">D₂</text>
  <text x="95" y="90" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">y² = x</text>
  <text x="195" y="140" font-size="12" font-style="italic" font-family="serif" fill="#c53030">y = x - 2</text>
</svg>