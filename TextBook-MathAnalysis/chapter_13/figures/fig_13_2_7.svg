<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="160" y1="150" x2="160" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="170" y="28" font-style="italic">z</text>
  <line x1="160" y1="150" x2="380" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="375" y="168" font-style="italic">y</text>
  <line x1="160" y1="150" x2="80" y2="245" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="70" y="260" font-style="italic">x</text>
  <text x="145" y="162">O</text>

  <!-- Plane cuts z-axis at (0, 0, 2): (160, 60) -->
  <circle cx="160" cy="60" r="2.5" fill="#1e293b"/>
  <text x="148" y="65">2</text>

  <!-- Base region on xy-plane bounded by 2y^2 = x and line x/4 + y/2 = 1 -->
  <!-- Intersections: (2, 1, 0) and (8, -2, 0) -->
  <!-- Project (x, y) to 2D: px = 160 + 35*y - 10*x, py = 150 + 12*x -->
  <!-- (0,0): (160, 150) -->
  <!-- (2, 1): 160 + 35 - 20 = 175, 150 + 24 = 174 -->
  <!-- (8, -2): 160 - 70 - 80 = 10, 150 + 96 = 246 (adjusted scaling for nice view) -->
  <!-- Let's use clean artistic 3D projection:
       O = (160, 150)
       y-axis direction: (1, 0)
       x-axis direction: (-0.7, 0.7)
       z-axis direction: (0, -1)
       (2, 1, 0) -> (160 + 50 - 28, 150 + 28) = (182, 178)
       (8, -2, 0) -> (160 - 100 - 112, 150 + 112) = (100, 240)
  -->
  <path d="M 160 150 Q 170 165 182 178 L 100 240 Q 120 195 160 150 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Solid surface and top inclined face -->
  <path d="M 160 60 L 182 178 L 100 240 Z" fill="#bae6fd" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.8"/>
  <path d="M 160 60 Q 160 110 160 150" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>

  <!-- Parabolic cylinder curved side -->
  <path d="M 160 60 Q 170 115 182 178 Q 170 165 160 150 Z" fill="#e0f2fe" fill-opacity="0.5" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="190" y="185" font-size="12">(2, 1, 0)</text>
  <text x="60" y="248" font-size="12">(8, -2, 0)</text>
  <text x="210" y="110" font-size="13" font-style="italic" fill="#0284c7">x/4 + y/2 + z/2 = 1</text>
  <text x="110" y="195" font-size="13" font-style="italic" fill="#1e40af">2y² = x</text>
</svg>
