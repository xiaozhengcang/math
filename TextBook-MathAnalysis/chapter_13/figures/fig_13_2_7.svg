<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width: 360px;">
  <!-- Axes -->
  <line x1="160" y1="130" x2="330" y2="130" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="330,127 338,130 330,133" fill="#2d3748" />
  <text x="335" y="144" font-size="13" font-style="italic" font-family="serif">y</text>

  <line x1="160" y1="170" x2="160" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="157,20 160,12 163,20" fill="#2d3748" />
  <text x="168" y="24" font-size="13" font-style="italic" font-family="serif">z</text>

  <line x1="160" y1="130" x2="90" y2="205" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="88,200 82,210 93,206" fill="#2d3748" />
  <text x="85" y="222" font-size="13" font-style="italic" font-family="serif">x</text>
  <text x="146" y="142" font-size="12" font-family="serif">O</text>

  <!-- Parabolic cylinder 2y^2 = x intersected by plane x/4 + y/2 + z/2 = 1 -->
  <!-- Apex at z=2 on z-axis (160, 50) -->
  <!-- Base on xy plane: parabola 2y^2 = x and line x/4 + y/2 = 1 -->
  <!-- Intersection points: (2, 1, 0) and (8, -2, 0) -->
  <path d="M 160 50 C 210 55, 270 85, 270 145 C 230 165, 140 185, 110 175 Z" fill="#ebf8ff" fill-opacity="0.6" stroke="#2b6cb0" stroke-width="1.8" />
  <path d="M 160 130 C 190 135, 230 140, 270 145" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" fill="none" />
  <line x1="160" y1="50" x2="160" y2="130" stroke="#718096" stroke-width="1" stroke-dasharray="3,3" />

  <text x="275" y="150" font-size="11" font-family="serif">(2, 1, 0)</text>
  <text x="95" y="190" font-size="11" font-family="serif">(8, -2, 0)</text>
  <text x="270" y="70" font-size="11" font-style="italic" font-family="serif" fill="#2b6cb0">2y² = x</text>
  <text x="80" y="60" font-size="11" font-style="italic" font-family="serif" fill="#2b6cb0">$\frac{x}{4}+\frac{y}{2}+\frac{z}{2}=1$</text>
</svg>