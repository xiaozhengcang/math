<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width: 380px;">
  <!-- Axes -->
  <line x1="120" y1="210" x2="340" y2="210" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="340,207 348,210 340,213" fill="#2d3748" />
  <text x="345" y="225" font-size="13" font-style="italic" font-family="serif">x</text>

  <line x1="120" y1="210" x2="120" y2="30" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="117,30 120,22 123,30" fill="#2d3748" />
  <text x="108" y="32" font-size="13" font-style="italic" font-family="serif">z</text>

  <line x1="120" y1="210" x2="50" y2="250" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="48,245 42,255 53,251" fill="#2d3748" />
  <text x="45" y="240" font-size="13" font-style="italic" font-family="serif">y</text>
  <text x="110" y="222" font-size="12" font-family="serif">O</text>

  <!-- Bounding prism base [a, b] x [c, d] -->
  <line x1="170" y1="210" x2="140" y2="235" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="290" y1="210" x2="260" y2="235" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="140" y1="235" x2="260" y2="235" stroke="#718096" stroke-width="1.2" />

  <!-- Back vertical pillars -->
  <line x1="170" y1="210" x2="170" y2="90" stroke="#718096" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="290" y1="210" x2="290" y2="120" stroke="#718096" stroke-width="1" stroke-dasharray="3,3" />
  <!-- Front vertical pillars -->
  <line x1="140" y1="235" x2="140" y2="115" stroke="#718096" stroke-width="1.2" />
  <line x1="260" y1="235" x2="260" y2="145" stroke="#718096" stroke-width="1.2" />

  <!-- Top surface z = f(x, y) -->
  <path d="M 140 115 C 170 85, 230 95, 260 145" fill="none" stroke="#2b6cb0" stroke-width="1.8" />
  <path d="M 170 90 C 200 65, 260 75, 290 120" fill="none" stroke="#2b6cb0" stroke-width="1.8" />
  <path d="M 140 115 C 150 100, 160 90, 170 90" fill="none" stroke="#2b6cb0" stroke-width="1.8" />
  <path d="M 260 145 C 270 130, 280 120, 290 120" fill="none" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Cross section at x with area A(x) -->
  <line x1="215" y1="210" x2="185" y2="235" stroke="#e53e3e" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="215" y1="210" x2="215" y2="78" stroke="#e53e3e" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="185" y1="235" x2="185" y2="100" stroke="#e53e3e" stroke-width="1.2" />
  <path d="M 185 100 C 195 88, 205 80, 215 78" fill="none" stroke="#e53e3e" stroke-width="1.5" />
  <!-- Shaded cross-section A(x) -->
  <path d="M 215 210 L 185 235 L 185 100 C 195 88, 205 80, 215 78 Z" fill="#feb2b2" fill-opacity="0.35" stroke="none" />

  <!-- Labels -->
  <text x="168" y="224" font-size="12" font-style="italic" font-family="serif">a</text>
  <text x="213" y="224" font-size="12" font-style="italic" font-family="serif">x</text>
  <text x="288" y="224" font-size="12" font-style="italic" font-family="serif">b</text>
  <text x="190" y="145" font-size="12" font-family="serif" fill="#c53030">A(x)</text>
  <text x="255" y="70" font-size="13" font-style="italic" font-family="serif" fill="#2b6cb0">z = f(x, y)</text>
</svg>