<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="120" y1="260" x2="120" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="130" y="28" font-style="italic">z</text>
  <line x1="120" y1="200" x2="410" y2="200" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="405" y="218" font-style="italic">y</text>
  <line x1="120" y1="200" x2="35" y2="265" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="25" y="280" font-style="italic">x</text>
  <text x="105" y="212">O</text>

  <!-- Rectangular base [a, b] x [c, d] in xy plane -->
  <!-- a=(95, 220), b=(60, 245) along x-axis projection -->
  <!-- c at y=170, d at y=330 -->
  <!-- Base vertices: A=(95, 220), B=(60, 245), C=(270, 245), D=(305, 220) -->
  <polygon points="95,220 60,245 270,245 305,220" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="80" y="232" font-style="italic" fill="#64748b">a</text>
  <text x="45" y="258" font-style="italic" fill="#64748b">b</text>
  <text x="165" y="215" font-style="italic" fill="#64748b">c</text>
  <text x="310" y="215" font-style="italic" fill="#64748b">d</text>

  <!-- Vertical pillars at 4 corners -->
  <line x1="95" y1="220" x2="95" y2="125" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="60" y1="245" x2="60" y2="140" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="270" y1="245" x2="270" y2="110" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="305" y1="220" x2="305" y2="90" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Top surface z = f(x, y) -->
  <path d="M 95 125 C 150 110, 250 100, 305 90 L 270 110 C 200 125, 120 135, 60 140 Z" fill="#e0f2fe" fill-opacity="0.4" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Slice plane at x: x0=(78, 232) -->
  <!-- Base of slice: line from (78, 232) to (288, 232) -->
  <!-- Slice top curve: from (78, 132) to (288, 100) -->
  <polygon points="78,232 288,232 288,100 78,132" fill="#bae6fd" fill-opacity="0.75" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="78" y1="232" x2="78" y2="132" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="288" y1="232" x2="288" y2="100" stroke="#0284c7" stroke-width="1.5"/>
  
  <text x="68" y="248" font-style="italic" fill="#0284c7" font-weight="bold">x</text>
  <text x="175" y="170" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">A(x)</text>
  <text x="260" y="80" font-style="italic" fill="#1e40af">z = f(x, y)</text>
</svg>
