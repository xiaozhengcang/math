<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="auto" style="max-width: 320px;">
  <!-- Axes -->
  <line x1="120" y1="140" x2="300" y2="140" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="300,137 308,140 300,143" fill="#2d3748" />
  <text x="305" y="152" font-size="13" font-style="italic" font-family="serif">y</text>

  <line x1="120" y1="180" x2="120" y2="30" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="117,30 120,22 123,30" fill="#2d3748" />
  <text x="126" y="32" font-size="13" font-style="italic" font-family="serif">z</text>

  <line x1="120" y1="140" x2="50" y2="200" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="48,195 42,205 53,201" fill="#2d3748" />
  <text x="45" y="215" font-size="13" font-style="italic" font-family="serif">x</text>
  <text x="108" y="145" font-size="12" font-family="serif">O</text>

  <!-- Region bounded by z = xy, x+y=1, z=0 -->
  <!-- Base on xy: triangle between (0,0), (1,0), (0,1) -->
  <line x1="75" y1="180" x2="220" y2="140" stroke="#4a5568" stroke-width="1.5" />
  <!-- Surface z = xy over this triangle -->
  <path d="M 120 140 Q 150 135 220 140 L 160 85 Q 110 115 75 180 Z" fill="#ebf8ff" fill-opacity="0.6" stroke="#2b6cb0" stroke-width="1.6" />
  <!-- Saddle line on surface -->
  <path d="M 75 180 Q 140 140 220 140" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3,3" />

  <text x="210" y="90" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">z = xy</text>
  <text x="180" y="165" font-size="11" font-style="italic" font-family="serif">x + y = 1</text>
</svg>