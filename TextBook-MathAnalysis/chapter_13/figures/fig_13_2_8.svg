<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="120" y1="160" x2="120" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="130" y="28" font-style="italic">z</text>
  <line x1="120" y1="160" x2="330" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="178" font-style="italic">y</text>
  <line x1="120" y1="160" x2="45" y2="235" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="35" y="245" font-style="italic">x</text>
  <text x="105" y="172">O</text>

  <!-- Triangle base on xy-plane: (0,0)->(120,160), (1,0)->(70,210), (0,1)->(240,160) -->
  <polygon points="120,160 70,210 240,160" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="55" y="215" font-style="italic">1</text>
  <text x="240" y="178" font-style="italic">1</text>
  <text x="160" y="200" font-size="12" font-style="italic" fill="#64748b">x + y = 1</text>

  <!-- Surface z = xy over this triangle:
       Along x=0, z=0; along y=0, z=0.
       Along x+y=1, z = x(1-x), parabolic arch peaking at (1/2, 1/2) with z = 1/4.
       Midpoint on base: (155, 185), rises upward by 55px to peak (155, 130).
  -->
  <path d="M 70 210 Q 155 125 240 160 L 120 160 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="1.8"/>

  <!-- Contour / wireframe lines on saddle patch -->
  <path d="M 95 185 Q 155 145 180 160" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
  <path d="M 85 195 Q 130 160 200 160" fill="none" stroke="#60a5fa" stroke-width="1.2"/>

  <!-- Peak point mark -->
  <circle cx="155" cy="140" r="2.5" fill="#dc2626"/>
  <text x="162" y="135" font-size="12" fill="#dc2626">z = 1/4</text>

  <text x="195" y="90" font-size="15" font-style="italic" fill="#1e40af" font-weight="bold">z = xy</text>
</svg>
