<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="100%" height="auto" style="max-width: 460px;">
  <!-- Left: sigma in uv -->
  <g transform="translate(20, 15)">
    <line x1="20" y1="150" x2="160" y2="150" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="160,148 166,150 160,152" fill="#2d3748" />
    <text x="162" y="165" font-size="12" font-style="italic" font-family="serif">u</text>

    <line x1="30" y1="160" x2="30" y2="20" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="28,20 30,14 32,20" fill="#2d3748" />
    <text x="18" y="22" font-size="12" font-style="italic" font-family="serif">v</text>

    <path d="M 65 110 C 60 75, 95 65, 120 80 C 135 90, 130 120, 105 125 C 85 130, 70 125, 65 110 Z" 
          fill="#bee3f8" fill-opacity="0.6" stroke="#3182ce" stroke-width="1.5" />
    <circle cx="95" cy="95" r="3" fill="#e53e3e" />
    <text x="85" y="112" font-size="12" font-style="italic" font-family="serif" fill="#2c5282">σ</text>
    <text x="96" y="93" font-size="10" font-family="serif" fill="#c53030">(u₀, v₀)</text>
  </g>

  <!-- Arrow T -->
  <g transform="translate(205, 80)">
    <path d="M 0 10 Q 20 -5 40 10" fill="none" stroke="#3182ce" stroke-width="1.8" />
    <polygon points="38,4 46,12 36,15" fill="#3182ce" />
    <text x="16" y="-3" font-size="13" font-style="italic" font-family="serif" fill="#2b6cb0">T</text>
  </g>

  <!-- Right: T(sigma) in xy -->
  <g transform="translate(270, 15)">
    <line x1="20" y1="150" x2="160" y2="150" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="160,148 166,150 160,152" fill="#2d3748" />
    <text x="162" y="165" font-size="12" font-style="italic" font-family="serif">x</text>

    <line x1="30" y1="160" x2="30" y2="20" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="28,20 30,14 32,20" fill="#2d3748" />
    <text x="18" y="22" font-size="12" font-style="italic" font-family="serif">y</text>

    <path d="M 60 120 C 70 70, 110 50, 140 75 C 155 95, 145 135, 110 135 C 80 135, 55 140, 60 120 Z" 
          fill="#feebc8" fill-opacity="0.6" stroke="#dd6b20" stroke-width="1.5" />
    <circle cx="102" cy="98" r="3" fill="#e53e3e" />
    <text x="88" y="112" font-size="12" font-style="italic" font-family="serif" fill="#c05621">T(σ)</text>
    <text x="104" y="96" font-size="10" font-family="serif" fill="#c53030">(x₀, y₀)</text>
  </g>
</svg>