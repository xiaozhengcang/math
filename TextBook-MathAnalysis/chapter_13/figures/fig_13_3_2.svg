<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="100%" height="auto" style="max-width:480px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Left panel: uv plane -->
  <g transform="translate(25, 15)">
    <line x1="20" y1="160" x2="170" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="165" y="178" font-style="italic">u</text>
    <line x1="35" y1="175" x2="35" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="25" font-style="italic">v</text>

    <!-- Patch sigma -->
    <path d="M 65 115 C 60 75, 95 65, 125 80 C 140 95, 130 125, 105 130 C 85 135, 70 130, 65 115 Z" 
          fill="#bae6fd" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="98" cy="98" r="3" fill="#dc2626"/>
    <text x="80" y="115" font-size="15" font-style="italic" fill="#0369a1" font-weight="bold">σ</text>
    <text x="104" y="96" font-size="11" fill="#dc2626">(u₀, v₀)</text>
  </g>

  <!-- Arrow T -->
  <g transform="translate(215, 85)">
    <path d="M 0 10 Q 20 -5 40 10" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
    <text x="18" y="-4" font-style="italic" fill="#1e40af" font-weight="bold">T</text>
    <text x="-5" y="32" font-size="12" fill="#64748b">m T(σ) ≈ |J| m σ</text>
  </g>

  <!-- Right panel: xy plane with T(sigma) -->
  <g transform="translate(285, 15)">
    <line x1="20" y1="160" x2="170" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="165" y="178" font-style="italic">x</text>
    <line x1="35" y1="175" x2="35" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="25" font-style="italic">y</text>

    <!-- Patch T(sigma) -->
    <path d="M 60 125 C 70 70, 115 50, 145 75 C 160 100, 150 140, 115 140 C 80 140, 55 145, 60 125 Z" 
          fill="#fed7aa" fill-opacity="0.65" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="106" cy="100" r="3" fill="#dc2626"/>
    <text x="85" y="115" font-size="15" font-style="italic" fill="#b45309" font-weight="bold">T(σ)</text>
    <text x="112" y="98" font-size="11" fill="#dc2626">(x₀, y₀)</text>
  </g>
</svg>
