<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="auto" style="max-width: 300px;">
  <!-- Sphere and cone intersection (ice cream cone region) -->
  <line x1="150" y1="210" x2="150" y2="20" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="148,20 150,14 152,20" fill="#2d3748" />
  <text x="140" y="24" font-size="12" font-style="italic" font-family="serif">z</text>
  <line x1="60" y1="210" x2="240" y2="210" stroke="#2d3748" stroke-width="1.2" />

  <!-- Cone sides -->
  <line x1="150" y1="210" x2="95" y2="95" stroke="#dd6b20" stroke-width="1.8" />
  <line x1="150" y1="210" x2="205" y2="95" stroke="#dd6b20" stroke-width="1.8" />
  <!-- Spherical cap top -->
  <path d="M 95 95 C 95 40, 205 40, 205 95" fill="#feebc8" fill-opacity="0.6" stroke="#c05621" stroke-width="1.8" />
  <ellipse cx="150" cy="95" rx="55" ry="14" fill="#feebc8" fill-opacity="0.3" stroke="#718096" stroke-dasharray="2,2" />
  <text x="155" y="125" font-size="12" font-style="italic" font-family="serif" fill="#c05621">Ω</text>
</svg>