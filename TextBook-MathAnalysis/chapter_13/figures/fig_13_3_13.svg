<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="160" y1="250" x2="160" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="170" y="25" font-style="italic">z</text>
  <line x1="160" y1="220" x2="310" y2="220" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="238" font-style="italic">y</text>
  <line x1="160" y1="220" x2="85" y2="265" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="75" y="275" font-style="italic">x</text>
  <text x="145" y="232">O</text>

  <!-- Cone sides: apex at (160, 220), intersecting sphere at height z = R (y = 135) -->
  <!-- Intersection circle: rx = 65, ry = 20 at y = 135 -->
  <!-- Spherical dome on top: from z=R to z=2R (y=50) -->

  <!-- Solid Omega fill: cone + dome -->
  <path d="M 160 220 L 95 135 C 95 65, 225 65, 225 135 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Intersection rim -->
  <ellipse cx="160" cy="135" rx="65" ry="20" fill="#bae6fd" fill-opacity="0.4" stroke="#64748b" stroke-dasharray="3,3"/>

  <!-- Sphere top mark 2R -->
  <circle cx="160" cy="50" r="2.5" fill="#1e293b"/>
  <text x="135" y="55" font-style="italic">2R</text>

  <!-- Center of sphere at (160, 135) -->
  <circle cx="160" cy="135" r="2.5" fill="#1e293b"/>
  <text x="145" y="140" font-style="italic">R</text>

  <!-- Cone generator label -->
  <text x="210" y="195" font-size="12" font-style="italic" fill="#1e40af">z = √(x² + y²)</text>
  <text x="180" y="75" font-size="12" font-style="italic" fill="#0284c7">x² + y² + z² = 2Rz</text>
  <text x="155" y="165" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Ω</text>
</svg>
