<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="160" y1="235" x2="160" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="170" y="28" font-style="italic">z</text>
  <line x1="160" y1="200" x2="330" y2="200" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="218" font-style="italic">y</text>
  <line x1="160" y1="200" x2="80" y2="255" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="70" y="265" font-style="italic">x</text>
  <text x="145" y="212">O</text>

  <!-- Paraboloid bottom surface: apex at (160, 200), opening up to intersection circle at z = 115 -->
  <!-- Intersection circle: center (160, 115), rx = 75, ry = 22 -->
  <path d="M 85 115 Q 160 200 235 115" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="2"/>

  <!-- Cone top surface: apex at (160, 50), expanding down to (85, 115) and (235, 115) -->
  <path d="M 85 115 L 160 50 L 235 115 Z" fill="#fed7aa" fill-opacity="0.6" stroke="#d97706" stroke-width="2"/>

  <!-- Intersection rim -->
  <ellipse cx="160" cy="115" rx="75" ry="22" fill="#bae6fd" fill-opacity="0.3" stroke="#64748b" stroke-dasharray="3,3"/>

  <!-- Labels -->
  <line x1="155" y1="50" x2="165" y2="50" stroke="#1e293b" stroke-width="1.2"/>
  <text x="140" y="55" font-style="italic">2a</text>
  <text x="175" y="70" font-size="13" font-style="italic" fill="#d97706">z = 2a - √(x² + y²)</text>
  <text x="180" y="165" font-size="13" font-style="italic" fill="#1e40af">x² + y² = 2az</text>
  <text x="155" y="125" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Ω</text>
</svg>
