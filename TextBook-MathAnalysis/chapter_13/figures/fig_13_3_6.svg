<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="auto" style="max-width: 320px;">
  <!-- Axes -->
  <line x1="150" y1="210" x2="290" y2="210" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="290,208 296,210 290,212" fill="#2d3748" />
  <text x="295" y="225" font-size="12" font-style="italic" font-family="serif">x</text>

  <line x1="150" y1="210" x2="150" y2="25" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="148,25 150,19 152,25" fill="#2d3748" />
  <text x="138" y="27" font-size="12" font-style="italic" font-family="serif">z</text>

  <line x1="150" y1="210" x2="70" y2="250" stroke="#2d3748" stroke-width="1.2" />
  <polygon points="68,245 62,254 73,251" fill="#2d3748" />
  <text x="60" y="242" font-size="12" font-style="italic" font-family="serif">y</text>
  <text x="140" y="222" font-size="11" font-family="serif">O</text>

  <!-- Paraboloid bottom surface -->
  <path d="M 85 110 Q 150 210 215 110" fill="none" stroke="#3182ce" stroke-width="1.8" />
  
  <!-- Cone top surface -->
  <path d="M 85 110 L 150 60 L 215 110" fill="none" stroke="#dd6b20" stroke-width="1.8" />
  <ellipse cx="150" cy="110" rx="65" ry="18" fill="#feebc8" fill-opacity="0.4" stroke="#718096" stroke-dasharray="3,3" />

  <text x="155" y="55" font-size="11" font-family="serif" fill="#c05621">z = 2a - √(x²+y²)</text>
  <text x="175" y="170" font-size="11" font-family="serif" fill="#2b6cb0">x²+y² = 2az</text>
</svg>