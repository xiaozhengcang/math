<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="auto" style="max-width: 400px;">
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#cbd5e0" stroke-width="1.2" />
    </pattern>
  </defs>
  <!-- Outer bounding rectangle U -->
  <rect x="50" y="30" width="300" height="240" fill="none" stroke="#4a5568" stroke-width="1.8" />
  <!-- Grid lines inside U -->
  <rect x="50" y="30" width="300" height="240" fill="url(#grid)" />
  
  <!-- Boundary curve of D -->
  <!-- Oval shape representing region D -->
  <path d="M 80 160 C 70 80, 160 50, 260 60 C 340 70, 340 180, 280 230 C 200 280, 90 230, 80 160 Z" 
        fill="#ebf8ff" fill-opacity="0.4" stroke="#2b6cb0" stroke-width="2.5" />
  
  <!-- Highlight some inner squares (completely inside D) -->
  <rect x="140" y="90" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="170" y="90" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="200" y="90" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="140" y="120" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="170" y="120" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="200" y="120" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="230" y="120" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="140" y="150" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="170" y="150" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="200" y="150" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />
  <rect x="230" y="150" width="30" height="30" fill="#bee3f8" fill-opacity="0.7" stroke="#3182ce" stroke-width="1.5" />

  <!-- Labels -->
  <text x="185" y="140" font-size="16" font-style="italic" font-family="serif" fill="#2c5282" font-weight="bold">D</text>
  <text x="355" y="275" font-size="14" font-style="italic" font-family="serif" fill="#4a5568">U</text>
</svg>