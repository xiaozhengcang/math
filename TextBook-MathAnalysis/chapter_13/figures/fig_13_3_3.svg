<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" width="100%" height="auto" style="max-width: 460px;">
  <!-- Circle u^2+v^2 <= a^2 -->
  <g transform="translate(20, 15)">
    <line x1="15" y1="80" x2="165" y2="80" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="165,78 171,80 165,82" fill="#2d3748" />
    <text x="165" y="95" font-size="12" font-style="italic" font-family="serif">u</text>

    <line x1="90" y1="155" x2="90" y2="10" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="88,10 90,4 92,10" fill="#2d3748" />
    <text x="96" y="16" font-size="12" font-style="italic" font-family="serif">v</text>

    <circle cx="90" cy="80" r="55" fill="#bee3f8" fill-opacity="0.5" stroke="#3182ce" stroke-width="1.6" />
    <text x="145" y="95" font-size="11" font-family="serif">a</text>
    <text x="75" y="145" font-size="11" font-family="serif">-a</text>
    <text x="80" y="75" font-size="11" font-family="serif">O</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(205, 75)">
    <text x="5" y="-6" font-size="11" font-family="serif" fill="#4a5568">x=au, y=bv</text>
    <path d="M 0 10 L 45 10" stroke="#3182ce" stroke-width="1.8" />
    <polygon points="43,6 51,10 43,14" fill="#3182ce" />
  </g>

  <!-- Ellipse x^2/a^2 + y^2/b^2 <= 1 -->
  <g transform="translate(270, 15)">
    <line x1="15" y1="80" x2="165" y2="80" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="165,78 171,80 165,82" fill="#2d3748" />
    <text x="165" y="95" font-size="12" font-style="italic" font-family="serif">x</text>

    <line x1="90" y1="155" x2="90" y2="10" stroke="#2d3748" stroke-width="1.2" />
    <polygon points="88,10 90,4 92,10" fill="#2d3748" />
    <text x="96" y="16" font-size="12" font-style="italic" font-family="serif">y</text>

    <ellipse cx="90" cy="80" rx="65" ry="40" fill="#c6f6d5" fill-opacity="0.5" stroke="#38a169" stroke-width="1.6" />
    <text x="155" y="95" font-size="11" font-family="serif">a</text>
    <text x="95" y="38" font-size="11" font-family="serif">b</text>
    <text x="85" y="85" font-size="13" font-style="italic" font-family="serif" fill="#22543d">D</text>
  </g>
</svg>