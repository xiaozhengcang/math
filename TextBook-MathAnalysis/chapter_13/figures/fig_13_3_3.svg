<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" height="auto" style="max-width:480px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Unit circle in uv plane -->
  <g transform="translate(25, 15)">
    <line x1="15" y1="85" x2="175" y2="85" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="170" y="102" font-style="italic">u</text>
    <line x1="95" y1="165" x2="95" y2="10" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="82" y="15" font-style="italic">v</text>
    <text x="82" y="98">O</text>

    <!-- Circle radius = 55 -->
    <circle cx="95" cy="85" r="55" fill="#bae6fd" fill-opacity="0.5" stroke="#0284c7" stroke-width="1.8"/>
    <line x1="150" y1="82" x2="150" y2="88" stroke="#1e293b" stroke-width="1.2"/>
    <text x="146" y="100">1</text>
    <line x1="40" y1="82" x2="40" y2="88" stroke="#1e293b" stroke-width="1.2"/>
    <text x="32" y="100">-1</text>
    <line x1="92" y1="30" x2="98" y2="30" stroke="#1e293b" stroke-width="1.2"/>
    <text x="100" y="34">1</text>
    <text x="90" y="90" font-size="14" font-style="italic" fill="#0369a1" text-anchor="middle">u² + v² ≤ 1</text>
  </g>

  <!-- Arrow T: x=au, y=bv -->
  <g transform="translate(215, 75)">
    <text x="10" y="-8" font-size="12" fill="#1e40af">x = au</text>
    <text x="10" y="6" font-size="12" fill="#1e40af">y = bv</text>
    <path d="M 0 16 L 45 16" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  </g>

  <!-- Ellipse in xy plane -->
  <g transform="translate(285, 15)">
    <line x1="15" y1="85" x2="175" y2="85" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="170" y="102" font-style="italic">x</text>
    <line x1="95" y1="165" x2="95" y2="10" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="82" y="15" font-style="italic">y</text>
    <text x="82" y="98">O</text>

    <!-- Ellipse rx=65, ry=40 -->
    <ellipse cx="95" cy="85" rx="65" ry="40" fill="#bbf7d0" fill-opacity="0.55" stroke="#16a34a" stroke-width="1.8"/>
    <line x1="160" y1="82" x2="160" y2="88" stroke="#1e293b" stroke-width="1.2"/>
    <text x="156" y="100" font-style="italic">a</text>
    <line x1="30" y1="82" x2="30" y2="88" stroke="#1e293b" stroke-width="1.2"/>
    <text x="22" y="100" font-style="italic">-a</text>
    <line x1="92" y1="45" x2="98" y2="45" stroke="#1e293b" stroke-width="1.2"/>
    <text x="100" y="49" font-style="italic">b</text>
    <text x="95" y="89" font-size="15" font-style="italic" fill="#15803d" font-weight="bold" text-anchor="middle">D</text>
  </g>
</svg>
