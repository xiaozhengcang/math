<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="180" x2="310" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="198" font-style="italic">x</text>
  <line x1="60" y1="205" x2="60" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="48" y="195">O</text>

  <!-- Triangle region: (60, 180), (220, 180), (220, 40) -->
  <polygon points="60,180 220,180 220,40" fill="#e0f2fe" stroke="#1e40af" stroke-width="2"/>
  <line x1="220" y1="180" x2="220" y2="40" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <text x="135" y="145" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">D</text>
  <text x="120" y="95" font-style="italic" fill="#1e40af">y = x</text>
  <line x1="220" y1="177" x2="220" y2="183" stroke="#1e293b" stroke-width="1.2"/>
  <text x="200" y="198" font-style="italic">√(π/2)</text>
</svg>
