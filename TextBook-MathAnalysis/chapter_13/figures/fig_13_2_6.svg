<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="auto" style="max-width: 280px;">
  <!-- Axes -->
  <line x1="30" y1="160" x2="250" y2="160" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="250,157 258,160 250,163" fill="#2d3748" />
  <text x="250" y="176" font-size="13" font-style="italic" font-family="serif">x</text>

  <line x1="50" y1="180" x2="50" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="47,20 50,12 53,20" fill="#2d3748" />
  <text x="40" y="24" font-size="13" font-style="italic" font-family="serif">y</text>
  <text x="38" y="172" font-size="12" font-family="serif">O</text>

  <!-- Triangle region D: y=0, x=sqrt(pi/2), y=x -->
  <polygon points="50,160 190,160 190,40" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" />
  <line x1="190" y1="160" x2="190" y2="40" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="3,3" />

  <text x="120" y="125" font-size="14" font-style="italic" font-family="serif" fill="#2b6cb0">D</text>
  <text x="95" y="85" font-size="12" font-style="italic" font-family="serif" fill="#2b6cb0">y = x</text>
  <text x="175" y="178" font-size="12" font-style="italic" font-family="serif">$\sqrt{\pi/2}$</text>
</svg>