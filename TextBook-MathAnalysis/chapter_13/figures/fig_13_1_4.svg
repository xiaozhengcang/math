<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Equilateral triangle ABC: side 240, height 207.8 -->
  <!-- A=(60, 260), B=(300, 260), C=(180, 52.2) -->
  <polygon points="60,260 300,260 180,52.2" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
  <text x="42" y="272">A</text>
  <text x="306" y="272">B</text>
  <text x="175" y="42">C</text>
  <text x="180" y="282" text-anchor="middle" font-style="italic" fill="#64748b">Δ</text>

  <!-- Centroid G = (180, 190.7) -->
  <circle cx="180" cy="190.7" r="3.5" fill="#1e293b"/>
  <text x="190" y="195" font-style="italic">G</text>

  <!-- Path f_1: A -> G -> B -->
  <path d="M 60 260 L 180 190.7 L 300 260" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round"/>
  
  <line x1="60" y1="260" x2="120" y2="225.4" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  <line x1="180" y1="190.7" x2="240" y2="225.4" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>

  <text x="180" y="235" text-anchor="middle" fill="#dc2626" font-weight="bold">f₁([0, 1])</text>
</svg>
