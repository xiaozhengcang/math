<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="160" y1="230" x2="160" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="170" y="28" font-style="italic">z</text>
  <line x1="160" y1="180" x2="330" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="198" font-style="italic">y</text>
  <line x1="160" y1="180" x2="90" y2="245" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="80" y="255" font-style="italic">x</text>
  <text x="145" y="192">O</text>

  <!-- Cone apex at (160, 180) -->
  <!-- Top disk at z = h: center (160, 75), rx = 75, ry = 22 -->
  <path d="M 160 180 L 85 75 C 85 63, 235 63, 235 75 Z" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="1.8"/>
  
  <!-- Top disk rim -->
  <ellipse cx="160" cy="75" rx="75" ry="22" fill="#bae6fd" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Axis segment inside cone -->
  <line x1="160" y1="180" x2="160" y2="75" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="155" y1="75" x2="165" y2="75" stroke="#1e293b" stroke-width="1.2"/>
  <text x="145" y="78" font-style="italic">h</text>

  <!-- Radius R mark on top disk -->
  <line x1="160" y1="75" x2="235" y2="75" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="160" cy="75" r="2.5" fill="#1e293b"/>
  <text x="190" y="70" font-style="italic" fill="#dc2626">R</text>

  <text x="215" y="130" font-size="13" font-style="italic" fill="#1e40af">z² = (h²/R²)(x² + y²)</text>
  <text x="245" y="78" font-style="italic" fill="#0284c7">z = h</text>
</svg>
