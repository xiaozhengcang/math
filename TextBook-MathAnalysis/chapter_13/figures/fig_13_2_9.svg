<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="100%" height="auto" style="max-width: 320px;">
  <!-- Axes -->
  <line x1="150" y1="140" x2="300" y2="140" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="300,137 308,140 300,143" fill="#2d3748" />
  <text x="305" y="152" font-size="13" font-style="italic" font-family="serif">y</text>

  <line x1="150" y1="180" x2="150" y2="20" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="147,20 150,12 153,20" fill="#2d3748" />
  <text x="158" y="24" font-size="13" font-style="italic" font-family="serif">z</text>

  <line x1="150" y1="140" x2="90" y2="195" stroke="#2d3748" stroke-width="1.5" />
  <polygon points="88,190 82,200 93,196" fill="#2d3748" />
  <text x="85" y="212" font-size="13" font-style="italic" font-family="serif">x</text>
  <text x="138" y="150" font-size="12" font-family="serif">O</text>

  <!-- Cone apex at (150, 140) -->
  <!-- Top disc at z = h -->
  <ellipse cx="150" cy="65" rx="60" ry="20" fill="#ebf8ff" fill-opacity="0.6" stroke="#2b6cb0" stroke-width="1.8" />
  <!-- Cone generators from apex to top disc -->
  <line x1="150" y1="140" x2="90" y2="65" stroke="#2b6cb0" stroke-width="1.8" />
  <line x1="150" y1="140" x2="210" y2="65" stroke="#2b6cb0" stroke-width="1.8" />

  <!-- Height mark z = h -->
  <line x1="150" y1="140" x2="150" y2="65" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3" />
  <text x="156" y="68" font-size="11" font-style="italic" font-family="serif">z = h</text>
  <text x="215" y="105" font-size="11" font-style="italic" font-family="serif" fill="#2b6cb0">$z^2 = \frac{h^2}{R^2}(x^2+y^2)$</text>
</svg>