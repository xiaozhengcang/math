<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="auto" style="max-width: 500px;">
  <!-- Left: uv plane -->
  <g transform="translate(30, 20)">
    <line x1="20" y1="160" x2="180" y2="160" stroke="#2d3748" stroke-width="1.5" />
    <polygon points="180,157 188,160 180,163" fill="#2d3748" />
    <text x="185" y="175" font-size="13" font-style="italic" font-family="serif">u</text>

    <line x1="30" y1="170" x2="30" y2="20" stroke="#2d3748" stroke-width="1.5" />
    <polygon points="27,20 30,12 33,20" fill="#2d3748" />
    <text x="18" y="22" font-size="13" font-style="italic" font-family="serif">v</text>
    <text x="18" y="172" font-size="12" font-family="serif">O</text>

    <!-- Grid lines -->
    <line x1="60" y1="40" x2="60" y2="150" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="100" y1="40" x2="100" y2="150" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="140" y1="40" x2="140" y2="150" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />

    <line x1="40" y1="130" x2="160" y2="130" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="40" y1="90" x2="160" y2="90" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="40" y1="50" x2="160" y2="50" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2,2" />

    <circle cx="100" cy="90" r="3.5" fill="#e53e3e" />
    <text x="106" y="86" font-size="12" font-family="serif" fill="#c53030">P(u, v)</text>
  </g>

  <!-- Arrow T -->
  <g transform="translate(230, 95)">
    <path d="M 0 10 Q 20 -5 40 10" fill="none" stroke="#3182ce" stroke-width="2" />
    <polygon points="38,4 46,12 36,15" fill="#3182ce" />
    <text x="18" y="-4" font-size="14" font-style="italic" font-family="serif" fill="#2b6cb0">T</text>
  </g>

  <!-- Right: xy plane curvilinear grid -->
  <g transform="translate(290, 20)">
    <line x1="20" y1="160" x2="180" y2="160" stroke="#2d3748" stroke-width="1.5" />
    <polygon points="180,157 188,160 180,163" fill="#2d3748" />
    <text x="185" y="175" font-size="13" font-style="italic" font-family="serif">x</text>

    <line x1="30" y1="170" x2="30" y2="20" stroke="#2d3748" stroke-width="1.5" />
    <polygon points="27,20 30,12 33,20" fill="#2d3748" />
    <text x="18" y="22" font-size="13" font-style="italic" font-family="serif">y</text>
    <text x="18" y="172" font-size="12" font-family="serif">O</text>

    <!-- Curvilinear u-curves and v-curves -->
    <path d="M 50 140 C 70 100, 90 70, 110 40" fill="none" stroke="#4299e1" stroke-width="1.5" />
    <path d="M 80 150 C 100 110, 125 80, 145 50" fill="none" stroke="#4299e1" stroke-width="1.5" />
    <path d="M 110 155 C 130 120, 155 90, 175 60" fill="none" stroke="#4299e1" stroke-width="1.5" />

    <path d="M 40 120 C 75 130, 115 135, 160 140" fill="none" stroke="#48bb78" stroke-width="1.5" />
    <path d="M 50 85 C 90 95, 130 100, 170 105" fill="none" stroke="#48bb78" stroke-width="1.5" />
    <path d="M 65 50 C 105 60, 145 65, 180 70" fill="none" stroke="#48bb78" stroke-width="1.5" />

    <circle cx="118" cy="98" r="3.5" fill="#e53e3e" />
    <text x="124" y="95" font-size="12" font-family="serif" fill="#c53030">P(x, y)</text>
    <text x="135" y="45" font-size="11" font-family="serif" fill="#2b6cb0">u-曲线</text>
    <text x="165" y="125" font-size="11" font-family="serif" fill="#276749">v-曲线</text>
  </g>
</svg>