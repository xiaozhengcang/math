<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="100%" height="auto" style="max-width:520px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Left panel: uv plane -->
  <g transform="translate(30, 20)">
    <line x1="20" y1="160" x2="190" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="185" y="178" font-style="italic">u</text>
    <line x1="35" y1="175" x2="35" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="25" font-style="italic">v</text>
    <text x="22" y="172">O</text>

    <!-- Grid lines: u=const (vertical), v=const (horizontal) -->
    <line x1="70" y1="40" x2="70" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="110" y1="40" x2="110" y2="150" stroke="#0284c7" stroke-width="1.4"/>
    <line x1="150" y1="40" x2="150" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

    <line x1="45" y1="130" x2="175" y2="130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="45" y1="90" x2="175" y2="90" stroke="#16a34a" stroke-width="1.4"/>
    <line x1="45" y1="50" x2="175" y2="50" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

    <circle cx="110" cy="90" r="3.5" fill="#dc2626"/>
    <text x="116" y="85" fill="#dc2626" font-size="12">P(u, v)</text>
    <text x="105" y="165" font-size="12" fill="#0284c7">u</text>
    <text x="18" y="93" font-size="12" fill="#16a34a">v</text>
  </g>

  <!-- Arrow T -->
  <g transform="translate(245, 95)">
    <path d="M 0 10 Q 20 -5 40 10" fill="none" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
    <text x="18" y="-4" font-style="italic" fill="#1e40af" font-weight="bold">T</text>
  </g>

  <!-- Right panel: xy plane with curvilinear grid -->
  <g transform="translate(305, 20)">
    <line x1="20" y1="160" x2="190" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="185" y="178" font-style="italic">x</text>
    <line x1="35" y1="175" x2="35" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="25" font-style="italic">y</text>
    <text x="22" y="172">O</text>

    <!-- Curvilinear u-curves (v varies) -->
    <path d="M 55 145 C 75 105, 95 70, 115 40" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M 85 150 C 105 110, 130 75, 150 45" fill="none" stroke="#0284c7" stroke-width="1.8"/>
    <path d="M 115 155 C 135 115, 160 80, 180 50" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Curvilinear v-curves (u varies) -->
    <path d="M 45 125 C 80 135, 120 140, 165 145" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M 55 90 C 95 100, 135 105, 175 110" fill="none" stroke="#16a34a" stroke-width="1.8"/>
    <path d="M 70 55 C 110 65, 150 70, 185 75" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

    <circle cx="122" cy="103" r="3.5" fill="#dc2626"/>
    <text x="128" y="100" fill="#dc2626" font-size="12">P(x, y)</text>
    <text x="145" y="40" font-size="12" fill="#0284c7">u-曲线</text>
    <text x="175" y="125" font-size="12" fill="#16a34a">v-曲线</text>
  </g>
</svg>
