<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="160" x2="310" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="178" font-style="italic">x</text>
  <line x1="55" y1="185" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="175">O</text>

  <!-- Domain D with origin and ray / puncture removed -->
  <path d="M 75 150 C 60 80, 130 45, 220 55 C 280 65, 275 140, 230 155 C 160 170, 95 170, 75 150 Z" 
        fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="1.8"/>

  <!-- Slit / singular segment removed from origin to (150, 105) -->
  <line x1="55" y1="160" x2="150" y2="105" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="150" cy="105" r="3.5" fill="#dc2626"/>
  <text x="158" y="108" font-size="12" fill="#dc2626">非单射点集</text>
  <text x="195" y="110" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">D_ε</text>
</svg>
