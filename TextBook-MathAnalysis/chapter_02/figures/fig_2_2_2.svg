<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 265" width="100%" height="auto" style="max-width:560px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!--
    Sequence ordering theorem (定理2.2.3): x_n → a < b ← y_n
    
    Two horizontal strips:
      - x_n strip around a (lower): a ± ε, separated from b
      - y_n strip around b (upper): b ± ε, separated from a
      - dividing line at (a+b)/2
    
    Layout:
      x-axis (n) at y=230, origin at x=90
      Vertical:
        b+ε  at y=55
        b    at y=75
        b-ε  at y=95
        (a+b)/2 at y=130 (midpoint)
        a+ε  at y=165
        a    at y=185
        a-ε  at y=205
  -->

  <!-- Shaded strips -->
  <!-- y_n strip around b -->
  <rect x="90" y="55" width="440" height="40" fill="#dbeafe" fill-opacity="0.7"/>
  <!-- x_n strip around a -->
  <rect x="90" y="165" width="440" height="40" fill="#f1f5f9" fill-opacity="0.7"/>

  <!-- Axes -->
  <line x1="55"  y1="230" x2="525" y2="230" stroke="#222" stroke-width="1.4" marker-end="url(#arr3)"/>
  <line x1="90"  y1="248" x2="90"  y2="18"  stroke="#222" stroke-width="1.4" marker-end="url(#arr3)"/>
  <text x="513" y="244" font-style="italic">n</text>
  <text x="74"  y="24"  font-style="italic">x</text>
  <text x="73"  y="244" font-style="italic">O</text>

  <!-- Dashed horizontal lines -->
  <line x1="90" y1="55"  x2="525" y2="55"  stroke="#3b82f6" stroke-dasharray="5,4" stroke-width="1.2"/>
  <line x1="90" y1="75"  x2="525" y2="75"  stroke="#93c5fd" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="90" y1="95"  x2="525" y2="95"  stroke="#3b82f6" stroke-dasharray="5,4" stroke-width="1.2"/>
  <line x1="90" y1="130" x2="525" y2="130" stroke="#dc2626" stroke-dasharray="6,4" stroke-width="1.5"/>
  <line x1="90" y1="165" x2="525" y2="165" stroke="#64748b" stroke-dasharray="5,4" stroke-width="1.2"/>
  <line x1="90" y1="185" x2="525" y2="185" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="90" y1="205" x2="525" y2="205" stroke="#64748b" stroke-dasharray="5,4" stroke-width="1.2"/>

  <!-- Labels on left -->
  <text x="40"  y="59"   font-style="italic">b+ε</text>
  <text x="70"  y="79"   font-style="italic">b</text>
  <text x="40"  y="99"   font-style="italic">b−ε</text>
  <text x="2"   y="134"  font-style="italic">(a+b)/2</text>
  <text x="40"  y="169"  font-style="italic">a+ε</text>
  <text x="70"  y="189"  font-style="italic">a</text>
  <text x="40"  y="209"  font-style="italic">a−ε</text>

  <!-- n-axis ticks -->
  <line x1="135" y1="227" x2="135" y2="233" stroke="#222"/><text x="132" y="244">1</text>
  <line x1="172" y1="227" x2="172" y2="233" stroke="#222"/><text x="169" y="244">2</text>
  <line x1="209" y1="227" x2="209" y2="233" stroke="#222"/><text x="206" y="244">3</text>
  <text x="236"  y="244">⋯</text>
  <line x1="275" y1="227" x2="275" y2="233" stroke="#222"/><text x="270" y="244" font-style="italic">N</text>
  <line x1="312" y1="227" x2="312" y2="233" stroke="#222"/><text x="299" y="244">N+1</text>
  <line x1="349" y1="227" x2="349" y2="233" stroke="#222"/><text x="336" y="244">N+2</text>
  <text x="388"  y="244">⋯</text>

  <!-- x_n points (circles): for n≤N scattered, for n>N inside a-strip -->
  <circle cx="135" cy="215" r="3" fill="#334155"/>
  <circle cx="172" cy="170" r="3" fill="#334155"/>
  <circle cx="209" cy="200" r="3" fill="#334155"/>
  <circle cx="238" cy="212" r="3" fill="#334155"/>
  <circle cx="275" cy="195" r="3" fill="#334155"/>
  <!-- n>N: inside a-strip -->
  <circle cx="312" cy="180" r="3" fill="#1e40af"/>
  <circle cx="349" cy="172" r="3" fill="#1e40af"/>
  <circle cx="380" cy="182" r="3" fill="#1e40af"/>
  <circle cx="410" cy="176" r="3" fill="#1e40af"/>
  <circle cx="440" cy="183" r="3" fill="#1e40af"/>
  <circle cx="470" cy="178" r="3" fill="#1e40af"/>
  <circle cx="500" cy="180" r="3" fill="#1e40af"/>

  <!-- y_n points (open squares): for n≤N scattered, for n>N inside b-strip -->
  <rect x="132" y="35"  width="6" height="6" fill="#fff" stroke="#374151" stroke-width="1.2"/>
  <rect x="169" y="105" width="6" height="6" fill="#fff" stroke="#374151" stroke-width="1.2"/>
  <rect x="206" y="90"  width="6" height="6" fill="#fff" stroke="#374151" stroke-width="1.2"/>
  <rect x="235" y="115" width="6" height="6" fill="#fff" stroke="#374151" stroke-width="1.2"/>
  <rect x="272" y="35"  width="6" height="6" fill="#fff" stroke="#374151" stroke-width="1.2"/>
  <!-- n>N: inside b-strip -->
  <rect x="309" y="70"  width="6" height="6" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="346" y="60"  width="6" height="6" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="377" y="75"  width="6" height="6" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="407" y="65"  width="6" height="6" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="437" y="72"  width="6" height="6" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="467" y="68"  width="6" height="6" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="497" y="73"  width="6" height="6" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Vertical dashed line at N -->
  <line x1="275" y1="25" x2="275" y2="220" stroke="#dc2626" stroke-dasharray="4,3" stroke-width="1.3"/>

  <!-- Legend -->
  <circle cx="110" cy="15" r="3" fill="#374155"/>
  <text x="118" y="19" font-size="12" font-style="italic">x_n</text>
  <rect x="148" y="11" width="6" height="6" fill="#fff" stroke="#374151" stroke-width="1.2"/>
  <text x="159" y="19" font-size="12" font-style="italic">y_n</text>
</svg>