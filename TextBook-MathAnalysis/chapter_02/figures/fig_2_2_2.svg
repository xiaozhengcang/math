<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="100%" height="auto" style="max-width:540px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Axes: Origin O at (80, 200) -->
    <line x1="50" y1="200" x2="500" y2="200" stroke="#222" stroke-width="1.4" marker-end="url(#arr3)" />
    <line x1="80" y1="215" x2="80" y2="15" stroke="#222" stroke-width="1.4" marker-end="url(#arr3)" />
    <text x="495" y="214" font-style="italic">t</text>
    <text x="66" y="214" font-style="italic">O</text>

    <!-- Levels: b=60 (b+eps=40), (a+b)/2=90, a=120 (a-eps=140) -->
    <!-- y_n strip around b=60 -->
    <rect x="80" y="40" width="410" height="40" fill="#eff6ff" fill-opacity="0.6" />
    <line x1="80" y1="40" x2="490" y2="40" stroke="#3b82f6" stroke-dasharray="4,4" stroke-width="1.2" />
    <line x1="80" y1="60" x2="490" y2="60" stroke="#93c5fd" stroke-dasharray="2,2" stroke-width="1" />
    
    <!-- dividing line (a+b)/2 = 90 -->
    <line x1="80" y1="90" x2="490" y2="90" stroke="#dc2626" stroke-dasharray="5,4" stroke-width="1.5" />

    <!-- x_n strip around a=120 -->
    <rect x="80" y="100" width="410" height="40" fill="#f1f5f9" fill-opacity="0.6" />
    <line x1="80" y1="120" x2="490" y2="120" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1" />
    <line x1="80" y1="140" x2="490" y2="140" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.2" />

    <text x="44" y="44" font-style="italic">b+ε</text>
    <text x="66" y="64" font-style="italic">b</text>
    <text x="24" y="94" font-style="italic">(a+b)/2</text>
    <text x="66" y="124" font-style="italic">a</text>
    <text x="44" y="144" font-style="italic">a-ε</text>

    <!-- Horizontal ticks -->
    <line x1="120" y1="197" x2="120" y2="203" stroke="#222" /><text x="117" y="214">1</text>
    <line x1="155" y1="197" x2="155" y2="203" stroke="#222" /><text x="152" y="214">2</text>
    <line x1="190" y1="197" x2="190" y2="203" stroke="#222" /><text x="187" y="214">3</text>
    <text x="220" y="214">⋯</text>
    <line x1="265" y1="197" x2="265" y2="203" stroke="#222" /><text x="260" y="214" font-style="italic">N</text>
    <line x1="305" y1="197" x2="305" y2="203" stroke="#222" /><text x="294" y="214">N+1</text>
    <line x1="345" y1="197" x2="345" y2="203" stroke="#222" /><text x="334" y="214">N+2</text>
    <text x="385" y="214">⋯</text>

    <!-- Points for x_n (solid circle) and y_n (open square) -->
    <!-- t=1 -->
    <circle cx="120" cy="165" r="3" fill="#334155" />
    <rect x="117" y="145" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <!-- t=2 -->
    <circle cx="155" cy="65" r="3" fill="#334155" />
    <rect x="152" y="95" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <!-- t=3 -->
    <circle cx="190" cy="80" r="3" fill="#334155" />
    <rect x="187" y="105" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <!-- intermediate -->
    <circle cx="215" cy="35" r="3" fill="#334155" />
    <rect x="232" y="80" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />
    
    <!-- t=N -->
    <circle cx="265" cy="150" r="3" fill="#334155" />
    <rect x="262" y="35" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <!-- For t > N: all circles in [100, 140], all squares in [40, 80] -->
    <!-- t=N+1 -->
    <circle cx="305" cy="125" r="3" fill="#334155" />
    <rect x="302" y="68" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <!-- t=N+2 -->
    <circle cx="345" cy="115" r="3" fill="#334155" />
    <rect x="342" y="52" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <!-- further -->
    <circle cx="375" cy="128" r="3" fill="#334155" />
    <rect x="372" y="70" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <circle cx="400" cy="118" r="3" fill="#334155" />
    <rect x="397" y="74" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <circle cx="425" cy="122" r="3" fill="#334155" />
    <rect x="422" y="62" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <circle cx="450" cy="116" r="3" fill="#334155" />
    <rect x="447" y="55" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />

    <circle cx="475" cy="123" r="3" fill="#334155" />
    <rect x="472" y="65" width="6" height="6" fill="#fff" stroke="#222" stroke-width="1.2" />
  </g>
</svg>