<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="100%" height="auto" style="max-width:540px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!--
    Axes: Origin O at (80, 185). t-axis horizontal, x-axis vertical.
    Scale: t-axis is discrete, x-axis continuous.
    
    Horizontal levels:
      a at y=95 (a is the limit)
      a+ε at y=70  (ε band top)
      a-ε at y=120 (ε band bottom)
    
    ε-strip: shaded region between y=70 and y=120.
    
    Points:
      For n ≤ N: scattered, some outside the strip.
      For n > N: all inside the strip [a-ε, a+ε].
  -->

  <!-- Shaded ε-strip -->
  <rect x="80" y="70" width="435" height="50" fill="#e8f4fd" fill-opacity="0.8"/>

  <!-- Axes -->
  <line x1="50"  y1="185" x2="510" y2="185" stroke="#222" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="80"  y1="210" x2="80"  y2="20"  stroke="#222" stroke-width="1.4" marker-end="url(#arr2)"/>
  <text x="500" y="201" font-style="italic">n</text>
  <text x="64"  y="26"  font-style="italic">x</text>
  <text x="63"  y="201" font-style="italic">O</text>

  <!-- Horizontal dashed lines for a+ε, a, a-ε -->
  <line x1="80" y1="70"  x2="510" y2="70"  stroke="#64748b" stroke-dasharray="5,4" stroke-width="1.2"/>
  <line x1="80" y1="95"  x2="510" y2="95"  stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="80" y1="120" x2="510" y2="120" stroke="#64748b" stroke-dasharray="5,4" stroke-width="1.2"/>

  <!-- Labels on y-axis -->
  <text x="34" y="74"  font-style="italic">a+ε</text>
  <text x="61" y="99"  font-style="italic">a</text>
  <text x="34" y="124" font-style="italic">a−ε</text>

  <!-- n-axis ticks -->
  <line x1="125" y1="182" x2="125" y2="188" stroke="#222"/><text x="122" y="200">1</text>
  <line x1="162" y1="182" x2="162" y2="188" stroke="#222"/><text x="159" y="200">2</text>
  <line x1="199" y1="182" x2="199" y2="188" stroke="#222"/><text x="196" y="200">3</text>
  <text x="228"  y="200">⋯</text>
  <line x1="268" y1="182" x2="268" y2="188" stroke="#222"/><text x="263" y="200" font-style="italic">N</text>
  <line x1="305" y1="182" x2="305" y2="188" stroke="#222"/><text x="292" y="200">N+1</text>
  <line x1="342" y1="182" x2="342" y2="188" stroke="#222"/><text x="329" y="200">N+2</text>
  <text x="385"  y="200">⋯</text>

  <!-- Points for n=1,2,...,N: scattered, some outside strip -->
  <circle cx="125" cy="148" r="3.5" fill="#334155"/>  <!-- n=1, below strip -->
  <circle cx="162" cy="50"  r="3.5" fill="#334155"/>  <!-- n=2, above strip -->
  <circle cx="199" cy="60"  r="3.5" fill="#334155"/>  <!-- n=3, above strip -->
  <circle cx="222" cy="38"  r="3.5" fill="#334155"/>  <!-- between -->
  <circle cx="242" cy="45"  r="3.5" fill="#334155"/>  <!-- between -->
  <circle cx="268" cy="142" r="3.5" fill="#334155"/>  <!-- n=N, below strip -->

  <!-- For n > N: all inside strip (blue to distinguish) -->
  <circle cx="305" cy="80"  r="3.5" fill="#1e40af"/>
  <circle cx="342" cy="112" r="3.5" fill="#1e40af"/>
  <circle cx="372" cy="88"  r="3.5" fill="#1e40af"/>
  <circle cx="402" cy="106" r="3.5" fill="#1e40af"/>
  <circle cx="432" cy="92"  r="3.5" fill="#1e40af"/>
  <circle cx="460" cy="102" r="3.5" fill="#1e40af"/>
  <circle cx="488" cy="96"  r="3.5" fill="#1e40af"/>

  <!-- Vertical dashed line at N separating regions -->
  <line x1="268" y1="30" x2="268" y2="175" stroke="#dc2626" stroke-dasharray="4,3" stroke-width="1.3"/>
</svg>