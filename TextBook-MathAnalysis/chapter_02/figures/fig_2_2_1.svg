<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="100%" height="auto" style="max-width:540px; font-family:'Times New Roman', serif; font-size:15px;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Axes: Origin O at (80, 180) -->
    <line x1="50" y1="180" x2="500" y2="180" stroke="#222" stroke-width="1.4" marker-end="url(#arr2)" />
    <line x1="80" y1="200" x2="80" y2="20" stroke="#222" stroke-width="1.4" marker-end="url(#arr2)" />
    <text x="495" y="196" font-style="italic">t</text>
    <text x="66" y="28" font-style="italic">x</text>
    <text x="66" y="196" font-style="italic">O</text>

    <!-- Horizontal levels: a=100, eps=25 -> a+eps=75, a-eps=125 -->
    <!-- Shaded strip -->
    <rect x="80" y="75" width="410" height="50" fill="#f1f5f9" fill-opacity="0.7" />
    <line x1="80" y1="75" x2="490" y2="75" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.2" />
    <line x1="80" y1="100" x2="490" y2="100" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1" />
    <line x1="80" y1="125" x2="490" y2="125" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.2" />

    <text x="44" y="80" font-style="italic">a+ε</text>
    <text x="66" y="104" font-style="italic">a</text>
    <text x="44" y="129" font-style="italic">a-ε</text>

    <!-- Horizontal ticks -->
    <!-- 1(120), 2(155), 3(190), ...(225), N(265), N+1(305), N+2(345), ...(395) -->
    <line x1="120" y1="177" x2="120" y2="183" stroke="#222" /><text x="117" y="196">1</text>
    <line x1="155" y1="177" x2="155" y2="183" stroke="#222" /><text x="152" y="196">2</text>
    <line x1="190" y1="177" x2="190" y2="183" stroke="#222" /><text x="187" y="196">3</text>
    <text x="220" y="196">⋯</text>
    <line x1="265" y1="177" x2="265" y2="183" stroke="#222" /><text x="260" y="196" font-style="italic">N</text>
    <line x1="305" y1="177" x2="305" y2="183" stroke="#222" /><text x="294" y="196">N+1</text>
    <line x1="345" y1="177" x2="345" y2="183" stroke="#222" /><text x="334" y="196">N+2</text>
    <text x="385" y="196">⋯</text>

    <!-- Points (t, x_t) -->
    <!-- t=1: x=145 (below) -->
    <circle cx="120" cy="145" r="3.5" fill="#334155" />
    <!-- t=2: x=50 (above) -->
    <circle cx="155" cy="50" r="3.5" fill="#334155" />
    <!-- t=3: x=65 (above) -->
    <circle cx="190" cy="65" r="3.5" fill="#334155" />
    <!-- between: (210, 35), (235, 45) -->
    <circle cx="210" cy="35" r="3.5" fill="#334155" />
    <circle cx="235" cy="45" r="3.5" fill="#334155" />
    <!-- t=N: x=135 (below) -->
    <circle cx="265" cy="140" r="3.5" fill="#334155" />

    <!-- For t > N, all points strictly inside [75, 125] -->
    <!-- t=N+1: x=80 -->
    <circle cx="305" cy="80" r="3.5" fill="#1e40af" />
    <!-- t=N+2: x=118 -->
    <circle cx="345" cy="118" r="3.5" fill="#1e40af" />
    <!-- t=375: x=92 -->
    <circle cx="375" cy="92" r="3.5" fill="#1e40af" />
    <!-- t=405: x=112 -->
    <circle cx="405" cy="112" r="3.5" fill="#1e40af" />
    <!-- t=435: x=96 -->
    <circle cx="435" cy="96" r="3.5" fill="#1e40af" />
    <!-- t=460: x=105 -->
    <circle cx="460" cy="105" r="3.5" fill="#1e40af" />
    <!-- t=480: x=99 -->
    <circle cx="480" cy="99" r="3.5" fill="#1e40af" />
  </g>
</svg>