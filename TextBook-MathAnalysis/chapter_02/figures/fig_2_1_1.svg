<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="100%" height="auto" style="max-width:500px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!--
    Number line: y=110, origin O at x=210, scale=50px per unit.
    Ticks: -3(60), -2(110)→wait O=210 so -2→110, -1→160, 0→210, 1→260, 2→310, 3→360
    
    Unit square: from O=(210,110) going right and up, corner at (260,60) = (1,1)
    Diagonal length = sqrt(50²+50²) = 50√2 ≈ 70.71px
    Circle arc: center O=(210,110), radius=70.71, from (260,60) sweeping to (280.71, 110)
    280.71 = 210 + 70.71
  -->

  <!-- Number line -->
  <line x1="30"  y1="110" x2="460" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="450" y="128" font-style="italic">x</text>

  <!-- Ticks and labels: scale 50px/unit, O at 210 -->
  <line x1="110" y1="106" x2="110" y2="114" stroke="#222"/>
  <text x="100"  y="130">−2</text>
  <line x1="160" y1="106" x2="160" y2="114" stroke="#222"/>
  <text x="152"  y="130">−1</text>
  <line x1="210" y1="106" x2="210" y2="114" stroke="#222"/>
  <text x="204"  y="130" font-style="italic">O</text>
  <line x1="260" y1="106" x2="260" y2="114" stroke="#222"/>
  <text x="257"  y="130">1</text>
  <line x1="310" y1="106" x2="310" y2="114" stroke="#222"/>
  <text x="307"  y="130">2</text>
  <line x1="360" y1="106" x2="360" y2="114" stroke="#222"/>
  <text x="357"  y="130">3</text>

  <!-- Unit square [0,1]×[0,1]: bottom-left (210,110), top-right (260,60) -->
  <rect x="210" y="60" width="50" height="50" fill="none" stroke="#374151" stroke-width="1.6"/>
  <!-- Dimension label "1" on bottom of square -->
  <text x="232"  y="128" font-size="14">1</text>
  <!-- Dimension label "1" on left of square -->
  <text x="193"  y="89"  font-size="14">1</text>

  <!-- Diagonal of unit square (length = √2) -->
  <line x1="210" y1="110" x2="260" y2="60" stroke="#1e40af" stroke-width="1.8"/>

  <!-- Arc of radius √2 from diagonal tip (260,60) sweeping down to number line at (280.71, 110) -->
  <!-- Center of arc = O = (210, 110), radius = 70.71 -->
  <!-- sweep-flag=1 (CW on screen = going right and down from (260,60)) -->
  <path d="M 260 60 A 70.71 70.71 0 0 1 280.71 110"
        fill="none" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Point c = √2 marked on number line -->
  <circle cx="280.71" cy="110" r="3" fill="#dc2626"/>
  <text x="275" y="130" fill="#dc2626" font-style="italic">c</text>
</svg>