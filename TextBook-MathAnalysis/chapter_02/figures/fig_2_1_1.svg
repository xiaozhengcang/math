<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="auto" style="max-width:520px; font-family:'Times New Roman', serif; font-size:16px;">
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Number line: y = 110, origin O at x = 240, scale = 50px per unit -->
    <line x1="20" y1="110" x2="480" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arr1)" />
    <text x="475" y="126" font-style="italic">x</text>

    <!-- Ticks: -3(90), -2(140), -1(190), 0(240), 1(290), 2(340), 3(390) -->
    <line x1="90" y1="106" x2="90" y2="114" stroke="#222" />
    <text x="83" y="128">-3</text>

    <line x1="140" y1="106" x2="140" y2="114" stroke="#222" />
    <text x="133" y="128">-2</text>

    <line x1="190" y1="106" x2="190" y2="114" stroke="#222" />
    <text x="183" y="128">-1</text>

    <line x1="240" y1="106" x2="240" y2="114" stroke="#222" />
    <text x="236" y="128" font-style="italic">O</text>

    <line x1="290" y1="106" x2="290" y2="114" stroke="#222" />
    <text x="287" y="128">1</text>

    <line x1="340" y1="106" x2="340" y2="114" stroke="#222" />
    <text x="337" y="128">2</text>

    <line x1="390" y1="106" x2="390" y2="114" stroke="#222" />
    <text x="387" y="128">3</text>

    <!-- Unit square on [0, 1]: (240, 110) to (290, 60) -->
    <rect x="240" y="60" width="50" height="50" fill="none" stroke="#222" stroke-width="1.8" />
    <!-- Diagonal from (240, 110) to (290, 60) -->
    <line x1="240" y1="110" x2="290" y2="60" stroke="#1e40af" stroke-width="1.8" />

    <!-- Circular arc radius = sqrt(50^2 + 50^2) = 70.71px -->
    <!-- Arc from (290, 60) down to number line: x = 240 + 70.71 = 310.71, y = 110 -->
    <path d="M 290 60 A 70.71 70.71 0 0 1 310.71 110" fill="none" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.5" />
    
    <!-- Point c = sqrt(2) on number line -->
    <circle cx="310.71" cy="110" r="2.5" fill="#dc2626" />
    <text x="306" y="128" font-style="italic" fill="#dc2626">c</text>
  </g>
</svg>