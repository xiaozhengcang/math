<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="auto" style="max-width:480px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="220" x2="450" y2="220" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="60" y1="250" x2="60" y2="30" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="455" y="224" font-style="italic">x</text>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="46" y="236" font-style="italic">O</text>
  <!-- Epsilon-Band S(x) ± ε -->
  <path d="M 100 135 C 180 135, 260 85, 400 45 L 400 95 C 260 135, 180 185, 100 185 Z" fill="#e0f2fe" fill-opacity="0.7"/>
  <path d="M 100 135 C 180 135, 260 85, 400 45" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 100 185 C 180 185, 260 135, 400 95" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Limit function S(x) -->
  <path d="M 100 160 C 180 160, 260 110, 400 70" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="405" y="70" font-style="italic" font-weight="bold" fill="#1e40af">S(x)</text>
  <!-- Sequence S_n(x) inside band -->
  <path d="M 100 152 C 140 170, 220 120, 310 98 S 360 62, 400 60" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text x="405" y="55" font-style="italic" fill="#dc2626">Sₙ(x) (n &gt; N)</text>
  <line x1="100" y1="{oy}" x2="100" y2="185" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="{oy}" x2="400" y2="95" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="238" text-anchor="middle" font-style="italic">a</text>
  <text x="400" y="238" text-anchor="middle" font-style="italic">b</text>
  <line x1="230" y1="120" x2="230" y2="170" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="240" y="148" font-size="12px" fill="#0284c7">2ε 带宽</text>
  <text x="250" y="260" text-anchor="middle" font-size="13px" fill="#1e293b">一致收敛几何意义：当 n &gt; N 时，Sₙ(x) 图像全部落入 S(x) ± ε 带状区域</text>
</svg>
