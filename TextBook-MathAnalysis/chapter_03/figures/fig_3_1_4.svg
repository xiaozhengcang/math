<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr314" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>

  <!--
    y = e^(1/x)
    
    For x > 0: e^(1/x) decreases from +∞ (as x→0+) to e^0=1 (as x→+∞)
    For x < 0: e^(1/x) increases from 0 (as x→-∞) to e^0=1 (as x→0-)
    
    Scale: 1 unit = 50px. Origin O at (200, 220).
    y=1 (asymptote) at py = 220 - 50 = 170.
    
    Key points (x → py = 220 - e^(1/x)*50, clamped to [30, 280]):
    
    x < 0 branch:
      x=-4: e^(-0.25)=0.7788 → py=220-38.9=181.1
      x=-3: e^(-0.333)=0.7165 → py=220-35.8=184.2
      x=-2: e^(-0.5)=0.6065 → py=220-30.3=189.7
      x=-1: e^(-1)=0.3679 → py=220-18.4=201.6
      x=-0.5: e^(-2)=0.1353 → py=220-6.8=213.2
      x=-0.25: e^(-4)=0.0183 → py=220-0.9=219.1
      x→0-: e^(-∞)=0 → py≈220
      
    x > 0 branch:
      x→0+: e^(+∞)→+∞ → py→-∞, clip to top
      x=0.2: e^5=148.4 → py=220-7420 → clip to 30
      x=0.25: e^4=54.6 → py=220-2730 → clip to 30
      x=0.3: e^3.33=28.0 → py=220-1400 → clip to 30
      x=0.4: e^2.5=12.2 → py=220-610 → clip to 30
      x=0.5: e^2=7.389 → py=220-369 → clip to 30
      x=0.6: e^1.667=5.294 → py=220-264.7 → clip ~30
      x=0.7: e^1.429=4.177 → py=220-208.8 → clip ~30
      x=0.8: e^1.25=3.490 → py=220-174.5=45.5
      x=0.9: e^1.111=3.038 → py=220-151.9=68.1
      x=1:   e^1=2.718 → py=220-135.9=84.1
      x=1.5: e^0.667=1.948 → py=220-97.4=122.6
      x=2:   e^0.5=1.649 → py=220-82.4=137.6
      x=3:   e^0.333=1.395 → py=220-69.8=150.2
      x=4:   e^0.25=1.284 → py=220-64.2=155.8
      x=6:   e^0.167=1.182 → py=220-59.1=160.9
    
    Note: scale for y is 50px per unit, but we need visible curve.
    Let's use scale=30px per unit for y to make it fit better.
    
    Revised: scale y=30px/unit. y=1 at py=220-30=190.
    
    x < 0 branch:
      x=-4: e^(-0.25)=0.779 → py=220-23.4=196.6
      x=-3: e^(-0.333)=0.717 → py=220-21.5=198.5
      x=-2: e^(-0.5)=0.607 → py=220-18.2=201.8
      x=-1: e^(-1)=0.368 → py=220-11.0=209.0
      x=-0.5: e^(-2)=0.135 → py=220-4.1=215.9
      x=-0.3: e^(-3.33)=0.036 → py=220-1.1=218.9
      x→0-: → py→220
    
    x > 0 branch (clip to y=30):
      x=0.8: e^1.25=3.49 → py=220-104.7=115.3
      x=0.9: e^1.11=3.04 → py=220-91.2=128.8
      x=1.0: e^1=2.718 → py=220-81.5=138.5
      x=1.5: e^0.667=1.948 → py=220-58.4=161.6
      x=2.0: e^0.5=1.649 → py=220-49.5=170.5
      x=3.0: e^0.333=1.395 → py=220-41.9=178.1
      x=4.0: e^0.25=1.284 → py=220-38.5=181.5
      x=6.0: e^0.167=1.182 → py=220-35.5=184.5
      
    For x very small positive (x=0.5, 0.6, 0.7), e^(1/x) is huge, clip to 30:
      x=0.5: e^2=7.39 → py=220-221.7 → clip to 30
      x=0.6: e^1.67=5.29 → py=220-158.8 → clip to 30
      x=0.7: e^1.43=4.18 → py=220-125.4=94.6
  -->

  <!-- Axes -->
  <line x1="20"  y1="220" x2="390" y2="220" stroke="#222" stroke-width="1.4" marker-end="url(#arr314)"/>
  <line x1="200" y1="280" x2="200" y2="18"  stroke="#222" stroke-width="1.4" marker-end="url(#arr314)"/>
  <text x="378" y="236" font-style="italic">x</text>
  <text x="186" y="24"  font-style="italic">y</text>
  <text x="186" y="235" font-style="italic">O</text>

  <!-- y=1 asymptote at py=190 -->
  <line x1="25" y1="190" x2="385" y2="190" stroke="#555" stroke-dasharray="5,4" stroke-width="1"/>
  <text x="182" y="186">1</text>
  <line x1="196" y1="190" x2="204" y2="190" stroke="#222" stroke-width="1.2"/>

  <!-- x-axis ticks: scale 50px/unit, O=200 -->
  <!-- -2→100, -1→150, 1→250, 2→300, 3→350 -->
  <line x1="100" y1="216" x2="100" y2="224" stroke="#222"/><text x="94" y="236">-2</text>
  <line x1="150" y1="216" x2="150" y2="224" stroke="#222"/><text x="145" y="236">-1</text>
  <line x1="250" y1="216" x2="250" y2="224" stroke="#222"/><text x="247" y="236">1</text>
  <line x1="300" y1="216" x2="300" y2="224" stroke="#222"/><text x="297" y="236">2</text>
  <line x1="350" y1="216" x2="350" y2="224" stroke="#222"/><text x="347" y="236">3</text>

  <!-- x < 0 branch: e^(1/x) → 0 as x→-∞, → 1 from below as x→0- -->
  <!-- Using scale 50px/unit for x, O=200 -->
  <!-- x=-4→px=0, x=-3→px=50, x=-2→px=100, x=-1→px=150, x=-0.5→px=175, x=-0.3→px=185, x→0-→px→200 -->
  <polyline
    points="30,199.8 50,199.5 75,200.0 100,202.0 125,204.5 150,209.1 162,211.5 170,213.8 175,215.8 180,217.2 185,218.6 190,219.3 195,219.8"
    fill="none" stroke="#1e40af" stroke-width="2" stroke-linejoin="round"/>

  <!-- Open circle at (0-, 1): at px=200, py=190 — limit from left is 0, not 1! -->
  <!-- lim x→0- of e^(1/x) = e^(-∞) = 0, so limit from left is 0 (py=220) -->
  <!-- The curve approaches y=0 from the left as x→0- -->
  <!-- Open circle at x=0, y=0 (from left side) -->
  <circle cx="200" cy="220" r="4" fill="white" stroke="#1e40af" stroke-width="1.8"/>

  <!-- x > 0 branch: e^(1/x) → +∞ as x→0+, → 1 from above as x→+∞ -->
  <!-- Clip to viewBox top at py=30 -->
  <!-- x=0.7→px=235: py=220-30*4.18=220-125.4=94.6 -->
  <!-- x=0.8→px=240: py=220-30*3.49=220-104.7=115.3 -->
  <!-- x=0.9→px=245: py=220-30*3.04=220-91.2=128.8 -->
  <!-- x=1.0→px=250: py=220-30*2.718=220-81.5=138.5 -->
  <!-- x=1.5→px=275: py=220-30*1.948=220-58.4=161.6 -->
  <!-- x=2.0→px=300: py=220-30*1.649=220-49.5=170.5 -->
  <!-- x=3.0→px=350: py=220-30*1.395=220-41.9=178.1 -->
  <!-- x=4.0→px=400→clip to 380: py≈181 -->
  <!-- For x=0.5→px=225: e^2=7.39 → py=220-221.7 → clip to 30 -->
  <!-- For x=0.6→px=230: e^1.67=5.29 → py=220-158.8=61.2 (visible) -->
  <!-- x=0.65→px=232.5: e^1.538=4.655 → py=220-139.7=80.3 -->
  <polyline
    points="222,30 225,30 228,45 230,61 232,80 235,95 240,115 245,129 250,139 260,149 270,157 275,162 285,167 300,171 325,177 350,178 375,181"
    fill="none" stroke="#1e40af" stroke-width="2" stroke-linejoin="round"/>

  <!-- Arrow at top indicating curve continues to +∞ -->
  <line x1="222" y1="35" x2="222" y2="22" stroke="#1e40af" stroke-width="2" marker-end="url(#arr314)"/>

  <!-- Open circle at x=0+, indicating vertical asymptote -->
  <circle cx="200" cy="30" r="4" fill="white" stroke="#1e40af" stroke-width="1.8"/>

  <!-- Label -->
  <text x="320" y="135" font-style="italic" font-size="14">y = e<tspan dy="-5" font-size="11">1/x</tspan></text>
</svg>