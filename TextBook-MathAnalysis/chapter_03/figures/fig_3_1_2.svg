<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr312" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>
  <g transform="translate(40, 20)">
    <!-- Axes -->
    <line x1="20" y1="220" x2="340" y2="220" stroke="#222" stroke-width="1.4" marker-end="url(#arr312)"/>
    <line x1="40" y1="240" x2="40" y2="20" stroke="#222" stroke-width="1.4" marker-end="url(#arr312)"/>
    <text x="330" y="236" font-style="italic">x</text>
    <text x="26" y="28" font-style="italic">y</text>
    <text x="26" y="235" font-style="italic">O</text>

    <!-- Unit arc from angle 0 to x -->
    <path d="M 40 220 A 120 120 0 0 0 164 76" fill="none" stroke="#1e40af" stroke-width="2"/>

    <!-- Point B on unit circle -->
    <circle cx="164" cy="76" r="3.2" fill="#1e40af"/>
    <text x="170" y="72" font-style="italic">B</text>

    <!-- Point C = (1, tan x) -->
    <circle cx="280" cy="76" r="3.2" fill="#1e40af"/>
    <text x="286" y="72" font-style="italic">C</text>

    <!-- Radius OA to B -->
    <line x1="40" y1="220" x2="164" y2="76" stroke="#222" stroke-width="1.4"/>
    <!-- Line OB along x-axis -->
    <line x1="40" y1="220" x2="280" y2="220" stroke="#222" stroke-width="1.4"/>
    <!-- Tangent line at B? actually line from O to C -->
    <line x1="40" y1="220" x2="280" y2="76" stroke="#222" stroke-width="1.4"/>
    <!-- Vertical line from B to x-axis -->
    <line x1="164" y1="76" x2="164" y2="220" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- Vertical line from C to x-axis -->
    <line x1="280" y1="76" x2="280" y2="220" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Angle x arc -->
    <path d="M 70 220 A 30 30 0 0 0 62 196" fill="none" stroke="#222" stroke-width="1.2"/>
    <text x="75" y="200" font-style="italic">x</text>

    <!-- Point A label at O? -->
    <text x="22" y="75" font-style="italic">A</text>
  </g>
</svg>
