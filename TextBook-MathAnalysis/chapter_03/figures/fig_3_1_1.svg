<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr311" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
  </defs>
  <g transform="translate(50, 30)">
    <!-- Axes -->
    <line x1="0" y1="220" x2="360" y2="220" stroke="#222" stroke-width="1.4" marker-end="url(#arr311)"/>
    <line x1="50" y1="250" x2="50" y2="10" stroke="#222" stroke-width="1.4" marker-end="url(#arr311)"/>
    <text x="350" y="236" font-style="italic">x</text>
    <text x="36" y="20" font-style="italic">y</text>
    <text x="36" y="235" font-style="italic">O</text>

    <!-- Curve y=f(x) -->
    <path d="M 60 160 Q 110 130, 150 120 T 220 90 T 300 60" fill="none" stroke="#1e40af" stroke-width="2"/>

    <!-- Horizontal lines A-epsilon, A, A+epsilon -->
    <line x1="45" y1="95" x2="320" y2="95" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>
    <line x1="45" y1="120" x2="320" y2="120" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>
    <line x1="45" y1="145" x2="320" y2="145" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Vertical lines x0-delta, x0, x0+delta -->
    <line x1="180" y1="225" x2="180" y2="80" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>
    <line x1="230" y1="225" x2="230" y2="80" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>
    <line x1="280" y1="225" x2="280" y2="80" stroke="#555" stroke-width="1" stroke-dasharray="5,4"/>

    <!-- Open circle at (x0, A) -->
    <circle cx="230" cy="120" r="4" fill="#fff" stroke="#1e40af" stroke-width="1.8"/>
    <circle cx="230" cy="145" r="4" fill="#1e40af"/>

    <!-- Labels -->
    <text x="26" y="100" font-style="italic">A+ε</text>
    <text x="38" y="125" font-style="italic">A</text>
    <text x="26" y="150" font-style="italic">A-ε</text>

    <text x="168" y="240" font-style="italic">x<tspan dy="3" font-size="12">0</tspan>-δ</text>
    <text x="223" y="240" font-style="italic">x<tspan dy="3" font-size="12">0</tspan></text>
    <text x="268" y="240" font-style="italic">x<tspan dy="3" font-size="12">0</tspan>+δ</text>

    <text x="300" y="55" font-style="italic">y=f(x)</text>
  </g>
</svg>
