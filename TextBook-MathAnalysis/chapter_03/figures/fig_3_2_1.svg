<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="auto" style="max-width:420px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr321" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#222"/>
    </marker>
    <marker id="arrDelta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 2 2 L 5 8 L 8 2 z" fill="#222"/>
    </marker>
  </defs>
  <g>
    <!-- Axes -->
    <line x1="40" y1="270" x2="390" y2="270" stroke="#222" stroke-width="1.4" marker-end="url(#arr321)"/>
    <line x1="70" y1="290" x2="70" y2="30" stroke="#222" stroke-width="1.4" marker-end="url(#arr321)"/>
    <text x="380" y="286" font-style="italic">x</text>
    <text x="56" y="38" font-style="italic">y</text>
    <text x="56" y="285" font-style="italic">O</text>

    <!-- Curve y = f(x): strictly increasing with inflection -->
    <!-- Passes from (110, 250) up to (330, 60) -->
    <!-- Point 1: x0 - eps = 170, y1 = 230 -->
    <!-- Point 0: x0 = 220, y0 = 175 -->
    <!-- Point 2: x0 + eps = 260, y2 = 90 -->
    <path d="M 110 250 C 160 245, 200 220, 220 175 C 235 135, 250 90, 340 70" fill="none" stroke="#1e40af" stroke-width="2"/>
    <text x="290" y="60" font-style="italic" font-size="15">y = f(x)</text>

    <!-- Dashed projection lines -->
    <!-- x0 - eps -->
    <line x1="170" y1="270" x2="170" y2="230" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="70" y1="230" x2="170" y2="230" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- x0 -->
    <line x1="220" y1="270" x2="220" y2="175" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="70" y1="175" x2="220" y2="175" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- x0 + eps -->
    <line x1="260" y1="270" x2="260" y2="90" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="70" y1="90" x2="260" y2="90" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Labels on x-axis -->
    <text x="148" y="286" font-style="italic">x<tspan dy="3" font-size="11">0</tspan>-ε</text>
    <text x="214" y="286" font-style="italic">x<tspan dy="3" font-size="11">0</tspan></text>
    <text x="246" y="286" font-style="italic">x<tspan dy="3" font-size="11">0</tspan>+ε</text>

    <!-- Labels on y-axis -->
    <text x="50" y="235" font-style="italic">y<tspan dy="3" font-size="11">1</tspan></text>
    <text x="50" y="180" font-style="italic">y<tspan dy="3" font-size="11">0</tspan></text>
    <text x="50" y="95" font-style="italic">y<tspan dy="3" font-size="11">2</tspan></text>

    <!-- Vertical double arrow for delta between y1 and y0 -->
    <line x1="88" y1="185" x2="88" y2="220" stroke="#222" stroke-width="1.2"/>
    <line x1="88" y1="178" x2="88" y2="185" stroke="#222" stroke-width="1.2" marker-end="url(#arr321)"/>
    <line x1="88" y1="227" x2="88" y2="220" stroke="#222" stroke-width="1.2" marker-end="url(#arr321)"/>
    <text x="76" y="206" font-style="italic">δ</text>
  </g>
</svg>