<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Vortex axis passing through M_0(190, 140) -->
  <line x1="190" y1="220" x2="190" y2="35" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="190" y1="140" x2="190" y2="45" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  <text x="200" y="55" font-size="16" font-weight="bold" font-style="italic" fill="#dc2626">ω (角速度)</text>

  <circle cx="190" cy="140" r="3.5" fill="#1e293b"/>
  <text x="200" y="145" font-weight="bold">M₀</text>

  <!-- Rotating flow streamlines around axis: ellipses with arrows (right-hand rule) -->
  <ellipse cx="190" cy="140" rx="95" ry="32" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <path d="M 285 140 C 285 158, 95 158, 95 140" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <!-- Arrow on front curve -->
  <line x1="190" y1="172" x2="150" y2="171" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <!-- Arrow on back curve -->
  <line x1="190" y1="108" x2="230" y2="109" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>

  <text x="295" y="145" font-size="14" font-style="italic" fill="#1e40af">v = ω × r</text>
  <text x="190" y="240" text-anchor="middle" font-size="12" fill="#64748b">流涡轴线与旋转方向满足右手螺旋定则</text>
</svg>
