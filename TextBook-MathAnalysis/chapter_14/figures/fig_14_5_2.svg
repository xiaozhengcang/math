<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Point charge +q at (180, 125) -->
  <!-- Radial field lines at angles 0, 30, 60, ..., 330 deg -->
  <line x1="180" y1="125" x2="285.0" y2="125.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="270.9" y2="72.5" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="232.5" y2="34.1" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="180.0" y2="20.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="127.5" y2="34.1" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="89.1" y2="72.5" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="75.0" y2="125.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="89.1" y2="177.5" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="127.5" y2="215.9" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="180.0" y2="230.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="232.5" y2="215.9" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="270.9" y2="177.5" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <!-- Positive point charge -->
  <circle cx="180" cy="125" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="130" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>

  <text x="180" y="240" text-anchor="middle" font-size="13" fill="#1e293b">点电荷电力线：自原点发出的半射线族</text>
</svg>
