<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (170, 130) -->
  <line x1="30" y1="130" x2="330" y2="130" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="148" font-style="italic">x</text>
  <line x1="170" y1="230" x2="170" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="158" y="25" font-style="italic">y</text>
  <text x="155" y="145">O</text>

  <!-- Curve L enclosing origin: counterclockwise -->
  <!-- Small circle l_epsilon of radius epsilon = 32 around origin: clockwise -->
  <path d="M 60 130 C 50 60, 140 40, 260 50 C 320 60, 320 180, 260 205 C 180 230, 80 205, 60 130 Z
           M 138 130 C 138 147.7, 152.3 162, 170 162 C 187.7 162, 202 147.7, 202 130 C 202 112.3, 187.7 98, 170 98 C 152.3 98, 138 112.3, 138 130 Z" 
        fill="#e0f2fe" fill-opacity="0.65" fill-rule="evenodd" stroke="#1e40af" stroke-width="2"/>

  <!-- Outer L orientation arrow -->
  <line x1="160" y1="46" x2="200" y2="47" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="210" y="40" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">L</text>

  <!-- Inner circle l_epsilon clockwise arrow -->
  <line x1="160" y1="98" x2="185" y2="98" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <text x="170" y="85" font-size="13" font-style="italic" fill="#dc2626" text-anchor="middle">l_ε (顺时针)</text>

  <text x="235" y="165" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">D_ε</text>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#64748b">∮_L (xdy - ydx)/(x² + y²) = ∮_{l_ε} = 2π</text>
</svg>
