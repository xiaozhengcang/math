<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="80" y1="210" x2="80" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="90" y="28" font-style="italic">z</text>
  <line x1="80" y1="210" x2="400" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="395" y="228" font-style="italic">y</text>
  <line x1="80" y1="210" x2="25" y2="265" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="15" y="275" font-style="italic">x</text>
  <text x="65" y="222">O</text>

  <!-- Space curve L from A to B -->
  <path d="M 110 180 C 140 100, 220 70, 290 120 C 330 150, 360 130, 380 90" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="385" y="85" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">L</text>

  <!-- Endpoints A and B -->
  <circle cx="110" cy="180" r="3" fill="#1e293b"/>
  <text x="95" y="195">A</text>
  <circle cx="380" cy="90" r="3" fill="#1e293b"/>
  <text x="385" y="105">B</text>

  <!-- Partition points P_i-1, P_i -->
  <circle cx="215" cy="85" r="3" fill="#1e293b"/>
  <text x="190" y="78">P_{i-1}</text>
  <circle cx="270" cy="105" r="3" fill="#1e293b"/>
  <text x="275" y="102">P_i</text>

  <!-- Sub-arc L_i highlighted in red -->
  <path d="M 215 85 C 235 90, 255 98, 270 105" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="245" y="120" font-size="13" font-style="italic" fill="#dc2626">L_i</text>

  <!-- Sample point (xi_i, eta_i, zeta_i) -->
  <circle cx="242" cy="95" r="3.5" fill="#dc2626"/>
  <line x1="242" y1="95" x2="280" y2="60" stroke="#dc2626" stroke-width="1"/>
  <text x="285" y="60" font-size="12" fill="#dc2626">(ξᵢ, ηᵢ, ζᵢ)</text>
</svg>
