<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="100%" height="auto" style="max-width:440px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="80" y1="210" x2="80" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="90" y="28" font-style="italic">z</text>
  <line x1="80" y1="210" x2="400" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="395" y="228" font-style="italic">y</text>
  <line x1="80" y1="210" x2="25" y2="265" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="15" y="275" font-style="italic">x</text>
  <text x="65" y="222">O</text>

  <!-- Curve L from A to B -->
  <path d="M 110 180 C 140 90, 220 70, 300 120 C 340 150, 370 130, 390 85" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="395" y="80" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">L</text>

  <!-- Curve direction arrow -->
  <line x1="160" y1="110" x2="200" y2="85" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>

  <circle cx="110" cy="180" r="3" fill="#1e293b"/>
  <text x="95" y="195">A</text>
  <circle cx="390" cy="85" r="3" fill="#1e293b"/>
  <text x="395" y="100">B</text>

  <!-- Partition points P_i-1, P_i and displacement vector -->
  <circle cx="230" cy="88" r="3" fill="#1e293b"/>
  <text x="210" y="80">P_{i-1}</text>
  <circle cx="280" cy="110" r="3" fill="#1e293b"/>
  <text x="285" y="108">P_i</text>

  <!-- Chord vector Delta r_i -->
  <line x1="230" y1="88" x2="280" y2="110" stroke="#0284c7" stroke-width="2" marker-end="url(#arr_blue)"/>
  <text x="245" y="120" font-size="13" font-style="italic" fill="#0284c7">Δr_i</text>

  <!-- Force vector F(xi_i) at sample point -->
  <line x1="255" y1="99" x2="295" y2="50" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <circle cx="255" cy="99" r="2.5" fill="#dc2626"/>
  <text x="300" y="50" font-size="14" font-weight="bold" font-style="italic" fill="#dc2626">F</text>
</svg>
