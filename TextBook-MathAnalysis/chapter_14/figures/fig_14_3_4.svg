<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Multiply connected domain with outer boundary L and inner hole l -->
  <path d="M 50 125 C 50 55, 150 40, 260 50 C 330 60, 330 180, 260 205 C 180 230, 70 205, 50 125 Z 
           M 150 125 C 150 155, 220 155, 220 125 C 220 95, 150 95, 150 125 Z" 
        fill="#e0f2fe" fill-opacity="0.65" fill-rule="evenodd" stroke="#1e40af" stroke-width="2"/>

  <!-- Cut line gamma connecting outer and inner boundary -->
  <!-- Cut at y=125 from x=50 to x=150 -->
  <line x1="50" y1="125" x2="150" y2="125" stroke="#dc2626" stroke-width="2"/>
  <!-- Two opposite arrows along cut line -->
  <line x1="75" y1="122" x2="115" y2="122" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="115" y1="128" x2="75" y2="128" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>

  <text x="95" y="112" font-style="italic" fill="#dc2626" font-weight="bold">γ (割线)</text>
  <text x="285" y="65" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">L</text>
  <text x="185" y="130" font-size="14" font-style="italic" fill="#1e40af" text-anchor="middle">l</text>
  <text x="240" y="160" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold">D</text>
  <text x="190" y="235" text-anchor="middle" font-size="12" fill="#64748b">割线使复连通区域变为单连通区域</text>
</svg>
