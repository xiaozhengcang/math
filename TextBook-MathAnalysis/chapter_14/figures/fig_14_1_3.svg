<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="auto" style="max-width:500px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Left panel: uv-plane rectangle sigma -->
  <g transform="translate(25, 20)">
    <line x1="20" y1="160" x2="175" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="170" y="178" font-style="italic">u</text>
    <line x1="35" y1="175" x2="35" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="22" y="25" font-style="italic">v</text>

    <!-- Rectangle sigma with vertices P1, P2, P3, P4 -->
    <rect x="65" y="65" width="70" height="55" fill="#bae6fd" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.6"/>
    <circle cx="65" cy="120" r="2.5" fill="#1e293b"/>
    <text x="50" y="132" font-size="12">P₁</text>
    <circle cx="135" cy="120" r="2.5" fill="#1e293b"/>
    <text x="140" y="132" font-size="12">P₂</text>
    <circle cx="135" cy="65" r="2.5" fill="#1e293b"/>
    <text x="140" y="62" font-size="12">P₃</text>
    <circle cx="65" cy="65" r="2.5" fill="#1e293b"/>
    <text x="50" y="62" font-size="12">P₄</text>

    <text x="95" y="97" font-size="15" font-style="italic" fill="#0369a1" font-weight="bold" text-anchor="middle">σ</text>
    <text x="95" y="140" font-size="12" fill="#64748b">Δu</text>
    <text x="145" y="95" font-size="12" fill="#64748b">Δv</text>
  </g>

  <!-- Mapping arrow r(u, v) -->
  <g transform="translate(215, 90)">
    <path d="M 0 10 L 40 10" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
    <text x="10" y="-4" font-style="italic" fill="#1e40af" font-weight="bold">r(u, v)</text>
  </g>

  <!-- Right panel: 3D surface patch Sigma -->
  <g transform="translate(285, 20)">
    <line x1="15" y1="165" x2="185" y2="165" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="180" y="180" font-style="italic">y</text>
    <line x1="25" y1="180" x2="25" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="15" y="25" font-style="italic">z</text>

    <!-- Curved surface Sigma -->
    <path d="M 45 135 C 75 65, 145 55, 185 85 C 165 145, 105 160, 45 135 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Micro patch with vertices Q1, Q2, Q3, Q4 -->
    <!-- Q1=(70, 115), Q2=(120, 125), Q3=(140, 85), Q4=(85, 75) -->
    <path d="M 70 115 C 85 120, 105 123, 120 125 C 128 110, 134 95, 140 85 C 120 80, 100 77, 85 75 C 78 90, 73 103, 70 115 Z" 
          fill="#fed7aa" fill-opacity="0.7" stroke="#d97706" stroke-width="1.6"/>

    <circle cx="70" cy="115" r="2.5" fill="#1e293b"/>
    <text x="55" y="125" font-size="12">Q₁</text>
    <circle cx="120" cy="125" r="2.5" fill="#1e293b"/>
    <text x="125" y="135" font-size="12">Q₂</text>
    <circle cx="140" cy="85" r="2.5" fill="#1e293b"/>
    <text x="145" y="85" font-size="12">Q₃</text>
    <circle cx="85" cy="75" r="2.5" fill="#1e293b"/>
    <text x="75" y="70" font-size="12">Q₄</text>

    <!-- Tangent vectors r_u Delta u and r_v Delta v from Q1 -->
    <line x1="70" y1="115" x2="120" y2="125" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arr_blue)"/>
    <text x="80" y="140" font-size="11" fill="#1e40af">r_u Δu</text>
    <line x1="70" y1="115" x2="85" y2="75" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
    <text x="50" y="92" font-size="11" fill="#dc2626">r_v Δv</text>

    <text x="105" y="105" font-size="14" font-style="italic" fill="#b45309" font-weight="bold">σ̃</text>
    <text x="165" y="65" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">Σ</text>
  </g>
</svg>
