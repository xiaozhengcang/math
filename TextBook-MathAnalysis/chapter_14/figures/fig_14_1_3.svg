<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e53e3e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f855a"/>
    </marker>
  </defs>
  <line x1="40" y1="170" x2="410" y2="170" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="175" font-family="serif" font-size="14" font-style="italic">x</text>
  <line x1="60" y1="190" x2="60" y2="30" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="50" y="25" font-family="serif" font-size="14" font-style="italic">y</text>
  <text x="48" y="185" font-family="serif" font-size="13">O</text>

  <path d="M 60 170 C 100 168, 140 60, 210 60 C 280 60, 320 168, 360 170" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  
  <circle cx="210" cy="115" r="55" fill="none" stroke="#cbd5e0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="210" cy="60" r="3.5" fill="#e53e3e"/>
  <text x="215" y="55" font-family="serif" font-size="13" fill="#e53e3e">(πa, 2a)</text>

  <line x1="360" y1="170" x2="360" y2="175" stroke="#4a5568" stroke-width="1.5"/>
  <text x="345" y="190" font-family="serif" font-size="13">2πa</text>

  <text x="120" y="90" font-family="serif" font-size="13" fill="#2b6cb0">x = a(t - sin t)</text>
  <text x="120" y="110" font-family="serif" font-size="13" fill="#2b6cb0">y = a(1 - cos t)</text>
  <text x="220" y="212" text-anchor="middle" font-family="serif" font-size="13" fill="#4a5568">图 14.1.3 摆线的一拱</text>
</svg>
