<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (180, 120) -->
  <line x1="30" y1="120" x2="330" y2="120" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="138" font-style="italic">x</text>
  <line x1="180" y1="220" x2="180" y2="20" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="168" y="25" font-style="italic">y</text>
  <text x="168" y="135">O</text>

  <!-- Ellipse rx = 100, ry = 60 -->
  <ellipse cx="180" cy="120" rx="100" ry="60" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Counterclockwise orientation arrows -->
  <line x1="195" y1="60" x2="165" y2="60" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="165" y1="180" x2="195" y2="180" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>

  <!-- Semi-axes ticks -->
  <line x1="280" y1="117" x2="280" y2="123" stroke="#1e293b" stroke-width="1.2"/>
  <text x="276" y="138" font-style="italic">a</text>
  <line x1="80" y1="117" x2="80" y2="123" stroke="#1e293b" stroke-width="1.2"/>
  <text x="70" y="138" font-style="italic">-a</text>
  <line x1="177" y1="60" x2="183" y2="60" stroke="#1e293b" stroke-width="1.2"/>
  <text x="185" y="65" font-style="italic">b</text>

  <text x="180" y="125" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold" text-anchor="middle">A = πab</text>
  <text x="250" y="45" font-size="12" font-style="italic" fill="#1e40af">x²/a² + y²/b² = 1</text>
</svg>
