<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="120" y1="260" x2="120" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="130" y="28" font-style="italic">z</text>
  <line x1="120" y1="210" x2="380" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="375" y="228" font-style="italic">y</text>
  <line x1="120" y1="210" x2="45" y2="275" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="35" y="285" font-style="italic">x</text>
  <text x="105" y="222">O</text>

  <!-- Projection domain Omega_xy in xy-plane -->
  <ellipse cx="230" cy="245" rx="80" ry="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="230" y="250" font-size="14" font-style="italic" fill="#64748b" text-anchor="middle">Ω_{xy}</text>

  <!-- Lower surface Sigma_1: z = z1(x, y) at y ~ 165 -->
  <path d="M 150 165 C 190 185, 270 185, 310 165 C 270 145, 190 145, 150 165 Z" fill="#bae6fd" fill-opacity="0.4" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="230" y1="165" x2="230" y2="195" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="240" y="195" font-size="12" fill="#dc2626">n₁ (下侧)</text>
  <text x="315" y="170" font-size="12" fill="#0284c7">Σ₁: z = z₁(x, y)</text>

  <!-- Upper surface Sigma_2: z = z2(x, y) at y ~ 85 -->
  <path d="M 150 85 C 190 105, 270 105, 310 85 C 270 65, 190 65, 150 85 Z" fill="#bae6fd" fill-opacity="0.65" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="230" y1="85" x2="230" y2="45" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="240" y="55" font-size="12" fill="#dc2626">n₂ (上侧)</text>
  <text x="315" y="85" font-size="12" fill="#0284c7">Σ₂: z = z₂(x, y)</text>

  <!-- Vertical cylinder side Sigma_3 -->
  <line x1="150" y1="85" x2="150" y2="165" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="310" y1="85" x2="310" y2="165" stroke="#1e40af" stroke-width="1.5"/>
  <text x="135" y="125" font-size="12" fill="#1e40af">Σ₃</text>

  <text x="230" y="125" font-size="18" font-style="italic" fill="#1e40af" font-weight="bold" text-anchor="middle">Ω</text>
</svg>
