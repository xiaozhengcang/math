  <!-- Continuous normal vector n demonstrating single-sidedness -->
  <!-- At start (u = 0): normal pointing up-left -->
  <line x1="285" y1="130" x2="285" y2="75" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <circle cx="285" cy="130" r="3" fill="#dc2626"/>
  <text x="292" y="80" font-weight="bold" fill="#dc2626">n (初始法向量)</text>

  <!-- At u = pi (halfway around): rotated 90 deg -->
  <line x1="95" y1="130" x2="55" y2="130" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr)"/>
  <circle cx="95" cy="130" r="2.5" fill="#d97706"/>
  <text x="20" y="125" font-size="12" fill="#d97706">连续移动</text>

  <!-- Back to start after 1 full loop (u = 2pi): normal reversed to -n (pointing down) -->
  <line x1="285" y1="130" x2="285" y2="185" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="3,2" marker-end="url(#arr_red)"/>
  <text x="292" y="195" font-weight="bold" fill="#dc2626">-n (绕行一周后反向)</text>

  <!-- Label -->
  <text x="190" y="245" text-anchor="middle" font-size="14" font-style="italic" fill="#1e40af" font-weight="bold">Möbius 带 (单侧曲面)</text>
