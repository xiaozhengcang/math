<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="170" y1="240" x2="170" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="180" y="28" font-style="italic">z</text>
  <line x1="170" y1="210" x2="330" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="228" font-style="italic">y</text>
  <line x1="170" y1="210" x2="90" y2="255" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="80" y="265" font-style="italic">x</text>
  <text x="155" y="222">O</text>

  <!-- Truncated cone (cone frustum) between z=a (y=155) and z=b (y=75) -->
  <!-- z=a: center (170, 155), rx = 40, ry = 12 -->
  <!-- z=b: center (170, 75), rx = 85, ry = 24 -->
  
  <!-- Cone apex at (170, 210) with dashed generator lines up to z=a -->
  <line x1="170" y1="210" x2="130" y2="155" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="170" y1="210" x2="210" y2="155" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Frustum side generators -->
  <line x1="130" y1="155" x2="85" y2="75" stroke="#1e40af" stroke-width="2"/>
  <line x1="210" y1="155" x2="255" y2="75" stroke="#1e40af" stroke-width="2"/>

  <!-- Shaded frustum lateral surface -->
  <path d="M 85 75 L 130 155 C 130 167, 210 167, 210 155 L 255 75 C 255 60, 85 60, 85 75 Z" 
        fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>

  <!-- Lower ellipse z = a -->
  <ellipse cx="170" cy="155" rx="40" ry="12" fill="none" stroke="#1e40af" stroke-width="1.5"/>
  <!-- Upper ellipse z = b -->
  <ellipse cx="170" cy="75" rx="85" ry="24" fill="#bae6fd" fill-opacity="0.5" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Height marks -->
  <line x1="165" y1="155" x2="175" y2="155" stroke="#1e293b" stroke-width="1.2"/>
  <text x="155" y="160" font-style="italic">a</text>
  <line x1="165" y1="75" x2="175" y2="75" stroke="#1e293b" stroke-width="1.2"/>
  <text x="155" y="80" font-style="italic">b</text>

  <text x="165" y="120" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Σ</text>
  <text x="235" y="115" font-size="13" font-style="italic" fill="#1e40af">z² = x² + y²</text>
</svg>
