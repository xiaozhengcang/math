<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="130" y1="180" x2="130" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="140" y="28" font-style="italic">z</text>
  <line x1="130" y1="180" x2="340" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="335" y="198" font-style="italic">y</text>
  <line x1="130" y1="180" x2="50" y2="250" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="40" y="260" font-style="italic">x</text>
  <text x="115" y="192">O</text>

  <!-- Tetrahedron vertices:
       O = (130, 180)
       A on x: (80, 224)
       B on y: (260, 180)
       C on z: (130, 60)
  -->

  <!-- Base triangle OAB in xy-plane (dashed interior) -->
  <polygon points="130,180 80,224 260,180" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Triangle OBC in yz-plane -->
  <line x1="130" y1="180" x2="130" y2="60" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Inclined face ABC (x+y+z=1) -->
  <polygon points="80,224 260,180 130,60" fill="#bae6fd" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Normal vector on face ABC (outward) -->
  <circle cx="156" cy="154" r="2.5" fill="#dc2626"/>
  <line x1="156" y1="154" x2="200" y2="105" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <text x="205" y="105" font-weight="bold" fill="#dc2626">n₁ (外侧)</text>

  <!-- Vertices labels -->
  <circle cx="80" cy="224" r="3" fill="#1e293b"/>
  <text x="60" y="235">A(1,0,0)</text>
  <circle cx="260" cy="180" r="3" fill="#1e293b"/>
  <text x="265" y="195">B(0,1,0)</text>
  <circle cx="130" cy="60" r="3" fill="#1e293b"/>
  <text x="135" y="58">C(0,0,1)</text>

  <text x="180" y="170" font-size="13" font-style="italic" fill="#1e40af">x + y + z = 1</text>
</svg>
