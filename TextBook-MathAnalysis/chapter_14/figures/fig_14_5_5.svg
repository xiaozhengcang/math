<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Surface Sigma with boundary Gamma -->
  <path d="M 90 170 C 70 80, 200 60, 310 100 C 330 180, 220 220, 90 170 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>
  <line x1="190" y1="70" x2="230" y2="76" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="320" y="105" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">Γ = ∂Σ</text>
  <text x="140" y="140" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Σ</text>

  <!-- Wire carrying current I penetrating Sigma at (200, 140) -->
  <line x1="200" y1="245" x2="200" y2="140" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="200" y1="140" x2="200" y2="25" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  
  <circle cx="200" cy="140" r="3.5" fill="#dc2626"/>
  <text x="210" y="35" font-size="15" font-weight="bold" fill="#dc2626">I (穿过曲面的电流)</text>

  <!-- Small loop C around wire in surface -->
  <ellipse cx="200" cy="140" rx="35" ry="14" fill="none" stroke="#d97706" stroke-width="1.8"/>
  <line x1="200" y1="154" x2="180" y2="153" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="240" y="145" font-size="12" font-style="italic" fill="#d97706">C</text>

  <text x="200" y="248" text-anchor="middle" font-size="13" fill="#1e40af">∮_Γ B · dr = μ₀ I</text>
</svg>
