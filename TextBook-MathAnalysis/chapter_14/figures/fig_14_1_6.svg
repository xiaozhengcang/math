<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Two parallel horizontal circle arcs representing adjacent layers on cylinder -->
  <path d="M 50 60 Q 190 90 330 60" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 50 170 Q 190 200 330 170" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Inscribed triangle ABC: A and B on upper circle, C on lower circle -->
  <!-- A=(120, 72), B=(260, 72), C=(190, 185) -->
  <polygon points="120,72 260,72 190,185" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>
  
  <circle cx="120" cy="72" r="3.5" fill="#1e293b"/>
  <text x="105" y="68" font-weight="bold">A</text>
  <circle cx="260" cy="72" r="3.5" fill="#1e293b"/>
  <text x="268" y="68" font-weight="bold">B</text>
  <circle cx="190" cy="185" r="3.5" fill="#1e293b"/>
  <text x="185" y="205" font-weight="bold">C</text>

  <!-- Midpoint of AB: M = (190, 72) -->
  <circle cx="190" cy="72" r="2.5" fill="#dc2626"/>
  <line x1="190" y1="72" x2="190" y2="185" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3,3"/>
  <text x="195" y="130" font-style="italic" fill="#dc2626" font-weight="bold">h_k</text>

  <!-- Base AB dimension -->
  <text x="190" y="55" text-anchor="middle" font-size="13" fill="#1e40af">底边 AB = 2r sin(π/m)</text>
  <text x="210" y="160" font-size="12" fill="#64748b">高 h_k = √[(r - r cos(π/m))² + (h/n)²]</text>
</svg>
