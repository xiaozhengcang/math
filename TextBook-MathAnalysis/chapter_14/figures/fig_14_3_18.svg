<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="auto" style="max-width:400px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="90" y1="210" x2="90" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="100" y="28" font-style="italic">z</text>
  <line x1="90" y1="210" x2="380" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="375" y="228" font-style="italic">y</text>
  <line x1="90" y1="210" x2="25" y2="265" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="15" y="275" font-style="italic">x</text>
  <text x="75" y="222">O</text>

  <!-- Projection Sigma_xy in xy-plane -->
  <ellipse cx="230" cy="245" rx="75" ry="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="230" y="250" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle">Σ_{xy}</text>

  <!-- Curved surface Sigma -->
  <path d="M 150 140 C 180 60, 280 50, 320 110 C 290 170, 190 180, 150 140 Z" 
        fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Boundary curve L = dSigma with right-hand rule orientation -->
  <line x1="210" y1="65" x2="260" y2="72" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
  <line x1="260" y1="165" x2="200" y2="160" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>

  <!-- Upward normal vector n -->
  <line x1="235" y1="110" x2="235" y2="40" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  <text x="242" y="45" font-weight="bold" fill="#dc2626">n (右手定则)</text>

  <text x="240" y="130" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold">Σ</text>
  <text x="330" y="115" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">L = ∂Σ</text>
</svg>
