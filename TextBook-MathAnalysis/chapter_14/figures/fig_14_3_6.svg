<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="200" x2="330" y2="200" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="218" font-style="italic">x</text>
  <line x1="55" y1="220" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="215">O</text>

  <!-- Rectangle [a, b] x [c, d] -->
  <rect x="95" y="55" width="180" height="115" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Orientation arrows (counterclockwise) -->
  <line x1="160" y1="170" x2="200" y2="170" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="275" y1="130" x2="275" y2="95" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="210" y1="55" x2="160" y2="55" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="95" y1="95" x2="95" y2="130" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>

  <!-- Ticks -->
  <line x1="95" y1="197" x2="95" y2="203" stroke="#1e293b" stroke-width="1.2"/>
  <text x="91" y="218" font-style="italic">a</text>
  <line x1="275" y1="197" x2="275" y2="203" stroke="#1e293b" stroke-width="1.2"/>
  <text x="271" y="218" font-style="italic">b</text>
  <line x1="52" y1="170" x2="58" y2="170" stroke="#1e293b" stroke-width="1.2"/>
  <text x="40" y="175" font-style="italic">c</text>
  <line x1="52" y1="55" x2="58" y2="55" stroke="#1e293b" stroke-width="1.2"/>
  <text x="40" y="60" font-style="italic">d</text>

  <text x="185" y="115" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold" text-anchor="middle">D</text>
</svg>
