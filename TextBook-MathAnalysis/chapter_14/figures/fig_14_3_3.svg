<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Overall region D split by dividing line AB -->
  <!-- A = (190, 55), B = (190, 195) -->
  
  <!-- Left subregion D1 -->
  <path d="M 60 125 C 60 70, 120 50, 190 55 L 190 195 C 120 205, 60 180, 60 125 Z" 
        fill="#bae6fd" fill-opacity="0.6" stroke="#0284c7" stroke-width="2"/>

  <!-- Right subregion D2 -->
  <path d="M 190 55 C 260 50, 320 70, 320 125 C 320 180, 260 205, 190 195 Z" 
        fill="#fed7aa" fill-opacity="0.6" stroke="#d97706" stroke-width="2"/>

  <!-- Dividing line AB with opposite arrows -->
  <line x1="190" y1="55" x2="190" y2="195" stroke="#dc2626" stroke-width="2"/>
  <!-- Arrow for D1 boundary (upward: B -> A) -->
  <line x1="187" y1="140" x2="187" y2="110" stroke="#0284c7" stroke-width="2" marker-end="url(#arr_blue)"/>
  <!-- Arrow for D2 boundary (downward: A -> B) -->
  <line x1="193" y1="110" x2="193" y2="140" stroke="#d97706" stroke-width="2" marker-end="url(#arr_red)"/>

  <!-- Points A and B -->
  <circle cx="190" cy="55" r="3" fill="#1e293b"/>
  <text x="185" y="45" font-weight="bold">A</text>
  <circle cx="190" cy="195" r="3" fill="#1e293b"/>
  <text x="185" y="212" font-weight="bold">B</text>

  <!-- Outer boundary arrows -->
  <line x1="100" y1="58" x2="140" y2="52" stroke="#0284c7" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="280" y1="75" x2="250" y2="56" stroke="#d97706" stroke-width="2" marker-end="url(#arr_red)"/>

  <text x="120" y="125" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold">D₁</text>
  <text x="245" y="125" font-size="18" font-style="italic" fill="#b45309" font-weight="bold">D₂</text>
  <text x="190" y="235" text-anchor="middle" font-size="12" fill="#64748b">公共边 AB 积分方向相反抵消</text>
</svg>
