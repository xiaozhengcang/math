<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (60, 180) -->
  <line x1="30" y1="180" x2="330" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="198" font-style="italic">x</text>
  <line x1="60" y1="205" x2="60" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="48" y="195">O</text>

  <!-- Sine arch from x=60 to x=280 (length 220 px) peaking at x=170 with y=75 (amplitude 105 px) -->
  <!-- Bezier approx of sine arch: M 60 180 C 115 60, 225 60, 280 180 Z -->
  <path d="M 60 180 C 115 60, 225 60, 280 180 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Counterclockwise boundary arrows -->
  <!-- Along bottom: left to right -->
  <line x1="140" y1="180" x2="180" y2="180" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <!-- Along sine arch: right to left -->
  <line x1="185" y1="75" x2="155" y2="75" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>

  <!-- Ticks -->
  <line x1="280" y1="177" x2="280" y2="183" stroke="#1e293b" stroke-width="1.2"/>
  <text x="276" y="198" font-style="italic">π</text>

  <text x="170" y="135" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold" text-anchor="middle">D</text>
  <text x="170" y="55" font-size="14" font-style="italic" fill="#1e40af" text-anchor="middle">y = sin x</text>
</svg>
