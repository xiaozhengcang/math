<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D perspective: wire along vertical z-axis, concentric magnetic circles in xy-plane -->
  <line x1="190" y1="240" x2="190" y2="25" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  <text x="200" y="35" font-size="15" font-weight="bold" fill="#dc2626">I (电流方向)</text>

  <!-- Concentric magnetic field lines B in horizontal plane at y = 140 -->
  <!-- Inner circle -->
  <ellipse cx="190" cy="140" rx="55" ry="20" fill="none" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="190" y1="160" x2="160" y2="160" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>

  <!-- Outer circle -->
  <ellipse cx="190" cy="140" rx="105" ry="38" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <line x1="190" y1="178" x2="140" y2="177" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <line x1="190" y1="102" x2="240" y2="103" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>

  <circle cx="190" cy="140" r="3.5" fill="#dc2626"/>
  <text x="180" y="135">O</text>

  <!-- Radius r line to point P -->
  <line x1="190" y1="140" x2="280" y2="120" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="280" cy="120" r="3" fill="#1e293b"/>
  <text x="240" y="125" font-style="italic" fill="#64748b">r</text>
  <text x="288" y="120">P</text>

  <!-- Tangent vector B at P -->
  <line x1="280" y1="120" x2="265" y2="85" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="250" y="80" font-size="14" font-weight="bold" font-style="italic" fill="#1e40af">B</text>

  <text x="190" y="245" text-anchor="middle" font-size="13" fill="#1e40af">B = μ₀ I / (2π r)  (右手螺旋定则)</text>
</svg>
