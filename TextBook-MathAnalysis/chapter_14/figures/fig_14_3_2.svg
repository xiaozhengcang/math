<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="210" x2="350" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="228" font-style="italic">x</text>
  <line x1="55" y1="230" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="225">O</text>

  <!-- Standard region D bounded by y1(x) and y2(x) between x=a and x=b -->
  <!-- a = 100, b = 280 -->
  <path d="M 100 150 C 140 180, 230 185, 280 140 L 280 75 C 220 50, 150 65, 100 100 Z" 
        fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Lower curve y = y1(x) oriented left to right -->
  <line x1="170" y1="180" x2="210" y2="177" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <text x="180" y="200" font-size="13" font-style="italic" fill="#1e40af">y = y₁(x)</text>

  <!-- Upper curve y = y2(x) oriented right to left -->
  <line x1="210" y1="57" x2="170" y2="65" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <text x="180" y="48" font-size="13" font-style="italic" fill="#1e40af">y = y₂(x)</text>

  <!-- Vertical lines x=a (oriented down) and x=b (oriented up) -->
  <line x1="100" y1="100" x2="100" y2="135" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="280" y1="140" x2="280" y2="100" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>

  <!-- Ticks at a and b -->
  <line x1="100" y1="207" x2="100" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="100" y1="150" x2="100" y2="210" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="96" y="228" font-style="italic">a</text>
  <line x1="280" y1="207" x2="280" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="280" y1="140" x2="280" y2="210" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="276" y="228" font-style="italic">b</text>

  <text x="185" y="125" font-size="18" font-style="italic" fill="#1e40af" font-weight="bold">D</text>
</svg>
