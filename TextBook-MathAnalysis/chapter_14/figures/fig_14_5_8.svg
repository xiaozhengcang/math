<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Infinite charged line along vertical z-axis -->
  <line x1="190" y1="250" x2="190" y2="20" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  <text x="200" y="30" font-weight="bold" fill="#dc2626">L (线电荷 q)</text>

  <!-- Cylindrical Gaussian surface: center axis (190, y), radius r = 65, height h = 120 -->
  <!-- Top cap at y = 70 -->
  <ellipse cx="190" cy="70" rx="65" ry="20" fill="#bae6fd" fill-opacity="0.65" stroke="#0284c7" stroke-width="1.8"/>
  
  <!-- Cylinder side -->
  <line x1="125" y1="70" x2="125" y2="190" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="255" y1="70" x2="255" y2="190" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="125" y="70" width="130" height="120" fill="#e0f2fe" fill-opacity="0.45" stroke="none"/>

  <!-- Bottom cap at y = 190 -->
  <ellipse cx="190" cy="190" rx="65" ry="20" fill="none" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Radial electric field vectors E -->
  <line x1="255" y1="130" x2="315" y2="130" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="320" y="135" font-size="14" font-weight="bold" font-style="italic" fill="#1e40af">E</text>

  <!-- Radius r line -->
  <line x1="190" y1="70" x2="255" y2="70" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="220" y="65" font-style="italic" fill="#64748b">r</text>

  <!-- Height h dimension line -->
  <line x1="105" y1="70" x2="105" y2="190" stroke="#64748b" stroke-width="1.2"/>
  <line x1="100" y1="70" x2="110" y2="70" stroke="#64748b" stroke-width="1.2"/>
  <line x1="100" y1="190" x2="110" y2="190" stroke="#64748b" stroke-width="1.2"/>
  <text x="90" y="135" font-style="italic" fill="#64748b">h</text>

  <text x="190" y="245" text-anchor="middle" font-size="13" fill="#1e40af">E = q / (2πε₀ r) e_r</text>
</svg>
