<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Boundary curve segment with region D on left -->
  <path d="M 60 210 C 120 180, 180 150, 230 90 C 260 55, 290 45, 320 40" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="260" y="170" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold">D (内部)</text>
  <text x="100" y="90" font-size="13" fill="#64748b">外部</text>

  <!-- Point P on curve -->
  <!-- Tangent angle around (180, 150): dy/dx approx -0.8 -> tau = (cos alpha, sin alpha) -->
  <circle cx="180" cy="150" r="3.5" fill="#1e293b"/>
  <text x="185" y="165" font-weight="bold">P</text>

  <!-- Tangent vector tau along curve direction (up-right) -->
  <line x1="180" y1="150" x2="245" y2="100" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
  <text x="250" y="100" font-size="16" font-weight="bold" font-style="italic" fill="#1e40af">τ</text>

  <!-- Outward normal vector n (pointing up-left, perpendicular to tau) -->
  <line x1="180" y1="150" x2="130" y2="85" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>
  <text x="110" y="80" font-size="16" font-weight="bold" font-style="italic" fill="#dc2626">n (外法向量)</text>

  <!-- Right angle mark -->
  <path d="M 167 133 L 180 123 L 193 140" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Legend -->
  <text x="180" y="235" text-anchor="middle" font-size="13" fill="#1e293b">τ = (dx/ds, dy/ds),  n = (dy/ds, -dx/ds)</text>
</svg>
