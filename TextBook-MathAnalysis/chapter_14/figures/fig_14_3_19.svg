<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="140" y1="180" x2="140" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="150" y="28" font-style="italic">z</text>
  <line x1="140" y1="180" x2="350" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="198" font-style="italic">y</text>
  <line x1="140" y1="180" x2="60" y2="250" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="50" y="260" font-style="italic">x</text>
  <text x="125" y="192">O</text>

  <!-- Triangle ABC: A(1, 0, 0)=(90, 224), B(0, 1, 0)=(270, 180), C(0, 0, 1)=(140, 60) -->
  <polygon points="90,224 270,180 140,60" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Direction arrows: counterclockwise viewed from positive x-axis (A -> B -> C -> A) -->
  <line x1="90" y1="224" x2="190" y2="200" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
  <line x1="270" y1="180" x2="200" y2="115" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
  <line x1="140" y1="60" x2="112" y2="150" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>

  <circle cx="90" cy="224" r="3" fill="#1e293b"/>
  <text x="70" y="235">A(1,0,0)</text>
  <circle cx="270" cy="180" r="3" fill="#1e293b"/>
  <text x="275" y="195">B(0,1,0)</text>
  <circle cx="140" cy="60" r="3" fill="#1e293b"/>
  <text x="145" y="58">C(0,0,1)</text>

  <text x="165" y="150" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Σ</text>
  <text x="195" y="140" font-size="14" font-style="italic" fill="#1e40af">x + y + z = 1</text>
</svg>
