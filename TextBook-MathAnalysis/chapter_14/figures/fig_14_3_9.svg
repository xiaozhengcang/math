<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Curve L from A to B -->
  <path d="M 80 170 C 120 70, 220 50, 280 120" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <line x1="170" y1="67" x2="210" y2="73" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
  <text x="195" y="50" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">L</text>

  <!-- Auxiliary line segment from B back to A -->
  <line x1="280" y1="120" x2="80" y2="170" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="200" y1="140" x2="160" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="180" y="175" font-size="13" fill="#dc2626">辅助线段 BA</text>

  <!-- Shaded enclosed region D -->
  <path d="M 80 170 C 120 70, 220 50, 280 120 Z" fill="#e0f2fe" fill-opacity="0.45" stroke="none"/>

  <circle cx="80" cy="170" r="3.5" fill="#1e293b"/>
  <text x="65" y="185" font-weight="bold">A</text>
  <circle cx="280" cy="120" r="3.5" fill="#1e293b"/>
  <text x="288" y="125" font-weight="bold">B</text>

  <text x="180" y="115" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">D</text>
  <text x="180" y="225" text-anchor="middle" font-size="12" fill="#64748b">闭曲线 L + BA 适用 Green 公式</text>
</svg>
