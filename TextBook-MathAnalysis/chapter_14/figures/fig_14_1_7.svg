<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Cylinder outlines -->
  <ellipse cx="190" cy="45" rx="100" ry="22" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="90" y1="45" x2="90" y2="225" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="290" y1="45" x2="290" y2="225" stroke="#1e293b" stroke-width="1.8"/>
  <ellipse cx="190" cy="225" rx="100" ry="22" fill="none" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Intermediate layer ellipses at y = 105, y = 165 -->
  <ellipse cx="190" cy="105" rx="100" ry="22" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="190" cy="165" rx="100" ry="22" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Schwarz lantern triangular triangulation (pleated surface) -->
  <!-- Layer 0 to 1: y=45 to y=105 -->
  <!-- Top vertices (approx x-coords): 95, 130, 190, 250, 285 -->
  <!-- Middle 1 vertices shifted: 110, 160, 220, 270 -->
  <polyline points="95,50 110,118 130,62 160,125 190,67 220,124 250,62 270,118 285,50" fill="none" stroke="#1e40af" stroke-width="1.5"/>
  <polyline points="110,118 130,62 160,125 190,67 220,124 250,62 270,118" fill="#bae6fd" fill-opacity="0.3" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Layer 1 to 2: y=105 to y=165 -->
  <polyline points="110,118 130,182 160,125 190,187 220,124 250,182 270,118" fill="none" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Layer 2 to 3: y=165 to y=225 -->
  <polyline points="95,230 130,182 160,245 190,187 220,244 250,182 285,230" fill="none" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Dimension annotations -->
  <line x1="305" y1="45" x2="305" y2="225" stroke="#64748b" stroke-width="1.2"/>
  <line x1="300" y1="45" x2="310" y2="45" stroke="#64748b" stroke-width="1.2"/>
  <line x1="300" y1="225" x2="310" y2="225" stroke="#64748b" stroke-width="1.2"/>
  <text x="315" y="140" font-style="italic" fill="#64748b">h (n 等分)</text>

  <text x="190" y="270" text-anchor="middle" font-size="13" fill="#1e40af">底圆 m 等分，高 n 等分 (共 2mn 个全等三角形)</text>
</svg>
