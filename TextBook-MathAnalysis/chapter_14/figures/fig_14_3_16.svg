<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Outer boundary Sigma_out -->
  <ellipse cx="190" cy="125" rx="135" ry="85" fill="#e0f2fe" fill-opacity="0.55" stroke="#1e40af" stroke-width="2"/>
  <!-- Inner boundary Sigma_in (cavity) -->
  <ellipse cx="190" cy="125" rx="45" ry="30" fill="#ffffff" stroke="#1e40af" stroke-width="1.8"/>

  <!-- Outer normal vectors: pointing OUTWARD away from Omega -->
  <line x1="190" y1="40" x2="190" y2="12" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <line x1="325" y1="125" x2="355" y2="125" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <line x1="190" y1="210" x2="190" y2="238" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <text x="200" y="22" font-size="12" font-weight="bold" fill="#dc2626">n (外侧)</text>

  <!-- Inner normal vectors: pointing INWARD (into cavity, which is outward from Omega!) -->
  <line x1="190" y1="95" x2="190" y2="115" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <line x1="145" y1="125" x2="165" y2="125" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <line x1="235" y1="125" x2="215" y2="125" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="190" y="140" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">内边界法向</text>

  <text x="245" y="80" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold">Ω</text>
  <text x="190" y="240" text-anchor="middle" font-size="12" fill="#64748b">对区域 Ω 而言，内外边界均取外侧法向量</text>
</svg>
