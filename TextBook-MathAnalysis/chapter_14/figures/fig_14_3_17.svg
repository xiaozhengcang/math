<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes: y-axis horizontal right, z-axis vertical, x-axis down-left -->
  <line x1="120" y1="150" x2="120" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="130" y="28" font-style="italic">z</text>
  <line x1="120" y1="150" x2="350" y2="150" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="168" font-style="italic">y</text>
  <line x1="120" y1="150" x2="45" y2="225" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="35" y="235" font-style="italic">x</text>
  <text x="105" y="162">O</text>

  <!-- Paraboloid opening horizontally along positive y-axis:
       Apex at origin (120, 150)
       At y = h (280, 150), circle radius in xz: r = 70 px
  -->
  <path d="M 120 150 Q 200 80 280 80 L 280 220 Q 200 220 120 150 Z" fill="#e0f2fe" fill-opacity="0.6" stroke="#1e40af" stroke-width="2"/>

  <!-- Cap disk at y = h -->
  <ellipse cx="280" cy="150" rx="22" ry="70" fill="#bae6fd" fill-opacity="0.65" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Normal vector: oriented left side (outer side) on paraboloid -->
  <line x1="180" y1="105" x2="160" y2="70" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <text x="145" y="65" font-weight="bold" fill="#dc2626">n (左侧)</text>

  <!-- Tick at y = h -->
  <line x1="280" y1="145" x2="280" y2="155" stroke="#1e293b" stroke-width="1.2"/>
  <text x="275" y="170" font-style="italic">h</text>

  <text x="210" y="145" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Σ</text>
  <text x="210" y="195" font-size="13" font-style="italic" fill="#1e40af">y = x² + z²</text>
</svg>
