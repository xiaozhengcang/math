<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="180" y1="200" x2="180" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="190" y="28" font-style="italic">z</text>
  <line x1="180" y1="160" x2="345" y2="160" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="340" y="178" font-style="italic">y</text>
  <line x1="180" y1="160" x2="80" y2="245" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="70" y="255" font-style="italic">x</text>
  <text x="165" y="172">O</text>

  <!-- Upper ellipsoid dome: center (180, 160), rx = 95, rz = 75, ry_proj = 25 -->
  <!-- Top at (180, 85) -->
  <path d="M 85 160 C 85 85, 275 85, 275 160 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Equator front half (solid) -->
  <path d="M 85 160 C 85 178, 275 178, 275 160" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <!-- Equator back half (dashed) -->
  <path d="M 85 160 C 85 142, 275 142, 275 160" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Upward normal vector field -->
  <line x1="180" y1="85" x2="180" y2="40" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <line x1="135" y1="110" x2="120" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <line x1="225" y1="110" x2="240" y2="70" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="188" y="45" font-weight="bold" fill="#dc2626">n (上侧)</text>

  <!-- Semi-axes ticks -->
  <circle cx="180" cy="85" r="2.5" fill="#1e293b"/>
  <text x="165" y="90" font-style="italic">c</text>
  <circle cx="275" cy="160" r="2.5" fill="#1e293b"/>
  <text x="280" y="175" font-style="italic">b</text>

  <text x="215" y="130" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Σ</text>
  <text x="190" y="235" font-size="12" font-style="italic" fill="#64748b">x²/a² + y²/b² + z²/c² = 1 (z ≥ 0)</text>
</svg>
