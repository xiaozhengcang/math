<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Surface Sigma -->
  <path d="M 50 180 C 80 80, 200 60, 330 110 C 310 200, 180 220, 50 180 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="335" y="110" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">Σ</text>

  <!-- Micro element Delta Sigma_i -->
  <path d="M 160 135 C 180 130, 210 132, 225 140 C 215 160, 185 165, 170 160 Z" 
        fill="#bae6fd" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.8"/>
  <text x="175" y="152" font-size="12" font-style="italic" fill="#0369a1">ΔΣ_i</text>

  <!-- Sample point M_i -->
  <circle cx="190" cy="145" r="3" fill="#1e293b"/>
  <text x="195" y="160" font-size="12">M_i</text>

  <!-- Normal vector n_i -->
  <line x1="190" y1="145" x2="190" y2="60" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <text x="198" y="65" font-weight="bold" fill="#dc2626">n_i (法向量)</text>

  <!-- Velocity vector v_i -->
  <line x1="190" y1="145" x2="255" y2="75" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="260" y="75" font-weight="bold" font-style="italic" fill="#1e40af">v_i</text>

  <!-- Angle theta between v_i and n_i -->
  <path d="M 190 100 A 45 45 0 0 1 216 110" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <text x="205" y="95" font-style="italic">θ</text>

  <!-- Flux formula annotation -->
  <text x="190" y="240" text-anchor="middle" font-size="13" fill="#1e40af">流量微元 ΔΦ_i ≈ (v_i · n_i) ΔS_i</text>
</svg>
