<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="auto" style="max-width:340px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (70, 180) -->
  <line x1="40" y1="180" x2="310" y2="180" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="198" font-style="italic">x</text>
  <line x1="70" y1="205" x2="70" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="58" y="30" font-style="italic">y</text>
  <text x="55" y="195">O(0, 0)</text>

  <!-- Unit square: 1 unit = 140 px -->
  <!-- (1, 0) = (210, 180), (1, 1) = (210, 40) -->
  <line x1="70" y1="180" x2="210" y2="180" stroke="#1e40af" stroke-width="2.5"/>
  <line x1="70" y1="180" x2="145" y2="180" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>
  
  <line x1="210" y1="180" x2="210" y2="40" stroke="#1e40af" stroke-width="2.5"/>
  <line x1="210" y1="180" x2="210" y2="105" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr_blue)"/>

  <!-- Ticks -->
  <line x1="210" y1="177" x2="210" y2="183" stroke="#1e293b" stroke-width="1.2"/>
  <text x="206" y="198">1</text>
  <line x1="67" y1="40" x2="73" y2="40" stroke="#1e293b" stroke-width="1.2"/>
  <text x="55" y="45">1</text>

  <circle cx="210" cy="180" r="3.5" fill="#1e293b"/>
  <text x="215" y="195">(1, 0)</text>
  <circle cx="210" cy="40" r="3.5" fill="#1e293b"/>
  <text x="215" y="35">(1, 1)</text>

  <text x="140" y="170" font-style="italic" fill="#1e40af">L₁</text>
  <text x="220" y="110" font-style="italic" fill="#1e40af">L₂</text>
</svg>
