<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Outer boundary L: counterclockwise -->
  <!-- Inner hole l: clockwise -->
  <!-- Shaded region D with hole -->
  <path d="M 50 130 C 50 60, 150 40, 260 50 C 340 60, 340 180, 270 210 C 180 240, 70 210, 50 130 Z 
           M 150 130 C 150 160, 220 160, 220 130 C 220 100, 150 100, 150 130 Z" 
        fill="#e0f2fe" fill-opacity="0.65" fill-rule="evenodd" stroke="#1e40af" stroke-width="2"/>

  <!-- Outer orientation arrows (counterclockwise) -->
  <line x1="160" y1="46" x2="200" y2="47" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <line x1="200" y1="225" x2="160" y2="223" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="210" y="38" font-size="16" font-style="italic" fill="#1e40af" font-weight="bold">L (逆时针)</text>

  <!-- Inner orientation arrows (clockwise) -->
  <line x1="170" y1="108" x2="200" y2="108" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <line x1="200" y1="152" x2="170" y2="152" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="185" y="135" font-size="14" font-style="italic" fill="#dc2626" font-weight="bold" text-anchor="middle">l (顺时针)</text>

  <text x="100" y="170" font-size="18" font-style="italic" fill="#0369a1" font-weight="bold">D</text>
  <text x="190" y="250" text-anchor="middle" font-size="12" fill="#64748b">行进方向左侧为区域 D (正向边界)</text>
</svg>
