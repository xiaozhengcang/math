<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D Axes -->
  <line x1="170" y1="230" x2="170" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="180" y="28" font-style="italic">z</text>
  <line x1="170" y1="210" x2="330" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="228" font-style="italic">y</text>
  <line x1="170" y1="210" x2="90" y2="255" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="80" y="265" font-style="italic">x</text>
  <text x="155" y="222">O</text>

  <!-- Paraboloid apex at (170, 210), opening up to z = 2 at y = 80 -->
  <path d="M 90 80 Q 170 210 250 80" fill="#e0f2fe" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>

  <!-- Top rim at z = 2: rx = 80, ry = 22 -->
  <ellipse cx="170" cy="80" rx="80" ry="22" fill="#bae6fd" fill-opacity="0.4" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Height mark z = 2 -->
  <line x1="165" y1="80" x2="175" y2="80" stroke="#1e293b" stroke-width="1.2"/>
  <text x="155" y="85">2</text>
  <text x="260" y="85" font-style="italic" fill="#0284c7">z = 2</text>

  <!-- Downward normal vectors on outer/lower surface -->
  <line x1="170" y1="210" x2="170" y2="245" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr_red)"/>
  <line x1="130" y1="160" x2="105" y2="185" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <line x1="210" y1="160" x2="235" y2="185" stroke="#dc2626" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="180" y="248" font-weight="bold" fill="#dc2626">n (下侧)</text>

  <text x="165" y="140" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">Σ</text>
  <text x="215" y="130" font-size="13" font-style="italic" fill="#1e40af">z = (x² + y²)/2</text>
</svg>
