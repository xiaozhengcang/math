<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e53e3e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f855a"/>
    </marker>
  </defs>
  <line x1="50" y1="190" x2="340" y2="190" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="195" font-family="serif" font-size="14" font-style="italic">x</text>
  <line x1="80" y1="210" x2="80" y2="40" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="35" font-family="serif" font-size="14" font-style="italic">y</text>

  <circle cx="120" cy="150" r="3.5" fill="#2d3748"/>
  <text x="90" y="145" font-family="serif" font-size="13">(x₀, y₀)</text>

  <line x1="120" y1="150" x2="260" y2="150" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="260" cy="150" r="3.5" fill="#4a5568"/>
  <text x="265" y="165" font-family="serif" font-size="13">(x, y₀)</text>

  <line x1="260" y1="150" x2="260" y2="70" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="260" cy="70" r="3.5" fill="#e53e3e"/>
  <text x="265" y="70" font-family="serif" font-size="13" font-weight="bold" fill="#e53e3e">(x, y)</text>

  <text x="190" y="230" text-anchor="middle" font-family="serif" font-size="13" fill="#4a5568">图 14.3.10 常用阶梯折线积分路径</text>
