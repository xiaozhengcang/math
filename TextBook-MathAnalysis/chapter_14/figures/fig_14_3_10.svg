<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Path from (x0, y0) to (x, y) to (x + Delta x, y) -->
  <!-- (x0, y0) = (80, 160) -->
  <!-- Arbitrary path to (x, y) = (240, 90) -->
  <path d="M 80 160 C 120 180, 160 120, 240 90" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="140" y1="145" x2="175" y2="120" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>

  <!-- Horizontal segment to (x + Delta x, y) = (320, 90) -->
  <line x1="240" y1="90" x2="320" y2="90" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="240" y1="90" x2="290" y2="90" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr_red)"/>

  <circle cx="80" cy="160" r="3.5" fill="#1e293b"/>
  <text x="65" y="180">(x₀, y₀)</text>
  <circle cx="240" cy="90" r="3.5" fill="#1e40af"/>
  <text x="225" y="78" fill="#1e40af">(x, y)</text>
  <circle cx="320" cy="90" r="3.5" fill="#dc2626"/>
  <text x="295" y="78" fill="#dc2626">(x+Δx, y)</text>

  <text x="280" y="115" font-size="13" font-style="italic" fill="#dc2626" text-anchor="middle">Δx</text>
  <text x="190" y="215" text-anchor="middle" font-size="13" fill="#1e40af">U(x+Δx, y) - U(x, y) = ∫ P(t, y) dt</text>
</svg>
