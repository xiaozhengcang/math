<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- 3D body Omega with cavity, cut by dividing surface -->
  <ellipse cx="190" cy="125" rx="130" ry="85" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <!-- Internal cavity -->
  <ellipse cx="190" cy="125" rx="45" ry="30" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Dividing cross-cut surface across the layer -->
  <line x1="60" y1="125" x2="145" y2="125" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="122" x2="120" y2="122" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="120" y1="128" x2="80" y2="128" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>

  <line x1="235" y1="125" x2="320" y2="125" stroke="#dc2626" stroke-width="2"/>
  <line x1="255" y1="122" x2="295" y2="122" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="295" y1="128" x2="255" y2="128" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>

  <text x="190" y="80" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold" text-anchor="middle">Ω₁</text>
  <text x="190" y="180" font-size="16" font-style="italic" fill="#b45309" font-weight="bold" text-anchor="middle">Ω₂</text>
  <text x="190" y="130" font-size="12" fill="#64748b" text-anchor="middle">空腔</text>

  <text x="190" y="235" text-anchor="middle" font-size="12" fill="#64748b">用辅助曲面分割为单连通区域后相加</text>
</svg>
