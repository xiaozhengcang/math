<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Earth sphere centered at O(190, 190), radius R = 75 -->
  <!-- Satellite S at (190, 45), distance R+h = 145 from O -->
  <!-- Tangent line from S to circle:
       Distance SO = 145. Circle radius R = 75.
       cos(alpha) = R / (R+h) = 75/145 = 0.5172 -> alpha = 58.85 deg.
       Contact point: z-coord above center = R * cos(alpha) = 75 * 0.5172 = 38.8.
       Horizontal offset = R * sin(alpha) = 75 * 0.8558 = 64.2.
       Contact points on 2D circle:
       T1 = (190 - 64.2, 190 - 38.8) = (125.8, 151.2)
       T2 = (190 + 64.2, 190 - 38.8) = (254.2, 151.2)
  -->
  
  <!-- Earth sphere -->
  <circle cx="190" cy="190" r="75" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="190" cy="190" r="2.5" fill="#1e293b"/>
  <text x="180" y="208">O</text>

  <!-- Covered spherical cap: z >= R cos alpha -->
  <path d="M 125.8 151.2 C 125.8 90, 254.2 90, 254.2 151.2 Z" fill="#bae6fd" fill-opacity="0.65" stroke="#1e40af" stroke-width="2"/>
  <ellipse cx="190" cy="151.2" rx="64.2" ry="18" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Satellite point S -->
  <circle cx="190" cy="45" r="4" fill="#dc2626"/>
  <text x="200" y="48" font-weight="bold" fill="#dc2626">S (卫星)</text>

  <!-- Tangent beam rays from S -->
  <line x1="190" y1="45" x2="125.8" y2="151.2" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="190" y1="45" x2="254.2" y2="151.2" stroke="#dc2626" stroke-width="1.8"/>

  <!-- Radius lines from O to T1 and S -->
  <line x1="190" y1="190" x2="125.8" y2="151.2" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="190" y1="190" x2="190" y2="45" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Angle alpha arc at S or at O -->
  <path d="M 190 140 A 50 50 0 0 0 162 148" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <text x="175" y="135" font-style="italic">α</text>

  <!-- Dimensions -->
  <text x="145" y="180" font-style="italic" fill="#64748b">R</text>
  <text x="195" y="85" font-style="italic" fill="#64748b">h</text>
  <text x="185" y="115" font-size="15" font-style="italic" fill="#1e40af" font-weight="bold">Σ</text>
  <text x="250" y="275" text-anchor="middle" font-size="12" fill="#64748b">cos α = R / (R + h)</text>
</svg>
