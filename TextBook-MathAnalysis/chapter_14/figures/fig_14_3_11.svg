<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e53e3e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f855a"/>
    </marker>
  </defs>
  <circle cx="100" cy="160" r="4" fill="#2d3748"/>
  <text x="70" y="180" font-family="serif" font-size="13">(x₀, y₀)</text>
  <circle cx="280" cy="70" r="4" fill="#2d3748"/>
  <text x="285" y="65" font-family="serif" font-size="13">(x, y)</text>

  <polyline points="100,160 280,160 280,70" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="180" y1="160" x2="200" y2="160" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="280" y1="120" x2="280" y2="105" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="200" y="180" font-family="serif" font-size="13" fill="#2b6cb0">路径 I</text>

  <polyline points="100,160 100,70 280,70" fill="none" stroke="#e53e3e" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="100" y1="120" x2="100" y2="105" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="180" y1="70" x2="200" y2="70" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="110" y="60" font-family="serif" font-size="13" fill="#e53e3e">路径 II</text>

  <text x="200" y="230" text-anchor="middle" font-family="serif" font-size="13" fill="#4a5568">图 14.3.11 求原函数的两种折线积分路径</text>
</svg>
