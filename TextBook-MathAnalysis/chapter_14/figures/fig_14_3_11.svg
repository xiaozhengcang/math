<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto" style="max-width:380px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="30" y1="210" x2="350" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="345" y="228" font-style="italic">x</text>
  <line x1="55" y1="230" x2="55" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="42" y="30" font-style="italic">y</text>
  <text x="42" y="225">O</text>

  <!-- Vertices: A(x0, y0)=(95, 160), B(x, y)=(275, 75) -->
  <!-- N(x, y0) = (275, 160) -->
  <!-- M(x0, y) = (95, 75) -->

  <!-- Path ANB: (95, 160) -> (275, 160) -> (275, 75) -->
  <line x1="95" y1="160" x2="275" y2="160" stroke="#1e40af" stroke-width="2"/>
  <line x1="95" y1="160" x2="195" y2="160" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="275" y1="160" x2="275" y2="75" stroke="#1e40af" stroke-width="2"/>
  <line x1="275" y1="160" x2="275" y2="110" stroke="#1e40af" stroke-width="2" marker-end="url(#arr_blue)"/>

  <!-- Path AMB: (95, 160) -> (95, 75) -> (275, 75) -->
  <line x1="95" y1="160" x2="95" y2="75" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="95" y1="160" x2="95" y2="110" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
  <line x1="95" y1="75" x2="275" y2="75" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="95" y1="75" x2="195" y2="75" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>

  <!-- Vertices marks and labels -->
  <circle cx="95" cy="160" r="3.5" fill="#1e293b"/>
  <text x="60" y="175">A(x₀, y₀)</text>
  <circle cx="275" cy="75" r="3.5" fill="#1e293b"/>
  <text x="280" y="70">B(x, y)</text>
  <circle cx="275" cy="160" r="3" fill="#1e40af"/>
  <text x="280" y="175" fill="#1e40af">N(x, y₀)</text>
  <circle cx="95" cy="75" r="3" fill="#dc2626"/>
  <text x="55" y="70" fill="#dc2626">M(x₀, y)</text>

  <!-- Coordinate ticks -->
  <line x1="95" y1="207" x2="95" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="90" y="228" font-style="italic">x₀</text>
  <line x1="275" y1="207" x2="275" y2="213" stroke="#1e293b" stroke-width="1.2"/>
  <text x="272" y="228" font-style="italic">x</text>
  <line x1="52" y1="160" x2="58" y2="160" stroke="#1e293b" stroke-width="1.2"/>
  <text x="40" y="165" font-style="italic">y₀</text>
  <line x1="52" y1="75" x2="58" y2="75" stroke="#1e293b" stroke-width="1.2"/>
  <text x="42" y="80" font-style="italic">y</text>
</svg>
