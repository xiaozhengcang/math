<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Concentric circles: equipotential lines V = const -->
  <!-- Center at (180, 125) -->
  <circle cx="180" cy="125" r="35" fill="none" stroke="#0284c7" stroke-width="1.4"/>
  <circle cx="180" cy="125" r="65" fill="none" stroke="#0284c7" stroke-width="1.4"/>
  <circle cx="180" cy="125" r="95" fill="none" stroke="#0284c7" stroke-width="1.4"/>

  <!-- Radial electric field lines E (8 rays) -->
  <line x1="180" y1="125" x2="285.0" y2="125.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="254.2" y2="50.8" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="180.0" y2="20.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="105.8" y2="50.8" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="75.0" y2="125.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="105.8" y2="199.2" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="180.0" y2="230.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <line x1="180" y1="125" x2="254.2" y2="199.2" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr_red)"/>
  <!-- Center charged line cross-section -->
  <circle cx="180" cy="125" r="5" fill="#dc2626"/>
  <text x="180" y="112" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">q</text>

  <!-- Legend -->
  <g transform="translate(60, 230)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr_red)"/>
    <text x="32" y="4" font-size="12" fill="#dc2626">电力线 (射线)</text>
    <line x1="140" y1="0" x2="165" y2="0" stroke="#0284c7" stroke-width="1.8"/>
    <text x="172" y="4" font-size="12" fill="#0284c7">等电势线 (同心圆)</text>
  </g>
</svg>
