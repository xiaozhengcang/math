<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="auto" style="max-width:360px; font-family:'Times New Roman', serif; font-size:14px;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e40af"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>
  <!-- Axes: origin at (60, 210) -->
  <line x1="30" y1="210" x2="330" y2="210" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="325" y="228" font-style="italic">x</text>
  <line x1="60" y1="235" x2="60" y2="25" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="48" y="30" font-style="italic">y</text>
  <text x="48" y="225">O</text>

  <!-- Radius a = 180 px -->
  <!-- A = (240, 210) on x-axis -->
  <!-- B on y = x at angle pi/4: x = 60 + 180*cos(pi/4) = 187.3, y = 210 - 180*sin(pi/4) = 82.7 -->
  
  <!-- Shaded sector region -->
  <path d="M 60 210 L 240 210 A 180 180 0 0 0 187.3 82.7 Z" fill="#e0f2fe" fill-opacity="0.65" stroke="none"/>

  <!-- Segment OA on x-axis -->
  <line x1="60" y1="210" x2="240" y2="210" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="60" y1="210" x2="155" y2="210" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="240" y="228">A(a, 0)</text>

  <!-- Arc AB on circle x^2+y^2=a^2 -->
  <path d="M 240 210 A 180 180 0 0 0 187.3 82.7" fill="none" stroke="#1e40af" stroke-width="2.2"/>
  <!-- Arc arrow halfway at angle pi/8 (22.5 deg): dx=180*cos(22.5)=166.3, dy=-68.9 -> (226.3, 141.1) -->
  <path d="M 240 210 A 180 180 0 0 0 226.3 141.1" fill="none" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="250" y="150" font-size="13" font-style="italic" fill="#1e40af">x² + y² = a²</text>

  <!-- Segment BO along y = x -->
  <line x1="187.3" y1="82.7" x2="60" y2="210" stroke="#1e40af" stroke-width="2.2"/>
  <line x1="187.3" y1="82.7" x2="120" y2="150" stroke="#1e40af" stroke-width="2.2" marker-end="url(#arr_blue)"/>
  <text x="185" y="72">B</text>
  <text x="105" y="125" font-style="italic" fill="#1e40af">y = x</text>

  <text x="145" y="180" font-size="16" font-style="italic" fill="#0369a1" font-weight="bold">L</text>
</svg>
